<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Tsunami: Long or Strong, Get Gone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>/* Phone-first, portrait, large tap targets. One stylesheet for every generated app; looks (engine/looks/) restyle it.
   --brand is set by the runtime when the template gives "Brand colour:"; each look decides where it shows. */
:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:var(--brand, #0b6e4f); --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }
.bar { position: sticky; top: 0; z-index: 3; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#14213d; color:#fff; }
.bar .t { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .brand { font-weight:800; margin-right:6px; }
.bar .clock:empty { display:none; }
.bar .clock { font-variant-numeric: tabular-nums; font-size:18px; }
.proto { font-size:12px; color:var(--author); background:var(--authorbg); padding:4px 14px; }
.card { background:var(--card); margin:10px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); }
h1 { font-size:22px; margin:4px 0 8px; } h2 { font-size:21px; margin:2px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
p { margin: 8px 0; } p.bul::before { content:"• "; color:var(--mut); }
.big { display:block; width:100%; min-height:52px; margin:10px 0 0; padding:12px 14px; font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line); background:#eef1f4; color:var(--ink); text-align:left; }
.big.go { background:var(--go); color:#fff; border-color:var(--go); text-align:center; }
.big.opt { background:#e8f0fe; border-color:#b7c9f5; }
.big.opt.broken { border-style:dashed; border-color:var(--author); }
.big.skip { background:transparent; text-align:center; font-weight:500; color:var(--mut); }
.link { background:none; border:0; color:#1d4ed8; font:inherit; padding:0; }
.crumb { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); }
.q { font-weight:600; font-size:19px; margin-top:16px; }
.warn { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; font-weight:600; }
.author { background:var(--authorbg); color:var(--author); border-left:4px solid var(--author); padding:8px 10px; border-radius:6px; font-size:15px; }
.do { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.do input { width:26px; height:26px; margin:0; flex:none; } .do span { flex:1; }
.do .dep { flex-basis:100%; margin-left:36px; }
.dep { display:block; color:var(--author); font-size:13px; }
/* folds: "More detail" (extra lines of the step) and "Sources for this screen" (the guideline quotes) */
details.more, details.sources { margin:14px 0 0; }
details.more > summary, details.sources > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:48px; }
details.more > summary::-webkit-details-marker, details.sources > summary::-webkit-details-marker { display:none; }
details.more > summary::before, details.sources > summary::before { content:"+"; display:inline-grid; place-items:center; flex:none; width:26px; height:26px; border-radius:6px; font-weight:800; line-height:1; }
details.more[open] > summary::before, details.sources[open] > summary::before { content:"−"; }
details.more { border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
details.more > summary { font-weight:700; color:var(--ink); } details.more > summary::before { background:#e8eef6; color:#1d4ed8; }
details.more[open] { padding-bottom:6px; } .more-line { margin:6px 0 10px; }
details.sources { font-size:14px; color:var(--mut); border-top:1px dashed var(--line); margin-top:18px; }
details.sources > summary { color:var(--mut); font-weight:600; } details.sources > summary::before { border:1px solid var(--line); color:var(--mut); }
.src-list { margin:4px 0 6px; padding-left:24px; } .src-list li { margin:0 0 10px; }
.src-list q { font-style:italic; color:var(--ink); } .src-list .where { color:var(--mut); } .src-list .for { display:block; font-size:13px; color:var(--mut); }
/* "Tip:" the app's own suggestion, never guideline advice: a dashed box and a badge that says so */
.tip { margin:12px 0; padding:10px 12px; border:2px dashed #4f6fb5; border-radius:10px; background:#f1f5fd; }
.tip-badge { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#fff; background:#3b5998; border-radius:999px; padding:2px 10px; }
.tip-text { margin:6px 0 0; font-size:.94em; font-weight:400; color:var(--mut); }   /* secondary to the guideline's own lines; the badge says what it is */
.timer { margin:14px 0; padding:12px; border-radius:10px; background:#eef6f2; text-align:center; }
.timer .lbl { color:var(--mut); font-size:14px; }
.big-clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
.timer.due { background:#fde8e8; } .timer.due .big-clock { color:var(--due); }
.reminders { position:sticky; top:44px; z-index:2; background:var(--bg); padding:6px 10px 0; }
.rem { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:6px; }
.rem .rt { flex:1; font-weight:600; font-size:15px; } .rem .rc { font-variant-numeric:tabular-nums; font-size:15px; }
.rem button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.rem.due { border-color:var(--due); background:#fde8e8; } .rem.due .rc { color:var(--due); font-weight:700; }
.rec { padding:6px 0; } .rec small { color:var(--mut); }
.rec-btn { background:#fff7e6; border-color:#f2c46d; }
.note-box { margin:12px 0; padding:10px 0; } .note-lbl { display:block; font-weight:700; margin-bottom:6px; }
.note-text { display:block; width:100%; min-height:132px; font:inherit; line-height:1.4; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
.note-text:focus { outline:3px solid var(--go); outline-offset:1px; }
.note-save { text-align:center; } .note-status { display:block; margin-top:6px; color:var(--mut); font-size:14px; }
/* "Location:" a position box with a big "Use GPS position" button */
.gps-btn { text-align:center; min-height:60px; font-size:18px; background:var(--go); color:#fff; border-color:var(--go); }
.gps-btn::before { content:"⌖"; margin-right:8px; font-size:1.2em; }
.gps-msg, .gps-ddm { display:block; margin:8px 0 0; } .gps-msg:empty, .gps-ddm:empty { display:none; }
.gps-msg { font-weight:600; font-size:15px; } .gps-ddm { font-weight:700; font-variant-numeric:tabular-nums; }
.loc-text { min-height:76px; margin-top:10px; }
.log small { white-space:pre-wrap; }
.lookup { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
.lookup .lk { font-weight:600; } .lookup .lv { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px dashed var(--line); }
table { border-collapse:collapse; width:100%; font-size:14px; } th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; }
.inputs { margin:10px 0; } .inp { display:block; margin:10px 0; font-weight:600; }
.inp input { display:block; width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); margin-top:4px; }
.inp small { font-weight:400; color:var(--mut); } .inp .bad { color:var(--due); font-weight:400; font-size:14px; }
.choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.choices button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.choices button.on { background:#14213d; color:#fff; }
.log { padding-left:0; list-style:none; } .log li { padding:6px 0; border-bottom:1px solid var(--line); } .log time { display:inline-block; min-width:56px; font-variant-numeric:tabular-nums; color:var(--mut); } .log .tod { font-variant-numeric:tabular-nums; font-size:.85em; color:var(--mut); margin-right:4px; }
.findings { padding-left:18px; } .findings li { margin:8px 0; font-size:15px; }
.lvl-fix { color:var(--due); } .lvl-check { color:var(--warn); } .lvl-info { color:var(--mut); }
.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
.tabs button { flex:1; font:inherit; font-size:15px; padding:14px 4px; background:none; border:0; color:var(--mut); }
.look-link { text-align:center; font-size:14px; margin-top:14px; }
.look-pick { display:flex; flex-wrap:wrap; gap:6px; }
.look-pick button { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
.look-pick button.on { background:var(--go); border-color:var(--go); color:#fff; }
.tabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 3px 0 #14213d; }

/* look: Clinic */

  --warn:#9a3412; --warnbg:#fff1e6; --due:#c2410c; --author:#6b21a8; --authorbg:#f4edfb; }html[data-look="clinic"], html[data-look="clinic"] body{ font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); }html[data-look="clinic"] .bar{ background:var(--bg); color:var(--ink); padding:14px 18px 6px; }html[data-look="clinic"] .bar .t{ font-size:15px; color:var(--mut); font-weight:600; }html[data-look="clinic"] .bar .clock{ background:var(--card); border-radius:999px; padding:4px 12px; font-size:15px; font-weight:600; color:var(--go); }html[data-look="clinic"] .proto{ background:transparent; color:var(--mut); padding:0 18px 4px; font-size:12px; }html[data-look="clinic"] .card{ border:0; border-radius:22px; padding:20px; margin:10px 12px; box-shadow:0 1px 2px rgba(22,35,43,.05), 0 8px 24px rgba(22,35,43,.06); }html[data-look="clinic"] h1, html[data-look="clinic"] h2{ font-family:"Inter", system-ui, sans-serif; font-weight:700; letter-spacing:-.02em; text-wrap:balance; }html[data-look="clinic"] h2{ font-size:24px; }html[data-look="clinic"] h3{ color:var(--go); }html[data-look="clinic"] .crumb{ font-size:13px; }html[data-look="clinic"] .crumb span{ background:var(--gosoft); color:var(--go); border-radius:999px; padding:2px 10px; font-weight:600; }html[data-look="clinic"] .big{ border-radius:16px; border:0; background:#f1f5f6; min-height:56px; }html[data-look="clinic"] .big.go{ background:var(--go); border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.25); }html[data-look="clinic"] .big.opt{ background:#f4f8f8; border:1.5px solid var(--line); position:relative; padding-right:40px; }html[data-look="clinic"] .big.opt::after{ content:"›"; position:absolute; right:16px; top:50%; transform:translateY(-52%); font-size:26px; color:var(--go); }html[data-look="clinic"] .q{ font-size:20px; }html[data-look="clinic"] .warn{ border:0; border-radius:14px; padding:12px 14px; }html[data-look="clinic"] .do{ border-bottom:0; background:#f6f9f9; border-radius:14px; padding:12px; margin:8px 0; }html[data-look="clinic"] .do input{ accent-color:var(--go); border-radius:50%; }html[data-look="clinic"] .timer{ background:var(--gosoft); border-radius:20px; padding:18px; position:relative; overflow:hidden; }html[data-look="clinic"] .timer::after{ content:""; position:absolute; left:0; bottom:0; height:6px; width:calc(var(--p, 0) * 100%); background:var(--go); transition:width .25s linear; }html[data-look="clinic"] .big-clock{ color:var(--go); font-size:52px; letter-spacing:-.02em; }html[data-look="clinic"] .rem{ border:0; border-radius:16px; box-shadow:0 4px 14px rgba(22,35,43,.08); }html[data-look="clinic"] .tabs{ left:12px; right:12px; bottom:10px; border:0; border-radius:20px; box-shadow:0 8px 30px rgba(22,35,43,.15); overflow:hidden; }html[data-look="clinic"] .tabs button.on{ color:var(--go); box-shadow:none; background:var(--gosoft); }html[data-look="clinic"] .choices button{ border-radius:999px; }html[data-look="clinic"] .choices button.on{ background:var(--go); border-color:var(--go); }html[data-look="clinic"] .note-box{ background:#f6f9f9; border-radius:16px; padding:14px; }html[data-look="clinic"] .note-text{ border:1.5px solid var(--line); border-radius:14px; background:#fff; }html[data-look="clinic"] .note-save{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] .tip{ background:#eef4ff; border:1.5px dashed #7b9be0; border-radius:16px; padding:12px 14px; }html[data-look="clinic"] .tip-badge{ background:#dbe6fb; color:#2f4f9a; font-weight:700; text-transform:none; letter-spacing:0; font-size:13px; }html[data-look="clinic"] details.more{ border:0; background:#f6f9f9; border-radius:16px; padding:0 14px; }html[data-look="clinic"] details.more[open]{ padding-bottom:8px; }html[data-look="clinic"] details.more > summary{ color:var(--ink); }html[data-look="clinic"] details.more > summary::before{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] details.sources{ border-top:1px solid var(--line); }html[data-look="clinic"] details.sources > summary::before{ border-radius:999px; }html[data-look="clinic"] .gps-btn{ background:var(--go); color:#fff; border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.2); }html[data-look="clinic"] .gps-ddm{ color:var(--go); }

  --warn:#0a0a0a; --warnbg:#ffd400; --due:#e4002b; --author:#5b21b6; --authorbg:#efe9fb; }html[data-look="wayfinding"], html[data-look="wayfinding"] body{ font-family:"Archivo", "Helvetica Neue", Arial, sans-serif; background:var(--bg); }html[data-look="wayfinding"] .bar{ background:var(--ink); padding:12px 16px; }html[data-look="wayfinding"] .bar .t{ font-weight:800; letter-spacing:.01em; }html[data-look="wayfinding"] .bar .clock{ background:var(--sign); color:var(--ink); padding:2px 10px; font-weight:800; }html[data-look="wayfinding"] .proto{ background:#f2f2f2; color:var(--mut); }html[data-look="wayfinding"] .card{ border:0; border-radius:0; margin:0; padding:18px 18px 20px; }html[data-look="wayfinding"] h1, html[data-look="wayfinding"] h2{ font-weight:900; letter-spacing:-.02em; line-height:1.05; text-wrap:balance; }html[data-look="wayfinding"] h1{ font-size:32px; }html[data-look="wayfinding"] h2{ font-size:30px; margin-top:6px; }html[data-look="wayfinding"] .crumb{ flex-direction:row-reverse; justify-content:flex-end; gap:14px; align-items:center; }html[data-look="wayfinding"] .crumb span{ display:inline-grid; place-items:center; min-width:40px; height:40px; padding:0 8px; background:var(--route); color:#fff; font-weight:900; font-size:15px; border-radius:999px; }html[data-look="wayfinding"] .big{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:800; min-height:58px; }html[data-look="wayfinding"] .big.go{ background:var(--ink); color:#fff; border-color:var(--ink); text-align:left; position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.go::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }html[data-look="wayfinding"] .big.opt{ background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.opt::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }html[data-look="wayfinding"] .big.skip{ border:0; text-decoration:underline; }html[data-look="wayfinding"] .link{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] .q{ font-size:22px; font-weight:900; }html[data-look="wayfinding"] .warn{ background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }html[data-look="wayfinding"] .warn::before{ content:"!"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }html[data-look="wayfinding"] .do{ position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }html[data-look="wayfinding"] .do::before{ content:""; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }html[data-look="wayfinding"] .do input{ position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }html[data-look="wayfinding"] .do .dep{ margin-left:0; }html[data-look="wayfinding"] .timer{ background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }html[data-look="wayfinding"] .timer .lbl{ color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }html[data-look="wayfinding"] .timer::after{ content:""; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg, var(--sign) calc(var(--p, 0) * 100%), #333 0); }html[data-look="wayfinding"] .big-clock{ font-size:60px; font-weight:900; color:var(--sign); }html[data-look="wayfinding"] .timer.due{ background:var(--due); }html[data-look="wayfinding"] .timer.due .big-clock{ color:#fff; }html[data-look="wayfinding"] .rem{ border:2px solid var(--ink); border-radius:0; }html[data-look="wayfinding"] .rem button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .rem.due{ background:var(--sign); }html[data-look="wayfinding"] .choices button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .choices button.on{ background:var(--ink); color:#fff; }html[data-look="wayfinding"] .look-pick button{ border-radius:0; border:2px solid var(--ink); font-weight:700; }html[data-look="wayfinding"] .tabs{ border-top:2px solid var(--ink); }html[data-look="wayfinding"] .tabs button{ font-weight:800; color:var(--mut); }html[data-look="wayfinding"] .tabs button.on{ color:var(--ink); box-shadow:inset 0 4px 0 var(--route); }html[data-look="wayfinding"] .note-lbl{ font-weight:900; font-size:19px; }html[data-look="wayfinding"] .note-text{ border:2px solid var(--ink); border-radius:0; font-weight:600; }html[data-look="wayfinding"] .note-text:focus{ outline:4px solid var(--sign); outline-offset:0; }html[data-look="wayfinding"] .tip{ background:#f2f6fb; color:var(--mut); border:0; border-left:6px solid #0057b8; border-radius:0; padding:10px 14px; }html[data-look="wayfinding"] .tip-badge{ background:#0057b8; color:#fff; border-radius:0; font-weight:900; }html[data-look="wayfinding"] .tip-text{ font-weight:400; color:var(--mut); }html[data-look="wayfinding"] details.more{ border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); }html[data-look="wayfinding"] details.more > summary{ font-weight:900; font-size:18px; }html[data-look="wayfinding"] details.more > summary::before{ background:var(--ink); color:#fff; border-radius:0; }html[data-look="wayfinding"] details.sources{ border-top:2px solid #ddd; }html[data-look="wayfinding"] details.sources > summary{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] details.sources > summary::before{ border:2px solid var(--ink); color:var(--ink); border-radius:0; }html[data-look="wayfinding"] .gps-btn{ background:var(--ink); color:#fff; border-color:var(--ink); border-radius:0; font-weight:900; }html[data-look="wayfinding"] .gps-btn::before{ color:var(--sign); }html[data-look="wayfinding"] .gps-ddm{ font-size:19px; font-weight:900; }

t up from the floor without help, don’t drop to the ground in an earthquake.","where":"","check":"exact"},{"text":"Brace yourself against a wall or sturdy furniture if you cannot drop to the floor.","where":"","check":"exact"}]},{"kind":"say","text":"As soon as the shaking stops, tap Next.","line":48}],"ask":null,"next":{"to":"long-strong","line":49,"target":"long-strong"},"timer":null,"reminders":[],"stop":null,"end":false,"line":37,"nexts":[{"to":"long-strong","line":49,"target":"long-strong"}]},{"id":"long-strong","title":"Was it long or strong?","lines":[{"kind":"say","text":"Strong: it was hard to stand. Long: it lasted more than a minute (Civil Defence: a minute or more).","line":52,"quotes":[{"text":"If you feel an earthquake that makes it hard to stand or lasts more than a minute, move immediately to higher ground or as far inland as possible out of tsunami evacuation zones.","where":"","check":"exact"},{"text":"Feel a strong earthquake that makes it hard to stand up, or a weak rolling earthquake that lasts a minute or more.","where":"","check":"exact"}]}],"ask":{"question":"Was it long or strong?","options":[{"label":"Yes","to":"get-gone","line":56,"target":"get-gone"},{"label":"No","to":"not-long","line":57,"target":"not-long"},{"label":"I'm not sure","to":"not-sure","line":58,"target":"not-sure"}],"line":55},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":51},{"id":"not-sure","title":"Not sure if it was long or strong","lines":[{"kind":"say","text":"Near the coast, a long or strong earthquake means leave as soon as the shaking stops.","line":61,"quotes":[{"text":"Anyone near the coast who feels a long or strong earthquake should self-evacuate as soon as the shaking stops.","where":"","check":"exact"}]},{"kind":"say","text":"At a mountain lake, even a small earthquake could cause a tsunami.","line":63,"quotes":[{"text":"Even a small earthquake could trigger a landslide at a mountain lake and create a tsunami.","where":"","check":"exact"}]},{"kind":"say","text":"The guidance doesn't say what to do if you're not sure.","line":65}],"ask":{"question":"What will you do?","options":[{"label":"Go to high ground or inland","to":"get-gone","line":67,"target":"get-gone"},{"label":"Stay and watch for signs","to":"not-long","line":68,"target":"not-long"}],"line":66},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":60},{"id":"not-long","title":"Watch for signs and warnings","lines":[{"kind":"say","text":"Expect more shaking. It may cause another tsunami.","line":71,"quotes":[{"text":"If there was an earthquake, expect more shaking.","where":"","check":"exact"},{"text":"More earthquake shaking may generate another tsunami.","where":"","check":"exact"}]},{"kind":"say","text":"Act if the sea suddenly rises or falls, or makes loud or unusual noises.","line":74,"quotes":[{"text":"See a sudden rise or fall in sea level","where":"","check":"exact"},{"text":"Hear loud or unusual noises from the sea","where":"","check":"exact"}]},{"kind":"say","text":"Mountain lake or fiord? Even a small quake can cause a tsunami; signs may be weak.","line":77,"quotes":[{"text":"Even a small earthquake could trigger a large landslide at a mountain lake or fiord/sound that generates a tsunami.","where":"","check":"exact"},{"text":"In these cases, natural warning signs may be weak or unnoticeable.","where":"","check":"exact"}]},{"kind":"say","text":"Warnings come on radio, TV or a mobile alert. Follow them immediately.","line":80,"quotes":[{"text":"Tsunami warnings will also be broadcast on radio and television.","where":"","check":"exact"},{"text":"An Emergency Mobile Alert may also be issued if there is a threat of flooding of land areas.","where":"","check":"exact"},{"text":"Immediately follow the advice of any emergency warning.","where":"","check":"exact"}]}],"ask":{"question":"Has anything changed?","options":[{"label":"Sea rose or fell, or loud noises","to":"get-gone","line":85,"target":"get-gone"},{"label":"Lake: strange water or rock falls","to":"lake","line":86,"target":"lake"},{"label":"Official warning","to":"official","line":87,"target":"official"},{"label":"Nothing more","to":"end","line":88,"target":"__end"}],"line":84},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":70},{"id":"lake","title":"At a lake: move away from the water","lines":[{"kind":"warning","text":"Move away from the water's edge to higher ground now.","line":91,"quotes":[{"text":"If you are at a lake or any other large body of water, move away from the water's edge to higher ground immediately if you experience any of the following:","where":"","check":"exact"}]},{"kind":"say","text":"The signs: a long or strong earthquake, a sudden rise or fall in the water, unusual waves, landslides or rock falls, or loud unusual noises.","line":93,"quotes":[{"text":"Feel a strong earthquake that makes it hard to stand up, or a long weak rolling earthquake that lasts a minute or more.","where":"","check":"exact"},{"text":"See a sudden rise or fall in water level, or unusual waves or water behaviour without an obvious cause (such as the wind or a boat).","where":"","check":"exact"},{"text":"See indications of landslides or rock falls occurring (for example, rocks falling or large dust clouds).","where":"","check":"exact"},{"text":"Hear loud and unusual noises from the water or surrounding area (for example, glacier cracking or rocks falling).","where":"","check":"exact"}]}],"ask":{"question":"When you can:","options":[{"label":"I've reached higher ground","to":"stay-there","line":99,"target":"stay-there"},{"label":"More help for the way","to":"get-gone","line":100,"target":"get-gone"}],"line":98},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":90},{"id":"get-gone","title":"Get Gone now","lines":[{"kind":"warning","text":"Move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.","line":103,"quotes":[{"text":"Move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.","where":"","check":"exact"}]},{"kind":"say","text":"Walk, run or cycle if at all possible.","line":105,"quotes":[{"text":"Walk, run or cycle if at all possible to reduce the chances of getting stuck in traffic congestion.","where":"","check":"exact"}]},{"kind":"say","text":"Don't spend time looking for pets; take them only if it won't delay you. Grab bag: if possible.","line":107,"quotes":[{"text":"Take your animals with you only if it will not delay you.","where":"","check":"exact"},{"text":"Do not spend time looking for them and if you are not at home, do not return to get them.","where":"","check":"exact"},{"text":"Take your grab bag with you if possible, but do not travel into the evacuation zone to collect your grab bag or other belongings.","where":"","check":"exact"}]}],"ask":{"question":"What do you need now?","options":[{"label":"Tips for the way","to":"on-the-way","line":112,"target":"on-the-way"},{"label":"Can't get out of the zone","to":"cant-get-out","line":113,"target":"cant-get-out"},{"label":"Can't walk, or must drive","to":"driving","line":114,"target":"driving"},{"label":"I've reached safety","to":"stay-there","line":115,"target":"stay-there"}],"line":111},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":102},{"id":"on-the-way","title":"On the way","lines":[{"kind":"warning","text":"Avoid earthquake damage, especially fallen power lines. Bridges may be damaged, and there may be landslides.","line":118,"quotes":[{"text":"While evacuating, avoid hazards caused by earthquake damage, especially fallen power lines.","where":"","check":"exact"},{"text":"For example, a large local earthquake may damage powerlines and bridges and create liquefaction and landslides.","where":"","check":"exact"}]},{"kind":"say","text":"Follow tsunami evacuation route signs or maps if there are any. If a route is slow or congested, use a different one.","line":121,"quotes":[{"text":"Evacuate via the routes shown on tsunami evacuation route signs or drawn on tsunami evacuation maps if these are available.","where":"","check":"exact"},{"text":"If these routes appear slow or congested, use a different route.","where":"","check":"exact"}]},{"kind":"say","text":"Not at home? Don't go back for pets. Don't go into the zone for your grab bag or belongings.","line":124,"quotes":[{"text":"Do not spend time looking for them and if you are not at home, do not return to get them.","where":"","check":"exact"},{"text":"Take your grab bag with you if possible, but do not travel into the evacuation zone to collect your grab bag or other belongings.","where":"","check":"exact"}]}],"ask":{"question":"When you've stopped:","options":[{"label":"I've reached safety","to":"stay-there","line":128,"target":"stay-there"},{"label":"Still on my way","to":"get-gone","line":129,"target":"get-gone"}],"line":127},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":117},{"id":"cant-get-out","title":"Can't get out of the zone","lines":[{"kind":"warning","text":"Go as far or as high as you can. Every metre makes a difference.","line":132,"quotes":[{"text":"Even if you can't get out of your evacuation zone, go as far or as high as you can.","where":"","check":"exact"},{"text":"Every metre makes a difference.","where":"","check":"exact"}]},{"kind":"say","text":"The guidance does not say which buildings or places are safe to go up. Follow local advice and your Civil Defence Group's evacuation maps.","line":135,"quotes":[{"text":"Your Civil Defence Emergency Management Group has tsunami evacuation zone maps and advice.","where":"","check":"exact"}]}],"ask":{"question":"When you've stopped:","options":[{"label":"I've reached safety","to":"stay-there","line":138,"target":"stay-there"},{"label":"Still on my way","to":"get-gone","line":139,"target":"get-gone"}],"line":137},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":131},{"id":"driving","title":"Can't walk, or have to drive","lines":[{"kind":"say","text":"Vehicles on roads should be kept for emergency services and people with mobility impairments, including wheelchair users.","line":142,"quotes":[{"text":"Use of vehicles on roads should be limited to emergency services and those with mobility impairments, including wheelchair users.","where":"","check":"exact"}]},{"kind":"warning","text":"If you have to drive, keep going once you are well outside all evacuation zones, to leave room for others behind you.","line":144,"quotes":[{"text":"If you have to drive, keep going once you are well outside of all evacuation zones, to allow room for others behind you.","where":"","check":"exact"}]},{"kind":"say","text":"The guidance says nothing more for people who can't walk, run or cycle. Follow local advice.","line":146}],"ask":{"question":"When you've stopped:","options":[{"label":"I've reached safety","to":"stay-there","line":148,"target":"stay-there"},{"label":"Still on my way","to":"get-gone","line":149,"target":"get-gone"}],"line":147},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":141},{"id":"stay-there","title":"Stay there until the all-clear","lines":[{"kind":"warning","text":"Do not return until you get an official all-clear message from Civil Defence.","line":152,"quotes":[{"text":"Do not return until you get an official all-clear message from Civil Defence.","where":"","check":"exact"}]},{"kind":"say","text":"Tsunami activity can continue for several hours, and the first wave may not be the largest.","line":154,"quotes":[{"text":"Tsunami activity can continue for several hours, and the first wave may not be the largest.","where":"","check":"exact"}]},{"kind":"say","text":"Expect aftershocks. Each time you feel one, drop, cover and hold. Aftershocks may generate another tsunami.","line":156,"quotes":[{"text":"If there was an earthquake, expect aftershocks.","where":"","check":"exact"},{"text":"Each time you feel one, drop, cover, and hold.","where":"","check":"exact"},{"text":"Aftershocks may generate another tsunami.","where":"","check":"exact"}]},{"kind":"say","text":"For updates, listen to the radio or follow your Civil Defence Group online.","line":160,"quotes":[{"text":"Listen to the radio or follow your Civil Defence Emergency Management Group online.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"after","line":162,"target":"after"},"timer":null,"reminders":[],"stop":null,"end":false,"line":151,"nexts":[{"to":"after","line":162,"target":"after"}]},{"id":"official","title":"Official warning","lines":[{"kind":"warning","text":"Immediately follow the advice of any emergency warning. Do not wait for more messages before you act.","line":165,"quotes":[{"text":"Immediately follow the advice of any emergency warning.","where":"","check":"exact"},{"text":"Do not wait for more messages before you act.","where":"","check":"exact"}]},{"kind":"say","text":"Felt a long or strong earthquake? Don't wait for an alert: go as soon as the shaking stops.","line":168,"quotes":[{"text":"Do not wait for an Emergency Mobile Alert if you felt a long or strong earthquake.","where":"","check":"exact"},{"text":"Self-evacuate as soon as the shaking stops.","where":"","check":"exact"}]}],"ask":{"question":"What does the warning tell you?","options":[{"label":"Evacuate immediately","to":"get-gone","line":172,"target":"get-gone"},{"label":"Prepare to evacuate","to":"prepare","line":173,"target":"prepare"},{"label":"Tsunami activity advisory: stay out of the water","to":"advisory","line":174,"target":"advisory"},{"label":"I know I'm outside the evacuation zones","to":"outside-zone","line":175,"target":"outside-zone"}],"line":171},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":164},{"id":"prepare","title":"Prepare to evacuate","lines":[{"kind":"do","text":"Listen to the radio or TV for updates, and check your Civil Defence Group's website. Follow any instructions about evacuating.","line":178,"quotes":[{"text":"Listen to the radio or TV for updates, and check your local Civil Defence Emergency Management Group's website","where":"","check":"exact"},{"text":"Listen to local Civil Defence Emergency Management authorities and follow any instructions regarding evacuation of your area.","where":"","check":"exact"}]},{"kind":"do","text":"Leave your phone on and charged so you get alerts.","line":181,"quotes":[{"text":"Leave cell phones on and charged so you can receive alerts.","where":"","check":"exact"}]},{"kind":"do","text":"Put food, clothing and medication in your grab bag.","line":183,"quotes":[{"text":"Put essential items such as food, clothing, and medication in your grab bag to take when you evacuate.","where":"","check":"exact"}]},{"kind":"do","text":"Find any pets. Bring them only if it won't delay you.","line":185,"quotes":[{"text":"Find any pets and bring them with you when you evacuate, only if it will not delay you.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"prepare-more","line":187,"target":"prepare-more"},"timer":null,"reminders":[],"stop":null,"end":false,"line":177,"nexts":[{"to":"prepare-more","line":187,"target":"prepare-more"}]},{"id":"prepare-more","title":"While you wait","lines":[{"kind":"do","text":"Secure your home as you would for a long time away.","line":190,"quotes":[{"text":"Secure your whare/home as you normally would when leaving for an extended period.","where":"","check":"exact"}]},{"kind":"do","text":"Tell your neighbours. Help any who need help to evacuate.","line":192,"quotes":[{"text":"Share information with your neighbours. They may not be aware of the tsunami warning.","where":"","check":"exact"},{"text":"Help neighbours who need assistance to evacuate.","where":"","check":"exact"}]},{"kind":"say","text":"Farming? Evacuate family and staff first; move livestock to higher ground if you have time.","line":195,"quotes":[{"text":"If you are farming along the coast or river estuary, evacuate your whānau/family and staff first. If you have time, move livestock to higher ground.","where":"","check":"exact"}]},{"kind":"say","text":"Not sure of your zone? Search your address on the evacuation zone maps.","line":197,"quotes":[{"text":"Search your home, work or school address to find out if it is in a tsunami evacuation zone.","where":"","check":"exact"}]}],"ask":{"question":"What now?","options":[{"label":"Time to go","to":"get-gone","line":200,"target":"get-gone"},{"label":"Still waiting","to":"prepare","line":201,"target":"prepare"},{"label":"I know I'm outside the zones","to":"outside-zone","line":202,"target":"outside-zone"},{"label":"Cancelled or all-clear","to":"after","line":203,"target":"after"}],"line":199},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":189},{"id":"outside-zone","title":"Outside the evacuation zones","lines":[{"kind":"say","text":"If you are outside the tsunami evacuation zones, you do not need to evacuate. Staying where you are helps reduce congestion for those who must.","line":206,"quotes":[{"text":"If you are outside of tsunami evacuation zones you do not need to evacuate.","where":"","check":"exact"},{"text":"If you stay where you are, it will help to reduce congestion for those who must evacuate.","where":"","check":"exact"}]},{"kind":"say","text":"Not sure? The guidance doesn't say. If you are told to evacuate immediately, move immediately.","line":209,"quotes":[{"text":"If you are advised to evacuate immediately, you should:","where":"","check":"exact"}]}],"ask":{"question":"What will you do?","options":[{"label":"I'm outside: staying here","to":"stay-there","line":212,"target":"stay-there"},{"label":"Go to high ground or inland","to":"get-gone","line":213,"target":"get-gone"}],"line":211},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":205},{"id":"advisory","title":"Activity advisory: stay out of the water","lines":[{"kind":"warning","text":"Stay out of the water (sea, rivers and estuaries, including boats) and off beaches and shore areas.","line":216,"quotes":[{"text":"Evacuation of land areas is not required but people should stay out of the water (sea, rivers, and estuaries, including boats) and stay off beaches and shore areas when a tsunami activity advisory is issued.","where":"","check":"exact"}]},{"kind":"say","text":"Land flooding isn't expected, but this can change. Don't swim, surf, fish or boat: currents can drown.","line":218,"quotes":[{"text":"A tsunami activity advisory will be issued when inundation of land areas near the shore is not expected (although this assessment may change)","where":"","check":"exact"},{"text":"Do not go swimming, surfing, fishing or engage in small boat activities when a tsunami activity advisory is issued.","where":"","check":"exact"},{"text":"Strong currents and surges can injure and drown people.","where":"","check":"exact"}]},{"kind":"say","text":"At a marina or on a boat: go ashore; don't go back unless Civil Defence says.","line":222,"quotes":[{"text":"People on boats, liveaboards and at marinas should leave their boats/vessels and move onto shore. Do not return to boats unless instructed by Civil Defence.","where":"","check":"exact"}]},{"kind":"say","text":"Out at sea? The guidance doesn't say whether to come in. Listen to Maritime Radio.","line":224,"quotes":[{"text":"Coastal Navigational Warnings will be issued by the Rescue Coordination Centre New Zealand (RCCNZ), via Maritime Radio.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"stay-there","line":226,"target":"stay-there"},"timer":null,"reminders":[],"stop":null,"end":false,"line":215,"nexts":[{"to":"stay-there","line":226,"target":"stay-there"}]},{"id":"informal","title":"Warning from friends, media or online","lines":[{"kind":"say","text":"If the warning seems trustworthy, consider evacuating. If you feel a threat is near, move immediately to high ground or inland.","line":229,"quotes":[{"text":"If the warning seems trustworthy, consider evacuating.","where":"","check":"exact"},{"text":"If you feel a tsunami threat is imminent, move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.","where":"","check":"exact"}]},{"kind":"say","text":"Check the warning once you've evacuated, or on the way if it won't slow you down. Trust official warnings over informal ones.","line":232,"quotes":[{"text":"Check the accuracy of the warning once you have evacuated or en route if it won’t slow you down.","where":"","check":"exact"},{"text":"If official warnings are available, trust their message over informal warnings.","where":"","check":"exact"}]}],"ask":{"question":"What will you do?","options":[{"label":"Go now","to":"get-gone","line":236,"target":"get-gone"},{"label":"There is an official warning","to":"official","line":237,"target":"official"},{"label":"Not going for now: watch for signs","to":"not-long","line":238,"target":"not-long"}],"line":235},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":228},{"id":"boat","title":"On a boat or at a marina","lines":[{"kind":"say","text":"This is for a local tsunami (minutes away). Distant one? Check with your harbourmaster.","line":241,"quotes":[{"text":"In a local source tsunami, which can arrive in minutes, you need to take action quickly.","where":"","check":"exact"},{"text":"Check with your local harbourmaster to find out what your local tsunami response procedures are.","where":"","check":"exact"}]},{"kind":"say","text":"At sea you may feel the quake through the hull, or see sudden extreme changes in currents.","line":244,"quotes":[{"text":"You may feel the earthquake through the hull of your boat.","where":"","check":"exact"},{"text":"You could see a rapid and extreme shift in currents and simultaneous changes in wind wave heights.","where":"","check":"exact"}]}],"ask":{"question":"Where is your boat?","options":[{"label":"On land or at a dock","to":"boat-dock","line":248,"target":"boat-dock"},{"label":"Shallower than 50 metres","to":"boat-shallow","line":249,"target":"boat-shallow"},{"label":"Over 50 metres, outside harbours/channels","to":"boat-deep","line":250,"target":"boat-deep"},{"label":"Over 50 metres, in a harbour or channel","to":"boat-harbour","line":251,"target":"boat-harbour"}],"line":247},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":240},{"id":"boat-dock","title":"Leave your boat","lines":[{"kind":"warning","text":"Leave your boat. Move immediately to the nearest high ground or as far inland as you can.","line":254,"quotes":[{"text":"If you are on land or tied up at dock, and you see or hear natural warning signs of a tsunami, leave your boat, move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"get-gone","line":256,"target":"get-gone"},"timer":null,"reminders":[],"stop":null,"end":false,"line":253,"nexts":[{"to":"get-gone","line":256,"target":"get-gone"}]},{"id":"boat-shallow","title":"Shallower than 50 metres","lines":[{"kind":"say","text":"Stop commercial fishing immediately. Free the vessel from anything on the bottom, or gear that might drag (cut lines if necessary).","line":259,"quotes":[{"text":"Stop commercial fishing operations immediately.","where":"","check":"exact"},{"text":"Free the vessel from any bottom attachment and gear that might drag in currents (cut lines if necessary).","where":"","check":"exact"}]},{"kind":"warning","text":"If you can beach or dock your small boat and leave on foot within ten minutes of a natural warning, that is your best chance.","line":262,"quotes":[{"text":"If you can beach or dock your small boat and evacuate on foot within ten minutes of a natural warning, then this is your best chance.","where":"","check":"exact"}]}],"ask":{"question":"Small boat: can you be ashore on foot within ten minutes of first noticing the sign?","options":[{"label":"Yes","to":"boat-dock","line":265,"target":"boat-dock"},{"label":"No","to":"boat-to-deep","line":266,"target":"boat-to-deep"}],"line":264},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":258},{"id":"boat-to-deep","title":"Head for deep water","lines":[{"kind":"say","text":"Head for the deepest water you can, more than 50 metres deep, directly away from the shore.","line":269,"quotes":[{"text":"If evacuation on foot is not possible, head for the deepest water possible, greater than 50 metres deep.","where":"","check":"exact"},{"text":"Proceed directly away from the shore.","where":"","check":"exact"}]},{"kind":"say","text":"Sail directly into waves. Tsunami can mix with wind waves in unusual ways. Keep as far as you can from other vessels.","line":272,"quotes":[{"text":"Sail directly into waves. Be aware that tsunami can interact with wind waves and produce unusual effects.","where":"","check":"exact"},{"text":"Maintain as much separation as possible from other vessels.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"boat-at-sea","line":275,"target":"boat-at-sea"},"timer":null,"reminders":[],"stop":null,"end":false,"line":268,"nexts":[{"to":"boat-at-sea","line":275,"target":"boat-at-sea"}]},{"id":"boat-deep","title":"Deeper than 50 metres","lines":[{"kind":"say","text":"Outside harbours and channels, keep heading to deeper water. It is safer from tsunami currents and waves.","line":278,"quotes":[{"text":"If you are on the water at greater than 50 metres outside of harbours/channels, continue to head to deeper water which is safer from tsunami currents and waves.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"boat-at-sea","line":280,"target":"boat-at-sea"},"timer":null,"reminders":[],"stop":null,"end":false,"line":277,"nexts":[{"to":"boat-at-sea","line":280,"target":"boat-at-sea"}]},{"id":"boat-harbour","title":"Deep water in a harbour or channel","lines":[{"kind":"say","text":"The guidance does not say what to do in d
