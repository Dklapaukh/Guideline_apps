<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Earthquake: Drop, Cover and Hold, then what to do after</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>/* Phone-first, portrait, large tap targets. One stylesheet for every generated app; looks (engine/looks/) restyle it.
   --brand is set by the runtime when the template gives "Brand colour:"; each look decides where it shows. */
:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:var(--brand, #0b6e4f); --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }
.bar { position: sticky; top: 0; z-index: 3; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#14213d; color:#fff; }
.bar .t { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .brand { font-weight:800; margin-right:6px; }
.bar .clock:empty { display:none; }
.bar .clock { font-variant-numeric: tabular-nums; font-size:18px; }
.proto { font-size:12px; color:var(--author); background:var(--authorbg); padding:4px 14px; }
.card { background:var(--card); margin:10px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); }
h1 { font-size:22px; margin:4px 0 8px; } h2 { font-size:21px; margin:2px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
p { margin: 8px 0; } p.bul::before { content:"• "; color:var(--mut); }
.big { display:block; width:100%; min-height:52px; margin:10px 0 0; padding:12px 14px; font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line); background:#eef1f4; color:var(--ink); text-align:left; }
.big.go { background:var(--go); color:#fff; border-color:var(--go); text-align:center; }
.big.opt { background:#e8f0fe; border-color:#b7c9f5; }
.big.opt.broken { border-style:dashed; border-color:var(--author); }
.big.skip { background:transparent; text-align:center; font-weight:500; color:var(--mut); }
.link { background:none; border:0; color:#1d4ed8; font:inherit; padding:0; }
.crumb { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); }
.q { font-weight:600; font-size:19px; margin-top:16px; }
.warn { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; font-weight:600; }
.author { background:var(--authorbg); color:var(--author); border-left:4px solid var(--author); padding:8px 10px; border-radius:6px; font-size:15px; }
.do { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.do input { width:26px; height:26px; margin:0; flex:none; } .do span { flex:1; }
.do .dep { flex-basis:100%; margin-left:36px; }
.dep { display:block; color:var(--author); font-size:13px; }
/* folds: "More detail" (extra lines of the step) and "Sources for this screen" (the guideline quotes) */
details.more, details.sources { margin:14px 0 0; }
details.more > summary, details.sources > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:48px; }
details.more > summary::-webkit-details-marker, details.sources > summary::-webkit-details-marker { display:none; }
details.more > summary::before, details.sources > summary::before { content:"+"; display:inline-grid; place-items:center; flex:none; width:26px; height:26px; border-radius:6px; font-weight:800; line-height:1; }
details.more[open] > summary::before, details.sources[open] > summary::before { content:"−"; }
details.more { border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
details.more > summary { font-weight:700; color:var(--ink); } details.more > summary::before { background:#e8eef6; color:#1d4ed8; }
details.more[open] { padding-bottom:6px; } .more-line { margin:6px 0 10px; }
details.sources { font-size:14px; color:var(--mut); border-top:1px dashed var(--line); margin-top:18px; }
details.sources > summary { color:var(--mut); font-weight:600; } details.sources > summary::before { border:1px solid var(--line); color:var(--mut); }
.src-list { margin:4px 0 6px; padding-left:24px; } .src-list li { margin:0 0 10px; }
.src-list q { font-style:italic; color:var(--ink); } .src-list .where { color:var(--mut); } .src-list .for { display:block; font-size:13px; color:var(--mut); }
/* "Tip:" the app's own suggestion, never guideline advice: a dashed box and a badge that says so */
.tip { margin:12px 0; padding:10px 12px; border:2px dashed #4f6fb5; border-radius:10px; background:#f1f5fd; }
.tip-badge { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#fff; background:#3b5998; border-radius:999px; padding:2px 10px; }
.tip-text { margin:6px 0 0; font-size:.94em; font-weight:400; color:var(--mut); }   /* secondary to the guideline's own lines; the badge says what it is */
.timer { margin:14px 0; padding:12px; border-radius:10px; background:#eef6f2; text-align:center; }
.timer .lbl { color:var(--mut); font-size:14px; }
.big-clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
.timer.due { background:#fde8e8; } .timer.due .big-clock { color:var(--due); }
.reminders { position:sticky; top:44px; z-index:2; background:var(--bg); padding:6px 10px 0; }
.rem { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:6px; }
.rem .rt { flex:1; font-weight:600; font-size:15px; } .rem .rc { font-variant-numeric:tabular-nums; font-size:15px; }
.rem button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.rem.due { border-color:var(--due); background:#fde8e8; } .rem.due .rc { color:var(--due); font-weight:700; }
.rec { padding:6px 0; } .rec small { color:var(--mut); }
.rec-btn { background:#fff7e6; border-color:#f2c46d; }
.note-box { margin:12px 0; padding:10px 0; } .note-lbl { display:block; font-weight:700; margin-bottom:6px; }
.note-text { display:block; width:100%; min-height:132px; font:inherit; line-height:1.4; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
.note-text:focus { outline:3px solid var(--go); outline-offset:1px; }
.note-save { text-align:center; } .note-status { display:block; margin-top:6px; color:var(--mut); font-size:14px; }
/* "Location:" a position box with a big "Use GPS position" button */
.gps-btn { text-align:center; min-height:60px; font-size:18px; background:var(--go); color:#fff; border-color:var(--go); }
.gps-btn::before { content:"⌖"; margin-right:8px; font-size:1.2em; }
.gps-msg, .gps-ddm { display:block; margin:8px 0 0; } .gps-msg:empty, .gps-ddm:empty { display:none; }
.gps-msg { font-weight:600; font-size:15px; } .gps-ddm { font-weight:700; font-variant-numeric:tabular-nums; }
.loc-text { min-height:76px; margin-top:10px; }
.log small { white-space:pre-wrap; }
.lookup { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
.lookup .lk { font-weight:600; } .lookup .lv { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px dashed var(--line); }
table { border-collapse:collapse; width:100%; font-size:14px; } th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; }
.inputs { margin:10px 0; } .inp { display:block; margin:10px 0; font-weight:600; }
.inp input { display:block; width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); margin-top:4px; }
.inp small { font-weight:400; color:var(--mut); } .inp .bad { color:var(--due); font-weight:400; font-size:14px; }
.choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.choices button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.choices button.on { background:#14213d; color:#fff; }
.log { padding-left:0; list-style:none; } .log li { padding:6px 0; border-bottom:1px solid var(--line); } .log time { display:inline-block; min-width:56px; font-variant-numeric:tabular-nums; color:var(--mut); } .log .tod { font-variant-numeric:tabular-nums; font-size:.85em; color:var(--mut); margin-right:4px; }
.findings { padding-left:18px; } .findings li { margin:8px 0; font-size:15px; }
.lvl-fix { color:var(--due); } .lvl-check { color:var(--warn); } .lvl-info { color:var(--mut); }
.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
.tabs button { flex:1; font:inherit; font-size:15px; padding:14px 4px; background:none; border:0; color:var(--mut); }
.look-link { text-align:center; font-size:14px; margin-top:14px; }
.look-pick { display:flex; flex-wrap:wrap; gap:6px; }
.look-pick button { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
.look-pick button.on { background:var(--go); border-color:var(--go); color:#fff; }
.tabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 3px 0 #14213d; }

/* look: Clinic */
html[data-look="clinic"]{ --ink:#16232b; --mut:#5b6b75; --bg:#eef3f4; --card:#fff; --line:#dfe7ea; --go:var(--brand, #0f766e); --gosoft:#d9f0ec; --gosoft:color-mix(in srgb, var(--go) 15%, #fff);
  --warn:#9a3412; --warnbg:#fff1e6; --due:#c2410c; --author:#6b21a8; --authorbg:#f4edfb; }html[data-look="clinic"], html[data-look="clinic"] body{ font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); }html[data-look="clinic"] .bar{ background:var(--bg); color:var(--ink); padding:14px 18px 6px; }html[data-look="clinic"] .bar .t{ font-size:15px; color:var(--mut); font-weight:600; }html[data-look="clinic"] .bar .clock{ background:var(--card); border-radius:999px; padding:4px 12px; font-size:15px; font-weight:600; color:var(--go); }html[data-look="clinic"] .proto{ background:transparent; color:var(--mut); padding:0 18px 4px; font-size:12px; }html[data-look="clinic"] .card{ border:0; border-radius:22px; padding:20px; margin:10px 12px; box-shadow:0 1px 2px rgba(22,35,43,.05), 0 8px 24px rgba(22,35,43,.06); }html[data-look="clinic"] h1, html[data-look="clinic"] h2{ font-family:"Inter", system-ui, sans-serif; font-weight:700; letter-spacing:-.02em; text-wrap:balance; }html[data-look="clinic"] h2{ font-size:24px; }html[data-look="clinic"] h3{ color:var(--go); }html[data-look="clinic"] .crumb{ font-size:13px; }html[data-look="clinic"] .crumb span{ background:var(--gosoft); color:var(--go); border-radius:999px; padding:2px 10px; font-weight:600; }html[data-look="clinic"] .big{ border-radius:16px; border:0; background:#f1f5f6; min-height:56px; }html[data-look="clinic"] .big.go{ background:var(--go); border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.25); }html[data-look="clinic"] .big.opt{ background:#f4f8f8; border:1.5px solid var(--line); position:relative; padding-right:40px; }html[data-look="clinic"] .big.opt::after{ content:"›"; position:absolute; right:16px; top:50%; transform:translateY(-52%); font-size:26px; color:var(--go); }html[data-look="clinic"] .q{ font-size:20px; }html[data-look="clinic"] .warn{ border:0; border-radius:14px; padding:12px 14px; }html[data-look="clinic"] .do{ border-bottom:0; background:#f6f9f9; border-radius:14px; padding:12px; margin:8px 0; }html[data-look="clinic"] .do input{ accent-color:var(--go); border-radius:50%; }html[data-look="clinic"] .timer{ background:var(--gosoft); border-radius:20px; padding:18px; position:relative; overflow:hidden; }html[data-look="clinic"] .timer::after{ content:""; position:absolute; left:0; bottom:0; height:6px; width:calc(var(--p, 0) * 100%); background:var(--go); transition:width .25s linear; }html[data-look="clinic"] .big-clock{ color:var(--go); font-size:52px; letter-spacing:-.02em; }html[data-look="clinic"] .rem{ border:0; border-radius:16px; box-shadow:0 4px 14px rgba(22,35,43,.08); }html[data-look="clinic"] .tabs{ left:12px; right:12px; bottom:10px; border:0; border-radius:20px; box-shadow:0 8px 30px rgba(22,35,43,.15); overflow:hidden; }html[data-look="clinic"] .tabs button.on{ color:var(--go); box-shadow:none; background:var(--gosoft); }html[data-look="clinic"] .choices button{ border-radius:999px; }html[data-look="clinic"] .choices button.on{ background:var(--go); border-color:var(--go); }html[data-look="clinic"] .note-box{ background:#f6f9f9; border-radius:16px; padding:14px; }html[data-look="clinic"] .note-text{ border:1.5px solid var(--line); border-radius:14px; background:#fff; }html[data-look="clinic"] .note-save{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] .tip{ background:#eef4ff; border:1.5px dashed #7b9be0; border-radius:16px; padding:12px 14px; }html[data-look="clinic"] .tip-badge{ background:#dbe6fb; color:#2f4f9a; font-weight:700; text-transform:none; letter-spacing:0; font-size:13px; }html[data-look="clinic"] details.more{ border:0; background:#f6f9f9; border-radius:16px; padding:0 14px; }html[data-look="clinic"] details.more[open]{ padding-bottom:8px; }html[data-look="clinic"] details.more > summary{ color:var(--ink); }html[data-look="clinic"] details.more > summary::before{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] details.sources{ border-top:1px solid var(--line); }html[data-look="clinic"] details.sources > summary::before{ border-radius:999px; }html[data-look="clinic"] .gps-btn{ background:var(--go); color:#fff; border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.2); }html[data-look="clinic"] .gps-ddm{ color:var(--go); }

/* look: Wayfinding */
html[data-look="wayfinding"]{ --ink:#0a0a0a; --mut:#555; --bg:#ffffff; --card:#fff; --line:#0a0a0a; --go:#0a0a0a; --route:var(--brand, #e4002b); --sign:#ffd400;
  --warn:#0a0a0a; --warnbg:#ffd400; --due:#e4002b; --author:#5b21b6; --authorbg:#efe9fb; }html[data-look="wayfinding"], html[data-look="wayfinding"] body{ font-family:"Archivo", "Helvetica Neue", Arial, sans-serif; background:var(--bg); }html[data-look="wayfinding"] .bar{ background:var(--ink); padding:12px 16px; }html[data-look="wayfinding"] .bar .t{ font-weight:800; letter-spacing:.01em; }html[data-look="wayfinding"] .bar .clock{ background:var(--sign); color:var(--ink); padding:2px 10px; font-weight:800; }html[data-look="wayfinding"] .proto{ background:#f2f2f2; color:var(--mut); }html[data-look="wayfinding"] .card{ border:0; border-radius:0; margin:0; padding:18px 18px 20px; }html[data-look="wayfinding"] h1, html[data-look="wayfinding"] h2{ font-weight:900; letter-spacing:-.02em; line-height:1.05; text-wrap:balance; }html[data-look="wayfinding"] h1{ font-size:32px; }html[data-look="wayfinding"] h2{ font-size:30px; margin-top:6px; }html[data-look="wayfinding"] .crumb{ flex-direction:row-reverse; justify-content:flex-end; gap:14px; align-items:center; }html[data-look="wayfinding"] .crumb span{ display:inline-grid; place-items:center; min-width:40px; height:40px; padding:0 8px; background:var(--route); color:#fff; font-weight:900; font-size:15px; border-radius:999px; }html[data-look="wayfinding"] .big{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:800; min-height:58px; }html[data-look="wayfinding"] .big.go{ background:var(--ink); color:#fff; border-color:var(--ink); text-align:left; position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.go::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }html[data-look="wayfinding"] .big.opt{ background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.opt::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }html[data-look="wayfinding"] .big.skip{ border:0; text-decoration:underline; }html[data-look="wayfinding"] .link{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] .q{ font-size:22px; font-weight:900; }html[data-look="wayfinding"] .warn{ background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }html[data-look="wayfinding"] .warn::before{ content:"!"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }html[data-look="wayfinding"] .do{ position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }html[data-look="wayfinding"] .do::before{ content:""; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }html[data-look="wayfinding"] .do input{ position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }html[data-look="wayfinding"] .do .dep{ margin-left:0; }html[data-look="wayfinding"] .timer{ background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }html[data-look="wayfinding"] .timer .lbl{ color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }html[data-look="wayfinding"] .timer::after{ content:""; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg, var(--sign) calc(var(--p, 0) * 100%), #333 0); }html[data-look="wayfinding"] .big-clock{ font-size:60px; font-weight:900; color:var(--sign); }html[data-look="wayfinding"] .timer.due{ background:var(--due); }html[data-look="wayfinding"] .timer.due .big-clock{ color:#fff; }html[data-look="wayfinding"] .rem{ border:2px solid var(--ink); border-radius:0; }html[data-look="wayfinding"] .rem button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .rem.due{ background:var(--sign); }html[data-look="wayfinding"] .choices button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .choices button.on{ background:var(--ink); color:#fff; }html[data-look="wayfinding"] .look-pick button{ border-radius:0; border:2px solid var(--ink); font-weight:700; }html[data-look="wayfinding"] .tabs{ border-top:2px solid var(--ink); }html[data-look="wayfinding"] .tabs button{ font-weight:800; color:var(--mut); }html[data-look="wayfinding"] .tabs button.on{ color:var(--ink); box-shadow:inset 0 4px 0 var(--route); }html[data-look="wayfinding"] .note-lbl{ font-weight:900; font-size:19px; }html[data-look="wayfinding"] .note-text{ border:2px solid var(--ink); border-radius:0; font-weight:600; }html[data-look="wayfinding"] .note-text:focus{ outline:4px solid var(--sign); outline-offset:0; }html[data-look="wayfinding"] .tip{ background:#f2f6fb; color:var(--mut); border:0; border-left:6px solid #0057b8; border-radius:0; padding:10px 14px; }html[data-look="wayfinding"] .tip-badge{ background:#0057b8; color:#fff; border-radius:0; font-weight:900; }html[data-look="wayfinding"] .tip-text{ font-weight:400; color:var(--mut); }html[data-look="wayfinding"] details.more{ border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); }html[data-look="wayfinding"] details.more > summary{ font-weight:900; font-size:18px; }html[data-look="wayfinding"] details.more > summary::before{ background:var(--ink); color:#fff; border-radius:0; }html[data-look="wayfinding"] details.sources{ border-top:2px solid #ddd; }html[data-look="wayfinding"] details.sources > summary{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] details.sources > summary::before{ border:2px solid var(--ink); color:var(--ink); border-radius:0; }html[data-look="wayfinding"] .gps-btn{ background:var(--ink); color:#fff; border-color:var(--ink); border-radius:0; font-weight:900; }html[data-look="wayfinding"] .gps-btn::before{ color:var(--sign); }html[data-look="wayfinding"] .gps-ddm{ font-size:19px; font-weight:900; }
