ied going back into a fire.","line":77,"quotes":[{"text":"Don't leave the meeting place to go back inside for any reason.","where":"3-Step Escape Plan","check":"exact"},{"text":"People have died by going back into a fire.","where":"3-Step Escape Plan","check":"exact"}]},{"kind":"say","text":"Your workplace's plan says who can give the all-clear.","line":80},{"kind":"note","text":"App wording. In FENZ's example scheme the all-clear is given by \"the Head Warden or Fire and Emergency\" (Area Wardens' duty), but that is the made-up building's set-up, so it isn't quoted as the user's instruction.","line":81},{"kind":"say","text":"You did the right thing by getting out.","line":82}],"ask":null,"next":null,"timer":null,"reminders":[],"stop":null,"end":true,"line":76},{"id":"ext-small","title":"Is the fire small?","lines":[{"kind":"warning","text":"First, shout \"Fire, Fire, Fire\" and set off the fire alarm.","line":85,"quotes":[{"text":"WARN OTHER BUILDING OCCUPANTS","where":"Fire Action Notice","check":"exact"},{"text":"Operate the nearest fire alarm manual call point","where":"Example evacuation scheme","check":"exact"}]},{"kind":"say","text":"Only use an extinguisher if it's safe. Life is more important than property.","line":88,"quotes":[{"text":"Only use fire extinguishers when it is safe to do so","where":"Commercial use of fire extinguishers","check":"exact"},{"text":"Remember, life is more important than property.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"say","text":"The fire must be no bigger than a waste paper basket or a pot on a stove, and in a place that is safe to get near.","line":91,"quotes":[{"text":"when the fire is no larger than a waste paper basket or pot on a stove.","where":"Commercial use of fire extinguishers","check":"exact"},{"text":"It's safe to do so considering the size and location of the fire","where":"Fire extinguishers, home page","check":"exact"}]}],"ask":{"question":"Is the fire that small, and safe to get n ing","text":"Gas fire: turn off the gas supply first.","line":116,"quotes":[{"text":"Always turn off the supply of gas before extinguishing gas fires.","where":"Fire extinguisher position document","check":"exact"}]},{"kind":"warning","text":"Cooking oil or fat: never use dry powder. Live electricity: don't use wet chemical.","line":118,"quotes":[{"text":"you should never use it on a cooking oil or fat fire","where":"Fire extinguishers, home page","check":"exact"},{"text":"However, don't use wet chemical extinguishers on fires with a live electrical source.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"say","text":"Metal fires need a special extinguisher.","line":121,"quotes":[{"text":"Special purpose extinguishers are available for metal fires.","where":"Fire extinguisher position document","check":"exact"}]},{"kind":"note","text":"FENZ's table of which extinguisher suits which class could not be read, so this screen gives only the pairings FENZ states in words. The question is backed by \"confident you understand how to use the extinguisher correctly\" (home page). The gap is explained in the Get ready route.","line":123}],"ask":{"question":"Are you sure this extinguisher is right for this fire?","options":[{"label":"Yes","to":"ext-confident","line":125,"target":"ext-confident"},{"label":"No, or I'm not sure","to":"get-out","line":126,"target":"get-out"}],"line":124},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":115},{"id":"ext-confident","title":"Do you know how?","lines":[{"kind":"say","text":"Only go ahead if you're confident you know how to use it.","line":129,"quotes":[{"text":"You're confident you understand how to use the extinguisher correctly.","where":"Fire extinguishers, home page","check":"exact"}]}],"ask":{"question":"Are you confident you know how to use it?","options":[{"label":"Yes","to":"ext-use","line":132,"target":"ext-use"},{"label":"No, or I'm not sure","to":"get-out","line":133,"target":"get-out"}],"line":131},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":128},{"id":"ext-use","title":"Use it: PTASS","lines":[{"kind":"say","text":"It only lasts 10-15 seconds once started.","line":136,"quotes":[{"text":"your extinguisher will only last 10-15 seconds once started","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"do","text":"Pull the safety pin or remove the clip.","line":138,"quotes":[{"text":"Pull the safety pin or remove the clip.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"do","text":"Test squirt it to check it works.","line":140,"quotes":[{"text":"Test squirt the extinguisher to make sure it is working.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"do","text":"Aim at the base of the fire from a safe distance (most extinguishers work from about 2-3 metres).","line":142,"quotes":[{"text":"Aim the nozzle at the base of the fire from a safe distance.","where":"Fire extinguishers, home page","check":"exact"},{"text":"Most extinguishers are designed to be operated from about 2 - 3 metres away.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"do","text":"Squeeze the handles.","line":145,"quotes":[{"text":"Squeeze the handles.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"do","text":"Sweep from side to side, aiming at the base of the fire.","line":147,"quotes":[{"text":"Sweep the extinguisher from side to side while aiming at the base of the fire.","where":"Fire extinguishers, home page","check":"exact"}]},{"kind":"note","text":"No Timer: 10-15 seconds is a range (lessons trap 1) and a countdown would pull eyes off the fire; it is shown as a fact. The PTASS steps are on FENZ's home page; the commercial page links to it (\"See our advice on how to use a fire exitnguisher.\").","line":149}],"ask":{"question":"Is the fire out?","options":[{"label":"Yes, it's out","to":"ext-done","line":151,"target":"ext-done"},{"label":"No, it's stil         return go(o.target, `${s.ask.question || s.title}: ${o.label}`);
      }
      if (d.rec) {
        const r = (_a = S.records)[_b = d.rec] ?? (_a[_b] = { n: 0, last: 0 });
        r.n++;
        r.last = now();
        log(d.rec);
        render();
        return;
      }
      if (d.remdone) {
        const r = S.reminders[d.remdone];
        if (r) {
          log("Done", r.text);
          if (r.once) delete S.reminders[d.remdone];
          else {
            r.dueAt = now() + r.ms;
            r.alerted = false;
          }
        }
        render();
        return;
      }
      if (d.remstop) {
        const r = S.reminders[d.remstop];
        if (r) log("Reminder stopped", r.text);
        delete S.reminders[d.remstop];
        render();
        return;
      }
      switch (d.act) {
        case "begin":
          try {
            startAudio();
          } catch {
          }
          return begin();
        // phones only allow sound that starts on a tap
        case "back":
          return back();
        case "next":
          return go(nextTarget(byId.get(S.current)), "Next");
        case "timer-go":
          return go(byId.get(S.current).timer.target, "Timer finished");
        case "finish":
          return finish();
        case "restart":
          return restart();
        case "copy":
          try {
            navigator.clipboard?.writeText(logText());
            b.textContent = "Copied";
          } catch {
            b.textContent = "Could not copy";
          }
          return;
      }
    });
    root.addEventListener("change", (e) => {
      const el = e.target;
      if (el.dataset.num && S.screen === "run") log("Detail changed", `${el.dataset.num}: ${el.value.trim()}`);
      if (el.dataset.tick) {
        S.ticks[el.dataset.tick] = el.checked;
        const s = byId.get(S.current);
        const l = s?.lines.filter((x) => x.kind !== "note")[+el.dataset.tick.split(":").pop()];
        log(el.checked ? "Ticked" : "Unticked", l?.text ?? "");
      }
    });
    root.addEventListener("input", (e) => {
      const el = e.target;
      if (el.dataset.num) {
        S.answers[el.dataset.num] = el.value.trim();
        const i = spec.inputs.find((x) => x.id === el.dataset.num);
        const bad = root.querySelector(`[data-bad="${el.dataset.num}"]`);
        if (bad) bad.textContent = numberProblem(i, el.value.trim()) ?? "";
      }
    });
    load();
    const timer = setInterval(tick, 250);
    render();
    return { state: S, render, stop: () => clearInterval(timer) };
  }

  // engine/app-entry.js
  var data = JSON.parse(document.getElementById("spec").textContent);
  window.__app = mount(document.getElementById("app"), data);
})();
</script>
