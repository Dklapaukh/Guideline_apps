<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>Resigning from a job</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>/* Phone-first, portrait, large tap targets. One stylesheet for every generated app; looks (engine/looks/) restyle it.
   --brand is set by the runtime when the template gives "Brand colour:"; each look decides where it shows. */
:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:var(--brand, #0b6e4f); --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }
.bar { position: sticky; top: 0; z-index: 3; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#14213d; color:#fff; }
.bar .t { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .brand { font-weight:800; margin-right:6px; }
.bar .clock:empty { display:none; }
.bar .clock { font-variant-numeric: tabular-nums; font-size:18px; }
.proto { font-size:12px; color:var(--author); background:var(--authorbg); padding:4px 14px; }
.card { background:var(--card); margin:10px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); }
h1 { font-size:22px; margin:4px 0 8px; } h2 { font-size:21px; margin:2px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
p { margin: 8px 0; } p.bul::before { content:"• "; color:var(--mut); }
.big { display:block; width:100%; min-height:52px; margin:10px 0 0; padding:12px 14px; font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line); background:#eef1f4; color:var(--ink); text-align:left; }
.big.go { background:var(--go); color:#fff; border-color:var(--go); text-align:center; }
.big.opt { background:#e8f0fe; border-color:#b7c9f5; }
.big.opt.broken { border-style:dashed; border-color:var(--author); }
.big.skip { background:transparent; text-align:center; font-weight:500; color:var(--mut); }
.link { background:none; border:0; color:#1d4ed8; font:inherit; padding:0; }
.crumb { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); }
.q { font-weight:600; font-size:19px; margin-top:16px; }
.warn { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; font-weight:600; }
.author { background:var(--authorbg); color:var(--author); border-left:4px solid var(--author); padding:8px 10px; border-radius:6px; font-size:15px; }
.do { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.do input { width:26px; height:26px; margin:0; flex:none; } .do span { flex:1; }
.do .dep { flex-basis:100%; margin-left:36px; }
.dep { display:block; color:var(--author); font-size:13px; }
/* folds: "More detail" (extra lines of the step) and "Sources for this screen" (the guideline quotes) */
details.more, details.sources { margin:14px 0 0; }
details.more > summary, details.sources > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:48px; }
details.more > summary::-webkit-details-marker, details.sources > summary::-webkit-details-marker { display:none; }
details.more > summary::before, details.sources > summary::before { content:"+"; display:inline-grid; place-items:center; flex:none; width:26px; height:26px; border-radius:6px; font-weight:800; line-height:1; }
details.more[open] > summary::before, details.sources[open] > summary::before { content:"−"; }
details.more { border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
details.more > summary { font-weight:700; color:var(--ink); } details.more > summary::before { background:#e8eef6; color:#1d4ed8; }
details.more[open] { padding-bottom:6px; } .more-line { margin:6px 0 10px; }
details.sources { font-size:14px; color:var(--mut); border-top:1px dashed var(--line); margin-top:18px; }
details.sources > summary { color:var(--mut); font-weight:600; } details.sources > summary::before { border:1px solid var(--line); color:var(--mut); }
.src-list { margin:4px 0 6px; padding-left:24px; } .src-list li { margin:0 0 10px; }
.src-list q { font-style:italic; color:var(--ink); } .src-list .where { color:var(--mut); } .src-list .for { display:block; font-size:13px; color:var(--mut); }
/* "Tip:" the app's own suggestion, never guideline advice: a dashed box and a badge that says so */
.tip { margin:12px 0; padding:10px 12px; border:2px dashed #4f6fb5; border-radius:10px; background:#f1f5fd; }
.tip-badge { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#fff; background:#3b5998; border-radius:999px; padding:2px 10px; }
.tip-text { margin:6px 0 0; font-size:.94em; font-weight:400; color:var(--mut); }   /* secondary to the guideline's own lines; the badge says what it is */
.timer { margin:14px 0; padding:12px; border-radius:10px; background:#eef6f2; text-align:center; }
.timer .lbl { color:var(--mut); font-size:14px; }
.big-clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
.timer.due { background:#fde8e8; } .timer.due .big-clock { color:var(--due); }
.reminders { position:sticky; top:44px; z-index:2; background:var(--bg); padding:6px 10px 0; }
.rem { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:6px; }
.rem .rt { flex:1; font-weight:600; font-size:15px; } .rem .rc { font-variant-numeric:tabular-nums; font-size:15px; }
.rem button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.rem.due { border-color:var(--due); background:#fde8e8; } .rem.due .rc { color:var(--due); font-weight:700; }
.rec { padding:6px 0; } .rec small { color:var(--mut); }
.rec-btn { background:#fff7e6; border-color:#f2c46d; }
.note-box { margin:12px 0; padding:10px 0; } .note-lbl { display:block; font-weight:700; margin-bottom:6px; }
.note-text { display:block; width:100%; min-height:132px; font:inherit; line-height:1.4; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
.note-text:focus { outline:3px solid var(--go); outline-offset:1px; }
.note-save { text-align:center; } .note-status { display:block; margin-top:6px; color:var(--mut); font-size:14px; }
/* "Location:" a position box with a big "Use GPS position" button */
.gps-btn { text-align:center; min-height:60px; font-size:18px; background:var(--go); color:#fff; border-color:var(--go); }
.gps-btn::before { content:"⌖"; margin-right:8px; font-size:1.2em; }
.gps-msg, .gps-ddm { display:block; margin:8px 0 0; } .gps-msg:empty, .gps-ddm:empty { display:none; }
.gps-msg { font-weight:600; font-size:15px; } .gps-ddm { font-weight:700; font-variant-numeric:tabular-nums; }
.loc-text { min-height:76px; margin-top:10px; }
.log small { white-space:pre-wrap; }
.lookup { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
.lookup .lk { font-weight:600; } .lookup .lv { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px dashed var(--line); }
table { border-collapse:collapse; width:100%; font-size:14px; } th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; }
.inputs { margin:10px 0; } .inp { display:block; margin:10px 0; font-weight:600; }
.inp input { display:block; width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); margin-top:4px; }
.inp small { font-weight:400; color:var(--mut); } .inp .bad { color:var(--due); font-weight:400; font-size:14px; }
.choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.choices button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.choices button.on { background:#14213d; color:#fff; }
.log { padding-left:0; list-style:none; } .log li { padding:6px 0; border-bottom:1px solid var(--line); } .log time { display:inline-block; min-width:56px; font-variant-numeric:tabular-nums; color:var(--mut); } .log .tod { font-variant-numeric:tabular-nums; font-size:.85em; color:var(--mut); margin-right:4px; }
.findings { padding-left:18px; } .findings li { margin:8px 0; font-size:15px; }
.lvl-fix { color:var(--due); } .lvl-check { color:var(--warn); } .lvl-info { color:var(--mut); }
.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
.tabs button { flex:1; font:inherit; font-size:15px; padding:14px 4px; background:none; border:0; color:var(--mut); }
.look-link { text-align:center; font-size:14px; margin-top:14px; }
.look-pick { display:flex; flex-wrap:wrap; gap:6px; }
.look-pick button { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
.look-pick button.on { background:var(--go); border-color:var(--go); color:#fff; }
.tabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 3px 0 #14213d; }

/* look: Clinic */
html[data-look="clinic"]{ --ink:#16232b; --mut:#5b6b75; --bg:#eef3f4; --card:#fff; --line:#dfe7ea; --go:var(--brand, #0f766e); --gosoft:#d9f0ec; --gosoft:color-mix(in srgb, var(--go) 15%, #fff);
  --warn:#9a3412; --warnbg:#fff1e6; --due:#c2410c; --author:#6b21a8; --authorbg:#f4edfb; }html[data-look="clinic"], html[data-look="clinic"] body{ font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); }html[data-look="clinic"] .bar{ background:var(--bg); color:var(--ink); padding:14px 18px 6px; }html[data-look="clinic"] .bar .t{ font-size:15px; color:var(--mut); font-weight:600; }html[data-look="clinic"] .bar .clock{ background:var(--card); border-radius:999px; padding:4px 12px; font-size:15px; font-weight:600; color:var(--go); }html[data-look="clinic"] .proto{ background:transparent; color:var(--mut); padding:0 18px 4px; font-size:12px; }html[data-look="clinic"] .card{ border:0; border-radius:22px; padding:20px; margin:10px 12px; box-shadow:0 1px 2px rgba(22,35,43,.05), 0 8px 24px rgba(22,35,43,.06); }html[data-look="clinic"] h1, html[data-look="clinic"] h2{ font-family:"Inter", system-ui, sans-serif; font-weight:700; letter-spacing:-.02em; text-wrap:balance; }html[data-look="clinic"] h2{ font-size:24px; }html[data-look="clinic"] h3{ color:var(--go); }html[data-look="clinic"] .crumb{ font-size:13px; }html[data-look="clinic"] .crumb span{ background:var(--gosoft); color:var(--go); border-radius:999px; padding:2px 10px; font-weight:600; }html[data-look="clinic"] .big{ border-radius:16px; border:0; background:#f1f5f6; min-height:56px; }html[data-look="clinic"] .big.go{ background:var(--go); border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.25); }html[data-look="clinic"] .big.opt{ background:#f4f8f8; border:1.5px solid var(--line); position:relative; padding-right:40px; }html[data-look="clinic"] .big.opt::after{ content:"›"; position:absolute; right:16px; top:50%; transform:translateY(-52%); font-size:26px; color:var(--go); }html[data-look="clinic"] .q{ font-size:20px; }html[data-look="clinic"] .warn{ border:0; border-radius:14px; padding:12px 14px; }html[data-look="clinic"] .do{ border-bottom:0; background:#f6f9f9; border-radius:14px; padding:12px; margin:8px 0; }html[data-look="clinic"] .do input{ accent-color:var(--go); border-radius:50%; }html[data-look="clinic"] .timer{ background:var(--gosoft); border-radius:20px; padding:18px; position:relative; overflow:hidden; }html[data-look="clinic"] .timer::after{ content:""; position:absolute; left:0; bottom:0; height:6px; width:calc(var(--p, 0) * 100%); background:var(--go); transition:width .25s linear; }html[data-look="clinic"] .big-clock{ color:var(--go); font-size:52px; letter-spacing:-.02em; }html[data-look="clinic"] .rem{ border:0; border-radius:16px; box-shadow:0 4px 14px rgba(22,35,43,.08); }html[data-look="clinic"] .tabs{ left:12px; right:12px; bottom:10px; border:0; border-radius:20px; box-shadow:0 8px 30px rgba(22,35,43,.15); overflow:hidden; }html[data-look="clinic"] .tabs button.on{ color:var(--go); box-shadow:none; background:var(--gosoft); }html[data-look="clinic"] .choices button{ border-radius:999px; }html[data-look="clinic"] .choices button.on{ background:var(--go); border-color:var(--go); }html[data-look="clinic"] .note-box{ background:#f6f9f9; border-radius:16px; padding:14px; }html[data-look="clinic"] .note-text{ border:1.5px solid var(--line); border-radius:14px; background:#fff; }html[data-look="clinic"] .note-save{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] .tip{ background:#eef4ff; border:1.5px dashed #7b9be0; border-radius:16px; padding:12px 14px; }html[data-look="clinic"] .tip-badge{ background:#dbe6fb; color:#2f4f9a; font-weight:700; text-transform:none; letter-spacing:0; font-size:13px; }html[data-look="clinic"] details.more{ border:0; background:#f6f9f9; border-radius:16px; padding:0 14px; }html[data-look="clinic"] details.more[open]{ padding-bottom:8px; }html[data-look="clinic"] details.more > summary{ color:var(--ink); }html[data-look="clinic"] details.more > summary::before{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] details.sources{ border-top:1px solid var(--line); }html[data-look="clinic"] details.sources > summary::before{ border-radius:999px; }html[data-look="clinic"] .gps-btn{ background:var(--go); color:#fff; border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.2); }html[data-look="clinic"] .gps-ddm{ color:var(--go); }

/* look: Wayfinding */
html[data-look="wayfinding"]{ --ink:#0a0a0a; --mut:#555; --bg:#ffffff; --card:#fff; --line:#0a0a0a; --go:#0a0a0a; --route:var(--brand, #e4002b); --sign:#ffd400;
  --warn:#0a0a0a; --warnbg:#ffd400; --due:#e4002b; --author:#5b21b6; --authorbg:#efe9fb; }html[data-look="wayfinding"], html[data-look="wayfinding"] body{ font-family:"Archivo", "Helvetica Neue", Arial, sans-serif; background:var(--bg); }html[data-look="wayfinding"] .bar{ background:var(--ink); padding:12px 16px; }html[data-look="wayfinding"] .bar .t{ font-weight:800; letter-spacing:.01em; }html[data-look="wayfinding"] .bar .clock{ background:var(--sign); color:var(--ink); padding:2px 10px; font-weight:800; }html[data-look="wayfinding"] .proto{ background:#f2f2f2; color:var(--mut); }html[data-look="wayfinding"] .card{ border:0; border-radius:0; margin:0; padding:18px 18px 20px; }html[data-look="wayfinding"] h1, html[data-look="wayfinding"] h2{ font-weight:900; letter-spacing:-.02em; line-height:1.05; text-wrap:balance; }html[data-look="wayfinding"] h1{ font-size:32px; }html[data-look="wayfinding"] h2{ font-size:30px; margin-top:6px; }html[data-look="wayfinding"] .crumb{ flex-direction:row-reverse; justify-content:flex-end; gap:14px; align-items:center; }html[data-look="wayfinding"] .crumb span{ display:inline-grid; place-items:center; min-width:40px; height:40px; padding:0 8px; background:var(--route); color:#fff; font-weight:900; font-size:15px; border-radius:999px; }html[data-look="wayfinding"] .big{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:800; min-height:58px; }html[data-look="wayfinding"] .big.go{ background:var(--ink); color:#fff; border-color:var(--ink); text-align:left; position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.go::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }html[data-look="wayfinding"] .big.opt{ background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.opt::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }html[data-look="wayfinding"] .big.skip{ border:0; text-decoration:underline; }html[data-look="wayfinding"] .link{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] .q{ font-size:22px; font-weight:900; }html[data-look="wayfinding"] .warn{ background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }html[data-look="wayfinding"] .warn::before{ content:"!"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }html[data-look="wayfinding"] .do{ position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }html[data-look="wayfinding"] .do::before{ content:""; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }html[data-look="wayfinding"] .do input{ position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }html[data-look="wayfinding"] .do .dep{ margin-left:0; }html[data-look="wayfinding"] .timer{ background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }html[data-look="wayfinding"] .timer .lbl{ color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }html[data-look="wayfinding"] .timer::after{ content:""; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg, var(--sign) calc(var(--p, 0) * 100%), #333 0); }html[data-look="wayfinding"] .big-clock{ font-size:60px; font-weight:900; color:var(--sign); }html[data-look="wayfinding"] .timer.due{ background:var(--due); }html[data-look="wayfinding"] .timer.due .big-clock{ color:#fff; }html[data-look="wayfinding"] .rem{ border:2px solid var(--ink); border-radius:0; }html[data-look="wayfinding"] .rem button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .rem.due{ background:var(--sign); }html[data-look="wayfinding"] .choices button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .choices button.on{ background:var(--ink); color:#fff; }html[data-look="wayfinding"] .look-pick button{ border-radius:0; border:2px solid var(--ink); font-weight:700; }html[data-look="wayfinding"] .tabs{ border-top:2px solid var(--ink); }html[data-look="wayfinding"] .tabs button{ font-weight:800; color:var(--mut); }html[data-look="wayfinding"] .tabs button.on{ color:var(--ink); box-shadow:inset 0 4px 0 var(--route); }html[data-look="wayfinding"] .note-lbl{ font-weight:900; font-size:19px; }html[data-look="wayfinding"] .note-text{ border:2px solid var(--ink); border-radius:0; font-weight:600; }html[data-look="wayfinding"] .note-text:focus{ outline:4px solid var(--sign); outline-offset:0; }html[data-look="wayfinding"] .tip{ background:#f2f6fb; color:var(--mut); border:0; border-left:6px solid #0057b8; border-radius:0; padding:10px 14px; }html[data-look="wayfinding"] .tip-badge{ background:#0057b8; color:#fff; border-radius:0; font-weight:900; }html[data-look="wayfinding"] .tip-text{ font-weight:400; color:var(--mut); }html[data-look="wayfinding"] details.more{ border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); }html[data-look="wayfinding"] details.more > summary{ font-weight:900; font-size:18px; }html[data-look="wayfinding"] details.more > summary::before{ background:var(--ink); color:#fff; border-radius:0; }html[data-look="wayfinding"] details.sources{ border-top:2px solid #ddd; }html[data-look="wayfinding"] details.sources > summary{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] details.sources > summary::before{ border:2px solid var(--ink); color:var(--ink); border-radius:0; }html[data-look="wayfinding"] .gps-btn{ background:var(--ink); color:#fff; border-color:var(--ink); border-radius:0; font-weight:900; }html[data-look="wayfinding"] .gps-btn::before{ color:var(--sign); }html[data-look="wayfinding"] .gps-ddm{ font-size:19px; font-weight:900; }

iting).","line":91,"quotes":[{"text":"how to resign (most agreements say to do this in writing).","where":"","check":"exact"}]},{"kind":"do","text":"Look for rules about working for another employer after you leave.","line":93,"quotes":[{"text":"The employment agreement may also have rules around working for another employer once the current employment has ended.","where":"","check":"exact"}]},{"kind":"do","text":"Check for any workplace policies about resigning.","line":95,"quotes":[{"text":"It’s important to check whether there are any workplace policies about resigning.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"on-leave","line":97,"target":"on-leave"},"timer":null,"reminders":[],"stop":null,"end":false,"line":84,"nexts":[{"to":"on-leave","line":97,"target":"on-leave"}]},{"id":"on-leave","title":"Are you on leave?","lines":[{"kind":"say","text":"The notice period is different if you are on parental leave or certain types of defence force leave.","line":100,"quotes":[{"text":"The notice period is different for employees who are on parental leave or certain types of defence force leave.","where":"","check":"exact"}]}],"ask":{"question":"Are you on one of these?","options":[{"label":"No","to":"notice","line":103,"target":"notice"},{"label":"Parental leave","to":"parental","line":104,"target":"parental"},{"label":"Defence force volunteers leave","to":"defence","line":105,"target":"defence"}],"line":102},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":99},{"id":"parental","title":"Resigning while on parental leave","lines":[{"kind":"say","text":"Your last day of employment is the day your parental leave started.","line":108,"quotes":[{"text":"their last day of employment is the day their parental leave started, and","where":"","check":"exact"}]},{"kind":"warning","text":"You must give at least 21 days' notice before your parental leave ends, unless your employment agreement has a longer notice period.","line":110,"quotes":[{"text":"they must give at least 21 days’ notice before their parental leave ends, unless their employment agreement has a longer notice period.","where":"","check":"exact"}]},{"kind":"say","text":"The pages do not say what last day to write in your resignation in this case. Ask your employer, or call Employment New Zealand on 0800 20 90 20.","line":112,"quotes":[{"text":"call us on 0800 20 90 20","where":"","check":"exact"}]},{"kind":"say","text":"About final pay: if you worked \"keeping in touch\" days and are not going back, those payments are not counted in the gross earnings for your holiday pay.","line":114,"quotes":[{"text":"If an employee worked \"keeping in touch\" days while on parental leave, but is not returning to work, their gross earnings for calculating annual holiday payments in their final pay does not include their “keeping in touch” payments.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"write","line":116,"target":"write"},"timer":null,"reminders":[],"stop":null,"end":false,"line":107,"nexts":[{"to":"write","line":116,"target":"write"}]},{"id":"defence","title":"Resigning while on defence force volunteers leave","lines":[{"kind":"say","text":"Your last day of employment might be the day your leave started. It depends on the situation.","line":119,"quotes":[{"text":"their last day of employment might be the day their leave started — it depends on the situation, and","where":"","check":"exact"}]},{"kind":"warning","text":"You must give a set notice period. It depends on the type of leave you are on.","line":121,"quotes":[{"text":"they must give a set notice period — it depends on the type of leave they’re on.","where":"","check":"exact"}]},{"kind":"say","text":"These pages do not say how long that notice is, or which types of leave it applies to. Check with your employer, or call Employment New Zealand on 0800 20 90 20.","line":123,"quotes":[{"text":"call us on 0800 20 90 20","where":"","check":"exact"}]}],"ask":null,"next":{"to":"leave-counted","line":125,"target":"leave-counted"},"timer":null,"reminders":[],"stop":null,"end":false,"line":118,"nexts":[{"to":"leave-counted","line":125,"target":"leave-counted"}]},{"id":"notice","title":"How much notice?","lines":[{"kind":"say","text":"The notice period runs from the day you tell your employer you are resigning to your last day of employment.","line":128,"quotes":[{"text":"the day the employee tells their employer they are resigning, and","where":"","check":"exact"},{"text":"their last day of employment (the end of the notice period).","where":"","check":"exact"}]}],"ask":{"question":"Does your employment agreement say how much notice to give?","options":[{"label":"Yes","to":"notice-set","line":132,"target":"notice-set"},{"label":"No, it doesn't say","to":"notice-reasonable","line":133,"target":"notice-reasonable"}],"line":131},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":127},{"id":"notice-set","title":"Your agreement gives a notice period","lines":[{"kind":"say","text":"Give the amount of notice your agreement says.","line":136,"quotes":[{"text":"The employment agreement usually says what the notice period is.","where":"","check":"exact"},{"text":"If it does, this is the amount of notice that must be given.","where":"","check":"exact"}]},{"kind":"say","text":"You and your employer can agree to make it shorter or longer. Any change should be in writing.","line":139,"quotes":[{"text":"The employer and employee can agree to make the notice period shorter or longer.","where":"","check":"exact"},{"text":"Any agreed change to the notice period should be recorded in writing.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"leave-counted","line":142,"target":"leave-counted"},"timer":null,"reminders":[],"stop":null,"end":false,"line":135,"nexts":[{"to":"leave-counted","line":142,"target":"leave-counted"}]},{"id":"notice-reasonable","title":"No notice period in your agreement","lines":[{"kind":"say","text":"You must give \"reasonable notice\". There is no set length.","line":145,"quotes":[{"text":"If the agreement does not say what the notice period is, the employee must give ‘reasonable notice’.","where":"","check":"exact"},{"text":"There’s no set timeframe for a reasonable notice period.","where":"","check":"exact"}]},{"kind":"say","text":"Generally 2 to 4 weeks is seen as reasonable, but it depends on your situation.","line":148,"quotes":[{"text":"Generally 2 to 4 weeks is seen as reasonable.","where":"","check":"exact"}]},{"kind":"say","text":"It depends on things like: the type of job and how long it takes to find someone else, how much training they will need, how long you have been in the job, how easy it is for you to find another job, and what usually happens in your industry.","line":150,"quotes":[{"text":"the type of job and how long it will take to find someone else, for example, if it’s a specialised role","where":"","check":"exact"},{"text":"how much training someone will need to take over the role","where":"","check":"exact"},{"text":"how long the employee has been in the job","where":"","check":"exact"},{"text":"how easy it will be for the employee to find another job","where":"","check":"exact"},{"text":"what usually happens in that industry, sector or workplace.","where":"","check":"exact"}]},{"kind":"do","text":"You and your employer must act in good faith: talk together about how long reasonable notice should be, and why.","line":156,"quotes":[{"text":"Employers and employees must act in good faith when deciding what’s reasonable.","where":"","check":"exact"},{"text":"This means discussing together how long reasonable notice should be and why.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"leave-counted","line":159,"target":"leave-counted"},"timer":null,"reminders":[],"stop":null,"end":false,"line":144,"nexts":[{"to":"leave-counted","line":159,"target":"leave-counted"}]},{"id":"leave-counted","title":"Leave and your notice period","lines":[{"kind":"say","text":"Some agreements say time on leave or holidays is not counted in the notice period. That could make your notice longer than you expect.","line":162,"quotes":[{"text":"Some employment agreements say that time on leave or holidays is not counted in the notice period.","where":"","check":"exact"},{"text":"This means the notice period could be longer than expected.","where":"","check":"exact"}]},{"kind":"do","text":"Check your agreement for this, and work out your last day of employment.","line":165,"quotes":[{"text":"Employees and employers should check the employment agreement to see if it says anything about this that could affect:","where":"","check":"exact"},{"text":"what the last day of employment would be.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"write","line":168,"target":"write"},"timer":null,"reminders":[],"stop":null,"end":false,"line":161,"nexts":[{"to":"write","line":168,"target":"write"}]},{"id":"write","title":"Put it in writing","lines":[{"kind":"say","text":"It's best to resign in writing, even if your agreement doesn't say so. An email or a short letter is most common.","line":171,"quotes":[{"text":"It’s best to put the resignation in writing, even if the employment agreement does not say to do this.","where":"","check":"exact"},{"text":"Sending an email or giving a short letter are the most common ways to resign.","where":"","check":"exact"}]},{"kind":"do","text":"Say that you are resigning.","line":174,"quotes":[{"text":"that the employee is resigning, and","where":"","check":"exact"}]},{"kind":"do","text":"Give your last day of employment (based on your notice period).","line":176,"quotes":[{"text":"the employee’s last day of employment (based on the notice period).","where":"","check":"exact"}]},{"kind":"say","text":"You do not have to say why you are resigning, unless you want to.","line":178,"quotes":[{"text":"The employee does not have to say why they’re resigning unless they want to.","where":"","check":"exact"}]},{"kind":"warning","text":"Employment New Zealand does not recommend giving notice by text or social media. It could be deleted or misunderstood.","line":180,"quotes":[{"text":"We do not recommend giving notice by text or over social media because it could be deleted or misunderstood.","where":"","check":"exact"}]},{"kind":"do","text":"Keep a copy of what you send, so you have a record.","line":182,"quotes":[{"text":"This means there’s a record of it which can help to avoid any misunderstandings.","where":"","check":"exact"}]}],"ask":{"question":"Have you handed in your resignation?","options":[{"label":"Yes, I've sent or given it","to":"reply","line":185,"target":"reply"},{"label":"Not yet","to":"not-sent","line":186,"target":"not-sent"}],"line":184},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":170},{"id":"not-sent","title":"Not handed in yet","lines":[{"kind":"say","text":"You have not resigned yet. Nothing has been sent to your employer.","line":189},{"kind":"say","text":"When you are ready, send your email or letter to the person your agreement names.","line":190,"quotes":[{"text":"who they need to tell about their resignation, for example, a manager, team leader or HR","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"I've sent it now","to":"reply","line":193,"target":"reply"},{"label":"Go back to what to write","to":"write","line":194,"target":"write"},{"label":"Finish for now","to":"end","line":195,"target":"__end"}],"line":192},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":188},{"id":"reply","title":"What your employer should do","lines":[{"kind":"say","text":"Your employer must accept your resignation.","line":198,"quotes":[{"text":"An employer must accept an employee’s resignation.","where":"","check":"exact"}]},{"kind":"say","text":"It's good practice for them to acknowledge it in writing. They should confirm they've received it, your last day of employment, and anything to do before you leave (such as handing over work and returning company property).","line":200,"quotes":[{"text":"It’s good practice for the employer to acknowledge the resignation in writing.","where":"","check":"exact"},{"text":"they’ve received the resignation","where":"","check":"exact"},{"text":"what the last day of employment will be (based on the notice period), and","where":"","check":"exact"},{"text":"if there’s anything that needs to be done before the employee leaves, for example, handing over work and returning company property.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"during","line":205,"target":"during"},"timer":null,"reminders":[],"stop":null,"end":false,"line":197,"nexts":[{"to":"during","line":205,"target":"during"}]},{"id":"during","title":"Your notice period","lines":[{"kind":"say","text":"Work carries on as normal, unless you and your employer agree something else.","line":208,"quotes":[{"text":"During the notice period, work carries on as normal unless another type of arrangement is agreed.","where":"","check":"exact"}]},{"kind":"say","text":"Your employer must pay you correctly. You should agree a plan with them for handing over your work.","line":210,"quotes":[{"text":"the employer must pay the employee correctly","where":"","check":"exact"},{"text":"the employer and employee should agree a plan for managing work and responsibilities","where":"","check":"exact"}]}],"ask":{"question":"Does any of these apply to you?","options":[{"label":"Leaving earlier, or pay or leave instead of working","to":"early","line":214,"target":"early"},{"label":"I don't feel safe working my notice","to":"unsafe","line":215,"target":"unsafe"},{"label":"I want to start a new job before my notice ends","to":"new-job","line":216,"target":"new-job"},{"label":"I want to take leave during my notice","to":"leave-in-notice","line":217,"target":"leave-in-notice"},{"label":"No, I'll work my notice","to":"handover","line":218,"target":"handover"}],"line":213},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":207},{"id":"early","title":"Leaving earlier","lines":[],"ask":{"question":"Who wants it?","options":[{"label":"I want to leave earlier","to":"shorter","line":222,"target":"shorter"},{"label":"My employer wants me to leave earlier","to":"employer-early","line":223,"target":"employer-early"},{"label":"I've been offered pay or garden leave instead of working","to":"in-lieu","line":224,"target":"in-lieu"},{"label":"Back to my notice period","to":"during","line":225,"target":"during"}],"line":221},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":220},{"id":"employer-early","title":"Your employer wants you to leave earlier","lines":[{"kind":"say","text":"If your employer wants you to work a shorter notice period, you must agree.","line":228,"quotes":[{"text":"If the employer wants the employee to work a shorter notice period, the employee must agree.","where":"","check":"exact"}]},{"kind":"warning","text":"If you don't agree, your employer must still pay you for the full notice period, as long as you work it, or another arrangement is agreed (for example garden leave or pay instead of notice).","line":230,"quotes":[{"text":"If the employee does not agree, the employer must still pay them for the full notice period, as long as:","where":"","check":"exact"},{"text":"the employee works it, or","where":"","check":"exact"},{"text":"another arrangement is agreed, for example, garden leave or payment instead of notice.","where":"","check":"exact"}]},{"kind":"warning","text":"Even if you agree not to work some or all of your notice, your employer must still pay you for the full notice period.","line":234,"quotes":[{"text":"Even if the employee agrees not to work for some or all the notice period, their employer must still pay them for the full notice period.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"I've been offered pay or garden leave","to":"in-lieu","line":237,"target":"in-lieu"},{"label":"Back to my notice period","to":"during","line":238,"target":"during"}],"line":236},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":227},{"id":"shorter","title":"You want to leave earlier","lines":[{"kind":"say","text":"A shorter notice period needs both you and your employer to agree. It should be recorded in writing.","line":241,"quotes":[{"text":"If an employer or employee want a shorter notice period, both must agree.","where":"","check":"exact"},{"text":"If they both agree, the shorter notice period should be recorded in writing.","where":"","check":"exact"}]},{"kind":"warning","text":"If YOU ask to leave early and your employer agrees, you are only paid for the part of the notice you actually worked.","line":244,"quotes":[{"text":"If the employee asks their employer to waive all or some of the notice period, and their employer agrees, the employee will only get paid for the part of the notice period they actually worked.","where":"","check":"exact"}]},{"kind":"say","text":"If they don't agree, you must work the notice period in your employment agreement.","line":246,"quotes":[{"text":"If they do not agree, the employee must work the notice period that’s in the employment agreement.","where":"","check":"exact"}]},{"kind":"say","text":"If your agreement has no notice period, you must work the notice period you and your employer agreed before, or the one you gave when you first gave notice.","line":248,"quotes":[{"text":"If there’s no notice period in the agreement, they must work the notice period that was:","where":"","check":"exact"},{"text":"previously agreed by the employer and employee, or","where":"","check":"exact"},{"text":"given when notice was first provided.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"What if I leave without enough notice?","to":"short-notice","line":253,"target":"short-notice"},{"label":"Back to my notice period","to":"during","line":254,"target":"during"}],"line":252},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":240},{"id":"unsafe","title":"You don't want to work your notice","lines":[{"kind":"say","text":"If you don't want to work your notice, for example because you feel unsafe, talk to your employer. You can also get legal advice if you need to.","line":257,"quotes":[{"text":"If an employee does not want to work the notice period, for example, because they feel unsafe, they should talk to their employer.","where":"","check":"exact"},{"text":"They can also seek legal advice if they need to.","where":"","check":"exact"}]},{"kind":"say","text":"The pages do not say what happens next in this case.","line":260}],"ask":{"question":"What next?","options":[{"label":"Back to my notice period","to":"during","line":262,"target":"during"},{"label":"Finish for now","to":"end","line":263,"target":"__end"}],"line":261},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":256},{"id":"short-notice","title":"Not giving enough notice","lines":[{"kind":"warning","text":"If you don't give enough notice, your employer only has to pay you for the days you actually worked, and for paid leave or holidays they approved, during the notice period.","line":266,"quotes":[{"text":"If an employee does not give enough notice, the employer only has to pay them for the days they:","where":"","check":"exact"},{"text":"actually worked during the notice period, and","where":"","check":"exact"},{"text":"took paid leave or holidays (that the employer approved) during the notice period.","where":"","check":"exact"}]},{"kind":"say","text":"If you give no notice at all, your employer does not have to pay you for the notice period, unless there is an agreed arrangement.","line":270,"quotes":[{"text":"If an employee does not give any notice, the employer does not have to pay them for the notice period, unless there is an agreed arrangement.","where":"","check":"exact"}]},{"kind":"say","text":"Your employer can only take money from your pay if all of these are true: you didn't work some or all of your notice; the amount is based on their actual loss; and you agreed in writing, or your agreement has a valid deduction clause.","line":272,"quotes":[{"text":"An employer can only deduct money from an employee’s pay, wages or holiday pay if:","where":"","check":"exact"},{"text":"the employee does not work some or all of the notice period","where":"","check":"exact"},{"text":"the amount deducted is based on the employer’s actual loss because the employee did not work the full notice period, and","where":"","check":"exact"},{"text":"the employee agrees to the deduction in writing, or the employment agreement has a valid deduction clause.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"during","line":277,"target":"during"},"timer":null,"reminders":[],"stop":null,"end":false,"line":265,"nexts":[{"to":"during","line":277,"target":"during"}]},{"id":"in-lieu","title":"Pay or leave instead of working your notice","lines":[{"kind":"say","text":"Sometimes the notice isn't worked because you and your employer agree something else.","line":280,"quotes":[{"text":"Sometimes the notice period is not worked because the employer and employee agree to a different arrangement.","where":"","check":"exact"}]},{"kind":"say","text":"Your employer can ask you not to work your full notice only if you agree, or your agreement has a clause saying you can be paid instead.","line":282,"quotes":[{"text":"Their employer can ask the employee not to work their full notice period, but only if the employee:","where":"","check":"exact"},{"text":"has a clause in their employment agreement that says they can be paid instead of working their notice period.","where":"","check":"exact"}]},{"kind":"warning","text":"Even if you agree not to work some or all of your notice, your employer must still pay you for the full notice period.","line":285,"quotes":[{"text":"Even if the employee agrees not to work for some or all the notice period, their employer must still pay them for the full notice period.","where":"","check":"exact"}]}],"ask":{"question":"Which have you been offered?","options":[{"label":"Pay instead of working (payment in lieu of notice)","to":"pilon","line":288,"target":"pilon"},{"label":"Leave instead of working (garden leave)","to":"garden","line":289,"target":"garden"}],"line":287},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":279},{"id":"pilon","title":"Payment in lieu of notice","lines":[{"kind":"say","text":"Your employment ends when notice is given, and you are paid out for the notice period instead of working it.","line":292,"quotes":[{"text":"the employee’s employment ends when notice is given, and","where":"","check":"exact"},{"text":"they are paid out for the notice period instead of working it.","where":"","check":"exact"}]},{"kind":"say","text":"There must be some form of agreement: a clause in your agreement, or agreed when notice is given. It should be in writing. The payment is made in your final pay.","line":295,"quotes":[{"text":"There must be some form of agreement to payment in lieu of notice.","where":"","check":"exact"},{"text":"This could be through a clause in the employment agreement or it’s agreed to when notice is given.","where":"","check":"exact"},{"text":"Agreement should be recorded in writing and the payment is made in the employee’s final pay.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"last-day","line":299,"target":"last-day"},"timer":null,"reminders":[],"stop":null,"end":false,"line":291,"nexts":[{"to":"last-day","line":299,"target":"last-day"}]},{"id":"garden","title":"Garden leave","lines":[{"kind":"say","text":"You are still employed and paid for the notice period, but you don't go to work.","line":302,"quotes":[{"text":"The employee is still employed and paid for the notice period but does not go to work.","where":"","check":"exact"}]},{"kind":"say","text":"It does not use up you
