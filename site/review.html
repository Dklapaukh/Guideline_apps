name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"What do you need?\",\"lines\":[{\"kind\":\"say\",\"text\":\"Eligible employees get 10 days of paid sick leave a year.\",\"line\":19,\"quotes\":[{\"text\":\"Eligible employees are entitled to 10 days of paid sick leave each year\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Today's rules apply until 6 August 2028. You cannot follow the new law early.\",\"line\":21,\"quotes\":[{\"text\":\"until the new law starts on 6 August 2028.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You cannot start following the new law early\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you need help with?\",\"options\":[{\"label\":\"I'm sick, or caring for someone, today\",\"to\":\"today\",\"line\":25,\"target\":\"today\"},{\"label\":\"Am I entitled?\",\"to\":\"entitled\",\"line\":26,\"target\":\"entitled\"},{\"label\":\"I've used up my sick leave\",\"to\":\"none-left\",\"line\":27,\"target\":\"none-left\"},{\"label\":\"I'm an employer\",\"to\":\"employer\",\"line\":28,\"target\":\"employer\"},{\"label\":\"Something else\",\"to\":\"other\",\"line\":29,\"target\":\"other\"}],\"line\":24},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":18},{\"id\":\"other\",\"title\":\"Something else\",\"lines\":[],\"ask\":{\"question\":\"What do you want to know about?\",\"options\":[{\"label\":\"A medical appointment\",\"to\":\"appointment\",\"line\":33,\"target\":\"appointment\"},{\"label\":\"Getting sick before or during annual holidays\",\"to\":\"holidays\",\"line\":34,\"target\":\"holidays\"},{\"label\":\"Going home sick part way through a day\",\"to\":\"part-day\",\"line\":35,\"target\":\"part-day\"},{\"label\":\"Stress\",\"to\":\"stress\",\"line\":36,\"target\":\"stress\"},{\"label\":\"A long illness or injury\",\"to\":\"ongoing\",\"line\":37,\"target\":\"ongoing\"},{\"label\":\"An injury covered by ACC\",\"to\":\"acc\",\"line\":38,\"target\":\"acc\"},{\"label\":\"Carrying over unused sick leave\",\"to\":\"balance\",\"line\":39,\"target\":\"balance\"}],\"line\":32},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":31},{\"id\":\"today\",\"title\":\"Sick today\",\"lines\":[{\"kind\":\"do\",\"text\":\"Tell your employer as soon as possible.\",\"line\":42,\"quotes\":[{\"text\":\"You should tell your employer as soon as possible if you need to take sick leave.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Employment New Zealand does not say how (phone, text, email), who to tell, or how far before your shift. Check your employment agreement or workplace policy.\",\"line\":44}],\"ask\":{\"question\":\"Which is true for you?\",\"options\":[{\"label\":\"I'm entitled and have sick leave left\",\"to\":\"proof\",\"line\":46,\"target\":\"proof\"},{\"label\":\"I'm not sure I'm entitled\",\"to\":\"entitled\",\"line\":47,\"target\":\"entitled\"},{\"label\":\"I've used up my sick leave\",\"to\":\"none-left\",\"line\":48,\"target\":\"none-left\"},{\"label\":\"I'm on, or about to go on, annual holidays\",\"to\":\"holidays\",\"line\":49,\"target\":\"holidays\"}],\"line\":45},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":41},{\"id\":\"proof\",\"title\":\"Proof of sickness\",\"lines\":[{\"kind\":\"say\",\"text\":\"Your employer can ask for proof, usually a medical certificate, for you or your spouse, partner, child or other dependant.\",\"line\":52,\"quotes\":[{\"text\":\"your employer can ask you for proof of sickness or injury.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"usually a medical certificate\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"(or your spouse, partner, child, or other dependant)\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Your employer cannot tell you which doctor to go to.\",\"line\":56,\"quotes\":[{\"text\":\"Your employer cannot tell you which doctor to go to.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"When they asked, how many days in a row had you been sick? (This decides who pays.)\",\"options\":[{\"label\":\"Less than 3 days\",\"to\":\"proof-under3\",\"line\":59,\"target\":\"proof-under3\"},{\"label\":\"3 or more days in a row\",\"to\":\"proof-3plus\",\"line\":60,\"target\":\"proof-3plus\"},{\"label\":\"I'm not sure how to count\",\"to\":\"proof-count\",\"line\":61,\"target\":\"proof-count\"},{\"label\":\"They haven't asked for proof\",\"to\":\"pay\",\"line\":62,\"target\":\"pay\"}],\"line\":58},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":51},{\"id\":\"proof-count\",\"title\":\"Counting the days\",\"lines\":[{\"kind\":\"say\",\"text\":\"Count calendar days, including weekends and days off.\",\"line\":65,\"quotes\":[{\"text\":\"The 3 days are counted as calendar days, not just workdays.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Jennifer: off sick Tuesday, still sick on her days off, off sick Friday. That is 4 days in a row.\",\"line\":67,\"quotes\":[{\"text\":\"as she has been sick for 4 days in a row.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If leave is recorded in half-days, back at lunchtime on day 3 is less than 3 days.\",\"line\":69,\"quotes\":[{\"text\":\"she would have been sick for less than 3 days.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"The page doesn't say how days that are not in a row count.\",\"line\":71}],\"ask\":{\"question\":\"Which is it?\",\"options\":[{\"label\":\"Less than 3 days\",\"to\":\"proof-under3\",\"line\":73,\"target\":\"proof-under3\"},{\"label\":\"3 or more days in a row\",\"to\":\"proof-3plus\",\"line\":74,\"target\":\"proof-3plus\"}],\"line\":72},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":64},{\"id\":\"proof-under3\",\"title\":\"Asked before day 3\",\"lines\":[{\"kind\":\"say\",\"text\":\"If your employer wants proof, they must ask as soon as possible, and pay you back the costs (such as the doctor's visit).\",\"line\":77,\"quotes\":[{\"text\":\"ask for proof as soon as possible, and\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"pay you back for any costs, for example, the cost of your doctor's visit.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Employment New Zealand does not say what happens if your employer asks late, but you were back at work before the third day.\",\"line\":80}],\"ask\":null,\"next\":{\"to\":\"pay\",\"line\":81,\"target\":\"pay\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":76,\"nexts\":[{\"to\":\"pay\",\"line\":81,\"target\":\"pay\"}]},{\"id\":\"proof-3plus\",\"title\":\"Asked on or after day 3\",\"lines\":[{\"kind\":\"say\",\"text\":\"If your employer knows you've been sick 3 or more days in a row, they can ask for proof on or after the third day. You pay for it yourself.\",\"line\":84,\"quotes\":[{\"text\":\"If your employer knows you have been sick for 3 or more days in a row\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You must pay for these costs yourself.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If they asked before the third day, they pay, even if you were off longer.\",\"line\":87,\"quotes\":[{\"text\":\"If Jennifer's employer had asked for proof when she was sick on Tuesday, her employer would have had to cover the cost.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The page doesn't say how they should \\\"know\\\".\",\"line\":89}],\"ask\":null,\"next\":{\"to\":\"pay\",\"line\":90,\"target\":\"pay\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":83,\"nexts\":[{\"to\":\"pay\",\"line\":90,\"target\":\"pay\"}]},{\"id\":\"pay\",\"title\":\"Getting paid\",\"lines\":[{\"kind\":\"say\",\"text\":\"You are paid what you would have earned that day, in the pay for that period.\",\"  apply until the Employment Leave Act starts on 6 August 2028.\",\"sources\":[{\"name\":\"Employment New Zealand, Taking sick leave\",\"link\":\"https://www.employment.govt.nz/leave-and-holidays/sick-leave/taking-sick-leave\"},{\"name\":\"Employment New Zealand, Managing sick leave\",\"link\":\"https://www.employment.govt.nz/leave-and-holidays/sick-leave/managing-sick-leave\"},{\"name\":\"Employment New Zealand, Pay for sick, bereavement and family violence leave\",\"link\":\"https://www.employment.govt.nz/pay-and-hours/pay-and-wages/leave-and-holiday-pay/pay-for-sick-bereavement-and-family-violence-leave\"},{\"name\":\"Employment New Zealand, Employment Leave Act 2026\",\"link\":\"https://www.employment.govt.nz/news-and-updates/employment-leave-act-2026\"}],\"warning\":\"General information from Employment New Zealand, not legal advice. Your employment agreement or workplace policy may give you more: check it.\",\"audience\":\"Employees and employers in New Zealand dealing with sick leave\",\"reviewedBy\":\"\",\"version\":\"Employment New Zealand pages \\\"Taking sick leave\\\" and \\\"Managing sick leave\\\" (each last modified 7 September 2026), \\\"Pay for sick, bereavement and family violence leave\\\" (last modified 7 August 2026), news page \\\"Employment Leave Act 2026\\\" (published 7 August 2026), read 20 Nov 2026\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"What do you need?\",\"lines\":[{\"kind\":\"say\",\"text\":\"Eligible employees get 10 days of paid sick leave a year.\",\"line\":19,\"quotes\":[{\"text\":\"Eligible employees are entitled to 10 days of paid sick leave each year\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Today's rules apply until 6 August 2028. You cannot follow the new law early.\",\"line\":21,\"quotes\":[{\"text\":\"until the new law starts on 6 August 2028.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You cannot start following the new law early\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you need help with?\",\"options\":[{\"label\":\"I'm sick, or caring for someone, today\",\"to\":\"today\",\"line\":25,\"target\":\"today\"},{\"label\":\"Am I entitled?\",\"to\":\"entitled\",\"line\":26,\"target\":\"entitled\"},{\"label\":\"I've used up my sick leave\",\"to\":\"none-left\",\"line\":27,\"target\":\"none-left\"},{\"label\":\"I'm an employer\",\"to\":\"employer\",\"line\":28,\"target\":\"employer\"},{\"label\":\"Something else\",\"to\":\"other\",\"line\":29,\"target\":\"other\"}],\"line\":24},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":18},{\"id\":\"other\",\"title\":\"Something else\",\"lines\":[],\"ask\":{\"question\":\"What do you want to know about?\",\"options\":[{\"label\":\"A medical appointment\",\"to\":\"appointment\",\"line\":33,\"target\":\"appointment\"},{\"label\":\"Getting sick before or during annual holidays\",\"to\":\"holidays\",\"line\":34,\"target\":\"holidays\"},{\"label\":\"Going home sick part way through a day\",\"to\":\"part-day\",\"line\":35,\"target\":\"part-day\"},{\"label\":\"Stress\",\"to\":\"stress\",\"line\":36,\"target\":\"stress\"},{\"label\":\"A long illness or injury\",\"to\":\"ongoing\",\"line\":37,\"target\":\"ongoing\"},{\"label\":\"An injury covered by ACC\",\"to\":\"acc\",\"line\":38,\"target\":\"acc\"},{\"label\":\"Carrying over unused sick leave\",\"to\":\"balance\",\"line\":39,\"target\":\"balance\"}],\"line\":32},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":31},{\"id\":\"today\",\"title\":\"Sick today\",\"lines\":[{\"kind\":\"do\",\"text\":\"Tell your employer as soon as possible.\",\"line\":42,\"quotes\":[{\"text\":\"You should tell your employer as soon as possible if you need to take sick leave.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Employment New Zealand does not say how (phone, text, email), who to tell, or how far before your shift. Check your employment agreement or workplace policy.\",\"line\":44}],\"ask\":{\"question\":\"Which is true for you?\",\"options\":[{\"label\":\"I'm entitled and have sick leave left\",\"to\":\"proof\",\"line\":46,\"target\":\"proof\"},{\"label\":\"I'm not sure I'm entitled\",\"to\":\"entitled\",\"line\":47,\"target\":\"entitled\"},{\"label\":\"I've used up my sick leave\",\"to\":\"none-left\",\"line\":48,\"target\":\"none-left\"},{\"label\":\"I'm on, or about to go on, annual holidays\",\"to\":\"holidays\",\"line\":49,\"target\":\"holidays\"}],\"line\":45},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":41},{\"id\":\"proof\",\"title\":\"Proof of sickness\",\"lines\":[{\"kind\":\"say\",\"text\":\"Your employer can ask for proof, usually a medical certificate, for you or your spouse, partner, child or other dependant.\",\"line\":52,\"quotes\":[{\"text\":\"your employer can ask you for proof of sickness or injury.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"usually a medical certificate\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"(or your spouse, partner, child, or other dependant)\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Your employer cannot tell you which doctor to go to.\",\"line\":56,\"quotes\":[{\"text\":\"Your employer cannot tell you which doctor to go to.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"When they asked, how many days in a row had you been sick? (This decides who pays.)\",\"options\":[{\"label\":\"Less than 3 days\",\"to\":\"proof-under3\",\"line\":59,\"target\":\"proof-under3\"},{\"label\":\"3 or more days in a row\",\"to\":\"proof-3plus\",\"line\":60,\"target\":\"proof-3plus\"},{\"label\":\"I'm not sure how to count\",\"to\":\"proof-count\",\"line\":61,\"target\":\"proof-count\"},{\"label\":\"They haven't asked for proof\",\"to\":\"pay\",\"line\":62,\"target\":\"pay\"}],\"line\":58},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":51},{\"id\":\"proof-count\",\"title\":\"Counting the days\",\"lines\":[{\"kind\":\"say\",\"text\":\"Count calendar days, including weekends and days off.\",\"line\":65,\"quotes\":[{\"text\":\"The 3 days are counted as calendar days, not just workdays.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Jennifer: off sick Tuesday, still sick on her days off, off sick Friday. That is 4 days in a row.\",\"line\":67,\"quotes\":[{\"text\":\"as she has been sick for 4 days in a row.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If leave is recorded in half-days, back at lunchtime on day 3 is less than 3 days.\",\"line\":69,\"quotes\":[{\"text\":\"she would have been sick for less than 3 days.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"The page doesn't say how days that are not in a row count.\",\"line\":71}],\"ask\":{\"question\":\"Which is it?\",\"options\":[{\"label\":\"Less than 3 days\",\"to\":\"proof-under3\",\"line\":73,\"target\":\"proof-under3\"},{\"label\":\"3 or more days in a row\",\"to\":\"proof-3plus\",\"line\":74,\"target\":\"proof-3plus\"}],\"line\":72},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":64},{\"id\":\"proof-under3\",\"title\":\"Asked before day 3\",\"lines\":[{\"kind\":\"say\",\"text\":\"If your employer wants proof, they must ask as soon as possible, and pay you back the costs (such as the doctor's visit).\",\"line\":77,\"quotes\":[{\"text\":\"ask for proof as soon as possible, and\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"pay you back for any costs, for example, the cost of your doctor's visit.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Employment New Zealand does not say what happens if your employer asks late, but you were back at work before the third day.\",\"line\":80}],\"ask\":null,\"next\":{\"to\":\"pay\",\"line\":81,\"target\":\"pay\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":76,\"nexts\":[{\"to\":\"pay\",\"line\":81,\"target\":\"pay\"}]},{\"id\":\"proof-3plus\",\"title\":\"Asked on or after day 3\",\"lines\":[{\"kind\":\"say\",\"text\":\"If your employer knows you've been sick 3 or more days in a row, they can ask for proof on or after the third day. You pay for it yourself.\",\"line\":84,\"quotes\":[{\"text\":\"If your employer knows you have been sick for 3 or more days in a row\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You must pay for these costs yourself.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If they asked before the third day, they pay, even if you were off longer.\",\"line\":87,\"quotes\":[{\"text\":\"If Jennifer's employer had asked for proof when she was sick on Tuesday, her employer would have had to cover the cost.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The page doesn't say how they should \\\"know\\\".\",\"line\":89}],\"ask\":null,\"next\":{\"to\":\"pay\",\"line\":90,\"target\":\"pay\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":83,\"nexts\":[{\"to\":\"pay\",\"line\":90,\"target\":\"pay\"}]},{\"id\":\"pay\",\"title\":\"Getting paid\",\"lines\":[{\"kind\":\"say\",\"text\":\"You are paid what you would have earned that day, in the pay for that period.\",\"line\":93,\"quotes\":[{\"text\":\"what you would have been paid if you had worked that day\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"in the payment that relates to the period in which the leave is taken\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Only days you would have worked are paid: not a day you weren't rostered, or were already on unpaid leave.\",\"line\":96,\"quotes\":[{\"text\":\"You only get paid sick leave for days you would have worked\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"if you were already on unpaid leave or you fell sick on a day you were not rostered to work.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"pay-proof\",\"line\":99,\"target\":\"pay-proof\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":92,\"nexts\":[{\"to\":\"pay-proof\",\"line\":99,\"target\":\"pay-proof\"}]},{\"id\":\"pay-proof\",\"title\":\"If you don't give proof\",\"lines\":[{\"kind\":\"warning\",\"text\":\"If your employer asked for proof and you don't give it, with no reasonable excuse, they don't have to pay you until you do.\",\"line\":102,\"quotes\":[{\"text\":\"do not have a reasonable excuse for not providing it\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"they do not have to pay you for the sick leave until you do so.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Employment New Zealand does not explain what a \\\"reasonable excuse\\\" is.\",\"line\":105}],\"ask\":{\"question\":\"What next?\",\"options\":[{\"label\":\"I went home part way through a day\",\"to\":\"part-day\",\"line\":107,\"target\":\"part-day\"},{\"label\":\"I'll be off for a long time\",\"to\":\"ongoing\",\"line\":108,\"target\":\"ongoing\"},{\"label\":\"Finish\",\"to\":\"end\",\"line\":109,\"target\":\"__end\"}],\"line\":106},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":101},{\"id\":\"entitled\",\"title\":\"Are you entitled?\",\"lines\":[{\"kind\":\"say\",\"text\":\"You get 10 days a year if you have worked for the same employer:\",\"line\":112,\"quotes\":[{\"text\":\"you are entitled to 10 days of\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"continuously for 6 months, or\",\"bullet\":true,\"line\":114,\"quotes\":[{\"text\":\"continuously for 6 months, or\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"for 6 months, with both:\",\"bullet\":true,\"line\":116,\"quotes\":[{\"text\":\"for a period of 6 months for:\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"an average of 10 hours a week, and\",\"bullet\":true,\"line\":118,\"quotes\":[{\"text\":\"an average of 10 hours per week, and\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"at least 1 hour every week or 40 hours every month.\",\"bullet\":true,\"line\":120,\"quotes\":[{\"text\":\"at least 1 hour in every week or 40 hours in every month.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Is one true (for you, or your employee)?\",\"options\":[{\"label\":\"Yes\",\"to\":\"balance\",\"line\":123,\"target\":\"balance\"},{\"label\":\"Not yet (under 6 months)\",\"to\":\"new-starter\",\"line\":124,\"target\":\"new-starter\"},{\"label\":\"No, not enough hours this year\",\"to\":\"not-yet\",\"line\":125,\"target\":\"not-yet\"},{\"label\":\"I'm not sure\",\"to\":\"not-sure\",\"line\":126,\"target\":\"not-sure\"}],\"line\":122},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":111},{\"id\":\"new-starter\",\"title\":\"Not 6 months yet\",\"lines\":[{\"kind\":\"say\",\"text\":\"Paid sick leave starts once one of the rules is met. Employment New Zealand does not say what you get before then.\",\"line\":129},{\"kind\":\"say\",\"text\":\"The options for having no sick leave left may help.\",\"line\":130}],\"ask\":null,\"next\":{\"to\":\"none-left\",\"line\":131,\"target\":\"none-left\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":128,\"nexts\":[{\"to\":\"none-left\",\"line\":131,\"target\":\"none-left\"}]},{\"id\":\"not-sure\",\"title\":\"Not sure if you're entitled\",\"lines\":[{\"kind\":\"say\",\"text\":\"Employment New Zealand has a chart to help (not copied here). You can also ask them: 0800 20 90 20.\",\"line\":134,\"quotes\":[{\"text\":\"call us on 0800 20 90 20\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What next?\",\"options\":[{\"label\":\"I'm sick today\",\"to\":\"today\",\"line\":137,\"target\":\"today\"},{\"label\":\"Finish\",\"to\":\"end\",\"line\":138,\"target\":\"__end\"}],\"line\":136},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":133},{\"id\":\"not-yet\",\"title\":\"Not entitled this year\",\"lines\":[{\"kind\":\"say\",\"text\":\"In a year you don't meet the rules, you get no new sick leave. You can still use sick leave carried over from last year.\",\"line\":141,\"quotes\":[{\"text\":\"you do not get any new sick leave entitlement\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"you can still use any sick leave balance that has been carried over from the previous year.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Do you have sick leave carried over?\",\"options\":[{\"label\":\"Yes\",\"to\":\"proof\",\"line\":145,\"target\":\"proof\"},{\"label\":\"No\",\"to\":\"none-left\",\"line\":146,\"target\":\"none-left\"}],\"line\":144},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":140},{\"id\":\"balance\",\"title\":\"How much sick leave\",\"lines\":[{\"kind\":\"say\",\"text\":\"Part-timers get the full 10 days too. Your employer can give more, not less.\",\"line\":149,\"quotes\":[{\"text\":\"they still get 10 days' sick leave\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"cannot give you less sick leave\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Unused sick leave carries over, up to 20 days (more if you both agree). The page doesn't say when the year starts.\",\"line\":152,\"quotes\":[{\"text\":\"up to a maximum of 20 days of sick leave.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"can accumulate to more than 20 days\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What next?\",\"options\":[{\"label\":\"Can unused sick leave be cashed up?\",\"to\":\"cashup\",\"line\":156,\"target\":\"cashup\"},{\"label\":\"I'm sick today\",\"to\":\"today\",\"line\":157,\"target\":\"today\"},{\"label\":\"I'm an employer\",\"to\":\"employer\",\"line\":158,\"target\":\"employer\"},{\"label\":\"Finish\",\"to\":\"end\",\"line\":159,\"target\":\"__end\"}],\"line\":155},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":148},{\"id\":\"cashup\",\"title\":\"Cashing up unused sick leave\",\"lines\":[{\"kind\":\"warning\",\"text\":\"You are not entitled to cash up unused sick leave, or have it paid out when you leave.\",\"line\":162,\"quotes\":[{\"text\":\"Unused sick leave cannot be cashed up or be part of any final payment\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"an employee is not entitled to have any unused sick leave paid out\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The employee page says it \\\"cannot\\\" be cashed up; the employer page says it \\\"does not have to\\\" be. Employment New Zealand does not say whether an employer may choose to.\",\"line\":165,\"quotes\":[{\"text\":\"Unused sick leave does not have to be cashed up\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What next?\",\"options\":[{\"label\":\"Finish\",\"to\":\"end\",\"line\":168,\"target\":\"__end\"}],\"line\":167},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":161},{\"id\":\"none-left\",\"title\":\"No sick leave left\",\"lines\":[{\"kind\":\"say\",\"text\":\"Coming to work sick can put other workers at risk.\",\"line\":171,\"quotes\":[{\"text\":\"can endanger the health or safety of other workers.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"You can ask for sick leave in advance, unpaid leave, or paid special leave. One more option did not come through in our copy: check the page itself.\",\"line\":173,\"quotes\":[{\"text\":\"sick leave in advance\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"unpaid leave\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"take paid special leave\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Your employer does not have to agree unless your employment agreement says so.\",\"line\":177,\"quotes\":[{\"text\":\"does not have to agree to the req <script>
// Review page: switches the app preview between looks and saves one reaction per look plus any comments.
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const roundKey = D.round.replace(/[^a-z0-9]+/gi, '-');
const picked = {};          // look id -> reaction, as saved
let current = 0, db = null;

// Draws the look buttons and loads the chosen look into the preview.
function show(k) {
  current = k;
  const L = D.looks[k];
  $('picker').innerHTML = D.looks.map((l, i) => `<button data-k="${i}" aria-pressed="${i === k}">${'ABC'[i]} · ${l.name}${picked[l.id] ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('from').textContent = 'Borrowed from ' + L.from.charAt(0).toLowerCase() + L.from.slice(1);
  $('frame').srcdoc = L.html;
  $('ask').textContent = `How does ${L.name} feel?`;
  for (const b of $('react').children) b.setAttribute('aria-pressed', String(picked[L.id] === b.dataset.r));
}
const say = (t) => { $('status').textContent = t; };

$('picker').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); });

// One reaction per look; tapping another replaces it.
$('react').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = D.looks[current];
  picked[L.id] = b.dataset.r; show(current);
  if (!db) return say('Saved on this screen only: feedback storage is not available here.');
  try { await db.doc(`reactions/${roundKey}-${L.id}`).set({ round: D.round, look: L.id, reaction: b.dataset.r, at: Date.now() }); say(`Saved: ${b.textContent} for ${L.name}.`); }
  catch (err) { say('Could not save that. Check your connection and tap again.'); }
});

// Comments are kept as separate notes, tagged with the look on screen.
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('comment').value.trim(); if (!text) return;
  const L = D.looks[current];
  if (!db) return say('Comments can only be saved when this page is opened in Claude.');
  try { await db.collection('comments').add({ round: D.round, look: L.id, text: text.slice(0, 2000), at: Date.now() }); $('comment').value = ''; say(`Comment saved for ${L.name}. The next build reads it.`); }
  catch (err) { say('Could not save the comment. Check your connection and try again.'); }
});

$('round').textContent = D.round.split(' ')[0];
show(0);

// Connect to feedback storage, then mark the looks already reacted to in this round.
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection('reactions').where('round', '==', D.round).get();
    for (const d of snap.docs) { const v = d.data(); if (v?.look) picked[v.look] = v.reaction; }
    show(current);
  } catch { /* first visit or offline: nothing to mark */ }
})();
</script>
