a-look=\"flightdeck\"] .do{ border-bottom:1px dashed var(--line); font-weight:500; }html[data-look=\"flightdeck\"] .do input{ accent-color:var(--go); border-radius:0; }html[data-look=\"flightdeck\"] details.src summary{ color:var(--go); }html[data-look=\"flightdeck\"] details.src{ color:var(--mut); }html[data-look=\"flightdeck\"] .timer{ background:#06121b; border:1px solid #1f3a50; border-radius:4px; position:relative; }html[data-look=\"flightdeck\"] .timer::after{ content:\"\"; display:block; height:4px; margin-top:10px; background:linear-gradient(90deg, var(--go) calc(var(--p, 0) * 100%), #1c2633 0); }html[data-look=\"flightdeck\"] .timer .lbl{ text-transform:uppercase; letter-spacing:.1em; font-size:12px; }html[data-look=\"flightdeck\"] .big-clock{ font-family:\"IBM Plex Mono\", ui-monospace, monospace; font-weight:500; color:var(--go); font-size:56px; }html[data-look=\"flightdeck\"] .timer.due{ background:#2a0d0b; border-color:var(--due); }html[data-look=\"flightdeck\"] .timer.due .big-clock{ color:var(--due); }html[data-look=\"flightdeck\"] .reminders{ background:var(--bg); }html[data-look=\"flightdeck\"] .rem{ background:var(--card); border-color:var(--line); border-radius:4px; }html[data-look=\"flightdeck\"] .rem button{ background:transparent; color:var(--ink); border-color:var(--line); }html[data-look=\"flightdeck\"] .rem.due{ background:#2a0d0b; border-color:var(--due); }html[data-look=\"flightdeck\"] .lookup, html[data-look=\"flightdeck\"] th, html[data-look=\"flightdeck\"] td{ border-color:var(--line); }html[data-look=\"flightdeck\"] .inp input{ background:#0b1118; color:var(--ink); border-color:var(--line); }html[data-look=\"flightdeck\"] .choices button{ background:transparent; color:var(--ink); border-color:var(--line); border-radius:4px; }html[data-look=\"flightdeck\"] .choices button.on, html[data-look=\"flightdeck\"] .look-pick button.on{ background:var(--go); color:#04121c; }html[data-look=\"flightdeck\"] .log time{ font-family:\"IBM Plex Mono\", monospace; }html[data-look=\"flightdeck\"] .tabs{ background:#070a0e; border-top:1px solid var(--line); }html[data-look=\"flightdeck\"] .tabs button{ text-transform:uppercase; letter-spacing:.08em; font-size:13px; }html[data-look=\"flightdeck\"] .tabs button.on{ color:var(--go); box-shadow:inset 0 3px 0 var(--go); }\n</style></head>\n<body><div id=\"app\"></div>\n<script type=\"application/json\" id=\"spec\">{\"spec\":{\"title\":\"Severe bleeding\",\"about\":\"Guides you through first aid in New Zealand when someone is bleeding badly: pressing on the wound, calling 111, a tourniquet on an arm or leg, objects stuck in a wound, a cut-off body part, bleeding inside, and a nosebleed. It keeps the times the ambulance will need.\",\"sources\":[{\"name\":\"ANZCOR Guideline 9.1.1, First Aid for Management of Bleeding (April 2021, editorial update July 2025) (main source)\",\"link\":\"https://www.anzcor.org/home/first-aid/guideline-9-1-1-first-aid-for-management-of-bleeding\"},{\"name\":\"Hato Hone St John NZ, \\\"Bleeding\\\"\",\"link\":\"https://www.stjohn.org.nz/First-Aid/First-Aid-Library/Bleeding/\"},{\"name\":\"Healthify He Puna Waiora, \\\"Bleeding first aid\\\" (reviewed 9 June 2026)\",\"link\":\"https://healthify.nz/health-a-z/b/bleeding\"}],\"warning\":\"Bleeding badly? Call 111. The sources do not all agree; where they differ, the app shows each one.\",\"audience\":\"Anyone helping a person who is bleeding badly in New Zealand\",\"reviewedBy\":\"\",\"version\":\"ANZCOR Guideline 9.1.1 'First Aid for Management of Bleeding' (Approved April 2021, supersedes July 2017; Editorial Update July 2025 on tourniquets); Hato Hone St John 'Bleeding' first aid library page (no date shown, footer 2025); Healthify He Puna Waiora 'Bleeding first aid' (Last reviewed 09 Jun 2026); all read 20 Nov 2026\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"Bleeding badly? Press and call 111\",\"lines\":[{\"kind\":\"do\",\"text\":\"Press hard on the wound with a clean cloth, or your hand. Keep the edges of the wound together. Keep pressing.\",\"line\":15,\"quotes\":[{\"text\":\"Firm pressure on or around the wound is the most effective way to stop most bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If there isn't a cloth nearby, don't waste time – use the person's hand or your hand (wear gloves) to press on the wound and keep the edges of the wound together.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Pressure started\",\"line\":18},{\"kind\":\"do\",\"text\":\"Call 111, or get someone else to call. Lie the person down.\",\"line\":19,\"quotes\":[{\"text\":\"Lie the person down, apply pressure and call for an ambulance.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"get somebody else to call 111 for you\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"111 called\",\"line\":22},{\"kind\":\"warning\",\"text\":\"Something stuck in the wound? Do not pull it out. Press around it.\",\"line\":23,\"quotes\":[{\"text\":\"Do not remove the embedded object because it may be plugging the wound and restricting bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"use pressure around the object\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Awake? Check they are happy for you to help. Not awake? Don't delay.\",\"line\":26,\"quotes\":[{\"text\":\"If the person is conscious, check they are happy for you to touch them before you give first aid.\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"If the person is unconscious and you need to check for injuries or give lifesaving first aid, then don't delay.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Gloves (and glasses) if you have them, or a plastic bag over your hands. Don't wait for them.\",\"line\":29,\"quotes\":[{\"text\":\"Use standard precautions (e.g. gloves, protective glasses) if readily available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If there are no gloves, place your hands inside a plastic bag.\",\"where\":\"St John\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you see?\",\"options\":[{\"label\":\"Pouring, spurting or soaking through\",\"to\":\"soaking\",\"line\":33,\"target\":\"soaking\"},{\"label\":\"A body part cut off\",\"to\":\"amputation\",\"line\":34,\"target\":\"amputation\"},{\"label\":\"Pressing, bleeding is slowing\",\"to\":\"care\",\"line\":35,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":36,\"target\":\"not-breathing\"},{\"label\":\"Other: object stuck, nose, inside, head\",\"to\":\"other\",\"line\":37,\"target\":\"other\"}],\"line\":32},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":14},{\"id\":\"soaking\",\"title\":\"Still bleeding? Press harder\",\"lines\":[{\"kind\":\"do\",\"text\":\"Keep pressing. Add a second pad and a tighter bandage over the wound.\",\"line\":40,\"quotes\":[{\"text\":\"If bleeding continues, apply a second pad and a tighter bandage over the wound.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Second pad added\",\"line\":42},{\"kind\":\"do\",\"text\":\"Still bleeding? Check the pad is right over the bleeding point. If not, take it off and place it again.\",\"line\":43,\"quotes\":[{\"text\":\"check that the pad and bandage are correctly applied, directly over the bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"it may be necessary to remove the pad(s) to ensure that a specific bleeding point has not been missed.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Pressing hard on 1 or 2 pads works better than piling on more (ANZCOR).\",\"line\":46,\"quotes\":[{\"text\":\"only using 1 to 2 pads over a small area, will achieve greater pressure over the bleeding point than continuing to layer up further pads.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The others differ:\",\"line\":48},{\"kind\":\"say\",\"text\":\"Healthify: add more padding; don't keep lifting it to check.\",\"bullet\":true,\"line\":49,\"quotes\":[{\"text\":\"Keep pressure on and add more padding if needed.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"don't keep lifting the dressing to check.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"St John: keep pressing firmly until the ambulance arrives.\",\"bullet\":true,\"line\":52,\"quotes\":[{\"text\":\"continue to press firmly until the ambulance arrives.\",\"where\":\"St John\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Still bleeding badly?\",\"options\":[{\"label\":\"Yes, from an arm or leg\",\"to\":\"tourniquet\",\"line\":55,\"target\":\"tourniquet\"},{\"label\":\"Yes, from somewhere else (neck, body)\",\"to\":\"dressing\",\"line\":56,\"target\":\"dressing\"},{\"label\":\"No, it is under control\",\"to\":\"care\",\"line\":57,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":58,\"target\":\"not-breathing\"}],\"line\":54},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":39},{\"id\":\"tourniquet\",\"title\":\"Arm or leg: tourniquet?\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR (the joint Australia-NZ guideline) suggests a tourniquet for life-threatening bleeding from an arm or leg that pressure does not stop, if you are trained and have one.\",\"line\":61,\"quotes\":[{\"text\":\"Arterial tourniquets should only be used for life-threatening bleeding from a limb, where the bleeding cannot be controlled by direct pressure.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"St John and Healthify do not mention tourniquets. They say keep pressing.\",\"line\":64,\"quotes\":[{\"text\":\"Keep pressure on until help arrives or the bleeding stops.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"ANZCOR treats bleeding as life-threatening if: a limb cut off above the wrist or ankle; a shark attack, propeller cut or similar major injury; pressure does not control it; or signs of shock.\",\"line\":66,\"quotes\":[{\"text\":\"amputated or partially amputated limb above wrist or ankle\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"shark attack, propeller cuts or similar major trauma to any part of the body\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"bleeding not controlled by local pressure\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you have?\",\"options\":[{\"label\":\"A tourniquet, and I am trained\",\"to\":\"tq-apply\",\"line\":71,\"target\":\"tq-apply\"},{\"label\":\"A tourniquet, but I am not trained\",\"to\":\"tq-untrained\",\"line\":72,\"target\":\"tq-untrained\"},{\"label\":\"No tourniquet: make one\",\"to\":\"improvise\",\"line\":73,\"target\":\"improvise\"},{\"label\":\"No tourniquet, can't make one\",\"to\":\"no-tq\",\"line\":74,\"target\":\"no-tq\"}],\"line\":70},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":60},{\"id\":\"tq-untrained\",\"title\":\"A tourniquet, not trained\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR suggests a tourniquet \\\"if trained in its use\\\", and says shop-made ones work best when the first aider is trained.\",\"line\":77,\"quotes\":[{\"text\":\"we suggest to apply an arterial tourniquet above the bleeding point, if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Effective use of commercial tourniquets is optimal when first aid providers are trained in proper application techniques.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"ANZCOR does not say whether an untrained helper should use one anyway. The app can't decide this for you. The 111 call taker may help.\",\"line\":80}],\"ask\":{\"question\":\"What will you do?\",\"options\":[{\"label\":\"Use it\",\"to\":\"tq-apply\",\"line\":82,\"target\":\"tq-apply\"},{\"label\":\"Don't use it: other options\",\"to\":\"no-tq\",\"line\":83,\"target\":\"no-tq\"}],\"line\":81},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":76},{\"id\":\"improvise\",\"title\":\"Make a tourniquet\",\"lines\":[{\"kind\":\"say\",\"text\":\"A shop-made windlass tourniquet works better. In life-threatening bleeding, a home-made one is likely better than none.\",\"line\":86,\"quotes\":[{\"text\":\"Commercially manufactured windlass tourniquets such as those based on military designs are more effective than improvised tourniquets.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"in the context of life-threatening bleeding, an improvised tourniquet is likely to be better than no tourniquet.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Use a broad band: a triangular or elastic bandage, clothing, or a surfboard leg rope. Tighten it by twisting a rod or stick under the band.\",\"line\":89,\"quotes\":[{\"text\":\"Tourniquets, ideally of a similar broad width to commercial types, can be improvised using materials from a first aid kit (e.g. triangular bandage, elastic bandage) from clothing, a surfboard leg rope or other available similar items.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Improvised tourniquets should be tightened by twisting a rod or stick under the improvised tourniquet band\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"ANZCOR suggests tourniquets \\\"if trained in its use\\\"; it does not say whether that also applies to a home-made one.\",\"line\":92,\"quotes\":[{\"text\":\"if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"A thin stretchy blood-test tourniquet will not work. A home-made one that is not tight enough can increase bleeding.\",\"line\":94,\"quotes\":[{\"text\":\"is not suitable for use as an arterial tourniquet.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Improvised tourniquets which do not stop all circulation can increase bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"tq-apply\",\"line\":97,\"target\":\"tq-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":85,\"nexts\":[{\"to\":\"tq-apply\",\"line\":97,\"target\":\"tq-apply\"}]},{\"id\":\"tq-apply\",\"title\":\"Put the tourniquet on\",\"lines\":[{\"kind\":\"do\",\"text\":\"Follow the maker's instructions. No instructions: 5 cm above the bleeding point.\",\"line\":100,\"quotes\":[{\"text\":\"in accordance with the manufacturer's instructions (or 5 cm above the bleeding point if no instructions)\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"If you can, not over a joint, the wound, clothing or a wetsuit. Tighten until the bleeding stops, even if it hurts.\",\"line\":102,\"quotes\":[{\"text\":\"Ideally, a tourniquet should not be applied over a joint or wound\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Ideally the tourniquet is not applied over clothing nor wetsuits and is applied tightly, even if this causes local discomfort.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"tightened until the bleeding stops.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Tap the button the moment it is on. It records the clock time. Tell the paramedics that time.\",\"line\":106,\"quotes\":[{\"text\":\"The time of tourniquet application must be noted and communicated to emergency/paramedic personnel.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Tourniquet on\",\"line\":108}],\"ask\":{\"question\":\"Has the bleeding stopped?\",\"options\":[{\"label\":\"Yes, it has stopped\",\"to\":\"tq-on\",\"line\":110,\"target\":\"tq-on\"},{\"label\":\"Still bleeding\",\"to\":\"tq-more\",\"line\":111,\"target\":\"tq-more\"}],\"line\":109},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":99},{\"id\":\"tq-more\",\"title\":\"Still bleeding with a tourniquet\",\"lines\":[{\"kind\":\"do\",\"text\":\"Check where it is and how it is put on. Tighten it.\",\"line\":114,\"quotes\":[{\"text\":\"If a tourniquet does not stop the bleeding its position and application must be checked.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Still bleeding? Put on a second tourniquet if you have one, above the first if you can.\",\"line\":116,\"quotes\":[{\"text\":\"a second tourniquet (if available) should be applied to the limb, preferably above the first.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Second tourniquet on\",\"line\":118},{\"kind\":\"say\",\"text\":\"Still bleeding after that? ANZCOR: think about a haemostatic dressing as well.\",\"line\":119,\"quotes\":[{\"text\":\"consider using a haemostatic dressing in conjunction with the tourniquet.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Bleeding has stopped\",\"to\":\"tq-on\",\"line\":122,\"target\":\"tq-on\"},{\"label\":\"Still bleeding: haemostatic dressing\",\"to\":\"dressing\",\"line\":123,\"target\":\"dressing\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":124,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":125,\"target\":\"not-breathing\"}],\"line\":121},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":113},{\"id\":\"tq-on\",\"title\":\"Tourniquet on: leave it\",\"lines\":[{\"kind\":\"warning\",\"text\":\"Do not take it off. Do not cover it with a bandage or clothing.\",\"line\":128,\"quotes\":[{\"text\":\"the tourniquet should not be removed until the person receives specialist care.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"must not be covered up by any bandage or clothing.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"They need to get to hospital urgently. Tell the paramedics the clock time it went on (on the \\\"Tourniquet on\\\" button and in the Log).\",\"line\":131,\"quotes\":[{\"text\":\"Once applied, the person requires urgent transfer to hospital\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"The time of tourniquet application must be noted and communicated to emergency/paramedic personnel.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"No source says how to write the time down (on the tourniquet or the person).\",\"line\":134},{\"kind\":\"say\",\"text\":\"ANZCOR's 2025 update: some studies found possible harm after more than 2 hours, but its advice is unchanged. It gives first aiders no step for this.\",\"line\":135,\"quotes\":[{\"text\":\"this occurred after prolonged (>2 hours) application of arterial tourniquets.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Until the results of this review are available, ANZCOR Guideline 9.1.1 recommendations remain unchanged.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"A cut-off body part to save\",\"to\":\"part\",\"line\":139,\"target\":\"part\"},{\"label\":\"Wait for the ambulance\",\"to\":\"care\",\"line\":140,\"target\":\"care\"}],\"line\":138},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":127},{\"id\":\"no-tq\",\"title\":\"No tourniquet\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR: no tourniquet, or it did not work? A haemostatic dressing, if you are trained and have one.\",\"line\":143,\"quotes\":[{\"text\":\"from a limb when a tourniquet is not available or has failed to stop the bleeding, we suggest to apply a haemostatic dressing, if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Otherwise keep pressing hard until help arrives. No source gives another step.\",\"line\":145,\"quotes\":[{\"text\":\"Keep pressure on until help arrives or the bleeding stops.\",\"where\":\"Healthify\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"I have a haemostatic dressing\",\"to\":\"dressing\",\"line\":148,\"target\":\"dressing\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":149,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":150,\"target\":\"not-breathing\"}],\"line\":147},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":142},{\"id\":\"dressing\",\"title\":\"Haemostatic dressing\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR only: a dressing with something in it that helps stop bleeding. Use it if you are trained and have one: where a tourniquet can't go, or when a tourniquet is not there or has not worked.\",\"line\":153,\"quotes\":[{\"text\":\"Haemostatic dressings are impregnated with agents that help stop bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"from a wound site not suitable for tourniquet, or from a limb when a tourniquet is not available or has failed to stop the bleeding\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Put it as close as you can to the bleeding point. Press it on with your hand, then bandage it in place.\",\"line\":156,\"quotes\":[{\"text\":\"Haemostatic dressings must be applied as close as possible to the bleeding point, held against the wound using local pressure (manually initially) then held in place with the application of a bandage (if available).\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Haemostatic dressing used\",\"line\":158},{\"kind\":\"warning\",\"text\":\"Leave it on until hospital care.\",\"line\":159,\"quotes\":[{\"text\":\"Haemostatic dressings should be left on the bleeding point until definitive care is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"No dressing? Keep pressing hard. No source gives another step.\",\"line\":161}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Bleeding under control\",\"to\":\"care\",\"line\":163,\"target\":\"care\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":164,\"target\":\"care\"},{\"label\":\"Still bleeding from an arm or leg\",\"to\":\"tourniquet\",\"line\":165,\"target\":\"tourniquet\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":166,\"target\":\"not-breathing\"}],\"line\":162},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":152},{\"id\":\"embedded\",\"title\":\"Something stuck in the wound\",\"lines\":[{\"kind\":\"warning\",\"text\":\"Do not pull it out. It may be plugging the wound.\",\"line\":169,\"quotes\":[{\"text\":\"Do not remove the embedded object because it may be plugging the wound and restricting bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If an object is stuck in the wound, don't remove it.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Put padding around it, on each side. Press on the padding, not on the object.\",\"line\":172,\"quotes\":[{\"text\":\"Apply padding around or on each side of the protruding object, with pressure over the padding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"apply pressure around the wound but don't put pressure on the object.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"St John differs: remove a small one near the surface (a nail or staple); leave a large one in. The app follows ANZCOR.\",\"line\":175,\"quotes\":[{\"text\":\"If it's small, like a nail or a staple, and near the surface of the skin, remove it.\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"If it's large, like a screwdriver or a knife, DO NOT remove it.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Pressing may not be enough. A tourniquet or haemostatic dressing may still be needed (ANZCOR).\",\"line\":178,\"quotes\":[{\"text\":\"It may still be necessary to use other measures including an arterial tourniquet or haemostatic dressings.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Still bleeding from an arm or leg\",\"to\":\"tourniquet\",\"line\":181,\"target\":\"tourniquet\"},{\"label\":\"Still bleeding from somewhere else\",\"to\":\"dressing\",\"line\":182,\"target\":\"dressing\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":183,\"target\":\"care\"},{\"label\":\"Bleeding under control\",\"to\":\"care\",\"line\":184,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":185,\"target\":\"not-breathing\"}],\"line\":180},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":168},{\"id\":\"amputation\",\"title\":\"A body part cut off\",\"lines\":[{\"kind\":\"do\",\"text\":\"Call 111. Press a bulky pad or clean cloth firmly on the bleeding area.\",\"line\":188,\"quotes\":[{\"text\":\"call 111 immediately for an ambulance.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"Use a bulky pad or clean cloth and apply it firmly to the bleeding area\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"111 called\",\"line\":191},{\"kind\":\"say\",\"text\":\"ANZCOR: an arm or leg cut off above the wrist or ankle (even partly) is life-threatening bleeding.\",\"line\":192,\"quotes\":[{\"text\":\"amputated or partially amputated limb above wrist or ankle\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Raise the injured part? St John and Healthify: yes, if you can. ANZCOR: no evidence it helps; it may cause more pain or injury. The app follows ANZCOR: no raising step.\",\"line\":194,\"quotes\":[{\"text\":\"Keep the injured area raised (if you can).\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"raise the injured area if possible.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"There is no evidence that elevating a bleeding part will help control bleeding and there is the potential to cause more pain or injury.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Still bleeding from an arm or leg\",\"to\":\"tourniquet\",\"line\":199,\"target\":\"tourniquet\"},{\"label\":\"Bleeding controlled: save the part\",\"to\":\"part\",\"line\":200,\"target\":\"part\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":201,\"target\":\"not-breathing\"}],\"line\":198},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":187},{\"id\":\"part\",\"title\":\"Save the cut-off part\",\"lines\":[{\"kind\":\"do\",\"text\":\"Put the part in a plastic bag; keep it dry. Seal the bag. Put the bag in water with ice.\",\"line\":204,\"quotes\":[{\"text\":\"Put the body part in a sealed plastic bag – keep it dry.\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"Place the sealed plastic bag in a container of water and ice.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Healthify adds: leave a little air in the bag, and use cold water with several ice cubes. ANZCOR says nothing about the part.\",\"line\":207,\"quotes\":[{\"text\":\"seal the bag closed with a little air inside to protect it with a 'cushion' of air.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"Place the bag in a bucket of cold water with several ice cubes in the water.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Make sure the part goes to hospital with the person.\",\"line\":210,\"quotes\":[{\"text\":\"Make sure the body part goes to the hospital with the person.\",\"where\":\"St John\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"care\",\"line\":212,\"target\":\"care\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":203,\"nexts\":[{\"to\":\"care\",\"line\":212,\"target\":\"care\"}]},{\"id\":\"care\",\"title\":\"While you wait for the ambulance\",\"lines\":[{\"kind\":\"do\",\"text\":\"Keep pressing until help arrives or the bleeding stops. No source gives a number of minutes.\",\"line\":215,\"quotes\":[{\"text\":\"Keep pressure on until help arrives or the bleeding stops.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Keep them lying down, still and warm. Reassure them.\",\"line\":217,\"quotes\":[{\"text\":\"Assist the person into a position of comfort, preferably lying down\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Advise the person to lie down and remain still\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Keep the person warm\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Reassure the person\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Nothing to eat or drink, not even medicines.\",\"line\":222,\"quotes\":[{\"text\":\"Do not give any food or drink orally, including medications\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Check their breathing and how they are often. ANZCOR gives no time.\",\"line\":224,\"quotes\":[{\"text\":\"Monitor the vital signs at frequent intervals\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Arm or leg: ANZCOR says keep it still. Raise it? St John says yes; ANZCOR says there is no evidence it helps and it may cause more pain or injury. The app follows ANZCOR.\",\"line\":226,\"quotes\":[{\"text\":\"Restrict movement by immobilising a bleeding limb\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If the wound is on the person's arm or leg, raise it up (to reduce blood flow to the injured area).\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"There is no evidence that elevating a bleeding part will help control bleeding and there is the potential to cause more pain or injury.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"How are they?\",\"options\":[{\"label\":\"Bleeding again or soaking through\",\"to\":\"soaking\",\"line\":231,\"target\":\"soaking\"},{\"label\":\"Pale, sweaty, confused (shock?)\",\"to\":\"shock\",\"line\":232,\"target\":\"shock\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":233,\"target\":\"not-breathing\"},{\"label\":\"A cut-off body part to save\",\"to\":\"part\",\"line\":234,\"target\":\"part\"},{\"label\":\"Ambulance arrived\",\"to\":\"handover\",\"line\":235,\"target\":\"handover\"}],\"line\":230},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":214},{\"id\":\"shock\",\"title\":\"Signs of shock\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR: pale and sweaty with a pulse over 100, or capillary refill over 2 seconds, and/or less awake.\",\"line\":238,\"quotes\":[{\"text\":\"pale and sweaty plus pulse rate >100, or capillary refill > 2 sec and/or decreased level of consciousness\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Healthify: pale, clammy, sweaty, fast breathing, confused, fainting, or not conscious.\",\"line\":240,\"quotes\":[{\"text\":\"unusual paleness or loss of colour, clammy skin, sweating, fast breathing, confusion, fainting or loss of consciousness.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Call 111 if nobody has. Keep them lying down and warm. Nothing to eat or drink.\",\"line\":242,\"quotes\":[{\"text\":\"the person shows signs of shock.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"Help the person lie down if possible and keep them warm.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"111 called\",\"line\":245},{\"kind\":\"say\",\"text\":\"ANZCOR says \\\"treat shock\\\" but gives no steps here. Check them often (no time given). Oxygen only if you have it and are trained.\",\"line\":246,\"quotes\":[{\"text\":\"Treat shock\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Monitor the vital signs at frequent intervals\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Administer oxygen if available and trained to do so\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Still bleeding or soaking through\",\"to\":\"soaking\",\"line\":251,\"target\":\"soaking\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":252,\"target\":\"not-breathing\"},{\"label\":\"Ambulance arrived\",\"to\":\"handover\",\"line\":253,\"target\":\"handover\"}],\"line\":250},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":237},{\"id\":\"not-breathing\",\"title\":\"Not breathing normally\",\"lines\":[{\"kind\":\"warning\",\"text\":\"Bleeding badly? Stopping the bleeding comes first, before airway and breathing (ANZCOR).\",\"line\":256,\"quotes\":[{\"text\":\"In life-threatening bleeding, control of bleeding takes priority over airway and breathing interventions.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Call 111 if nobody has. Not responding and not breathing normally: start CPR (Healthify); follow the Basic Life Support flowchart (ANZCOR).\",\"line\":258,\"quotes\":[{\"text\":\"If the person isn't responding and isn't breathing normally, start CPR.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"If the person is unresponsive and not breathing normally, follow the Basic Life Support Flowchart.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"111 called\",\"line\":261},{\"kind\":\"say\",\"text\":\"Bleeding that is not life-threatening: airway and CPR come first (ANZCOR).\",\"line\":262, look=\"flightdeck\"] details.src summary{ color:var(--go); }html[data-look=\"flightdeck\"] details.src{ color:var(--mut); }html[data-look=\"flightdeck\"] .timer{ background:#06121b; border:1px solid #1f3a50; border-radius:4px; position:relative; }html[data-look=\"flightdeck\"] .timer::after{ content:\"\"; display:block; height:4px; margin-top:10px; background:linear-gradient(90deg, var(--go) calc(var(--p, 0) * 100%), #1c2633 0); }html[data-look=\"flightdeck\"] .timer .lbl{ text-transform:uppercase; letter-spacing:.1em; font-size:12px; }html[data-look=\"flightdeck\"] .big-clock{ font-family:\"IBM Plex Mono\", ui-monospace, monospace; font-weight:500; color:var(--go); font-size:56px; }html[data-look=\"flightdeck\"] .timer.due{ background:#2a0d0b; border-color:var(--due); }html[data-look=\"flightdeck\"] .timer.due .big-clock{ color:var(--due); }html[data-look=\"flightdeck\"] .reminders{ background:var(--bg); }html[data-look=\"flightdeck\"] .rem{ background:var(--card); border-color:var(--line); border-radius:4px; }html[data-look=\"flightdeck\"] .rem button{ background:transparent; color:var(--ink); border-color:var(--line); }html[data-look=\"flightdeck\"] .rem.due{ background:#2a0d0b; border-color:var(--due); }html[data-look=\"flightdeck\"] .lookup, html[data-look=\"flightdeck\"] th, html[data-look=\"flightdeck\"] td{ border-color:var(--line); }html[data-look=\"flightdeck\"] .inp input{ background:#0b1118; color:var(--ink); border-color:var(--line); }html[data-look=\"flightdeck\"] .choices button{ background:transparent; color:var(--ink); border-color:var(--line); border-radius:4px; }html[data-look=\"flightdeck\"] .choices button.on, html[data-look=\"flightdeck\"] .look-pick button.on{ background:var(--go); color:#04121c; }html[data-look=\"flightdeck\"] .log time{ font-family:\"IBM Plex Mono\", monospace; }html[data-look=\"flightdeck\"] .tabs{ background:#070a0e; border-top:1px solid var(--line); }html[data-look=\"flightdeck\"] .tabs button{ text-transform:uppercase; letter-spacing:.08em; font-size:13px; }html[data-look=\"flightdeck\"] .tabs button.on{ color:var(--go); box-shadow:inset 0 3px 0 var(--go); }\n</style></head>\n<body><div id=\"app\"></div>\n<script type=\"application/json\" id=\"spec\">{\"spec\":{\"title\":\"Severe bleeding\",\"about\":\"Guides you through first aid in New Zealand when someone is bleeding badly: pressing on the wound, calling 111, a tourniquet on an arm or leg, objects stuck in a wound, a cut-off body part, bleeding inside, and a nosebleed. It keeps the times the ambulance will need.\",\"sources\":[{\"name\":\"ANZCOR Guideline 9.1.1, First Aid for Management of Bleeding (April 2021, editorial update July 2025) (main source)\",\"link\":\"https://www.anzcor.org/home/first-aid/guideline-9-1-1-first-aid-for-management-of-bleeding\"},{\"name\":\"Hato Hone St John NZ, \\\"Bleeding\\\"\",\"link\":\"https://www.stjohn.org.nz/First-Aid/First-Aid-Library/Bleeding/\"},{\"name\":\"Healthify He Puna Waiora, \\\"Bleeding first aid\\\" (reviewed 9 June 2026)\",\"link\":\"https://healthify.nz/health-a-z/b/bleeding\"}],\"warning\":\"Bleeding badly? Call 111. The sources do not all agree; where they differ, the app shows each one.\",\"audience\":\"Anyone helping a person who is bleeding badly in New Zealand\",\"reviewedBy\":\"\",\"version\":\"ANZCOR Guideline 9.1.1 'First Aid for Management of Bleeding' (Approved April 2021, supersedes July 2017; Editorial Update July 2025 on tourniquets); Hato Hone St John 'Bleeding' first aid library page (no date shown, footer 2025); Healthify He Puna Waiora 'Bleeding first aid' (Last reviewed 09 Jun 2026); all read 20 Nov 2026\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"Bleeding badly? Press and call 111\",\"lines\":[{\"kind\":\"do\",\"text\":\"Press hard on the wound with a clean cloth, or your hand. Keep the edges of the wound together. Keep pressing.\",\"line\":15,\"quotes\":[{\"text\":\"Firm pressure on or around the wound is the most effective way to stop most bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If there isn't a cloth nearby, don't waste time – use the person's hand or your hand (wear gloves) to press on the wound and keep the edges of the wound together.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Pressure started\",\"line\":18},{\"kind\":\"do\",\"text\":\"Call 111, or get someone else to call. Lie the person down.\",\"line\":19,\"quotes\":[{\"text\":\"Lie the person down, apply pressure and call for an ambulance.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"get somebody else to call 111 for you\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"111 called\",\"line\":22},{\"kind\":\"warning\",\"text\":\"Something stuck in the wound? Do not pull it out. Press around it.\",\"line\":23,\"quotes\":[{\"text\":\"Do not remove the embedded object because it may be plugging the wound and restricting bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"use pressure around the object\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Awake? Check they are happy for you to help. Not awake? Don't delay.\",\"line\":26,\"quotes\":[{\"text\":\"If the person is conscious, check they are happy for you to touch them before you give first aid.\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"If the person is unconscious and you need to check for injuries or give lifesaving first aid, then don't delay.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Gloves (and glasses) if you have them, or a plastic bag over your hands. Don't wait for them.\",\"line\":29,\"quotes\":[{\"text\":\"Use standard precautions (e.g. gloves, protective glasses) if readily available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If there are no gloves, place your hands inside a plastic bag.\",\"where\":\"St John\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you see?\",\"options\":[{\"label\":\"Pouring, spurting or soaking through\",\"to\":\"soaking\",\"line\":33,\"target\":\"soaking\"},{\"label\":\"A body part cut off\",\"to\":\"amputation\",\"line\":34,\"target\":\"amputation\"},{\"label\":\"Pressing, bleeding is slowing\",\"to\":\"care\",\"line\":35,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":36,\"target\":\"not-breathing\"},{\"label\":\"Other: object stuck, nose, inside, head\",\"to\":\"other\",\"line\":37,\"target\":\"other\"}],\"line\":32},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":14},{\"id\":\"soaking\",\"title\":\"Still bleeding? Press harder\",\"lines\":[{\"kind\":\"do\",\"text\":\"Keep pressing. Add a second pad and a tighter bandage over the wound.\",\"line\":40,\"quotes\":[{\"text\":\"If bleeding continues, apply a second pad and a tighter bandage over the wound.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Second pad added\",\"line\":42},{\"kind\":\"do\",\"text\":\"Still bleeding? Check the pad is right over the bleeding point. If not, take it off and place it again.\",\"line\":43,\"quotes\":[{\"text\":\"check that the pad and bandage are correctly applied, directly over the bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"it may be necessary to remove the pad(s) to ensure that a specific bleeding point has not been missed.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Pressing hard on 1 or 2 pads works better than piling on more (ANZCOR).\",\"line\":46,\"quotes\":[{\"text\":\"only using 1 to 2 pads over a small area, will achieve greater pressure over the bleeding point than continuing to layer up further pads.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The others differ:\",\"line\":48},{\"kind\":\"say\",\"text\":\"Healthify: add more padding; don't keep lifting it to check.\",\"bullet\":true,\"line\":49,\"quotes\":[{\"text\":\"Keep pressure on and add more padding if needed.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"don't keep lifting the dressing to check.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"St John: keep pressing firmly until the ambulance arrives.\",\"bullet\":true,\"line\":52,\"quotes\":[{\"text\":\"continue to press firmly until the ambulance arrives.\",\"where\":\"St John\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Still bleeding badly?\",\"options\":[{\"label\":\"Yes, from an arm or leg\",\"to\":\"tourniquet\",\"line\":55,\"target\":\"tourniquet\"},{\"label\":\"Yes, from somewhere else (neck, body)\",\"to\":\"dressing\",\"line\":56,\"target\":\"dressing\"},{\"label\":\"No, it is under control\",\"to\":\"care\",\"line\":57,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":58,\"target\":\"not-breathing\"}],\"line\":54},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":39},{\"id\":\"tourniquet\",\"title\":\"Arm or leg: tourniquet?\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR (the joint Australia-NZ guideline) suggests a tourniquet for life-threatening bleeding from an arm or leg that pressure does not stop, if you are trained and have one.\",\"line\":61,\"quotes\":[{\"text\":\"Arterial tourniquets should only be used for life-threatening bleeding from a limb, where the bleeding cannot be controlled by direct pressure.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"St John and Healthify do not mention tourniquets. They say keep pressing.\",\"line\":64,\"quotes\":[{\"text\":\"Keep pressure on until help arrives or the bleeding stops.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"ANZCOR treats bleeding as life-threatening if: a limb cut off above the wrist or ankle; a shark attack, propeller cut or similar major injury; pressure does not control it; or signs of shock.\",\"line\":66,\"quotes\":[{\"text\":\"amputated or partially amputated limb above wrist or ankle\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"shark attack, propeller cuts or similar major trauma to any part of the body\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"bleeding not controlled by local pressure\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you have?\",\"options\":[{\"label\":\"A tourniquet, and I am trained\",\"to\":\"tq-apply\",\"line\":71,\"target\":\"tq-apply\"},{\"label\":\"A tourniquet, but I am not trained\",\"to\":\"tq-untrained\",\"line\":72,\"target\":\"tq-untrained\"},{\"label\":\"No tourniquet: make one\",\"to\":\"improvise\",\"line\":73,\"target\":\"improvise\"},{\"label\":\"No tourniquet, can't make one\",\"to\":\"no-tq\",\"line\":74,\"target\":\"no-tq\"}],\"line\":70},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":60},{\"id\":\"tq-untrained\",\"title\":\"A tourniquet, not trained\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR suggests a tourniquet \\\"if trained in its use\\\", and says shop-made ones work best when the first aider is trained.\",\"line\":77,\"quotes\":[{\"text\":\"we suggest to apply an arterial tourniquet above the bleeding point, if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Effective use of commercial tourniquets is optimal when first aid providers are trained in proper application techniques.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"ANZCOR does not say whether an untrained helper should use one anyway. The app can't decide this for you. The 111 call taker may help.\",\"line\":80}],\"ask\":{\"question\":\"What will you do?\",\"options\":[{\"label\":\"Use it\",\"to\":\"tq-apply\",\"line\":82,\"target\":\"tq-apply\"},{\"label\":\"Don't use it: other options\",\"to\":\"no-tq\",\"line\":83,\"target\":\"no-tq\"}],\"line\":81},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":76},{\"id\":\"improvise\",\"title\":\"Make a tourniquet\",\"lines\":[{\"kind\":\"say\",\"text\":\"A shop-made windlass tourniquet works better. In life-threatening bleeding, a home-made one is likely better than none.\",\"line\":86,\"quotes\":[{\"text\":\"Commercially manufactured windlass tourniquets such as those based on military designs are more effective than improvised tourniquets.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"in the context of life-threatening bleeding, an improvised tourniquet is likely to be better than no tourniquet.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Use a broad band: a triangular or elastic bandage, clothing, or a surfboard leg rope. Tighten it by twisting a rod or stick under the band.\",\"line\":89,\"quotes\":[{\"text\":\"Tourniquets, ideally of a similar broad width to commercial types, can be improvised using materials from a first aid kit (e.g. triangular bandage, elastic bandage) from clothing, a surfboard leg rope or other available similar items.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Improvised tourniquets should be tightened by twisting a rod or stick under the improvised tourniquet band\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"ANZCOR suggests tourniquets \\\"if trained in its use\\\"; it does not say whether that also applies to a home-made one.\",\"line\":92,\"quotes\":[{\"text\":\"if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"A thin stretchy blood-test tourniquet will not work. A home-made one that is not tight enough can increase bleeding.\",\"line\":94,\"quotes\":[{\"text\":\"is not suitable for use as an arterial tourniquet.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Improvised tourniquets which do not stop all circulation can increase bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"tq-apply\",\"line\":97,\"target\":\"tq-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":85,\"nexts\":[{\"to\":\"tq-apply\",\"line\":97,\"target\":\"tq-apply\"}]},{\"id\":\"tq-apply\",\"title\":\"Put the tourniquet on\",\"lines\":[{\"kind\":\"do\",\"text\":\"Follow the maker's instructions. No instructions: 5 cm above the bleeding point.\",\"line\":100,\"quotes\":[{\"text\":\"in accordance with the manufacturer's instructions (or 5 cm above the bleeding point if no instructions)\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"If you can, not over a joint, the wound, clothing or a wetsuit. Tighten until the bleeding stops, even if it hurts.\",\"line\":102,\"quotes\":[{\"text\":\"Ideally, a tourniquet should not be applied over a joint or wound\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Ideally the tourniquet is not applied over clothing nor wetsuits and is applied tightly, even if this causes local discomfort.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"tightened until the bleeding stops.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Tap the button the moment it is on. It records the clock time. Tell the paramedics that time.\",\"line\":106,\"quotes\":[{\"text\":\"The time of tourniquet application must be noted and communicated to emergency/paramedic personnel.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Tourniquet on\",\"line\":108}],\"ask\":{\"question\":\"Has the bleeding stopped?\",\"options\":[{\"label\":\"Yes, it has stopped\",\"to\":\"tq-on\",\"line\":110,\"target\":\"tq-on\"},{\"label\":\"Still bleeding\",\"to\":\"tq-more\",\"line\":111,\"target\":\"tq-more\"}],\"line\":109},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":99},{\"id\":\"tq-more\",\"title\":\"Still bleeding with a tourniquet\",\"lines\":[{\"kind\":\"do\",\"text\":\"Check where it is and how it is put on. Tighten it.\",\"line\":114,\"quotes\":[{\"text\":\"If a tourniquet does not stop the bleeding its position and application must be checked.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Still bleeding? Put on a second tourniquet if you have one, above the first if you can.\",\"line\":116,\"quotes\":[{\"text\":\"a second tourniquet (if available) should be applied to the limb, preferably above the first.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Second tourniquet on\",\"line\":118},{\"kind\":\"say\",\"text\":\"Still bleeding after that? ANZCOR: think about a haemostatic dressing as well.\",\"line\":119,\"quotes\":[{\"text\":\"consider using a haemostatic dressing in conjunction with the tourniquet.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Bleeding has stopped\",\"to\":\"tq-on\",\"line\":122,\"target\":\"tq-on\"},{\"label\":\"Still bleeding: haemostatic dressing\",\"to\":\"dressing\",\"line\":123,\"target\":\"dressing\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":124,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":125,\"target\":\"not-breathing\"}],\"line\":121},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":113},{\"id\":\"tq-on\",\"title\":\"Tourniquet on: leave it\",\"lines\":[{\"kind\":\"warning\",\"text\":\"Do not take it off. Do not cover it with a bandage or clothing.\",\"line\":128,\"quotes\":[{\"text\":\"the tourniquet should not be removed until the person receives specialist care.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"must not be covered up by any bandage or clothing.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"They need to get to hospital urgently. Tell the paramedics the clock time it went on (on the \\\"Tourniquet on\\\" button and in the Log).\",\"line\":131,\"quotes\":[{\"text\":\"Once applied, the person requires urgent transfer to hospital\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"The time of tourniquet application must be noted and communicated to emergency/paramedic personnel.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"No source says how to write the time down (on the tourniquet or the person).\",\"line\":134},{\"kind\":\"say\",\"text\":\"ANZCOR's 2025 update: some studies found possible harm after more than 2 hours, but its advice is unchanged. It gives first aiders no step for this.\",\"line\":135,\"quotes\":[{\"text\":\"this occurred after prolonged (>2 hours) application of arterial tourniquets.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Until the results of this review are available, ANZCOR Guideline 9.1.1 recommendations remain unchanged.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"A cut-off body part to save\",\"to\":\"part\",\"line\":139,\"target\":\"part\"},{\"label\":\"Wait for the ambulance\",\"to\":\"care\",\"line\":140,\"target\":\"care\"}],\"line\":138},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":127},{\"id\":\"no-tq\",\"title\":\"No tourniquet\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR: no tourniquet, or it did not work? A haemostatic dressing, if you are trained and have one.\",\"line\":143,\"quotes\":[{\"text\":\"from a limb when a tourniquet is not available or has failed to stop the bleeding, we suggest to apply a haemostatic dressing, if trained in its use and one is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Otherwise keep pressing hard until help arrives. No source gives another step.\",\"line\":145,\"quotes\":[{\"text\":\"Keep pressure on until help arrives or the bleeding stops.\",\"where\":\"Healthify\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"I have a haemostatic dressing\",\"to\":\"dressing\",\"line\":148,\"target\":\"dressing\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":149,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":150,\"target\":\"not-breathing\"}],\"line\":147},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":142},{\"id\":\"dressing\",\"title\":\"Haemostatic dressing\",\"lines\":[{\"kind\":\"say\",\"text\":\"ANZCOR only: a dressing with something in it that helps stop bleeding. Use it if you are trained and have one: where a tourniquet can't go, or when a tourniquet is not there or has not worked.\",\"line\":153,\"quotes\":[{\"text\":\"Haemostatic dressings are impregnated with agents that help stop bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"from a wound site not suitable for tourniquet, or from a limb when a tourniquet is not available or has failed to stop the bleeding\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Put it as close as you can to the bleeding point. Press it on with your hand, then bandage it in place.\",\"line\":156,\"quotes\":[{\"text\":\"Haemostatic dressings must be applied as close as possible to the bleeding point, held against the wound using local pressure (manually initially) then held in place with the application of a bandage (if available).\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"Haemostatic dressing used\",\"line\":158},{\"kind\":\"warning\",\"text\":\"Leave it on until hospital care.\",\"line\":159,\"quotes\":[{\"text\":\"Haemostatic dressings should be left on the bleeding point until definitive care is available.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"No dressing? Keep pressing hard. No source gives another step.\",\"line\":161}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Bleeding under control\",\"to\":\"care\",\"line\":163,\"target\":\"care\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":164,\"target\":\"care\"},{\"label\":\"Still bleeding from an arm or leg\",\"to\":\"tourniquet\",\"line\":165,\"target\":\"tourniquet\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":166,\"target\":\"not-breathing\"}],\"line\":162},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":152},{\"id\":\"embedded\",\"title\":\"Something stuck in the wound\",\"lines\":[{\"kind\":\"warning\",\"text\":\"Do not pull it out. It may be plugging the wound.\",\"line\":169,\"quotes\":[{\"text\":\"Do not remove the embedded object because it may be plugging the wound and restricting bleeding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If an object is stuck in the wound, don't remove it.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Put padding around it, on each side. Press on the padding, not on the object.\",\"line\":172,\"quotes\":[{\"text\":\"Apply padding around or on each side of the protruding object, with pressure over the padding.\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"apply pressure around the wound but don't put pressure on the object.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"St John differs: remove a small one near the surface (a nail or staple); leave a large one in. The app follows ANZCOR.\",\"line\":175,\"quotes\":[{\"text\":\"If it's small, like a nail or a staple, and near the surface of the skin, remove it.\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"If it's large, like a screwdriver or a knife, DO NOT remove it.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Pressing may not be enough. A tourniquet or haemostatic dressing may still be needed (ANZCOR).\",\"line\":178,\"quotes\":[{\"text\":\"It may still be necessary to use other measures including an arterial tourniquet or haemostatic dressings.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Still bleeding from an arm or leg\",\"to\":\"tourniquet\",\"line\":181,\"target\":\"tourniquet\"},{\"label\":\"Still bleeding from somewhere else\",\"to\":\"dressing\",\"line\":182,\"target\":\"dressing\"},{\"label\":\"Still bleeding, no dressing: keep pressing\",\"to\":\"care\",\"line\":183,\"target\":\"care\"},{\"label\":\"Bleeding under control\",\"to\":\"care\",\"line\":184,\"target\":\"care\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":185,\"target\":\"not-breathing\"}],\"line\":180},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":168},{\"id\":\"amputation\",\"title\":\"A body part cut off\",\"lines\":[{\"kind\":\"do\",\"text\":\"Call 111. Press a bulky pad or clean cloth firmly on the bleeding area.\",\"line\":188,\"quotes\":[{\"text\":\"call 111 immediately for an ambulance.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"Use a bulky pad or clean cloth and apply it firmly to the bleeding area\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"record\",\"text\":\"111 called\",\"line\":191},{\"kind\":\"say\",\"text\":\"ANZCOR: an arm or leg cut off above the wrist or ankle (even partly) is life-threatening bleeding.\",\"line\":192,\"quotes\":[{\"text\":\"amputated or partially amputated limb above wrist or ankle\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Raise the injured part? St John and Healthify: yes, if you can. ANZCOR: no evidence it helps; it may cause more pain or injury. The app follows ANZCOR: no raising step.\",\"line\":194,\"quotes\":[{\"text\":\"Keep the injured area raised (if you can).\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"raise the injured area if possible.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"There is no evidence that elevating a bleeding part will help control bleeding and there is the potential to cause more pain or injury.\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Now?\",\"options\":[{\"label\":\"Still bleeding from an arm or leg\",\"to\":\"tourniquet\",\"line\":199,\"target\":\"tourniquet\"},{\"label\":\"Bleeding controlled: save the part\",\"to\":\"part\",\"line\":200,\"target\":\"part\"},{\"label\":\"Not breathing normally\",\"to\":\"not-breathing\",\"line\":201,\"target\":\"not-breathing\"}],\"line\":198},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":187},{\"id\":\"part\",\"title\":\"Save the cut-off part\",\"lines\":[{\"kind\":\"do\",\"text\":\"Put the part in a plastic bag; keep it dry. Seal the bag. Put the bag in water with ice.\",\"line\":204,\"quotes\":[{\"text\":\"Put the body part in a sealed plastic bag – keep it dry.\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"Place the sealed plastic bag in a container of water and ice.\",\"where\":\"St John\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Healthify adds: leave a little air in the bag, and use cold water with several ice cubes. ANZCOR says nothing about the part.\",\"line\":207,\"quotes\":[{\"text\":\"seal the bag closed with a little air inside to protect it with a 'cushion' of air.\",\"where\":\"Healthify\",\"check\":\"exact\"},{\"text\":\"Place the bag in a bucket of cold water with several ice cubes in the water.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Make sure the part goes to hospital with the person.\",\"line\":210,\"quotes\":[{\"text\":\"Make sure the body part goes to the hospital with the person.\",\"where\":\"St John\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"care\",\"line\":212,\"target\":\"care\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":203,\"nexts\":[{\"to\":\"care\",\"line\":212,\"target\":\"care\"}]},{\"id\":\"care\",\"title\":\"While you wait for the ambulance\",\"lines\":[{\"kind\":\"do\",\"text\":\"Keep pressing until help arrives or the bleeding stops. No source gives a number of minutes.\",\"line\":215,\"quotes\":[{\"text\":\"Keep pressure on until help arrives or the bleeding stops.\",\"where\":\"Healthify\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Keep them lying down, still and warm. Reassure them.\",\"line\":217,\"quotes\":[{\"text\":\"Assist the person into a position of comfort, preferably lying down\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Advise the person to lie down and remain still\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Keep the person warm\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"Reassure the person\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Nothing to eat or drink, not even medicines.\",\"line\":222,\"quotes\":[{\"text\":\"Do not give any food or drink orally, including medications\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Check their breathing and how they are often. ANZCOR gives no time.\",\"line\":224,\"quotes\":[{\"text\":\"Monitor the vital signs at frequent intervals\",\"where\":\"ANZCOR\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Arm or leg: ANZCOR says keep it still. Raise it? St John says yes; ANZCOR says there is no evidence it helps and it may cause more pain or injury. The app follows ANZCOR.\",\"line\":226,\"quotes\":[{\"text\":\"Restrict movement by immobilising a bleeding limb\",\"where\":\"ANZCOR\",\"check\":\"exact\"},{\"text\":\"If the wound is on the person's arm or leg, raise it up (to reduce blood flow to the injured area).\",\"where\":\"St John\",\"check\":\"exact\"},{\"text\":\"There is no evidence that elevating a bleeding part will help control bleeding and there enteredAt) / s.timer.ms).toFixed(3));\n        }\n        if (kind === \"rem\") {\n          const r = S.reminders[el.dataset.remId];\n          if (!r) continue;\n          const left = r.dueAt - t;\n          el.textContent = left > 0 ? clock(left) : `${r.once ? \"NOW\" : \"DUE\"} \\xB7 ${clock(-left)} ago`;\n          el.parentElement.classList.toggle(\"due\", left <= 0);\n        }\n        if (kind === \"rec\") {\n          const r = S.records[el.dataset.recName];\n          if (r) el.textContent = `${r.n}\\xD7 \\xB7 last at ${tod(r.last)}, ${formatDuration(t - r.last)} ago`;\n        }\n      }\n    }\n    let audio = null;\n    const startAudio = () => {\n      audio ?? (audio = new (window.AudioContext || window.webkitAudioContext)());\n    };\n    const buzz = () => {\n      try {\n        navigator.vibrate?.([200, 100, 200]);\n      } catch {\n      }\n      try {\n        startAudio();\n        for (const at of [0, 0.3]) {\n          const o = audio.createOscillator(), g = audio.createGain();\n          o.frequency.value = 880;\n          g.gain.value = 0.2;\n          o.connect(g);\n          g.connect(audio.destination);\n          o.start(audio.currentTime + at);\n          o.stop(audio.currentTime + at + 0.18);\n        }\n      } catch {\n      }\n    };\n    const KEY = \"guideline-app:\" + slug(spec.title);\n    let lastSaved = \"\";\n    function save() {\n      try {\n        const j = JSON.stringify(S);\n        if (j !== lastSaved) {\n          localStorage.setItem(KEY, j);\n          lastSaved = j;\n        }\n      } catch {\n      }\n    }\n    function load() {\n      try {\n        const j = localStorage.getItem(KEY);\n        if (j) {\n          const old = JSON.parse(j);\n          if (old.screen === \"run\" && old.current && byId.has(old.current)) {\n            Object.assign(S, old, { tab: \"steps\", note: \"Carried on from where this was left (the page was reloaded).\" });\n          }\n        }\n      } catch {\n      }\n    }\n ion:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }html[data-look=\"wayfinding\"] .big.opt{ background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }html[data-look=\"wayfinding\"] .big.opt::after{ content:\"→\"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }html[data-look=\"wayfinding\"] .big.skip{ border:0; text-decoration:underline; }html[data-look=\"wayfinding\"] .link{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look=\"wayfinding\"] .q{ font-size:22px; font-weight:900; }html[data-look=\"wayfinding\"] .warn{ background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }html[data-look=\"wayfinding\"] .warn::before{ content:\"!\"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }html[data-look=\"wayfinding\"] .do{ position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }html[data-look=\"wayfinding\"] .do::before{ content:\"\"; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }html[data-look=\"wayfinding\"] .do input{ position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }html[data-look=\"wayfinding\"] .do .src, html[data-look=\"wayfinding\"] .do .dep{ margin-left:0; }html[data-look=\"wayfinding\"] details.src summary{ color:var(--ink); text-decoration:underline; }html[data-look=\"wayfinding\"] .timer{ background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }html[data-look=\"wayfinding\"] .timer .lbl{ color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }html[data-look=\"wayfinding\"] .timer::after{ content:\"\"; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg
