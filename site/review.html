d you\",\"lines\":[{\"kind\":\"say\",\"text\":\"Sex of caller; estimated age\",\"bullet\":true,\"line\":232,\"quotes\":[{\"text\":\"Sex of caller:\",\"where\":\"NZ Police card\",\"check\":\"exact\"},{\"text\":\"Estimated age:\",\"where\":\"NZ Police card\",\"check\":\"exact\"}]},{\"kind\":\"write\",\"text\":\"Sex and estimated age of caller\",\"line\":235},{\"kind\":\"say\",\"text\":\"The Australian checklist also asks nationality.\",\"line\":236,\"quotes\":[{\"text\":\"Nationality?\",\"where\":\"ANZCTC\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The number that was called (the date, time and length are on the \\\"call has ended\\\" screen)\",\"bullet\":true,\"line\":238,\"quotes\":[{\"text\":\"Number called:\",\"where\":\"NZ Police card\",\"check\":\"exact\"}]},{\"kind\":\"write\",\"text\":\"Number that was called\",\"line\":240},{\"kind\":\"say\",\"text\":\"Your name (print) and your phone number\",\"bullet\":true,\"line\":241,\"quotes\":[{\"text\":\"Name (print):\",\"where\":\"NZ Police card\",\"check\":\"exact\"},{\"text\":\"Telephone number:\",\"where\":\"NZ Police card\",\"check\":\"exact\"}]},{\"kind\":\"write\",\"text\":\"Your name and phone number\",\"line\":244},{\"kind\":\"say\",\"text\":\"The card also asks for your signature: sign the paper card if your workplace uses it.\",\"line\":245,\"quotes\":[{\"text\":\"Signature:\",\"where\":\"NZ Police card\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"decide\",\"line\":247,\"target\":\"decide\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":231,\"nexts\":[{\"to\":\"decide\",\"line\":247,\"target\":\"decide\"}]},{\"id\":\"decide\",\"title\":\"Search or evacuate? Not your call alone\",\"lines\":[{\"kind\":\"warning\",\"text\":\"The app does not decide. In New Zealand the employer decides whether to search or evacuate.\",\"line\":250,\"quotes\":[{\"text\":\"If a bomb threat is received, it is the responsibility of employers to decide whether a search or evacuation will be conducted.\",\"where\":\"NZ Police web\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The Australian guide: the incident or security manager decides, with Police if possible. It can be total or partial.\",\"line\":252,\"quotes\":[{\"text\":\"Planning and initiating evacuation should be the responsibility of the incident/security manager and, if possible, made in consultation with police and other emergency services.\",\"where\":\"ANZCTC\",\"check\":\"exact\"},{\"text\":\"The decision to initiate a total or partial evacuation may be determined by several factors\",\"where\":\"ANZCTC\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Things it says to weigh: the nature of the threat, the chance of panic, and the impact on the business of a total evacuation.\",\"line\":255,\"quotes\":[{\"text\":\"the nature of the threat\",\"where\":\"ANZCTC\",\"check\":\"exact\"},{\"text\":\"the potential to cause panic\",\"where\":\"ANZCTC\",\"check\":\"exact\"},{\"text\":\"potential business impacts from total evacuation\",\"where\":\"ANZCTC\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"It says to treat every threat as real until shown otherwise.\",\"line\":259,\"quotes\":[{\"text\":\"Generally speaking, all threats should be deemed credible until proven otherwise.\",\"where\":\"ANZCTC\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"It also lists four questions (is the threat non-specific? do you know the caller? has specific detail been given? is it credible?) and three responses (occupant inspection, supervisory inspection, support a Police search). How the answers lead to a response was in a chart that could not be read, so the app does not link them.\",\"line\":261,\"quotes\":[{\"text\":\"Is the threat non-specific?\",\"where\":\"ANZCTC\",\"check\":\"exact\"},{\"text\":\"Do you recognise the caller?\",\"where\":\"ANZCTC\",\"check\":\"exact\"},{\"text\":\"Has specific detail been provided?\",\"where\":\"ANZCTC\",\"check\":\"exact\"},{\"text\":\"Is the <script>
// Review page: switches the app preview between looks and saves one reaction per look plus any comments.
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const roundKey = D.round.replace(/[^a-z0-9]+/gi, '-');
const picked = {};          // look id -> reaction, as saved
let current = 0, db = null;

// Draws the look buttons and loads the chosen look into the preview.
function show(k) {
  current = k;
  const L = D.looks[k];
  $('picker').innerHTML = D.looks.map((l, i) => `<button data-k="${i}" aria-pressed="${i === k}">${'ABC'[i]} · ${l.name}${picked[l.id] ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('from').textContent = 'Borrowed from ' + L.from.charAt(0).toLowerCase() + L.from.slice(1);
  $('frame').srcdoc = L.html;
  $('ask').textContent = `How does ${L.name} feel?`;
  for (const b of $('react').children) b.setAttribute('aria-pressed', String(picked[L.id] === b.dataset.r));
}
const say = (t) => { $('status').textContent = t; };

$('picker').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); });

// One reaction per look; tapping another replaces it.
$('react').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = D.looks[current];
  picked[L.id] = b.dataset.r; show(current);
  if (!db) return say('Saved on this screen only: feedback storage is not available here.');
  try { await db.doc(`reactions/${roundKey}-${L.id}`).set({ round: D.round, look: L.id, reaction: b.dataset.r, at: Date.now() }); say(`Saved: ${b.textContent} for ${L.name}.`); }
  catch (err) { say('Could not save that. Check your connection and tap again.'); }
});

// Comments are kept as separate notes, tagged with the look on screen.
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('comment').value.trim(); if (!text) return;
  const L = D.looks[current];
  if (!db) return say('Comments can only be saved when this page is opened in Claude.');
  try { await db.collection('comments').add({ round: D.round, look: L.id, text: text.slice(0, 2000), at: Date.now() }); $('comment').value = ''; say(`Comment saved for ${L.name}. The next build reads it.`); }
  catch (err) { say('Could not save the comment. Check your connection and try again.'); }
});

$('round').textContent = D.round.split(' ')[0];
show(0);

// Connect to feedback storage, then mark the looks already reacted to in this round.
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection('reactions').where('round', '==', D.round).get();
    for (const d of snap.docs) { const v = d.data(); if (v?.look) picked[v.look] = v.reaction; }
    show(current);
  } catch { /* first visit or offline: nothing to mark */ }
})();
</script>
