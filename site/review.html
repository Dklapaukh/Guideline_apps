op:1px solid var(--line); }html[data-look=\"flightdeck\"] .tabs button{ text-transform:uppercase; letter-spacing:.08em; font-size:13px; }html[data-look=\"flightdeck\"] .tabs button.on{ color:var(--go); box-shadow:inset 0 3px 0 var(--go); }\n</style></head>\n<body><div id=\"app\"></div>\n<script type=\"application/json\" id=\"spec\">{\"spec\":{\"title\":\"More time for an assessment (AUT)\",\"about\":\"Helps you work out whether to ask for a 3-day short extension or apply for special consideration at AUT, when to apply, what evidence you need and by when, and where to get help.\",\"sources\":[{\"name\":\"Auckland University of Technology (AUT), Special consideration for an assessment\",\"link\":\"https://www.aut.ac.nz/student-life/studying/study-help/assessments-and-exams/special-consideration\"}],\"warning\":\"This is AUT's guidance, for AUT students. If you study somewhere else, follow your own university's rules.\",\"audience\":\"AUT students who need more time for an assignment, or whose test or exam has been affected by something serious\",\"reviewedBy\":\"\",\"version\":\"AUT \\\"Special consideration for an assessment\\\" web page, no date or review date shown, read 19 Nov 2026\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"What do you need?\",\"lines\":[{\"kind\":\"say\",\"text\":\"If something serious and outside your control affects an assessment, you can apply for special consideration. You could also ask for a short extension of up to 3 days.\",\"line\":13,\"quotes\":[{\"text\":\"your ability to attempt or prepare for an assessment may be seriously affected by exceptional circumstances beyond your control.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If this happens, you can apply for special consideration for that assessment.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You could also apply for a short extension of up to 3 days\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you need?\",\"options\":[{\"label\":\"Just a couple of extra days\",\"to\":\"short-check\",\"line\":18,\"target\":\"short-check\"},{\"label\":\"Something serious is affecting me\",\"to\":\"reason\",\"line\":19,\"target\":\"reason\"},{\"label\":\"My due date (or test or exam) has already passed\",\"to\":\"past-due\",\"line\":20,\"target\":\"past-due\"},{\"label\":\"I've applied. What happens next?\",\"to\":\"next-steps\",\"line\":21,\"target\":\"next-steps\"}],\"line\":17},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":12},{\"id\":\"short-check\",\"title\":\"Can you get a short extension?\",\"lines\":[{\"kind\":\"say\",\"text\":\"A short extension gives you 3 calendar days. You don't need any evidence.\",\"line\":24,\"quotes\":[{\"text\":\"The short extension is for 3 calendar days\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You don't need to provide evidence for a short extension.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"You can get one only if all three of these are true:\",\"line\":27},{\"kind\":\"say\",\"text\":\"1. It's an assignment, not a test or exam. Nothing done under controlled conditions can have a short extension.\",\"line\":28,\"quotes\":[{\"text\":\"You can't apply for short extensions for tests and exams; any assessment conducted under controlled conditions is not eligible for a short extension\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"2. You haven't had a short extension in this course yet. You get one per course.\",\"line\":30,\"quotes\":[{\"text\":\"You can only have one short extension per course.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"3. You apply by midnight the day BEFORE it's due. For example, if it's due at 4pm on Monday, apply before midnight on Sunday.\",\"line\":32,\"quotes\":[{\"text\":\"You must apply by midnight the day BEFORE your assessment is due\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"For example, if an assessment is due at 4pm on Monday 20 May, in order to be eligible for a short extension, you must apply BEFORE midnight on Sunday 19 May.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Are all three true for you?\",\"options\":[{\"label\":\"Yes, all three\",\"to\":\"short-apply\",\"line\":36,\"target\":\"short-apply\"},{\"label\":\"No, at least one isn't\",\"to\":\"short-no\",\"line\":37,\"target\":\"short-no\"}],\"line\":35},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":23},{\"id\":\"short-apply\",\"title\":\"Apply for your short extension\",\"lines\":[{\"kind\":\"do\",\"text\":\"Open AUT's Special Consideration Application (SCA) tool. The link is on AUT's \\\"Special consideration for an assessment\\\" page.\",\"line\":40,\"quotes\":[{\"text\":\"You must apply using the Special Consideration Application tool\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"The first time, Microsoft asks you to approve access. Click 'accept' and carry on.\",\"line\":42,\"quotes\":[{\"text\":\"When you're accessing the tool for the first time, you'll be asked by Microsoft to approve access to the new software.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Make sure you click on ‘accept’ and proceed.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"On the second screen, choose 'short extension'.\",\"line\":45,\"quotes\":[{\"text\":\"select ‘short extension’ on the second screen\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Need more than 3 days because of something serious? Then you need a standard extension, with evidence.\",\"line\":47,\"quotes\":[{\"text\":\"If you need more time than 3 days because of valid exceptional circumstances, you need to apply for the standard extension and provide evidence\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The page doesn't say how you'll hear that your short extension is confirmed, or what your new due time is. If you're unsure, contact the Student Hub: studenthub@aut.ac.nz or 0800 288 864.\",\"line\":49,\"quotes\":[{\"text\":\"Email: studenthub@aut.ac.nz\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Phone: 0800 288 864\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Is that everything?\",\"options\":[{\"label\":\"Yes, I've applied\",\"to\":\"end\",\"line\":53,\"target\":\"__end\"},{\"label\":\"I need more than 3 days\",\"to\":\"reason\",\"line\":54,\"target\":\"reason\"}],\"line\":52},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":39},{\"id\":\"short-no\",\"title\":\"A short extension isn't possible\",\"lines\":[{\"kind\":\"say\",\"text\":\"If something serious is affecting you, you can apply for special consideration instead. You'll need to provide evidence.\",\"line\":57,\"quotes\":[{\"text\":\"If this happens, you can apply for special consideration for that assessment.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If you need more time than 3 days because of valid exceptional circumstances, you need to apply for the standard extension and provide evidence\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If you need further extensions for the same course, you'll then need to provide evidence of exceptional circumstances.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Missed the short-extension deadline? You can still apply for special consideration, up to 5 working days after the due date.\",\"line\":61,\"quotes\":[{\"text\":\"You can submit an SCA up to 5 working days after your assessment due date.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The page offers nothing else if you simply need more time. If you're unsure, contact the Student Hub: studenthub@aut.ac.nz or 0800 288 864.\",\"line\":63,\"quotes\":[{\"text\":\"Email: studenthub@aut.ac.nz\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Phone: 0800 288 864\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Is something serious affecting you?\",\"options\":[{\"label\":\"Yes\",\"to\":\"reason\",\"line\":67,\"target\":\"reason\"},{\"label\":\"No\",\"to\":\"end\",\"line\":68,\"target\":\"__end\"}],\"line\":66},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":56},{\"id\":\"reason\",\"title\":\"What's affecting you?\",\"lines\":[{\"kind\":\"say\",\"text\":\"Special consideration is for when something serious, beyond your control, affects an assessment. Pick the closest match.\",\"line\":71,\"quotes\":[{\"text\":\"seriously affected by exceptional circumstances beyond your control\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What's affecting you?\",\"options\":[{\"label\":\"A medical reason (illness, injury, COVID-19)\",\"to\":\"report-medical\",\"line\":74,\"target\":\"report-medical\"},{\"label\":\"My emotional or mental wellbeing\",\"to\":\"report-mental\",\"line\":75,\"target\":\"report-mental\"},{\"label\":\"Bereavement, being a victim of crime, or something else\",\"to\":\"other-reason\",\"line\":76,\"target\":\"other-reason\"},{\"label\":\"A sporting, cultural, religious or AUT commitment\",\"to\":\"commitment\",\"line\":77,\"target\":\"commitment\"},{\"label\":\"Computer or printer trouble, lost work, or I misread the date\",\"to\":\"not-eligible\",\"line\":78,\"target\":\"not-eligible\"}],\"line\":73},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":70},{\"id\":\"report-medical\",\"title\":\"You need a Student Impairment Report\",\"lines\":[{\"kind\":\"say\",\"text\":\"For a medical reason, send a Student Impairment Report with your application. A suitably qualified person fills it in.\",\"line\":81,\"quotes\":[{\"text\":\"you need to provide a completed Student Impairment Report to accompany your Special Consideration Application form.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"The Student Impairment Report must be completed by a suitably qualified person.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"COVID-19 counts: if you're unwell or isolating, have ongoing effects, or your whānau or household has been seriously affected. Choose the 'Medical' reason.\",\"line\":84,\"quotes\":[{\"text\":\"You can apply for a special consideration for assessment if you have COVID-19 and are unwell or you’re needing to isolate.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You can also apply if you're suffering from ongoing health effects due to COVID-19 or your whānau or household has been seriously affected by COVID-19.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Use the ‘Medical’ reason for application.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If you couldn't see anyone in time through no fault of your own, that can be taken into account.\",\"line\":88,\"quotes\":[{\"text\":\"though delays in accessing medical care through no fault of your own can be taken into account\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Who will fill in your report?\",\"options\":[{\"label\":\"A nurse at the AUT Student Medical Centre\",\"to\":\"med-nurse\",\"line\":91,\"target\":\"med-nurse\"},{\"label\":\"My own doctor or practitioner outside AUT\",\"to\":\"sir-external\",\"line\":92,\"target\":\"sir-external\"}],\"line\":90},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":80},{\"id\":\"med-nurse\",\"title\":\"Student Medical Centre\",\"lines\":[{\"kind\":\"do\",\"text\":\"Ask the registered nurses at the AUT Student Medical Centre to fill in your Student Impairment Report.\",\"line\":95,\"quotes\":[{\"text\":\"registered nurses at the AUT Student Medical Centre can complete the Student Impairment Report for your Special Consideration Application.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"when-apply\",\"line\":97,\"target\":\"when-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":94,\"nexts\":[{\"to\":\"when-apply\",\"line\":97,\"target\":\"when-apply\"}]},{\"id\":\"report-mental\",\"title\":\"You need a Student Impairment Report\",\"lines\":[{\"kind\":\"say\",\"text\":\"If you need support urgently or on an ongoing basis, AUT's Student Counselling and Mental Health services take appointments.\",\"line\":100,\"quotes\":[{\"text\":\"Student Counselling and Mental Health services are also available for appointments if you have urgent or ongoing needs for counselling and/or mental health support.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"For an emotional or mental wellbeing reason, send a Student Impairment Report with your application. A suitably qualified person fills it in.\",\"line\":102,\"quotes\":[{\"text\":\"you need to provide a completed Student Impairment Report to accompany your Special Consideration Application form.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"The Student Impairment Report must be completed by a suitably qualified person.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Who will fill in your report?\",\"options\":[{\"label\":\"A qualified advisor at the Student Hub\",\"to\":\"mental-hub\",\"line\":106,\"target\":\"mental-hub\"},{\"label\":\"My own practitioner outside AUT\",\"to\":\"sir-external\",\"line\":107,\"target\":\"sir-external\"}],\"line\":105},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":99},{\"id\":\"mental-hub\",\"title\":\"Book a Student Hub advisor\",\"lines\":[{\"kind\":\"say\",\"text\":\"A qualified advisor at your closest Student Hub can assess you for the report. To book:\",\"line\":110,\"quotes\":[{\"text\":\"For emotional/mental wellbeing impairments, a qualified advisor at the Student Hub can assess you for a Student Impairment Report.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Log in to My AUT.\",\"line\":112,\"quotes\":[{\"text\": "application/json\" id=\"spec\">{\"spec\":{\"title\":\"More time for an assessment (AUT)\",\"about\":\"Helps you work out whether to ask for a 3-day short extension or apply for special consideration at AUT, when to apply, what evidence you need and by when, and where to get help.\",\"sources\":[{\"name\":\"Auckland University of Technology (AUT), Special consideration for an assessment\",\"link\":\"https://www.aut.ac.nz/student-life/studying/study-help/assessments-and-exams/special-consideration\"}],\"warning\":\"This is AUT's guidance, for AUT students. If you study somewhere else, follow your own university's rules.\",\"audience\":\"AUT students who need more time for an assignment, or whose test or exam has been affected by something serious\",\"reviewedBy\":\"\",\"version\":\"AUT \\\"Special consideration for an assessment\\\" web page, no date or review date shown, read 19 Nov 2026\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"What do you need?\",\"lines\":[{\"kind\":\"say\",\"text\":\"If something serious and outside your control affects an assessment, you can apply for special consideration. You could also ask for a short extension of up to 3 days.\",\"line\":13,\"quotes\":[{\"text\":\"your ability to attempt or prepare for an assessment may be seriously affected by exceptional circumstances beyond your control.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If this happens, you can apply for special consideration for that assessment.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You could also apply for a short extension of up to 3 days\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you need?\",\"options\":[{\"label\":\"Just a couple of extra days\",\"to\":\"short-check\",\"line\":18,\"target\":\"short-check\"},{\"label\":\"Something serious is affecting me\",\"to\":\"reason\",\"line\":19,\"target\":\"reason\"},{\"label\":\"My due date (or test or exam) has already passed\",\"to\":\"past-due\",\"line\":20,\"target\":\"past-due\"},{\"label\":\"I've applied. What happens next?\",\"to\":\"next-steps\",\"line\":21,\"target\":\"next-steps\"}],\"line\":17},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":12},{\"id\":\"short-check\",\"title\":\"Can you get a short extension?\",\"lines\":[{\"kind\":\"say\",\"text\":\"A short extension gives you 3 calendar days. You don't need any evidence.\",\"line\":24,\"quotes\":[{\"text\":\"The short extension is for 3 calendar days\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You don't need to provide evidence for a short extension.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"You can get one only if all three of these are true:\",\"line\":27},{\"kind\":\"say\",\"text\":\"1. It's an assignment, not a test or exam. Nothing done under controlled conditions can have a short extension.\",\"line\":28,\"quotes\":[{\"text\":\"You can't apply for short extensions for tests and exams; any assessment conducted under controlled conditions is not eligible for a short extension\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"2. You haven't had a short extension in this course yet. You get one per course.\",\"line\":30,\"quotes\":[{\"text\":\"You can only have one short extension per course.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"3. You apply by midnight the day BEFORE it's due. For example, if it's due at 4pm on Monday, apply before midnight on Sunday.\",\"line\":32,\"quotes\":[{\"text\":\"You must apply by midnight the day BEFORE your assessment is due\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"For example, if an assessment is due at 4pm on Monday 20 May, in order to be eligible for a short extension, you must apply BEFORE midnight on Sunday 19 May.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Are all three true for you?\",\"options\":[{\"label\":\"Y "name\":\"Auckland University of Technology (AUT), Special consideration for an assessment\",\"link\":\"https://www.aut.ac.nz/student-life/studying/study-help/assessments-and-exams/special-consideration\"}],\"warning\":\"This is AUT's guidance, for AUT students. If you study somewhere else, follow your own university's rules.\",\"audience\":\"AUT students who need more time for an assignment, or whose test or exam has been affected by something serious\",\"reviewedBy\":\"\",\"version\":\"AUT \\\"Special consideration for an assessment\\\" web page, no date or review date shown, read 19 Nov 2026\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"What do you need?\",\"lines\":[{\"kind\":\"say\",\"text\":\"If something serious and outside your control affects an assessment, you can apply for special consideration. You could also ask for a short extension of up to 3 days.\",\"line\":13,\"quotes\":[{\"text\":\"your ability to attempt or prepare for an assessment may be seriously affected by exceptional circumstances beyond your control.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If this happens, you can apply for special consideration for that assessment.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You could also apply for a short extension of up to 3 days\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What do you need?\",\"options\":[{\"label\":\"Just a couple of extra days\",\"to\":\"short-check\",\"line\":18,\"target\":\"short-check\"},{\"label\":\"Something serious is affecting me\",\"to\":\"reason\",\"line\":19,\"target\":\"reason\"},{\"label\":\"My due date (or test or exam) has already passed\",\"to\":\"past-due\",\"line\":20,\"target\":\"past-due\"},{\"label\":\"I've applied. What happens next?\",\"to\":\"next-steps\",\"line\":21,\"target\":\"next-steps\"}],\"line\":17},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":12},{\"id\":\"short-check\",\"title\":\"Can you get a short extension?\",\"lines\":[{\"kind\":\"say\",\"text\":\"A short extension gives you 3 calendar days. You don't need any evidence.\",\"line\":24,\"quotes\":[{\"text\":\"The short extension is for 3 calendar days\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You don't need to provide evidence for a short extension.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"You can get one only if all three of these are true:\",\"line\":27},{\"kind\":\"say\",\"text\":\"1. It's an assignment, not a test or exam. Nothing done under controlled conditions can have a short extension.\",\"line\":28,\"quotes\":[{\"text\":\"You can't apply for short extensions for tests and exams; any assessment conducted under controlled conditions is not eligible for a short extension\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"2. You haven't had a short extension in this course yet. You get one per course.\",\"line\":30,\"quotes\":[{\"text\":\"You can only have one short extension per course.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"3. You apply by midnight the day BEFORE it's due. For example, if it's due at 4pm on Monday, apply before midnight on Sunday.\",\"line\":32,\"quotes\":[{\"text\":\"You must apply by midnight the day BEFORE your assessment is due\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"For example, if an assessment is due at 4pm on Monday 20 May, in order to be eligible for a short extension, you must apply BEFORE midnight on Sunday 19 May.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Are all three true for you?\",\"options\":[{\"label\":\"Yes, all three\",\"to\":\"short-apply\",\"line\":36,\"target\":\"short-apply\"},{\"label\":\"No, at least one isn't\",\"to\":\"short-no\",\"line\":37,\"target\":\"short-no\"}],\"line\":35},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":23},{\"id\":\"short-apply\",\"title\":\"Apply for your short extension\",\"lines\":[{\"kind\":\"do\",\"text\":\"Open AUT's Special Consideration Application (SCA) tool. The link is on AUT's \\\"Special consideration for an assessment\\\" page.\",\"line\":40,\"quotes\":[{\"text\":\"You must apply using the Special Consideration Application tool\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"The first time, Microsoft asks you to approve access. Click 'accept' and carry on.\",\"line\":42,\"quotes\":[{\"text\":\"When you're accessing the tool for the first time, you'll be asked by Microsoft to approve access to the new software.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Make sure you click on ‘accept’ and proceed.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"On the second screen, choose 'short extension'.\",\"line\":45,\"quotes\":[{\"text\":\"select ‘short extension’ on the second screen\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Need more than 3 days because of something serious? Then you need a standard extension, with evidence.\",\"line\":47,\"quotes\":[{\"text\":\"If you need more time than 3 days because of valid exceptional circumstances, you need to apply for the standard extension and provide evidence\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The page doesn't say how you'll hear that your short extension is confirmed, or what your new due time is. If you're unsure, contact the Student Hub: studenthub@aut.ac.nz or 0800 288 864.\",\"line\":49,\"quotes\":[{\"text\":\"Email: studenthub@aut.ac.nz\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Phone: 0800 288 864\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Is that everything?\",\"options\":[{\"label\":\"Yes, I've applied\",\"to\":\"end\",\"line\":53,\"target\":\"__end\"},{\"label\":\"I need more than 3 days\",\"to\":\"reason\",\"line\":54,\"target\":\"reason\"}],\"line\":52},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":39},{\"id\":\"short-no\",\"title\":\"A short extension isn't possible\",\"lines\":[{\"kind\":\"say\",\"text\":\"If something serious is affecting you, you can apply for special consideration instead. You'll need to provide evidence.\",\"line\":57,\"quotes\":[{\"text\":\"If this happens, you can apply for special consideration for that assessment.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If you need more time than 3 days because of valid exceptional circumstances, you need to apply for the standard extension and provide evidence\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If you need further extensions for the same course, you'll then need to provide evidence of exceptional circumstances.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Missed the short-extension deadline? You can still apply for special consideration, up to 5 working days after the due date.\",\"line\":61,\"quotes\":[{\"text\":\"You can submit an SCA up to 5 working days after your assessment due date.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The page offers nothing else if you simply need more time. If you're unsure, contact the Student Hub: studenthub@aut.ac.nz or 0800 288 864.\",\"line\":63,\"quotes\":[{\"text\":\"Email: studenthub@aut.ac.nz\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Phone: 0800 288 864\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Is something serious affecting you?\",\"options\":[{\"label\":\"Yes\",\"to\":\"reason\",\"line\":67,\"target\":\"reason\"},{\"label\":\"No\",\"to\":\"end\",\"line\":68,\"target\":\"__end\"}],\"line\":66},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":56},{\"id\":\"reason\",\"title\":\"What's affecting you?\",\"lines\":[{\"kind\":\"say\",\"text\":\"Special consideration is for when something serious, beyond your control, affects an assessment. Pick the closest match.\",\"line\":71,\"quotes\":[{\"text\":\"seriously affected by exceptional circumstances beyond your control\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"What's affecting you?\",\"options\":[{\"label\":\"A medical reason (illness, injury, COVID-19)\",\"to\":\"report-medical\",\"line\":74,\"target\":\"report-medical\"},{\"label\":\"My emotional or mental wellbeing\",\"to\":\"report-mental\",\"line\":75,\"target\":\"report-mental\"},{\"label\":\"Bereavement, being a victim of crime, or something else\",\"to\":\"other-reason\",\"line\":76,\"target\":\"other-reason\"},{\"label\":\"A sporting, cultural, religious or AUT commitment\",\"to\":\"commitment\",\"line\":77,\"target\":\"commitment\"},{\"label\":\"Computer or printer trouble, lost work, or I misread the date\",\"to\":\"not-eligible\",\"line\":78,\"target\":\"not-eligible\"}],\"line\":73},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":70},{\"id\":\"report-medical\",\"title\":\"You need a Student Impairment Report\",\"lines\":[{\"kind\":\"say\",\"text\":\"For a medical reason, send a Student Impairment Report with your application. A suitably qualified person fills it in.\",\"line\":81,\"quotes\":[{\"text\":\"you need to provide a completed Student Impairment Report to accompany your Special Consideration Application form.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"The Student Impairment Report must be completed by a suitably qualified person.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"COVID-19 counts: if you're unwell or isolating, have ongoing effects, or your whānau or household has been seriously affected. Choose the 'Medical' reason.\",\"line\":84,\"quotes\":[{\"text\":\"You can apply for a special consideration for assessment if you have COVID-19 and are unwell or you’re needing to isolate.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"You can also apply if you're suffering from ongoing health effects due to COVID-19 or your whānau or household has been seriously affected by COVID-19.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Use the ‘Medical’ reason for application.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If you couldn't see anyone in time through no fault of your own, that can be taken into account.\",\"line\":88,\"quotes\":[{\"text\":\"though delays in accessing medical care through no fault of your own can be taken into account\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Who will fill in your report?\",\"options\":[{\"label\":\"A nurse at the AUT Student Medical Centre\",\"to\":\"med-nurse\",\"line\":91,\"target\":\"med-nurse\"},{\"label\":\"My own doctor or practitioner outside AUT\",\"to\":\"sir-external\",\"line\":92,\"target\":\"sir-external\"}],\"line\":90},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":80},{\"id\":\"med-nurse\",\"title\":\"Student Medical Centre\",\"lines\":[{\"kind\":\"do\",\"text\":\"Ask the registered nurses at the AUT Student Medical Centre to fill in your Student Impairment Report.\",\"line\":95,\"quotes\":[{\"text\":\"registered nurses at the AUT Student Medical Centre can complete the Student Impairment Report for your Special Consideration Application.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"when-apply\",\"line\":97,\"target\":\"when-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":94,\"nexts\":[{\"to\":\"when-apply\",\"line\":97,\"target\":\"when-apply\"}]},{\"id\":\"report-mental\",\"title\":\"You need a Student Impairment Report\",\"lines\":[{\"kind\":\"say\",\"text\":\"If you need support urgently or on an ongoing basis, AUT's Student Counselling and Mental Health services take appointments.\",\"line\":100,\"quotes\":[{\"text\":\"Student Counselling and Mental Health services are also available for appointments if you have urgent or ongoing needs for counselling and/or mental health support.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"For an emotional or mental wellbeing reason, send a Student Impairment Report with your application. A suitably qualified person fills it in.\",\"line\":102,\"quotes\":[{\"text\":\"you need to provide a completed Student Impairment Report to accompany your Special Consideration Application form.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"The Student Impairment Report must be completed by a suitably qualified person.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Who will fill in your report?\",\"options\":[{\"label\":\"A qualified advisor at the Student Hub\",\"to\":\"mental-hub\",\"line\":106,\"target\":\"mental-hub\"},{\"label\":\"My own practitioner outside AUT\",\"to\":\"sir-external\",\"line\":107,\"target\":\"sir-external\"}],\"line\":105},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":99},{\"id\":\"mental-hub\",\"title\":\"Book a Student Hub advisor\",\"lines\":[{\"kind\":\"say\",\"text\":\"A qualified advisor at your closest Student Hub can assess you for the report. To book:\",\"line\":110,\"quotes\":[{\"text\":\"For emotional/mental wellbeing impairments, a qualified advisor at the Student Hub can assess you for a Student Impairment Report.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Log in to My AUT.\",\"line\":112,\"quotes\":[{\"text\":\"Visit My AUT and log in\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Click 'Make a booking'.\",\"line\":114,\"quotes\":[{\"text\":\"Click on 'Make a booking'\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Choose 'Book a Student Hub appointment'.\",\"line\":116,\"quotes\":[{\"text\":\"Select 'Book a Student Hub appointment'\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Click the 'Special Consideration Application' button.\",\"line\":118,\"quotes\":[{\"text\":\"Click on the 'Special Consideration Application' button\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"when-apply\",\"line\":120,\"target\":\"when-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":109,\"nexts\":[{\"to\":\"when-apply\",\"line\":120,\"target\":\"when-apply\"}]},{\"id\":\"sir-external\",\"title\":\"Your own practitioner\",\"lines\":[{\"kind\":\"do\",\"text\":\"Download the Student Impairment Report so your practitioner can fill it in. The form is linked from AUT's \\\"Special consideration for an assessment\\\" page.\",\"line\":123,\"quotes\":[{\"text\":\"If you're seeing an external practitioner, you should download the Student Impairment Report so they can complete it for submission.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"when-apply\",\"line\":125,\"target\":\"when-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":122,\"nexts\":[{\"to\":\"when-apply\",\"line\":125,\"target\":\"when-apply\"}]},{\"id\":\"other-reason\",\"title\":\"What to send\",\"lines\":[{\"kind\":\"say\",\"text\":\"Bereavement, being a victim of crime, and other circumstances can all count.\",\"line\":128,\"quotes\":[{\"text\":\"Bereavement\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Being a victim of crime\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Other circumstances\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"What you need to send depends on your situation. The application form explains it.\",\"line\":132,\"quotes\":[{\"text\":\"The specific requirements for your application will depend on the situation and are explained in the Special Consideration Application (SCA) form.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":null,\"next\":{\"to\":\"when-apply\",\"line\":134,\"target\":\"when-apply\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":127,\"nexts\":[{\"to\":\"when-apply\",\"line\":134,\"target\":\"when-apply\"}]},{\"id\":\"commitment\",\"title\":\"A planned commitmen <script>
// Review page: switches the app preview between looks and saves one reaction per look plus any comments.
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const roundKey = D.round.replace(/[^a-z0-9]+/gi, '-');
const picked = {};          // look id -> reaction, as saved
let current = 0, db = null;

// Draws the look buttons and loads the chosen look into the preview.
function show(k) {
  current = k;
  const L = D.looks[k];
  $('picker').innerHTML = D.looks.map((l, i) => `<button data-k="${i}" aria-pressed="${i === k}">${'ABC'[i]} · ${l.name}${picked[l.id] ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('from').textContent = 'Borrowed from ' + L.from.charAt(0).toLowerCase() + L.from.slice(1);
  $('frame').srcdoc = L.html;
  $('ask').textContent = `How does ${L.name} feel?`;
  for (const b of $('react').children) b.setAttribute('aria-pressed', String(picked[L.id] === b.dataset.r));
}
const say = (t) => { $('status').textContent = t; };

$('picker').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); });

// One reaction per look; tapping another replaces it.
$('react').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = D.looks[current];
  picked[L.id] = b.dataset.r; show(current);
  if (!db) return say('Saved on this screen only: feedback storage is not available here.');
  try { await db.doc(`reactions/${roundKey}-${L.id}`).set({ round: D.round, look: L.id, reaction: b.dataset.r, at: Date.now() }); say(`Saved: ${b.textContent} for ${L.name}.`); }
  catch (err) { say('Could not save that. Check your connection and tap again.'); }
});

// Comments are kept as separate notes, tagged with the look on screen.
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('comment').value.trim(); if (!text) return;
  const L = D.looks[current];
  if (!db) return say('Comments can only be saved when this page is opened in Claude.');
  try { await db.collection('comments').add({ round: D.round, look: L.id, text: text.slice(0, 2000), at: Date.now() }); $('comment').value = ''; say(`Comment saved for ${L.name}. The next build reads it.`); }
  catch (err) { say('Could not save the comment. Check your connection and try again.'); }
});

$('round').textContent = D.round.split(' ')[0];
show(0);

// Connect to feedback storage, then mark the looks already reacted to in this round.
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection('reactions').where('round', '==', D.round).get();
    for (const d of snap.docs) { const v = d.data(); if (v?.look) picked[v.look] = v.reaction; }
    show(current);
  } catch { /* first visit or offline: nothing to mark */ }
})();
</script>
