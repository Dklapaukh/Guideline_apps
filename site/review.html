:\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Where are you?\",\"options\":[{\"label\":\"Inside a building\",\"to\":\"indoors\",\"line\":21,\"target\":\"indoors\"},{\"label\":\"In bed\",\"to\":\"in-bed\",\"line\":22,\"target\":\"in-bed\"},{\"label\":\"I have a mobility problem, or use a cane, walker or wheelchair\",\"to\":\"mobility\",\"line\":23,\"target\":\"mobility\"},{\"label\":\"Outside\",\"to\":\"outside\",\"line\":24,\"target\":\"outside\"},{\"label\":\"Driving\",\"to\":\"driving\",\"line\":25,\"target\":\"driving\"},{\"label\":\"In a lift\",\"to\":\"lift\",\"line\":26,\"target\":\"lift\"},{\"label\":\"Somewhere else\",\"to\":\"elsewhere\",\"line\":27,\"target\":\"elsewhere\"}],\"line\":20},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":13},{\"id\":\"mobility\",\"title\":\"Your version of Drop, Cover and Hold\",\"lines\":[{\"kind\":\"say\",\"text\":\"Use the version that works for your body.\",\"line\":30,\"quotes\":[{\"text\":\"The best version of Drop, Cover, Hold is the one that works for your body and that you have practiced.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Which is closest to you?\",\"options\":[{\"label\":\"I have a mobility impairment or use a cane\",\"to\":\"cane\",\"line\":33,\"target\":\"cane\"},{\"label\":\"I can't get up from the floor without help\",\"to\":\"cane\",\"line\":34,\"target\":\"cane\"},{\"label\":\"I use a walker or wheelchair\",\"to\":\"wheelchair\",\"line\":35,\"target\":\"wheelchair\"}],\"line\":32},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":29},{\"id\":\"indoors\",\"title\":\"Inside: Drop, Cover and Hold\",\"lines\":[{\"kind\":\"warning\",\"text\":\"If you can't get up from the floor without help, don't drop to the ground.\",\"line\":38,\"quotes\":[{\"text\":\"If you can’t get up from the floor without help, don’t drop to the ground in an earthquake.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Drop down on your hands and knees, or as low as you can.\",\"line\":40,\"quotes\":[{\"text\":\"Drop down on your hands and knees or as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If you can't drop to the floor, brace yourself against a wall or sturdy furniture.\",\"line\":42,\"quotes\":[{\"text\":\"Brace yourself against a wall or sturdy furniture if you cannot drop to the floor.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck under a sturdy table or desk, if one is a few steps away.\",\"line\":44,\"quotes\":[{\"text\":\"COVER your head and neck (or your entire body if possible) under a sturdy table or desk (if it is within a few steps of you).\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"No shelter nearby? Cover your head and neck with your arms and hands.\",\"line\":46,\"quotes\":[{\"text\":\"If there is no shelter nearby, cover your head and neck with your arms and hands.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on to your shelter, or your position, until the shaking stops.\",\"line\":48,\"quotes\":[{\"text\":\"HOLD on to your shelter (or your position to protect your head and neck) until the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Under a table, hold on to the table legs. If the shaking moves your shelter, move with it.\",\"line\":50,\"quotes\":[{\"text\":\"Hold on to the table legs to keep it from moving away from you.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If the shaking shifts your shelter around, move with it.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Keep away from windows and tall furniture. Not in a doorway.\",\"line\":53,\"quotes\":[{\"text\":\"Away from windows that can shatter and cause injury.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"And away from tall furniture that can fall on you.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Not in a doorway.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"In most homes a doorway is no stronger than the rest of the house, and a swinging door can cause more injury.\",\"line\":57,\"quotes\":[{\"text\":\"In most homes, doorways are not stronger than any other part of a house and a swinging door can cause more injury.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"The table, no-shelter, hold and move-with-it lines are only on the Sign Language page (Section B). The windows, tall furniture and doorway lines come from its \\\"Get ready\\\" list of safe spaces.\",\"line\":59}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":60,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":37,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":60,\"target\":\"shaking-stops\"}]},{\"id\":\"in-bed\",\"title\":\"In bed: stay in bed\",\"lines\":[{\"kind\":\"do\",\"text\":\"Stay in bed. Pull the sheets and blankets over you.\",\"line\":63,\"quotes\":[{\"text\":\"If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Use your pillow to protect your head and neck.\",\"line\":65,\"quotes\":[{\"text\":\"If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B).\",\"line\":67}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":68,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":62,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":68,\"target\":\"shaking-stops\"}]},{\"id\":\"cane\",\"title\":\"Using a cane, or can't get up from the floor\",\"lines\":[{\"kind\":\"warning\",\"text\":\"If you can't get up from the floor without help, don't drop to the ground.\",\"line\":71,\"quotes\":[{\"text\":\"If you can’t get up from the floor without help, don’t drop to the ground in an earthquake.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Get as low as you can, or sit in a chair, on the side of the bed or on a couch.\",\"line\":73,\"quotes\":[{\"text\":\"If you have a mobility impairment or use a cane, get as low as you can or sit on in a chair, on the side of the bed or on a couch.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck with both hands.\",\"line\":75,\"quotes\":[{\"text\":\"Cover your head and neck with both hands.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Curl your body as much as you can into your lap.\",\"line\":77,\"quotes\":[{\"text\":\"Curl your body as much as you can into your lap.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Keep your cane near you so you can use it when the shaking stops.\",\"line\":79,\"quotes\":[{\"text\":\"Keep your cane near you so you can use it when the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"The cane lines are only on the Sign Language page (Section B). Its \\\"sit on in a chair\\\" is a typo on the page; the quote keeps it as written and the screen says \\\"sit in a chair\\\".\",\"line\":81}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":82,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":70,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":82,\"target\":\"shaking-stops\"}]},{\"id\":\"wheelchair\",\"title\":\"Walker or wheelchair: Lock, Cover and Hold\",\"lines\":[{\"kind\":\"do\",\"text\":\"Lock your wheels and get as low as you can.\",\"line\":85,\"quotes\":[{\"text\":\"Lock your wheels and get as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck with both hands if you can.\",\"line\":87,\"quotes\":[{\"text\":\"Cover your head and neck with both hands if you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Curl your body as much as you can into your lap.\",\"line\":89,\"quotes\":[{\"text\":\"Curl your body as much as you can into your lap.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on until the shaking stops.\",\"line\":91,\"quotes\":[{\"text\":\"Hold on until the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B): \\\"If you use a walker or wheelchair, Lock, Cover and Hold.\\\"\",\"line\":93}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":94,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":84,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":94,\"target\":\"shaking-stops\"}]},{\"id\":\"outside\",\"title\":\"Outside\",\"lines\":[{\"kind\":\"do\",\"text\":\"If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.\",\"line\":97,\"quotes\":[{\"text\":\"If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The guideline's wording here is unclear: it does not plainly say how far to move, or which way. Follow local advice.\",\"line\":99},{\"kind\":\"do\",\"text\":\"Drop down on your hands and knees, or as low as you can.\",\"line\":100,\"quotes\":[{\"text\":\"Drop down on your hands and knees or as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck if you can.\",\"line\":102,\"quotes\":[{\"text\":\"Cover your head and neck if you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on to your position or shelter.\",\"line\":104,\"quotes\":[{\"tex getready.govt.nz/emergency/earthquakes/\"},{\"name\":\"Get Ready (NEMA), Earthquakes, NZ Sign Language version\",\"link\":\"https://nzsl.getready.govt.nz/emergency/earthquakes\"}],\"warning\":\"Shaking now? Drop, Cover and Hold first. Read this when you are safe.\",\"audience\":\"Anyone in New Zealand during or just after an earthquake\",\"reviewedBy\":\"\",\"version\":\"Get Ready (NEMA) earthquakes page and its NZ Sign Language version (nzsl.getready.govt.nz/emergency/earthquakes), read 18 Nov 2026, no review date shown\",\"brand\":{\"name\":\"\",\"colour\":\"\"},\"look\":\"\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"Shaking now: Drop, Cover and Hold\",\"lines\":[{\"kind\":\"do\",\"text\":\"Drop, Cover and Hold until the shaking is over.\",\"line\":14,\"quotes\":[{\"text\":\"Drop, Cover and Hold until the shaking is over.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"warning\",\"text\":\"Do not run outside. You could be hit by falling bricks and glass.\",\"line\":16,\"quotes\":[{\"text\":\"Do not run outside or you risk getting hit by falling bricks and glass.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Use the version that works for your body.\",\"line\":18,\"quotes\":[{\"text\":\"The best version of Drop, Cover, Hold is the one that works for your body and that you have practiced.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Where are you?\",\"options\":[{\"label\":\"Inside a building\",\"to\":\"indoors\",\"line\":21,\"target\":\"indoors\"},{\"label\":\"In bed\",\"to\":\"in-bed\",\"line\":22,\"target\":\"in-bed\"},{\"label\":\"I have a mobility problem, or use a cane, walker or wheelchair\",\"to\":\"mobility\",\"line\":23,\"target\":\"mobility\"},{\"label\":\"Outside\",\"to\":\"outside\",\"line\":24,\"target\":\"outside\"},{\"label\":\"Driving\",\"to\":\"driving\",\"line\":25,\"target\":\"driving\"},{\"label\":\"In a lift\",\"to\":\"lift\",\"line\":26,\"target\":\"lift\"},{\"label\":\"Somewhere else\",\"to\":\"elsewhere\",\"line\":27,\"target\":\"elsewhere\"}],\"line\":20},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":13},{\"id\":\"mobility\",\"title\":\"Your version of Drop, Cover and Hold\",\"lines\":[{\"kind\":\"say\",\"text\":\"Use the version that works for your body.\",\"line\":30,\"quotes\":[{\"text\":\"The best version of Drop, Cover, Hold is the one that works for your body and that you have practiced.\",\"where\":\"\",\"check\":\"exact\"}]}],\"ask\":{\"question\":\"Which is closest to you?\",\"options\":[{\"label\":\"I have a mobility impairment or use a cane\",\"to\":\"cane\",\"line\":33,\"target\":\"cane\"},{\"label\":\"I can't get up from the floor without help\",\"to\":\"cane\",\"line\":34,\"target\":\"cane\"},{\"label\":\"I use a walker or wheelchair\",\"to\":\"wheelchair\",\"line\":35,\"target\":\"wheelchair\"}],\"line\":32},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":29},{\"id\":\"indoors\",\"title\":\"Inside: Drop, Cover and Hold\",\"lines\":[{\"kind\":\"warning\",\"text\":\"If you can't get up from the floor without help, don't drop to the ground.\",\"line\":38,\"quotes\":[{\"text\":\"If you can’t get up from the floor without help, don’t drop to the ground in an earthquake.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Drop down on your hands and knees, or as low as you can.\",\"line\":40,\"quotes\":[{\"text\":\"Drop down on your hands and knees or as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If you can't drop to the floor, brace yourself against a wall or sturdy furniture.\",\"line\":42,\"quotes\":[{\"text\":\"Brace yourself against a wall or sturdy furniture if you cannot drop to the floor.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck under a sturdy table or desk, if one is a few steps away.\",\"line\":44,\"quotes\":[{\"text\":\"COVER your head and neck (or your entire body if possible) under a sturdy table or desk (if it is within a few steps of you).\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"No shelter nearby? Cover your head and neck with your arms and hands.\",\"line\":46,\"quotes\":[{\"text\":\"If there is no shelter nearby, cover your head and neck with your arms and hands.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on to your shelter, or your position, until the shaking stops.\",\"line\":48,\"quotes\":[{\"text\":\"HOLD on to your shelter (or your position to protect your head and neck) until the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Under a table, hold on to the table legs. If the shaking moves your shelter, move with it.\",\"line\":50,\"quotes\":[{\"text\":\"Hold on to the table legs to keep it from moving away from you.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"If the shaking shifts your shelter around, move with it.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Keep away from windows and tall furniture. Not in a doorway.\",\"line\":53,\"quotes\":[{\"text\":\"Away from windows that can shatter and cause injury.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"And away from tall furniture that can fall on you.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Not in a doorway.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"In most homes a doorway is no stronger than the rest of the house, and a swinging door can cause more injury.\",\"line\":57,\"quotes\":[{\"text\":\"In most homes, doorways are not stronger than any other part of a house and a swinging door can cause more injury.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"The table, no-shelter, hold and move-with-it lines are only on the Sign Language page (Section B). The windows, tall furniture and doorway lines come from its \\\"Get ready\\\" list of safe spaces.\",\"line\":59}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":60,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":37,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":60,\"target\":\"shaking-stops\"}]},{\"id\":\"in-bed\",\"title\":\"In bed: stay in bed\",\"lines\":[{\"kind\":\"do\",\"text\":\"Stay in bed. Pull the sheets and blankets over you.\",\"line\":63,\"quotes\":[{\"text\":\"If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Use your pillow to protect your head and neck.\",\"line\":65,\"quotes\":[{\"text\":\"If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B).\",\"line\":67}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":68,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":62,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":68,\"target\":\"shaking-stops\"}]},{\"id\":\"cane\",\"title\":\"Using a cane, or can't get up from the floor\",\"lines\":[{\"kind\":\"warning\",\"text\":\"If you can't get up from the floor without help, don't drop to the ground.\",\"line\":71,\"quotes\":[{\"text\":\"If you can’t get up from the floor without help, don’t drop to the ground in an earthquake.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Get as low as you can, or sit in a chair, on the side of the bed or on a couch.\",\"line\":73,\"quotes\":[{\"text\":\"If you have a mobility impairment or use a cane, get as low as you can or sit on in a chair, on the side of the bed or on a couch.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck with both hands.\",\"line\":75,\"quotes\":[{\"text\":\"Cover your head and neck with both hands.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Curl your body as much as you can into your lap.\",\"line\":77,\"quotes\":[{\"text\":\"Curl your body as much as you can into your lap.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Keep your cane near you so you can use it when the shaking stops.\",\"line\":79,\"quotes\":[{\"text\":\"Keep your cane near you so you can use it when the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"The cane lines are only on the Sign Language page (Section B). Its \\\"sit on in a chair\\\" is a typo on the page; the quote keeps it as written and the screen says \\\"sit in a chair\\\".\",\"line\":81}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":82,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":70,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":82,\"target\":\"shaking-stops\"}]},{\"id\":\"wheelchair\",\"title\":\"Walker or wheelchair: Lock, Cover and Hold\",\"lines\":[{\"kind\":\"do\",\"text\":\"Lock your wheels and get as low as you can.\",\"line\":85,\"quotes\":[{\"text\":\"Lock your wheels and get as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck with both hands if you can.\",\"line\":87,\"quotes\":[{\"text\":\"Cover your head and neck with both hands if you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Curl your body as much as you can into your lap.\",\"line\":89,\"quotes\":[{\"text\":\"Curl your body as much as you can into your lap.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on until the shaking stops.\",\"line\":91,\"quotes\":[{\"text\":\"Hold on until the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B): \\\"If you use a walker or wheelchair, Lock, Cover and Hold.\\\"\",\"line\":93}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":94,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":84,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":94,\"target\":\"shaking-stops\"}]},{\"id\":\"outside\",\"title\":\"Outside\",\"lines\":[{\"kind\":\"do\",\"text\":\"If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.\",\"line\":97,\"quotes\":[{\"text\":\"If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The guideline's wording here is unclear: it does not plainly say how far to move, or which way. Follow local advice.\",\"line\":99},{\"kind\":\"do\",\"text\":\"Drop down on your hands and knees, or as low as you can.\",\"line\":100,\"quotes\":[{\"text\":\"Drop down on your hands and knees or as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck if you can.\",\"line\":102,\"quotes\":[{\"text\":\"Cover your head and neck if you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on to your position or shelter.\",\"line\":104,\"quotes\":[{\"text\":\"Hold on to your position or shelter.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The guideline does not give advice for crowds, or for being near cliffs or steep slopes. Follow local advice.\",\"line\":106},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B). The screen shows the outside sentence word for word because it is ambiguous (it can be read as \\\"stay within a few steps of buildings\\\"); the app does not choose a reading. Gap: nothing on cliffs, slopes or crowds outdoors. The Drop, Cover and Hold how-to lines are from Section A.\",\"line\":107}],\"ask\":nu "do\",\"text\":\"Use your pillow to protect your head and neck.\",\"line\":65,\"quotes\":[{\"text\":\"If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B).\",\"line\":67}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":68,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":62,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":68,\"target\":\"shaking-stops\"}]},{\"id\":\"cane\",\"title\":\"Using a cane, or can't get up from the floor\",\"lines\":[{\"kind\":\"warning\",\"text\":\"If you can't get up from the floor without help, don't drop to the ground.\",\"line\":71,\"quotes\":[{\"text\":\"If you can’t get up from the floor without help, don’t drop to the ground in an earthquake.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Get as low as you can, or sit in a chair, on the side of the bed or on a couch.\",\"line\":73,\"quotes\":[{\"text\":\"If you have a mobility impairment or use a cane, get as low as you can or sit on in a chair, on the side of the bed or on a couch.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck with both hands.\",\"line\":75,\"quotes\":[{\"text\":\"Cover your head and neck with both hands.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Curl your body as much as you can into your lap.\",\"line\":77,\"quotes\":[{\"text\":\"Curl your body as much as you can into your lap.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"Keep your cane near you so you can use it when the shaking stops.\",\"line\":79,\"quotes\":[{\"text\":\"Keep your cane near you so you can use it when the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"The cane lines are only on the Sign Language page (Section B). Its \\\"sit on in a chair\\\" is a typo on the page; the quote keeps it as written and the screen says \\\"sit in a chair\\\".\",\"line\":81}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":82,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":70,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":82,\"target\":\"shaking-stops\"}]},{\"id\":\"wheelchair\",\"title\":\"Walker or wheelchair: Lock, Cover and Hold\",\"lines\":[{\"kind\":\"do\",\"text\":\"Lock your wheels and get as low as you can.\",\"line\":85,\"quotes\":[{\"text\":\"Lock your wheels and get as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck with both hands if you can.\",\"line\":87,\"quotes\":[{\"text\":\"Cover your head and neck with both hands if you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Curl your body as much as you can into your lap.\",\"line\":89,\"quotes\":[{\"text\":\"Curl your body as much as you can into your lap.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on until the shaking stops.\",\"line\":91,\"quotes\":[{\"text\":\"Hold on until the shaking stops.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B): \\\"If you use a walker or wheelchair, Lock, Cover and Hold.\\\"\",\"line\":93}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":94,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":84,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":94,\"target\":\"shaking-stops\"}]},{\"id\":\"outside\",\"title\":\"Outside\",\"lines\":[{\"kind\":\"do\",\"text\":\"If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.\",\"line\":97,\"quotes\":[{\"text\":\"If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The guideline's wording here is unclear: it does not plainly say how far to move, or which way. Follow local advice.\",\"line\":99},{\"kind\":\"do\",\"text\":\"Drop down on your hands and knees, or as low as you can.\",\"line\":100,\"quotes\":[{\"text\":\"Drop down on your hands and knees or as low as you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Cover your head and neck if you can.\",\"line\":102,\"quotes\":[{\"text\":\"Cover your head and neck if you can.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Hold on to your position or shelter.\",\"line\":104,\"quotes\":[{\"text\":\"Hold on to your position or shelter.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The guideline does not give advice for crowds, or for being near cliffs or steep slopes. Follow local advice.\",\"line\":106},{\"kind\":\"note\",\"text\":\"Only on the Sign Language page (Section B). The screen shows the outside sentence word for word because it is ambiguous (it can be read as \\\"stay within a few steps of buildings\\\"); the app does not choose a reading. Gap: nothing on cliffs, slopes or crowds outdoors. The Drop, Cover and Hold how-to lines are from Section A.\",\"line\":107}],\"ask\":null,\"next\":{\"to\":\"shaking-stops\",\"line\":108,\"target\":\"shaking-stops\"},\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":96,\"nexts\":[{\"to\":\"shaking-stops\",\"line\":108,\"target\":\"shaking-stops\"}]},{\"id\":\"driving\",\"title\":\"Driving\",\"lines\":[{\"kind\":\"do\",\"text\":\"Pull over to a clear place and stop.\",\"line\":111,\"quotes\":[{\"text\":\"If you are driving, pull over to a clear location.\",\"where\":\"\",\"check\":\"exact\"},{\"text\":\"Stop.\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"do\",\"text\":\"Wait there with your seatbelt on until the shaking stop   for (const b of $('react').children) b.setAttribute('aria-pressed', String(picked[L.id] === b.dataset.r));
}
const say = (t) => { $('status').textContent = t; };

$('picker').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); });

// One reaction per look; tapping another replaces it.
$('react').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = D.looks[current];
  picked[L.id] = b.dataset.r; show(current);
  if (!db) return say('Saved on this screen only: feedback storage is not available here.');
  try { await db.doc(`reactions/${roundKey}-${L.id}`).set({ round: D.round, look: L.id, reaction: b.dataset.r, at: Date.now() }); say(`Saved: ${b.textContent} for ${L.name}.`); }
  catch (err) { say('Could not save that. Check your connection and tap again.'); }
});

// Comments are kept as separate notes, tagged with the look on screen.
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('comment').value.trim(); if (!text) return;
  const L = D.looks[current];
  if (!db) return say('Comments can only be saved when this page is opened in Claude.');
  try { await db.collection('comments').add({ round: D.round, look: L.id, text: text.slice(0, 2000), at: Date.now() }); $('comment').value = ''; say(`Comment saved for ${L.name}. The next build reads it.`); }
  catch (err) { say('Could not save the comment. Check your connection and try again.'); }
});

$('round').textContent = D.round.split(' ')[0];
show(0);

// Connect to feedback storage, then mark the looks already reacted to in this round.
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection('reactions').where('round', '==', D.round).get();
    for (const d of snap.docs) { const v = d.data(); if (v?.look) picked[v.look] = v.reaction; }
    show(current);
  } catch { /* first visit or offline: nothing to mark */ }
})();
</script>
