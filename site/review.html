form { display:flex; gap:6px; margin-top:8px; }
input { flex:1; min-width:0; font:15px var(--ui); padding:11px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
form button { font:600 14px var(--ui); padding:0 16px; border-radius:12px; border:0; background:var(--ink); color:var(--panel); min-height:44px; }
.status { color:var(--mut); font-size:12px; margin:6px 2px 0; min-height:1.2em; }
button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }

 `${s.ask.question || s.title}: ${o.label}`);\n      }\n      if (d.rec) {\n        const r = (_a = S.records)[_b = d.rec] ?? (_a[_b] = { n: 0, last: 0 });\n        r.n++;\n        r.last = now();\n        log(d.rec);\n        render();\n        return;\n      }\n      if (d.remdone) {\n        const r = S.reminders[d.remdone];\n        if (r) {\n          log(\"Done\", r.text);\n          if (r.once) delete S.reminders[d.remdone];\n          else {\n            r.dueAt = now() + r.ms;\n            r.alerted = false;\n          }\n        }\n        render();\n        return;\n      }\n      if (d.remstop) {\n        const r = S.reminders[d.remstop];\n        if (r) log(\"Reminder stopped\", r.text);\n        delete S.reminders[d.remstop];\n        render();\n        return;\n      }\n      switch (d.act) {\n        case \"begin\":\n          try {\n            audio ?? (audio = new (window.AudioContext || window.webkitAudioContext)());\n          } catch {\n          }\n          return begin();\n        case \"back\":\n          return back();\n        case \"next\":\n          return go(nextTarget(byId.get(S.current)), \"Next\");\n        case \"timer-go\":\n          return go(byId.get(S.current).timer.target, \"Timer finished\");\n        case \"finish\":\n          return finish();\n        case \"restart\":\n          return restart();\n        case \"copy\":\n          try {\n            navigator.clipboard?.writeText(logText());\n            b.textContent = \"Copied\";\n          } catch {\n            b.textContent = \"Could not copy\";\n          }\n          return;\n      }\n    });\n    root.addEventListener(\"change\", (e) => {\n      const el = e.target;\n      if (el.dataset.num && S.screen === \"run\") log(\"Detail changed\", `${el.dataset.num}: ${el.value.trim()}`);\n      if (el.dataset.tick) {\n        S.ticks[el.dataset.tick] = el.checked;\n        const s = byId.get(S.current);\n        const l = s?.lines.filter((x) => x.kind !== \"note\")[+el.dataset.tick.split(\":\").pop()];\n        log(el.checked ? \"Ticked\" : \"Unticked\", l?.text ?? \"\");\n      }\n    });\n    root.addEventListener(\"input\", (e) => {\n      const el = e.target;\n      if (el.dataset.num) {\n        S.answers[el.dataset.num] = el.value.trim();\n        const i = spec.inputs.find((x) => x.id === el.dataset.num);\n        const bad = root.querySelector(`[data-bad=\"${el.dataset.num}\"]`);\n        if (bad) bad.textContent = numberProblem(i, el.value.trim()) ?? \"\";\n      }\n    });\n    load();\n    const timer = setInterval(tick, 250);\n    render();\n    return { state: S, render, stop: () => clearInterval(timer) };\n  }\n\n  // engine/app-entry.js\n  var data = JSON.parse(document.getElementById(\"spec\").textContent);\n  window.__app = mount(document.getElementById(\"app\"), data);\n})();\n<\/script>\n</body></html>\n"},{"id":"wayfinding","name":"Wayfinding","from":"Transit maps and road signs: bold type, actions as stations on a line, sign-yellow cautions.","html":"<!DOCTYPE html>\n<html lang=\"en\" data-look=\"wayfinding\"><head><meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<meta name=\"theme-color\" content=\"#14213d\">\n<title>Burns first aid</title>\n<style>/* Phone-first, portrait, large tap targets. One stylesheet for every generated app. */\n:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:#0b6e4f; --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }\n* { box-sizing: border-box; }\nhtml, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, \"Segoe UI\", Roboto, sans-serif; }\n#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }\n.bar { position: sticky; top: 0; z-index: 3; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#14213d; color:#fff; }\n.bar .t { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }\n.bar .clock { font-variant-numeric: tabular-nums; font-size:18px; }\n.proto { font-size:12px; color:var(--author); background:var(--authorbg); padding:4px 14px; }\n.card { background:var(--card); margin:10px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); }\nh1 { font-size:22px; margin:4px 0 8px; } h2 { font-size:21px; margin:2px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }\np { margin: 8px 0; } p.bul::before { content:\"• \"; color:var(--mut); }\n.big { display:block; width:100%; min-height:52px; margin:10px 0 0; padding:12px 14px; font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line); background:#eef1f4; color:var(--ink); text-align:left; }\n.big.go { background:var(--go); color:#fff; border-color:var(--go); text-align:center; }\n.big.opt { background:#e8f0fe; border-color:#b7c9f5; }\n.big.opt.broken { border-style:dashed; border-color:var(--author); }\n.big.skip { background:transparent; text-align:center; font-weight:500; color:var(--mut); }\n.link { background:none; border:0; color:#1d4ed8; font:inherit; padding:0; }\n.crumb { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); }\n.q { font-weight:600; font-size:19px; margin-top:16px; }\n.warn { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; font-weight:600; }\n.author { background:var(--authorbg); color:var(--author); border-left:4px solid var(--author); padding:8px 10px; border-radius:6px; font-size:15px; }\n.do { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }\n.do input { width:26px; height:26px; margin:0; flex:none; } .do span { flex:1; }\n.do .src, .do .dep { flex-basis:100%; margin-left:36px; }\n.dep { display:block; color:var(--author); font-size:13px; }\ndetails.src { font-size:14px; color:var(--mut); margin:2px 0 4px; } details.src summary { cursor:pointer; color:#1d4ed8; }\ndetails.src q { font-style:italic; }\n.timer { margin:14px 0; padding:12px; border-radius:10px; background:#eef6f2; text-align:center; }\n.timer .lbl { color:var(--mut); font-size:14px; }\n.big-clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }\n.timer.due { background:#fde8e8; } .timer.due .big-clock { color:var(--due); }\n.reminders { position:sticky; top:44px; z-index:2; background:var(--bg); padding:6px 10px 0; }\n.rem { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:6px; }\n.rem .rt { flex:1; font-weight:600; font-size:15px; } .rem .rc { font-variant-numeric:tabular-nums; font-size:15px; }\n.rem button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }\n.rem.due { border-color:var(--due); background:#fde8e8; } .rem.due .rc { color:var(--due); font-weight:700; }\n.rec { padding:6px 0; } .rec small { color:var(--mut); }\n.rec-btn { background:#fff7e6; border-color:#f2c46d; }\n.lookup { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }\n.lookup .lk { font-weight:600; } .lookup .lv { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px dashed var(--line); }\ntable { border-collapse:collapse; width:100%; font-size:14px; } th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; }\n.inputs { margin:10px 0; } .inp { display:block; margin:10px 0; font-weight:600; }\n.inp input { display:block; width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); margin-top:4px; }\n.inp small { font-weight:400; color:var(--mut); } .inp .bad { color:var(--due); font-weight:400; font-size:14px; }\n.choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }\n.choices button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }\n.choices button.on { background:#14213d; color:#fff; }\n.log { padding-left:0; list-style:none; } .log li { padding:6px 0; border-bottom:1px solid var(--line); } .log time { display:inline-block; min-width:56px; font-variant-numeric:tabular-nums; color:var(--mut); }\n.findings { padding-left:18px; } .findings li { margin:8px 0; font-size:15px; }\n.lvl-fix { color:var(--due); } .lvl-check { color:var(--warn); } .lvl-info { color:var(--mut); }\n.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }\n.tabs button { flex:1; font:inherit; font-size:15px; padding:14px 4px; background:none; border:0; color:var(--mut); }\n.tabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 3px 0 #14213d; }\n</style><link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&display=swap\">\n<style>/* LOOK C \"Wayfinding\": ideas from transit maps and road signs. White ground, heavy black type, a line that\n   runs down the screen like a metro route with each action as a station, sign-yellow cautions, square buttons. */\n:root { --ink:#0a0a0a; --mut:#555; --bg:#ffffff; --card:#fff; --line:#0a0a0a; --go:#0a0a0a; --route:#e4002b; --sign:#ffd400;\n  --warn:#0a0a0a; --warnbg:#ffd400; --due:#e4002b; --author:#5b21b6; --authorbg:#efe9fb; }\nhtml, body { font-family:\"Archivo\", \"Helvetica Neue\", Arial, sans-serif; background:var(--bg); }\n.bar { background:var(--ink); padding:12px 16px; }\n.bar .t { font-weight:800; letter-spacing:.01em; }\n.bar .clock { background:var(--sign); color:var(--ink); padding:2px 10px; font-weight:800; }\n.proto { background:#f2f2f2; color:var(--mut); }\n.card { border:0; border-radius:0; margin:0; padding:18px 18px 20px; }\nh1, h2 { font-weight:900; letter-spacing:-.02em; line-height:1.05; text-wrap:balance; }\nh1 { font-size:32px; } h2 { font-size:30px; margin-top:6px; }\n.crumb { flex-direction:row-reverse; justify-content:flex-end; gap:14px; align-items:center; }\n.crumb span { display:inline-grid; place-items:center; min-width:40px; height:40px; padding:0 8px; background:var(--route); color:#fff; font-weight:900; font-size:15px; border-radius:999px; }\n.big { border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:800; min-height:58px; }\n.big.go { background:var(--ink); color:#fff; border-color:var(--ink); text-align:left; position:relative; padding-right:44px; }\n.big.go::after { content:\"→\"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }\n.big.opt { background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }\n.big.opt::after { content:\"→\"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }\n.big.skip { border:0; text-decoration:underline; }\n.link { color:var(--ink); text-decoration:underline; font-weight:700; }\n.q { font-size:22px; font-weight:900; }\n.warn { background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }\n.warn::before { content:\"!\"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }\n/* the route line: actions are stations on a red line */\n.do { position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }\n.do::before { content:\"\"; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }\n.do input { position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }\n.do .src, .do .dep { margin-left:0; }\ndetails.src summary { color:var(--ink); text-decoration:underline; }\n.timer { background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }\n.timer .lbl { color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }\n.timer::after { content:\"\"; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg, var(--sign) calc(var(--p, 0) * 100%), #333 0); }\n.big-clock { font-size:60px; font-weight:900; color:var(--sign); }\n.timer.due { background:var(--due); } .timer.due .big-clock { color:#fff; }\n.rem { border:2px solid var(--ink); border-radius:0; } .rem button { border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }\n.rem.due { background:var(--sign); }\n.choices button { border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; } .choices button.on { background:var(--ink); color:#fff; }\n.tabs { border-top:2px solid var(--ink); }\n.tabs button { font-weight:800; color:var(--mut); } .tabs button.on { color:var(--ink); box-shadow:inset 0 4px 0 var(--route); }\n</style></head>\n<body><div id=\"app\"></div>\n<script type=\"application/json\" id=\"spec\">{\"spec\":{\"title\":\"Burns first aid\",\"about\":\"Walks a first aider through calling for help, cooling a burn for 20 minutes and covering it.\",\"sources\":[{\"name\":\"Hato Hone St John first aid library, Burns\",\"link\":\"https://www.stjohn.org.nz/first-aid/first-aid-library/burns/\"}],\"warning\":\"If you have a person in urgent need of medical attention, call 111 now.\",\"audience\":\"Anyone giving first aid for a burn\",\"reviewedBy\":\"\",\"version\":\"St John web page, read 18 Nov 2026 (no review date shown)\",\"inputs\":[],\"tables\":[],\"steps\":[{\"id\":\"start\",\"title\":\"What caused the burn?\",\"lines\":[{\"kind\":\"say\",\"text\":\"Check that the person is happy for you to touch them before you give first aid.\",\"line\":13,\"quotes\":[{\"text\":\"Check that the person is happy for you to touch them before you give first aid\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"If they are unconscious and need lifesaving first aid, don't delay.\",\"line\":15},{\"kind\":\"note\",\"text\":\"Reworded from the same Quick help item; no exact quote captured.\",\"line\":16},{\"kind\":\"say\",\"text\":\"A dry cough can mean smoke or fire has damaged the airway: choose \\\"Smoke or gas\\\".\",\"line\":17},{\"kind\":\"note\",\"text\":\"Reworded from \\\"What to look for\\\"; no exact quote captured.\",\"line\":18},{\"kind\":\"note\",\"text\":\"Electricity is named on the page as a cause, but it gives no separate steps, so there is no answer for it.\",\"line\":22}],\"ask\":{\"question\":\"What caused the burn?\",\"options\":[{\"label\":\"Heat, hot liquid or a hot object\",\"to\":\"call-check\",\"line\":20,\"target\":\"call-check\"},{\"label\":\"A chemical (or bitumen)\",\"to\":\"chemical\",\"line\":21,\"target\":\"chemical\"},{\"label\":\"Smoke or gas: burns in the mouth or throat\",\"to\":\"smoke\",\"line\":23,\"target\":\"smoke\"},{\"label\":\"Clothing is on fire\",\"to\":\"on-fire\",\"line\":24,\"target\":\"on-fire\"}],\"line\":19},\"next\":null,\"timer\":null,\"reminders\":[],\"stop\":null,\"end\":false,\"line\":12},{\"id\":\"call-check\",\"title\":\"Does this need an ambulance?\",\"lines\":[{\"kind\":\"say\",\"text\":\"Call 111 for an ambulance if any of these is true:\",\"line\":27},{\"kind\":\"say\",\"text\":\"The burn is larger than half the person's arm.\",\"bullet\":true,\"line\":28,\"quotes\":[{\"text\":\"Call 111 for an ambulance if the area of the burn is larger than half the person’s arm;\",\"where\":\"\",\"check\":\"exact\"}]},{\"kind\":\"say\",\"text\":\"The burn causes severe pain.\",\"bullet\":true,\"line\":30},{\"kind\":\"say\",\"text\":\"The burn involves the eyes.\",\"bullet\":true,\"line\":31},{\"kind\":\"note\",\"text\":\"Severe pain and eyes are from the same Quick help list; only the \\\"half the person's arm\\\" line was captured word for word.\",\"line\":32}],\"ask\":{\"question\":\"Is any of these true?\",\" <script>
// Review page: switches the app preview between looks and saves one reaction per look plus any comments.
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const roundKey = D.round.replace(/[^a-z0-9]+/gi, '-');
const picked = {};          // look id -> reaction, as saved
let current = 0, db = null;

// Draws the look buttons and loads the chosen look into the preview.
function show(k) {
  current = k;
  const L = D.looks[k];
  $('picker').innerHTML = D.looks.map((l, i) => `<button data-k="${i}" aria-pressed="${i === k}">${'ABC'[i]} · ${l.name}${picked[l.id] ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('from').textContent = 'Borrowed from ' + L.from.charAt(0).toLowerCase() + L.from.slice(1);
  $('frame').srcdoc = L.html;
  $('ask').textContent = `How does ${L.name} feel?`;
  for (const b of $('react').children) b.setAttribute('aria-pressed', String(picked[L.id] === b.dataset.r));
}
const say = (t) => { $('status').textContent = t; };

$('picker').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); });

// One reaction per look; tapping another replaces it.
$('react').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = D.looks[current];
  picked[L.id] = b.dataset.r; show(current);
  if (!db) return say('Saved on this screen only: feedback storage is not available here.');
  try { await db.doc(`reactions/${roundKey}-${L.id}`).set({ round: D.round, look: L.id, reaction: b.dataset.r, at: Date.now() }); say(`Saved: ${b.textContent} for ${L.name}.`); }
  catch (err) { say('Could not save that. Check your connection and tap again.'); }
});

// Comments are kept as separate notes, tagged with the look on screen.
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('comment').value.trim(); if (!text) return;
  const L = D.looks[current];
  if (!db) return say('Comments can only be saved when this page is opened in Claude.');
  try { await db.collection('comments').add({ round: D.round, look: L.id, text: text.slice(0, 2000), at: Date.now() }); $('comment').value = ''; say(`Comment saved for ${L.name}. The next build reads it.`); }
  catch (err) { say('Could not save the comment. Check your connection and try again.'); }
});

$('round').textContent = D.round.split(' ')[0];
show(0);

// Connect to feedback storage, then mark the looks already reacted to in this round.
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection('reactions').where('round', '==', D.round).get();
    for (const d of snap.docs) { const v = d.data(); if (v?.look) picked[v.look] = v.reaction; }
    show(current);
  } catch { /* first visit or offline: nothing to mark */ }
})();
</script>
