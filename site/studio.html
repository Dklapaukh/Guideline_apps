Vinh does not agree to cancel all his requested holidays because he wants to spend time with his family over the school holidays.
However, he does offer to postpone 2 days of his arranged annual holidays and work these days to support the business.
[The story ends here; the page does not say how the boss responded.]

When employment ends
When you leave a job, if you have unused annual holidays or have annual holidays you are not yet entitled to take (because you have not yet worked 12 months), your employer must pay you their cash equivalent in your final pay.

==================== SECTION C: Managing annual holidays ====================

Managing annual holidays
An employer must give their employees at least 4 weeks paid annual holidays (annual leave) \u2013 and keep accurate records of what employees are entitled to and have taken.

Changes to leave coming in 2028
The Employment Leave Act is going to replace the Holidays Act in August 2028.
It will be a major change to how leave works.
You must follow the current rules in the Holidays Act until the new law starts in 2028.

What you must do
As an employer, you must:
give all your employees at least 4 weeks of paid holidays each year
be reasonable in considering requests to take annual holidays
keep accurate records to track annual holiday entitlements and payments.

What you cannot do
You cannot give an employee less than 4 weeks annual holidays each year, even if their employment agreement says so.

How annual holiday entitlement works
Your employees become entitled to a minimum of 4 weeks annual holidays when they have worked continuously for you for 12 months.
You can, however, choose to:
give employees more than their minimum entitlement of 4 weeks of annual holidays each year \u2013 this should be documented in their [link words missing]
allow employees to take annual holidays before they are entitled to them (in advance).
An employee\u2019s annual holiday entitlement does not expire.
The employee remains entitled to their annual holidays until they:
take the holidays
cash them up, or
their employment ends, and they are paid out for them.
In some cases, you can agree with an employee that they be paid 8% of their gross pay instead of getting paid annual holidays \u2013 referred to as \u2018pay-as-you-go\u2019 holiday pay.
This can only happen if the employee:
has a [link words missing] of less than 12 months, or
works so irregularly that it is impossible in practice for you to provide them with 4 weeks\u2019 annual holidays in the normal way.

Calculating annual holiday entitlements
What constitutes a \u2018working week\u2019, and how you calculate an employee\u2019s annual holiday entitlement, will depend on their working arrangement.

Employees with a predictable work pattern
For employees who work the same hours on the same days each week, annual holiday entitlement is simple to work out.
Every 12 months, on their anniversary for annual holidays entitlement, they can take 4 of their working weeks as paid annual holidays.
For example, if an employee works 3 days each week, they can take 12 days of annual holidays. (3 days x 4 weeks = 12 days.)
If they work 5 days each week, they can take 20 days of annual holidays.
Some employees have a consistent pattern of work, but it's not the same every week.
In this case, you can agree with your employee to work out their annual holiday entitlement in either days or hours.
For example, if:
they work the same total number of hours or days each week, but the number of hours each day or the days worked each week changes \u2013 you could agree to work out the annual holiday entitlement in either days or hours
the total number of days they work each week is the same but the total number of hours changes \u2013 you might agree to work out their annual holiday entitlement in days
the total number of hours they work each week is the same but the total number of days they work changes \u2013 you might agree to work out their annual holiday entitlement in hours
they have a work pattern that is consistent but not based on a 7-day cycle, for example, they work 4 days on and 4 days off \u2013 you might agree to define the week by using the longest week in the pattern, or by using an average week based on the pattern or by just referring to the week at the time the annual holiday is taken.
You should discuss the options and their consequences with your employees, in [link words missing], and help them to decide what\u2019s best for them.
The option agreed should be used consistently for that employee unless their situation changes.
If the employee\u2019s work pattern does change, their situation must be reviewed, and their annual holiday entitlement recalculated based on the new work pattern.

Employees with an unpredictable work pattern
For some employees, it may not be possible to define what a \u2018working week\u2019 looks like in advance \u2013 for example, if they have no guaranteed hours, or work to a roster that changes unpredictably each week.
If this is the case, you should try to identify with them whether there is a pattern of work that could be used to work out a working week for their annual holiday entitlement.
This could be based on:
the agreed hours in their employment agreement if these are a fair and reasonable reflection of their working week, or
the days and hours they have actually been working in the weeks leading up to the leave.

When employment ends
When an employee leaves, you must pay them for any unused annual holidays that they are entitled to.
This should be paid at the greater rate of their [link words missing] when they finish employment or their [link words missing] for the 12 months up to the end of the last pay period before employment ended.
If an employee has not yet become entitled to annual holidays or has worked a part-year since their last entitlement anniversary, you must pay them 8% of their total before-tax earnings from the time they started the job, less any amount paid to them for annual holidays taken in advance or paid on a pay-as-you-go basis.

Approving and declining annual holiday requests
Annual holidays (also called \u2018annual leave\u2019) can be taken at any time agreed to by you and an employee.
You must allow your employees to:
take annual holidays within 12 months of the date on which they become entitled to them.
take at least 2 of their 4 weeks of annual holidays at once, if they wish to.

What you can and cannot do
As an employer, you can:
choose whether or not to agree to an employee taking unpaid leave, or annual holidays in advance if they do not have annual holidays they are entitled to use
require employees, in specific circumstances, to take annual holidays
cancel annual holidays that have already been approved, if you have a good reason, or the employee asks you to.
You cannot unreasonably refuse an employee who wants to take annual holidays they're entitled to.

Requests to take annual holidays in advance
Employees can ask to take annual holidays before they are entitled to them (\u2018in advance\u2019) but you do not have to agree to the request unless there is a relevant clause in their [link words missing].
Employees can ask for annual holidays in advance if they:
have not completed 12 months of continuous service, or
have used all of their current entitlement.
When you agree to an employee taking annual holidays in advance, you should make sure they agree in writing that if they leave your employment before, they become entitled to annual holidays, you can recover the overpayment from their final pay. [sic: the comma after "before" is on the page]

Requiring employees to take annual holidays
You can only require employees to take annual holidays if:
you cannot reach agreement about when annual holidays (that the employee is entitled to) will be taken, and you give the employee at least 14 days' notice, or
you regularly close down for a certain period every year (for example, over Christmas) and give the employee at least 14 days\u2019 notice.
An employer cannot require an employee to take annual holidays in advance, except when there is an annual closedown.

Unexpected closedowns
If you close down your workplace unexpectedly (for example, after a natural disaster) and an employee refuses to take annual holidays with less than 14 days' notice and is willing and able to work \u2013 they cannot be made to take annual holidays.

Cancelling annual holidays
You or your employee may wish to cancel annual holidays that have already been arranged.
You do not have to agree to a cancellation request \u2013 and your employee does not have to agree if you ask them to cancel annual holidays.
Both parties should negotiate in good faith \u2013 for example, you could agree:
to postpone the annual holidays to another time
to reduce the number of annual holidays taken.

==================== SECTION D: Annual closedowns and holidays ====================

Annual closedowns and holidays

Changes to leave coming in 2028
The Employment Leave Act is going to replace the Holidays Act in August 2028.
It will be a major change to how leave works.
You must follow the current rules in the Holidays Act until the new law starts in 2028.

What is an annual closedown?
An annual closedown is when a workplace shuts each year, often for a holiday or seasonal break, and employees are required to take time off.
Annual closedowns often happen over Christmas, but some industries have them at the end of a season.
An annual closedown can occur:
across an entire workplace
for part of a workplace \u2013 for example, where a factory closes each year for maintenance while the office stays open
for different parts of a workplace at different times.
An employer can only have 1 annual closedown in any 12-month period and must give their employees 14 days' notice before it starts.
They can have different annual closedown periods for different parts of a workplace.
An annual closedown can also happen when the workplace stays open, but the employer temporarily stops work for 1 or more employees.
For example, this could happen when a customer service centre stays open between Christmas and New Year but has fewer employees working than usual.
Instead of having an annual closedown, the employer could consider other options like asking employees to take annual holidays, leave without pay or paid special leave.

If an employee is entitled to annual holidays
If at the start of the annual closedown an employee has [link words missing] they're able to use, they must do so (as long as they get 14 days' notice).
Payment for these annual holidays is calculated in the usual way.
If they do not have enough annual holidays to cover the whole annual closedown period, then:
their employer can choose to also let them take annual holidays in advance
they may agree with their employer to use other types of holidays or leave, such as alternative holidays, leave without pay, or another form of leave (with or without pay) not provided by law.

taken unpaid leave of more than a week and this has moved their anniversary date for annual holidays entitlement, or

regular allowances, like a shift allowance

the cash value of board or lodgings

Go to the end of the last pay period before the employee is taking annual holidays.

Sit
Sit your child upright and stay with them.

Treat
Treat mild asthma symptoms with two puffs of a reliever inhaler.
Treat moderate or severe symptoms with six puffs of the inhaler.

Help

Monitor
Stay with your child and watch carefully, even if they seem to get better.
If your child is not finding it easier to breathe, give repeat doses of the reliever inhaler and call an ambulance.

All OK
Your child can return to quiet activities when they no longer wheeze, cough or feel breathless.
If your child's attacks are becoming more frequent or worrying, see your doctor as soon as possible.

What to do for an asthma attack
For mild attacks
A mild attack may only need 1 dose of reliever (inhaler).
Give the number of puffs your doctor told you to and you should get back to normal straightaway.

take 6 breaths after each puff

feel like their chest is tight
look pale or have blueness around their lips

is floppy
is very tired or less responsive

==================== SECTION A: Taking sick leave (for employees) ====================

Taking sick leave
Eligible employees are entitled to 10 days of paid sick leave each year, to care for themselves, their partners and children, or other dependants.

Changes to leave coming in 2028
The Employment Leave Act is going to replace the Holidays Act in August 2028.
It will be a major change to how leave works.
You must follow the current rules in the Holidays Act until the new law starts in 2028.
To find out about the changes and how you can get ready for them, go to: [link]

What you're entitled to
Whether you are full-time, part-time or [link words missing], you are entitled to 10 days of [link words missing] per year if:
you have been working for the same employer continuously for 6 months, or
you have worked for the same employer for a period of 6 months for:
an average of 10 hours per week, and
at least 1 hour in every week or 40 hours in every month.
You can accumulate up to 20 days of sick leave, which means you can carry over 10 days of unused sick leave into the next year.
Your employer:
cannot give you less sick leave than this, but can offer you more
can, unless agreed otherwise, deduct a full day of sick leave entitlement even if you were only off for part of the day
can ask for a medical certificate or other proof that you are sick or injured and cannot work
is not legally required to give you additional time off work to visit the doctor or dentist for routine appointments unless your [link words missing] says so.
If, in any year, you do not meet the criteria:
you do not get any new sick leave entitlement
you can still use any sick leave balance that has been carried over from the previous year.
You should tell your employer as soon as possible if you need to take sick leave.
[Links: "Chart for Employees to work out if they qualify for sick leave and bereavement leave [PDF, 600 KB]"; "Pay for sick, bereavement and family violence leave"]

Taking sick leave during annual holidays
If you're about to take annual holidays but get sick before you go, your employer must let you take sick leave for the relevant period.
If you're already on annual holidays and get sick, you may be able to take sick leave instead of annual holidays for the relevant period.
Your employer must agree to this.

Stress leave
Stress leave is not an entitlement under the law, but some employers offer it in their workplace policies or employment agreements.
Stress leave can help manage the impact of work-related stress on your health.
If stress is making you mentally or physically unwell, you can use sick leave just like you would for any illness or injury.
Workplace stress is a health and safety issue.
For more information about dealing with stress at work visit: Work-related stress - WorkSafe(external link)

Sick leave is not pro-rated
Sick leave entitlements are not pro-rated (assessed proportionately).
Even if a part-time employee only works 3 days a week, they still get 10 days' sick leave a year and can accumulate up to 20 sick days a year.

Carrying over unused sick leave
If you have unused sick leave at the end of a 12-month period, it will be carried over and added to next year's entitlement \u2013 up to a maximum of 20 days of sick leave.
You and your employer can agree that sick leave can accumulate to more than 20 days \u2013 either in your [link words missing] or through your [link words missing].
Unused sick leave cannot be cashed up or be part of any final payment when you leave your job.

Taking sick leave for appointments
If you have a medical appointment (for example, to go to a doctor or dentist), you may be able to use sick leave for your appointment.
It depends if it's a routine appointment or not.
A routine appointment is one where you do not have to be diagnosed or treated for an illness, injury or condition.
For example, getting a repeat prescription or getting a check-up at the dentist.
An appointment that is not routine is one where you need to be diagnosed or treated for an illness, injury or condition.
For example, you need to go to:
the doctor because you are sick or injured
hospital to have surgery
physio.

If it is a routine appointment
Your employer is not legally required to give you leave unless your employment agreement says so.
If there is nothing specified in the employment agreement, you and your employer can negotiate.
For example, you could agree to use paid leave or unpaid leave.
If you cannot agree, you can schedule these appointments for a time outside of work hours.

If it is not a routine appointment
If it is not a routine appointment, you can use sick leave to attend the appointment.

Taking part-days sick
The Holidays Act 2003 describes sick leave entitlement in days and does not divide it into part-days or hours.
This means that if you work for part of the day and then go home sick, this can be counted as using a whole day of sick leave \u2013 no matter how much of the day you worked before going home.
However, you and your employer can agree to describe your entitlement as hours or part-days if you want to.
If you do agree to this, the number of hours or part-days must be equivalent to at least 10 full days a year.
For example, if you worked a half day and then went home sick, your employer could deduct only a half day of sick leave.

If you have no sick leave left
Coming to work when you're sick can endanger the health or safety of other workers.
If you have used up all your sick leave, you can ask to take:
sick leave in advance
[link words missing], or
unpaid leave
paid [link words missing], either as provided for in your employment agreement or or [sic] by agreement between the employer and you.
Your employer does not have to agree to the request unless your employment agreement says they do.

Providing proof of illness or injury
If you request sick leave, your employer can ask you for proof of sickness or injury.
This is usually a medical certificate from a doctor saying that you (or your spouse, partner, child, or other dependant) are sick or injured and cannot work.
Your employer cannot tell you which doctor to go to.
If your employer asks for proof, it could be you or your employer who pays for these costs.
It depends how many days you've been sick.

Sick for less than 3 days
If you've been sick for less than 3 days, your employer must:
ask for proof as soon as possible, and
pay you back for any costs, for example, the cost of your doctor's visit.

Sick for 3 or more days in a row
If your employer knows you have been sick for 3 or more days in a row, they can ask for proof on or after the third day.
You must pay for these costs yourself.
The 3 days are counted as calendar days, not just workdays.
This means it includes days you would not otherwise have worked.
For example, a Saturday or Sunday, or another day you were already scheduled to have off.
[Example] Jennifer works on Monday and takes a day's sick leave on Tuesday.
She then has a 2-day scheduled break on Wednesday and Thursday (during which she is still sick).
She calls her employer on Friday to tell them she will be off sick again.
Her employer can ask for proof on Friday at Jennifer's expense, as she has been sick for 4 days in a row.
If Jennifer's employer had asked for proof when she was sick on Tuesday, her employer would have had to cover the cost.
[Example] Holly is sick on Monday and Tuesday, and on Wednesday she phones her employer to tell them that she will be off sick again.
Holly's employer tells her that:
she will need to bring a medical certificate to work on her return to prove that she was genuinely ill, and
she will need to pay for the costs of getting the medical certificate herself, as she will have been sick for 3 days.
If Holly's employer had asked for the certificate when she phoned in sick on Tuesday, her employer would have had to cover the cost.
Holly's workplace policies state that sick leave is recorded and deducted in half-days.
If Holly had come to work at lunchtime on Wednesday (and taken only a half day's sick leave), she would have been sick for less than 3 days.
This means her employer would have had to cover the cost of the medical certificate.

Getting paid for sick leave
You must be paid for sick leave:
in the payment that relates to the period in which the leave is taken
what you would have been paid if you had worked that day \u2013 either your [link words missing] or [link words missing].
You only get paid sick leave for days you would have worked if you had not been sick, known as [link words missing].
If you are sick on a day that is not an otherwise working day, you are not entitled to paid sick leave \u2013 for example, if you were already on unpaid leave or you fell sick on a day you were not rostered to work.
If your employer has asked you for proof of sickness or injury and you do not provide it and do not have a reasonable excuse for not providing it, they do not have to pay you for the sick leave until you do so.

If you have an ongoing illness or injury
If you are sick or injured for a reasonable period of time and can no longer do your job, your employer needs to know:
how long you are likely to be off work, and
whether you'll be able to do your job again.
For more information, see: Health issues; Illness and injury

ACC
If you are injured in an accident and it is covered by ACC, you may be eligible for income support.

When you are on ACC
If you have an accident or injury covered by the Accident Compensation (ACC) scheme, your employer has payment responsibilities for the first week of your injury.
ACC will pay you from the second week onwards.
If you are receiving weekly ACC compensation, your employer cannot make you take time off in the form of sick leave or [sic: the sentence ends here on the page]

The first week after your injury
If your injury happened at work, your employer must pay you compensation of 80% of your usual earnings for that first week.
If the injury did not happen at work, you can use sick leave or other paid leave (for example, annual holidays), if you have any.
If you do not have any paid leave available, you will not be paid for that first week.

If you are on ACC for more than 5 days
If you are on ACC for more than 5 days, you and your employer can agree that your ACC payment is topped up.
It can be topped up from 80% to 100% by using 1 day of your sick leave for every 5 days you are on ACC.
If the injury happened at work, your employer can top up your payment in the first week and every week after this.
If the injury did not happen at work, your employer can only top up your payment from the second week onwards.

If you leave your job after being on ACC
When you end a job after an extended period of being on ACC, this can affect your final holiday pay.
Your final pay must include your final wages, all the holiday pay you're entitled to and any other payments owing.

ACC will pay the employee from the second week onwards.
If the employee is receiving ACC payments, you cannot make them take this time as sick leave or annual holidays.

Payment responsibilities for the first week after injury
Your payment responsibilities for the first week after their injury depend on whether the injury happened at work or not.
If the injury happened at work, you must pay compensation of 80% of the employee's usual earnings for that first week.
If the injury did not happen at work, the employee can use sick leave or other paid leave (for example, annual holidays) if they have any.
If they do not have any paid leave available, they will not be paid for that first week.

If the employee is on ACC for more than 5 days
If the employee is on ACC for more than 5 days, you and your employee can agree that you will top up their ACC payment.
It can be topped up from 80% to 100% by using 1 day of sick leave for every 5 days they are on ACC.
If the injury happened at work, you can top up the payment in the first week and every week after this.
If the injury did not happen at work, you can only top up the payment from the second week onwards.

If an employee leaves after being on ACC
When an employee leaves their job after being on ACC compensation, this can affect their final holiday pay.
Their final pay must include their final wages, all the holiday pay they're entitled to and any other payments owing.

If you are unsure about your rights or responsibilities, or need advice, call us on 0800 20 90 20 or email us a query.

==================== SECTION C: Pay for sick, bereavement and family violence leave (for everyone; some sections only) ====================

Changes to leave coming in 2028
The Employment Leave Act is going to replace the Holidays Act in August 2028.
You must follow the current rules in the Holidays Act until the new law starts in 2028.

What employees are entitled to
Employees are entitled to paid [link words missing], [link words missing] and [link words missing]:
after 6 months of continuous employment with the same employer, or
if they have worked for the employer for 6 months for an average of 10 hours per week, including at least 1 hour in every week or 40 hours in every month.

When employees are paid for sick, bereavement or family violence leave
Payment for sick, bereavement, or family violence leave is only made when it is a day that the employee would have worked if they had not been on leave.
If the employee works continuously but has an irregular pattern of work, it's an otherwise working day and they are entitled to paid leave if they:
are rostered, or agreed to work, on the day they're taking leave, or
could have expected to have worked or been rostered to work on the day they're taking leave.
If it is not an otherwise working day, then the employee is not entitled to paid leave.
For example, if the employee falls sick on a day they are not rostered to work, then they are not entitled to paid sick leave.
Pay for sick, bereavement, and family violence leave is made in the normal pay cycle.

Otherwise working day
An otherwise working day is a day that the employee would have worked had the day not been a public holiday, sick leave, bereavement leave, family violence leave, annual holiday or alternative holiday for that employee.

Calculating pay for leave [only these lines captured]
RDP is the amount the employee would have earned if they had worked on the day in question.
ADP is the daily average of the employee's gross earnings over the past 52 weeks, or weeks they've been employed if it's less than 52 weeks.

Taking a part-day of sick, bereavement or family violence leave
The law describes sick, bereavement and family violence leave entitlement in days and does not divide it into part-days or hours.
This means that if an employee works for part of the day and then takes the rest of the day off, it can be counted as a using [sic] a whole day of leave, no matter how much of the day they worked before going home.
Their employer can:
deduct a full day of leave entitlement, and
pay the employee a full day of RDP (or ADP if applicable).

For example, if an employee works a half-day and then takes the rest of the day off, their employer can agree to:
deduct a half-day of the employee's leave entitlement
pay for the time worked, and
pay half the employee's RDP (or ADP if applicable) for the rest of the day.

Contradiction (trap 5 and 7), "long": Get Ready says "lasts more than a minute"; Civil Defence says "a weak rolling earthquake that lasts a minute or more" and the lake lists say "a long, weak, rolling earthquake that lasts a minute or more". Exactly one minute is ambiguous. The Long or Strong screen shows the Get Ready wording with "(Civil Defence: a minute or more)" in brackets; the lake screen uses the lake wording. No timer: the person is taking cover while it shakes and no page says to time it; the app asks a simple question instead.
Contradiction, warning signs: the main page and large-print copy list three shore signs (long or strong earthquake, sudden sea-level rise or fall, loud or unusual noises from the sea). The Sign Language page's shore sentence names only the earthquake and sea level, no noises. Civil Defence says "water level" and "loud and unusual noises from the water". The app uses the large-print wording for the sea signs (sudden rise or fall in sea level; loud or unusual noises from the sea) on the first and watch screens. The difference is an omission, not an opposite instruction, so it is in Notes only.
Contradiction, water after a tsunami: Get Ready says stay away from coastal water, estuaries, rivers and streams "for at least 24 hours"; the Civil Defence page only says "Be cautious" (no time). Both are on the after-water screen; the longer Get Ready advice is the instruction and the Civil Defence wording is in brackets. No 24-hour timer: a phone timer that long is not useful; the time is stated.
Difference: only Civil Defence says tsunami activity lasts several hours and the first wave may not be the largest; shown on the stay-there screen. "Can continue" (Section D during part) is used; the cancellations part says "will continue".
Difference, after lists: the main page says "Listen to the radio or follow your ... Group online" and "If there was an earthquake"; the Sign Language page says "Follow your ... Group online" and "If you felt an earthquake". The app uses the main page wording.
Warning channels differ: Get Ready lists the NEMA website, radio, TV, Emergency Mobile Alert, siren, phone, text, loud hailer; Civil Defence lists civildefence.govt.nz and Twitter @NZCivilDefence. The Twitter handle looks dated, so it is not shown; the app shows radio, TV and Emergency Mobile Alert.
Gaps (said on screen, "follow local advice"): vertical evacuation or upper floors are not mentioned by any NEMA page; the only "can't get out" guidance is "go as far or as high as you can. Every metre makes a difference", and the app does not advise going up buildings. People who cannot walk, run or cycle: only the vehicles line ("limited to emergency services and those with mobility impairments"). What to do if not sure the earthquake was long or strong: not stated; the not-sure screen shows the self-evacuate rule and the small-earthquake lake line first, then says the guidance doesn't say, and lets the person choose. When it is safe to go back into a damaged building: not stated.
Boats: advice is only on the Civil Defence sector page (Get Ready has none), under "Local source tsunami". The 50 metres depth and the ten-minute beach-and-walk rule are shown as printed. No ten-minute timer: the ten minutes count from the natural warning, which the app cannot know, so a timer started on that screen would mislead. Small boats already in deep water: only "continue to head to deeper water"; gap stated. The "leave your boats" line for marinas sits under the activity advisory (its exact place on the page was not confirmed), so it is on the advisory screen; the dock line under local source is on the boat-dock screen.
Informal warnings: "consider evacuating" is judgement (trap 8), shown as text; the person chooses.
Outside evacuation zones: Section D says people outside the zones do not need to evacuate; reached from the official-warning and prepare screens only, not from Long or Strong (Section D says anyone near the coast who feels a long or strong earthquake should self-evacuate).
Not on screen: preparation advice (insurance, make a plan, supplies, h\u012Bkoi planning) except a one-line h\u012Bkoi reminder at the end; background on tsunami types and speeds; Coastal Navigational Warnings via RCCNZ (background for mariners); lake causes list (background).

Outside-zone: the address search is preparation advice, so it is on the prepare route only; during an alert, "not sure of my zone" is a gap, stated, with a choice to go.
"If these routes appear slow or congested, use a different route" is from the prepare-to-evacuate list (distant tsunami); shown on the shared on-the-way screen for everyone.

A tsunami is a series of powerful waves with strong current.
They can be caused by an earthquake, volcanic eruption, landslide or even a meteorite impact.
They can travel many thousands of kilometres across the oceans at speeds of up to 800 kilometres per hour.
Tsunami waves contain considerable energy.
They travel much further compared to ordinary coastal waves.
Even small tsunami can be dangerous to those in or near the water.
New Zealand\u2019s entire coastline and some of our larger lakes are at risk of tsunami.
Tsunami can flood our shores, causing property damage, injuries and loss of life.
The biggest tsunami in New Zealand are likely to be caused by events close to our shore and can arrive within minutes.
There are three different types of tsunami, depending on where they start.
Distant tsunami are generated from a long way away, such as from across the Pacific in Chile.
In this case, we will have more than three hours warning time for New Zealand.
There will be time for official warning messages.
Regional tsunami are generated between one and three hours travel time.
An eruption from an underwater volcano in the Kermadec Trench to the north of New Zealand could create a regional tsunami.
There will be time for official warning messages.
Local tsunami come from very close to New Zealand.
In this case, there won't be time for an official warning.
People in coastal areas need to take immediate action.
Remember: Long or Strong, Get Gone.
If you feel an earthquake that makes it hard to stand or lasts more than a minute, move immediately to higher ground or as far inland as possible out of tsunami evacuation zones.
Remember if an earthquake is LONG or STRONG, GET GONE.

Lake tsunami

==================== SECTION D: civildefence.govt.nz consistent messages, "Response: What to do during a tsunami" ====================

Response: What to do during a tsunami
This page provides tsunami response messages.
For a local-source tsunami which can arrive in minutes, there is not enough time for an official warning.
It is important to recognise the natural warning signs and act quickly.
Remember, LONG or STRONG, GET GONE.
If there is earthquake shaking, drop, cover and hold.
Protect yourself from the earthquake first, then act as soon as the shaking stops.
If you are near the coast, you need to act immediately if you experience any of the following:
- Feel a strong earthquake that makes it hard to stand up, or a weak rolling earthquake that lasts a minute or more.
- See a sudden rise or fall in water level.
- Hear loud and unusual noises from the water.
Move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.
Do not wait for official warnings.
Walk, run or cycle, if you can.
This reduces the chances of getting stuck due to damaged roads or traffic congestion.
While evacuating, be aware of other hazards.
For example, a large local earthquake may damage powerlines and bridges and create liquefaction and landslides.
Do not return until an official all-clear message is given by Civil Defence Emergency Management.
Tsunami activity can continue for several hours, and the first wave may not be the largest.
If there was an earthquake, expect aftershocks.
Each time you feel one, drop, cover, and hold.
Aftershocks may generate another tsunami.
Listen to the radio and/or TV for updates, local CDEM Groups' websites and social media and @NZCivilDefence Twitter.
When tsunami travel across the ocean from far away, there is time to issue official warnings.
The National Emergency Management Agency is responsible for issuing tsunami warnings in New Zealand.
Tsunami warnings are published on www.civildefence.govt.nz and Twitter @NZCivilDefence.
Tsunami warnings will also be broadcast on radio and television.
If there is a land threat, Emergency Mobile Alerts (EMA) will be issued by the National Emergency Management Agency and Civil Defence Emergency Management Groups to areas under threat.
If strong and unusual currents and unpredictable surges are expected near the shore, a local EMA may be issued by your local Civil Defence Emergency Management Group.
Your local area may have its own methods for broadcasting warnings.
These might include sirens, phone calls, local EMAs, or warnings through loud hailers.
Contact your local Civil Defence Emergency Management Group or your local council to find out about the warnings you can expect to receive in your area.
Immediately follow the advice of any emergency warning.
Do not wait for more messages before you act.
Depending on the location of the earthquake, you may have a number of hours in which to take appropriate action.

Tsunami threat to land and marine areas warning
A tsunami threat to land and marine areas warning will be issued when coastal inundation (flooding of land areas) is expected, and unusually strong and hazardous currents and unpredictable surges are expected near the shore.
The land warning may apply to all of New Zealand's coastline, or only to certain areas.
A land warning means that evacuations may be required in some areas.
An Emergency Mobile Alert will be issued to the areas under land threat.
This will advise people to evacuate immediately or prepare to evacuate.
Listen to local Civil Defence Emergency Management authorities and follow any instructions regarding evacuation of your area.

Tsunami activity advisory
A tsunami activity advisory will be issued when inundation of land areas near the shore is not expected (although this assessment may change), but strong and unusual currents and unpredictable surges are expected near the shore.
The tsunami activity advisory may apply to all of New Zealand's coastline or only certain areas.
Strong currents and surges can injure and drown people.
There is a danger to swimmers, surfers, people fishing, small boats and anyone in or near the water close to shore.
Evacuation of land areas is not required but people should stay out of the water (sea, rivers, and estuaries, including boats) and stay off beaches and shore areas when a tsunami activity advisory is issued.
Do not go swimming, surfing, fishing or engage in small boat activities when a tsunami activity advisory is issued.
People on boats, liveaboards and at marinas should leave their boats/vessels and move onto shore. Do not return to boats unless instructed by Civil Defence.
[exact position of the line above within this section not confirmed]

[Informal warnings]
A tsunami warning could also come from friends, neighbours, your community or international media.
If you trust them and you feel unsafe, consider evacuating.
If you feel a tsunami threat is imminent, move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.
Check the accuracy of the warning once you have arrived at your safe location or en route only if it won't slow you down.
You can check the warnings at civildefence.govt.nz or via TV/radio broadcasts, news websites, or through your local Civil Defence Emergency Management Group and emergency services.
If official warnings are available, trust their message over informal warnings.

[Evacuation]
Anyone near the coast who feels a long or strong earthquake should self-evacuate as soon as the shaking stops.
Do not wait for an official warning.
If you are inside a tsunami evacuation zone when a tsunami is expected, you may need to evacuate.
If you are outside of tsunami evacuation zones you do not need to evacuate.
If you stay where you are, it will help to reduce congestion for those who must evacuate.

Advised to evacuate immediately
Land and marine tsunami warnings for local and regional tsunami will advise people near the coast in affected areas to evacuate immediately.
The National Emergency Management Agency will issue an Emergency Mobile Alert to areas under land threat advising people near the coast in affected areas to evacuate immediately.
Civil Defence Emergency Management Groups will also issue supporting Emergency Mobile Alerts providing local information.
Do not wait for an Emergency Mobile Alert if you felt a long or strong earthquake.
Self-evacuate as soon as the shaking stops.
Remember, LONG or STRONG, GET GONE.
If you are advised to evacuate immediately, you should:
- Move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.
- Walk, run or cycle, if you can.
  This reduces the chances of getting stuck due to damaged roads or traffic congestion, especially in a local source tsunami event where there may only be a few minutes available to get to safety.
- Use of vehicles on roads should be limited to emergency services and those with mobility impairments, including wheelchair users.
- If you have to drive, keep going once you are well outside of all evacuation zones, to allow room for others behind you.
- Evacuate via the routes shown on tsunami evacuation route signs or drawn on tsunami evacuation maps if these are available.
- Take your grab bag with you if possible, but do not travel into the evacuation zone to collect your grab bag or other belongings.
- Take your animals with you only if it will not delay you.

In a local source tsunami, which can arrive in minutes, you need to take action quickly.
Be aware of the natural warning signs:

- Feel a strong earthquake that makes it hard to stand up, or a weak rolling earthquake that lasts a minute or more.
- See a sudden rise or fall in water level.
- Hear loud and unusual noises from the water.
Offshore:
- You may feel the earthquake through the hull of your boat.
- You could see a rapid and extreme shift in currents and simultaneous changes in wind wave heights.
If you are on land or tied up at dock, and you see or hear natural warning signs of a tsunami, leave your boat, move immediately to the nearest high ground or as far inland as you can, out of tsunami evacuation zones.
If you are on the water shallower than 50 metres or 27.3 fathoms depth:

- Free the vessel from any bottom attachment and gear that might drag in currents (cut lines if necessary).
- If you can beach or dock your small boat and evacuate on foot within ten minutes of a natural warning, then this is your best chance.
- If evacuation on foot is not possible, head for the deepest water possible, greater than 50 metres deep.
- Proceed directly away from the shore.
- Sail directly into waves. Be aware that tsunami can interact with wind waves and produce unusual effects.
- Maintain as much separation as possible from other vessels.
If you are on the water at greater than 50 metres outside of harbours/channels, continue to head to deeper water which is safer from tsunami currents and waves.
Do not return to port if you are at sea and a tsunami warning is issued.
Port and harbour facilities may become damaged and hazardous with debris.
Listen to maritime radio reports to find out when it is safe to return and be careful navigating when you return as the seafloor may have changed and there may be debris.

Check with your local harbourmaster to find out what your local tsunami response procedures are.

Do not return until an official all-clear message is given by Civil Defence Emergency Management.
Tsunami activity will continue for several hours and the first wave may not be the largest.
If there was an earthquake, expect aftershocks. Each time you feel one, drop, cover, and hold.
Aftershocks may generate another tsunami. Be prepared to evacuate.
Be cautious in and around coastal water, tidal estuaries, rivers and streams after any tsunami or tsunami warning, as even small waves create dangerous currents that can injure or drown people.
[Lake tsunami]
Tsunami can happen at inland locations in lakes and other large bodies of water \u2013 not only on the coast.
Lake tsunami can be caused by earthquakes, landslides (starting above the lake or underwater), rock falls, volcanic eruptions, dam failures and glacier collapses.
Even a small earthquake could trigger a large landslide at a mountain lake or fiord/sound that generates a tsunami.
In these cases, natural warning signs may be weak or unnoticeable.
It is important to recognise natural warning signs and act quickly.
If you are at a lake or any other large body of water, move away from the water's edge to higher ground immediately if you experience any of the following:
- Feel a strong earthquake that makes it hard to stand up, or a long weak rolling earthquake that lasts a minute or more.
  Remember: LONG or STRONG, GET GONE.
- See a sudden rise or fall in water level, or unusual waves or water behaviour without an obvious cause (such as the wind or a boat).
- See indications of landslides or rock falls occurring (for example, rocks falling or large dust clouds).
- Hear loud and unusual noises from the water or surrounding area (for example, glacier cracking or rocks falling).
More information about lake tsunami is available on the GeoNet website.
