<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guideline App Studio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Phone-first, portrait, large tap targets. One stylesheet for every generated app; looks (engine/looks/) restyle it.
   --brand is set by the runtime when the template gives "Brand colour:"; each look decides where it shows. */
:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:var(--brand, #0b6e4f); --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }
.bar { position: sticky; top: 0; z-index: 3; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#14213d; color:#fff; }
.bar .t { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .brand { font-weight:800; margin-right:6px; }
.bar .clock:empty { display:none; }
.bar .clock { font-variant-numeric: tabular-nums; font-size:18px; }
.proto { font-size:12px; color:var(--author); background:var(--authorbg); padding:4px 14px; }
.card { background:var(--card); margin:10px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); }
h1 { font-size:22px; margin:4px 0 8px; } h2 { font-size:21px; margin:2px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
p { margin: 8px 0; } p.bul::before { content:"• "; color:var(--mut); }
.big { display:block; width:100%; min-height:52px; margin:10px 0 0; padding:12px 14px; font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line); background:#eef1f4; color:var(--ink); text-align:left; }
.big.go { background:var(--go); color:#fff; border-color:var(--go); text-align:center; }
.big.opt { background:#e8f0fe; border-color:#b7c9f5; }
.big.opt.broken { border-style:dashed; border-color:var(--author); }
.big.skip { background:transparent; text-align:center; font-weight:500; color:var(--mut); }
.link { background:none; border:0; color:#1d4ed8; font:inherit; padding:0; }
.crumb { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); }
.q { font-weight:600; font-size:19px; margin-top:16px; }
.warn { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; font-weight:600; }
.author { background:var(--authorbg); color:var(--author); border-left:4px solid var(--author); padding:8px 10px; border-radius:6px; font-size:15px; }
.do { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.do input { width:26px; height:26px; margin:0; flex:none; } .do span { flex:1; }
.do .src, .do .dep { flex-basis:100%; margin-left:36px; }
.dep { display:block; color:var(--author); font-size:13px; }
details.src { font-size:14px; color:var(--mut); margin:2px 0 4px; } details.src summary { cursor:pointer; color:#1d4ed8; }
details.src q { font-style:italic; }
.timer { margin:14px 0; padding:12px; border-radius:10px; background:#eef6f2; text-align:center; }
.timer .lbl { color:var(--mut); font-size:14px; }
.big-clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
.timer.due { background:#fde8e8; } .timer.due .big-clock { color:var(--due); }
.reminders { position:sticky; top:44px; z-index:2; background:var(--bg); padding:6px 10px 0; }
.rem { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:6px; }
.rem .rt { flex:1; font-weight:600; font-size:15px; } .rem .rc { font-variant-numeric:tabular-nums; font-size:15px; }
.rem button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.rem.due { border-color:var(--due); background:#fde8e8; } .rem.due .rc { color:var(--due); font-weight:700; }
.rec { padding:6px 0; } .rec small { color:var(--mut); }
.rec-btn { background:#fff7e6; border-color:#f2c46d; }
.lookup { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
.lookup .lk { font-weight:600; } .lookup .lv { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px dashed var(--line); }
table { border-collapse:collapse; width:100%; font-size:14px; } th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; }
.inputs { margin:10px 0; } .inp { display:block; margin:10px 0; font-weight:600; }
.inp input { display:block; width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); margin-top:4px; }
.inp small { font-weight:400; color:var(--mut); } .inp .bad { color:var(--due); font-weight:400; font-size:14px; }
.choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.choices button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.choices button.on { background:#14213d; color:#fff; }
.log { padding-left:0; list-style:none; } .log li { padding:6px 0; border-bottom:1px solid var(--line); } .log time { display:inline-block; min-width:56px; font-variant-numeric:tabular-nums; color:var(--mut); }
.findings { padding-left:18px; } .findings li { margin:8px 0; font-size:15px; }
.lvl-fix { color:var(--due); } .lvl-check { color:var(--warn); } .lvl-info { color:var(--mut); }
.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
.tabs button { flex:1; font:inherit; font-size:15px; padding:14px 4px; background:none; border:0; color:var(--mut); }
.look-link { text-align:center; font-size:14px; margin-top:14px; }
.look-pick { display:flex; flex-wrap:wrap; gap:6px; }
.look-pick button { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
.look-pick button.on { background:var(--go); border-color:var(--go); color:#fff; }
.tabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 3px 0 #14213d; }

/* look: Clinic */

  --warn:#9a3412; --warnbg:#fff1e6; --due:#c2410c; --author:#6b21a8; --authorbg:#f4edfb; }html[data-look="clinic"], html[data-look="clinic"] body{ font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); }html[data-look="clinic"] .bar{ background:var(--bg); color:var(--ink); padding:14px 18px 6px; }html[data-look="clinic"] .bar .t{ font-size:15px; color:var(--mut); font-weight:600; }html[data-look="clinic"] .bar .clock{ background:var(--card); border-radius:999px; padding:4px 12px; font-size:15px; font-weight:600; color:var(--go); }html[data-look="clinic"] .proto{ background:transparent; color:var(--mut); padding:0 18px 4px; font-size:12px; }html[data-look="clinic"] .card{ border:0; border-radius:22px; padding:20px; margin:10px 12px; box-shadow:0 1px 2px rgba(22,35,43,.05), 0 8px 24px rgba(22,35,43,.06); }html[data-look="clinic"] h1, html[data-look="clinic"] h2{ font-family:"Inter", system-ui, sans-serif; font-weight:700; letter-spacing:-.02em; text-wrap:balance; }html[data-look="clinic"] h2{ font-size:24px; }html[data-look="clinic"] h3{ color:var(--go); }html[data-look="clinic"] .crumb{ font-size:13px; }html[data-look="clinic"] .crumb span{ background:var(--gosoft); color:var(--go); border-radius:999px; padding:2px 10px; font-weight:600; }html[data-look="clinic"] .big{ border-radius:16px; border:0; background:#f1f5f6; min-height:56px; }html[data-look="clinic"] .big.go{ background:var(--go); border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.25); }html[data-look="clinic"] .big.opt{ background:#f4f8f8; border:1.5px solid var(--line); position:relative; padding-right:40px; }html[data-look="clinic"] .big.opt::after{ content:"›"; position:absolute; right:16px; top:50%; transform:translateY(-52%); font-size:26px; color:var(--go); }html[data-look="clinic"] .q{ font-size:20px; }html[data-look="clinic"] .warn{ border:0; border-radius:14px; padding:12px 14px; }html[data-look="clinic"] .do{ border-bottom:0; background:#f6f9   --warn:#0a0a0a; --warnbg:#ffd400; --due:#e4002b; --author:#5b21b6; --authorbg:#efe9fb; }html[data-look="wayfinding"], html[data-look="wayfinding"] body{ font-family:"Archivo", "Helvetica Neue", Arial, sans-serif; background:var(--bg); }html[data-look="wayfinding"] .bar{ background:var(--ink); padding:12px 16px; }html[data-look="wayfinding"] .bar .t{ font-weight:800; letter-spacing:.01em; }html[data-look="wayfinding"] .bar .clock{ background:var(--sign); color:var(--ink); padding:2px 10px; font-weight:800; }html[data-look="wayfinding"] .proto{ background:#f2f2f2; color:var(--mut); }html[data-look="wayfinding"] .card{ border:0; border-radius:0; margin:0; padding:18px 18px 20px; }html[data-look="wayfinding"] h1, html[data-look="wayfinding"] h2{ font-weight:900; letter-spacing:-.02em; line-height:1.05; text-wrap:balance; }html[data-look="wayfinding"] h1{ font-size:32px; }html[data-look="wayfinding"] h2{ font-size:30px; margin-top:6px; }html[data-look="wayfinding"] .crumb{ flex-direction:row-reverse; justify-content:flex-end; gap:14px; align-items:center; }html[data-look="wayfinding"] .crumb span{ display:inline-grid; place-items:center; min-width:40px; height:40px; padding:0 8px; background:var(--route); color:#fff; font-weight:900; font-size:15px; border-radius:999px; }html[data-look="wayfinding"] .big{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:800; min-height:58px; }html[data-look="wayfinding"] .big.go{ background:var(--ink); color:#fff; border-color:var(--ink); text-align:left; position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.go::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }html[data-look="wayfinding"] .big.opt{ background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.opt::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }html[data-look="wayfinding"] .big.skip{ border:0; text-decoration:underline; }html[data-look="wayfinding"] .link{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] .q{ font-size:22px; font-weight:900; }html[data-look="wayfinding"] .warn{ background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }html[data-look="wayfinding"] .warn::before{ content:"!"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }html[data-look="wayfinding"] .do{ position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }html[data-look="wayfinding"] .do::before{ content:""; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }html[data-look="wayfinding"] .do input{ position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }html[data-look="wayfinding"] .do .src, html[data-look="wayfinding"] .do .dep{ margin-left:0; }html[data-look="wayfinding"] details.src summary{ color:var(--ink); text-decoration:underline; }html[data-look="wayfinding"] .timer{ background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }html[data-look="wayfinding"] .timer .lbl{ color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }html[data-look="wayfinding"] .timer::after{ content:""; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg, var(--sign) calc(var(--p, 0) * 100%), #333 0); }html[data-look="wayfinding"] .big-clock{ font-size:60px; font-weight:900; color:var(--sign); }html[data-look="wayfinding"] .timer.due{ background:var(--due); }html[data-look="wayfinding"] .timer.due .big-clock{ color:#fff; }html[data-look="wayfinding"] .rem{ border:2px solid var(--ink); border-radius:0; }html[data-look="wayfinding"] .rem button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .rem.due{ background:var(--sign); }html[data-look="wayfinding"] .choices button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .choices button.on{ background:var(--ink); color:#fff; }html[data-look="wayfinding"] .look-pick button{ border-radius:0; border:2px solid var(--ink); font-weight:700; }html[data-look="wayfinding"] .tabs{ border-top:2px solid var(--ink); }html[data-look="wayfinding"] .tabs button{ font-weight:800; color:var(--mut); }html[data-look="wayfinding"] .tabs button.on{ color:var(--ink); box-shadow:inset 0 4px 0 var(--route); }

/* look: Flight deck */
html[data-look="flightdeck"]{ --ink:#e8edf2; --mut:#8a97a6; --bg:#0b0f14; --card:#121820; --line:#253040; --go:#38bdf8; --warn:#ffb020; --warnbg:#2a1f08;
  --due:#ff5a4f; --author:#c4a1ff; --authorbg:#1f1830; color-scheme:dark; }html[data-look="flightdeck"], html[data-look="flightdeck"] body{ font-family:"IBM Plex Sans", system-ui, sans-serif; background:var(--bg); color:var(--ink); }html[data-look="flightdeck"] .bar{ background:#070a0e; border-bottom:1px solid var(--line); border-top:4px solid var(--brand, #070a0e); }html[data-look="flightdeck"] .bar .t{ font-family:"IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; text-transform:uppercase; letter-spacing:.08em; font-size:14px; color:var(--mut); }html[data-look="flightdeck"] .bar .clock{ font-family:"IBM Plex Mono", ui-monospace, monospace; color:var(--go); }html[data-look="flightdeck"] .proto{ background:#0f0b18; }html[data-look="flightdeck"] .card{ background:var(--card); border:1px solid var(--line); border-radius:4px; margin:8px; }html[data-look="flightdeck"] h1, html[data-look="flightdeck"] h2{ font-family:"IBM Plex Sans Condensed", "IBM Plex Sans", sans-serif; text-transform:uppercase; letter-spacing:.04em; font-weight:700; }html[data-look="flightdeck"] h2{ font-size:22px; border-bottom:1px solid var(--line); padding-bottom:10px; }html[data-look="flightdeck"] h3{ color:var(--warn); }html[data-look="flightdeck"] .crumb{ font-family:"IBM Plex Mono", monospace; font-size:12px; text-transform:uppercase; }html[data-look="flightdeck"] .link{ color:var(--go); }html[data-look="flightdeck"] .big{ border-radius:4px; background:transparent; border:1px solid var(--line); color:var(--ink); }html[data-look="flightdeck"] .big.go{ background:var(--go); color:#04121c; border-color:var(--go); text-transform:uppercase; letter-spacing:.06em; }html[data-look="flightdeck"] .big.opt{ background:#0f1a24; border-color:#1f3a50; color:var(--ink); }html[data-look="flightdeck"] .big.opt::before{ content:"▸ "; color:var(--go); }html[data-look="flightdeck"] .big.skip{ color:var(--mut); }html[data-look="flightdeck"] .q{ font-family:"IBM Plex Sans Condensed", sans-serif; text-transform:uppercase; letter-spacing:.04em; color:var(--go); }html[data-look="flightdeck"] .warn{ background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); border-radius:2px; text-transform:uppercase; font-size:15px; letter-spacing:.02em; }html[data-look="flightdeck"] .do{ border-bottom:1px dashed var(--line); font-weight:500; }html[data-look="flightdeck"] .do input{ accent-color:var(--go); border-radius:0; }html[data-look="flightdeck"] details.src summary{ color:var(--go); }html[data-look="flightdeck"] details.src{ color:var(--mut); }html[data-look="flightdeck"] .timer{ background:#06121b; border:1px solid #1f3a50; border-radius:4px; position:relative; }html[data-look="flightdeck"] .timer::after{ content:""; display:block; height:4px; margin-top:10px; background:linear-gradient(90deg, var(--go) calc(var(--p, 0) * 100%), #1c2633 0); }html[data-look="flightdeck"] .timer .lbl{ text-transform:uppercase; letter-spacing:.1em; font-size:12px; }html[data-look="flightdeck"] .big-clock{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-weight:500; color:var(--go); font-size:56px; }html[data-look="flightdeck"] .timer.due{ background:#2a0d0b; border-color:var(--due); }html[data-look="flightdeck"] .timer.due .big-clock{ color:var(--due); }html[data-look="flightdeck"] .reminders{ background:var(--bg); }html[data-look="flightdeck"] .rem{ background:var(--card); border-color:var(--line); border-radius:4px; }html[data-look="flightdeck"] .rem button{ background:transparent; color:var(--ink); border-color:var(--line); }html[data-look="flightdeck"] .rem.due{ background:#2a0d0b; border-color:var(--due); }html[data-look="flightdeck"] .lookup, html[data-look="flightdeck"] th, html[data-look="flightdeck"] td{ border-color:var(--line); }html[data-look="flightdeck"] .inp input{ background:#0b1118; color:var(--ink); border-color:var(--line); }html[data-look="flightdeck"] .choices button{ background:transparent; color:var(--ink); border-color:var(--line); border-radius:4px /* studio layout (the app's own styles are above, so the preview looks exactly like a built app) */
body { background:#e9ecf0; }
.studio-bar { background:#14213d; color:#fff; padding:10px 14px; }
.studio-bar h1 { font-size:18px; margin:0; } .studio-bar p { margin:2px 0 0; font-size:13px; opacity:.8; }
.stabs { display:flex; position:sticky; top:0; z-index:5; background:#fff; border-bottom:1px solid #dde1e6; }
.stabs button { flex:1; font:inherit; font-size:15px; padding:12px 4px; border:0; background:none; color:#5d6670; }
.stabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 -3px 0 #14213d; }
.pane { max-width:900px; margin:0 auto; padding:10px; }
textarea { width:100%; min-height:65vh; font:14px/1.45 ui-monospace, Menlo, monospace; padding:10px; border-radius:10px; border:1px solid #c9ced6; }
.row { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0; align-items:center; }
.row button, #examples button { font:inherit; font-size:14px; padding:9px 12px; border-radius:8px; border:1px solid #c9ced6; background:#fff; }
#count { font-size:14px; color:#5d6670; }
#checks { list-style:none; padding:0; } #checks li { background:#fff; border:1px solid #dde1e6; border-radius:8px; padding:8px 10px; margin:6px 0; font-size:15px; }
#checks .sum { color:#5d6670; }
#preview { max-width:420px; margin:0 auto; border:1px solid #c9ced6; border-radius:18px; overflow:hidden; background:#f4f5f7; position:relative; transform: translateZ(0); min-height:70vh; }
#preview #app { min-height:70vh; }
</style></head>
<body>
<div class="studio-bar"><h1>Guideline App Studio</h1><p>Template in, app out. Plain code, no AI · built 2026-11-20</p></div>
<nav class="stabs"><button id="tab-template" data-pane="template">Template</button><button id="tab-source" data-pane="source">Guideline text</button><button id="tab-checks" data-pane="checks">Checks</button><button id="tab-preview" data-pane="preview">Preview</button></nav>
<section class="pane" id="pane-template">
  <div class="row"><span>Examples:</span><span id="examples"></span></div>
  <textarea id="tpl" spellcheck="false" aria-label="Template"></textarea>
  <div class="row"><button id="dl-tpl">Copy template</button><button id="dl-app">Copy app code</button><span id="count"></span></div>
</section>
<section class="pane" id="pane-source" hidden>
  <p>Optional: paste the guideline's own text here. Every "Quote:" in the template is then checked word for word against it, and numbers the template never uses are listed.</p>

> HOW TO USE THIS TEMPLATE

About: One sentence on what the app helps someone do.

### Example dose

|---|---|---|

`, source: "" }, { name: "Cooling freshly cooked food", template: `# Cooling freshly cooked food

About: Times the two cooling stages for a batch of freshly cooked food and says what to do at each limit.
Source: MPI Yellow Card S39-00002, Cooling freshly cooked food - https://www.mpi.govt.nz/dmsdocument/16660/direct
Audience: Food business staff using an MPI food control plan
Reviewed by:

## Steps

### start: Get ready to cool
Say: Start this when the cooked food has dropped to 60\xB0C. The 6-hour clock runs from now.
Quote: "When cooling freshly cooked food it must get from:"
Remind: after 6 hours: 6-hour limit: food not at 5\xB0C or below now must be thrown out
Quote: "60\xB0C to 5\xB0C (or below) in less than 6 hours or it must be thrown out"
Say: Use any of these methods, or a combination:
Quote: "Use any (or a combination) of these methods:"
Do: Shallow containers
Quote: "placing your food into shallow containers"
Do: Ice bath
Quote: "using an ice bath"
Do: Smaller portions
Quote: "separating your food into smaller portions"
Do: Blast chiller
Quote: "placing your food in a blast chiller"
Next: stage-1

### stage-1: Stage 1: cool to 21\xB0C or room temperature
Say: Cool the food to room temperature or 21\xB0C, whichever is colder, within 2 hours.
Quote: "60\xB0C to room temperature or 21\xB0C (whichever is colder) in less than 2 hours"
Say: The whole cool-down, from 60\xB0C to 5\xB0C or below, must take less than 6 hours.
Quote: "60\xB0C to 5\xB0C (or below) in less than 6 hours or it must be thrown out"
Timer: 2 hours -> stage-1-late
Ask: Has the food reached room temperature or 21\xB0C (whichever is colder)?
- Yes -> stage-2
- No, 2 hours are up -> stage-1-late

### stage-1-late: Stage 1 took longer than 2 hours
Warning: The food did not reach room temperature or 21\xB0C within 2 hours.
Say: The card does not say what to do in this case. Follow your food control plan or ask your supervisor.
Note: Gap in the guideline: the card states the 2-hour limit but gives no action if it is missed (only the 6-hour "thrown out" rule).
Ask: What has been decided?
- Keep cooling -> stage-2
- Throw it out -> discard

### stage-2: Stage 2: fridge, cool to 5\xB0C
Do: Put the food in the fridge.
Note: From the card's "Check" section ("refrigerate once at room temperature or 21\xB0C"); its exact words were not available, so there is no quote.
Say: Cool from room temperature or 21\xB0C to 5\xB0C or below within 4 hours.
Quote: "then room temperature or 21\xB0C (whichever is colder) to 5\xB0C (or below) in less than 4 hours."
Timer: 4 hours -> stage-2-late
Ask: Is the food at 5\xB0C or below?
- Yes -> cooled
- No, 4 hours are up -> stage-2-late

### stage-2-late: Not at 5\xB0C after 4 hours
Warning: Food that has not reached 5\xB0C or below within 6 hours of starting must be thrown out.
Quote: "60\xB0C to 5\xB0C (or below) in less than 6 hours or it must be thrown out"
Say: The "6-hour limit" bar at the top shows how long is left.
Note: Possible contradiction: stage 2 allows 4 hours, but if stage 1 was quick the 6-hour total may not yet be up. The card does not say which limit wins.
Ask: Has the 6-hour limit been reached?
- Yes -> discard
- Not yet -> keep-cooling

### keep-cooling: Keep cooling (within the 6 hours)
Say: Keep the food cooling in the fridge. The "6-hour limit" bar at the top shows how long is left.
Note: No new 4-hour timer here: the 4 hours already ran out, and the 6-hour limit is the one left to apply.
Ask: Is the food at 5\xB0C or below?
- Yes -> cooled
- No, and the 6-hour limit is reached -> discard

### discard: Throw the food out
Stop: all
Warning: Throw the food out.
Quote: "60\xB0C to 5\xB0C (or below) in less than 6 hours or it must be thrown out"
Do: Record what was thrown out and why.
End:

### cooled: Cooled in time
Stop: all
Say: The food is cooled. Keep it at 5\xB0C or below.
Do: Record the food, the date it was cooked and how long it took to cool. (The Log tab has the times.)
End:

## Notes
The card's "Check" and "Show" sections (refrigerate at 21\xB0C, check at 4 hours, keep a record per batch) were not available word for word; the steps that use them carry no quote.
`, source: "Making + Cooking\n\nYellow Card / S39-00002 / Cooling freshly cooked food\n\nWhat do you need to know?\n\u2022 You must cool food correctly, so that it does not stay\nin the temperature danger zone (5\xB0C\u201360\xB0C) long\nenough for bugs to grow to unsafe levels.\n\n\u2022 If you don\u2019t cool hot food quickly, bugs will grow and\nmake your food unsafe and unsuitable.\n\nWhat do you need to do?\n\u2022 Cool food quickly to stop bugs growing or producing\ntoxins.\n\u2022 When cooling freshly cooked food it must get from:\n\n \u25E6 60\xB0C to 5\xB0C (or below) in less than 6 hours or it\nmust be thrown out,\n\n \u25E6 60\xB0C to room temperature or 21\xB0C (whichever\nis colder) in less than 2 hours, then room\ntemperature or 21\xB0C (whichever is colder) to 5\xB0C\n(or below) in less than 4 hours.\n\n\u2022 Use any (or a combination) of these methods:\n(tick as appropriate):\n\n placing your food into shallow containers\n using an ice bath\n separating your food into smaller portions\n placing your food in a blast chiller\n" }, { name: "Burns first aid", template: `# Burns first aid

About: Walks a first aider through calling for help, cooling a burn for 20 minutes and covering it.
Source: Hato Hone St John first aid library, Burns - https://www.stjohn.org.nz/first-aid/first-aid-library/burns/
Version: St John web page, read 18 Nov 2026 (no review date shown)
Audience: Anyone giving first aid for a burn
Warning: If you have a person in urgent need of medical attention, call 111 now.
Reviewed by:

## Steps

### start: What caused the burn?
Say: Check that the person is happy for you to touch them before you give first aid.
Quote: "Check that the person is happy for you to touch them before you give first aid"
Say: If they are unconscious and need lifesaving first aid, don't delay.
Note: Reworded from the same Quick help item; no exact quote captured.
Say: A dry cough can mean smoke or fire has damaged the airway: choose "Smoke or gas".
Note: Reworded from "What to look for"; no exact quote captured.
Ask: What caused the burn?
- Heat, hot liquid or a hot object -> call-check
- A chemical (or bitumen) -> chemical
Note: Electricity is named on the page as a cause, but it gives no separate steps, so there is no answer for it.
- Smoke or gas: burns in the mouth or throat -> smoke
- Clothing is on fire -> on-fire

### call-check: Does this need an ambulance?
Say: Call 111 for an ambulance if any of these is true:
- The burn is larger than half the person's arm.
Quote: "Call 111 for an ambulance if the area of the burn is larger than half the person\u2019s arm;"
- The burn causes severe pain.
- The burn involves the eyes.
Note: Severe pain and eyes are from the same Quick help list; only the "half the person's arm" line was captured word for word.
Ask: Is any of these true?
- Yes: call 111, then start cooling -> call-111
- No -> cool

### call-111: Call 111
Do: Call 111 for an ambulance.
Quote: "Call 111 for an ambulance if the area of the burn is larger than half the person\u2019s arm;"
Say: Start cooling the burn while you wait.
Next: cool

### chemical: Chemical burn
Warning: Call 111 for an ambulance urgently.
Quote: "Call 111 for an ambulance urgently."
Do: Call 111.
Do: Remove contaminated clothing. If the chemical is a powder, brush it off carefully.
Note: Reworded from the page; no exact quote captured.
Do: Soak the area with lots of water.
Quote: "Soak the area with lots of water"
Do: If the eyes are affected, rinse the eyes and under the eyelids with water.
Note: Reworded from the page; no exact quote captured.
Do: Bitumen: very carefully try to crack the bitumen with scissors, taking care not to damage the skin underneath.
Quote: "Very carefully try to crack the bitumen with scissors taking care not to damage the skin underneath"
Say: The page does not say how long to soak a chemical burn. Follow the advice of the 111 call taker.
Note: Gap in the guideline: no soaking time for chemical burns, so this route does not use the 20-minute heat-burn timer.
Next: cover

### smoke: Burns in the mouth or throat
Warning: The throat, airway and lungs may be damaged. Call 111 urgently.
Note: Reworded from the page; no exact quote captured for this line.
Do: Move the person to a safe area, preferably outside into fresh air.
Quote: "Move the person to a safe area, preferably outside into fresh air."
Do: Call 111.
Say: If breathing is hard, help them into a position with the head and chest raised.
Note: Reworded from the page; no exact quote captured.
Note: Deliberate: the page's smoke section has no cooling or covering steps.
End:

### on-fire: Clothing on fire
Do: Smother the flames with a coat or blanket if you can.
Do: Stop, drop and roll: stop them running or waving their arms, get them to the ground and roll them to put the fire out.
Note: Both lines reworded from the page's "Clothing on fire" section; no exact quote captured.
Next: call-check

### cool: Cool the burn for at least 20 minutes
Do: Pour cool water over the burn.
Quote: "Pour cool water over the burn for at least 20 minutes."
Say: Any cool, clean liquid can be used. A hand or foot can go in a bowl or bucket of water.
Note: Reworded from the page; no exact quote captured.
Do: Remove tight clothing or jewellery near the burn (it may swell), and clothing splashed with hot liquid or chemicals.
Note: Reworded from the page; no exact quote captured.
Warning: Cool the burn, not the child. Do not put small children or babies into a cold bath or shower for a full 20 minutes.
Quote: "Put small children or babies into a cold bath or shower for a full 20 minutes"
Say: Use cool, not cold, water.
Quote: "Remember to cool the burn not the child, so use cool (NOT cold) water."
Note: The quote sits under the page's "DO NOT" heading; the app adds "Do not" so the meaning is kept (lessons trap 10).
Say: Don't break blisters, remove anything stuck to the burn, or put creams or lotions on it.
Note: From the page's "DO NOT" list, reworded; no exact quote captured.
Timer: 20 minutes -> cover
Say: The timer shows the minimum. The page says "at least" 20 minutes and gives no upper limit.
Note: Lessons trap 6: "at least 20 minutes" sets a minimum only. The page does not say what to do if 20 minutes of cooling is not possible.
Ask: Has the burn been cooled for at least 20 minutes?
- Yes -> cover
- It can't be cooled for 20 minutes -> cool-short

### cool-short: Cooling cut short
Warning: The page does not say what to do if the burn can't be cooled for 20 minutes.
Say: Call 111 for advice if you are unsure.
Note: Gap in the guideline (lessons trap 13). Advice to call 111 rests on the page's closing line.
Quote: "If you have a person in urgent need of medical attention, call 111 now."
Next: cover

Note: Reworded from the page; no exact quote captured.
Say: If you have a person in urgent need of medical attention, call 111 now.
Quote: "If you have a person in urgent need of medical attention, call 111 now."
End:

## Notes
Source copy: the St John site blocks direct download. Thirteen lines were captured word for word; every other line is reworded from a fetch of the page and is marked with a Note and has no quote.
Gap: the page gives no soaking time for chemical burns (that route skips the 20-minute timer) and no action if 20 minutes of cooling cannot be done (shown on screen).
Electrical burns: named as a cause, but the page gives no separate steps.
Gap: the page does not say when to see a doctor after first aid for heat burns (its sunburn section does); the app shows only its closing 111 line.

`, source: "Burns - Hato Hone St John first aid library (https://www.stjohn.org.nz/first-aid/first-aid-library/burns/)\nExact lines only (each read from the page by a fetch tool, in two separate reads; the rest of the page could not be copied word for word).\n\nQuick help\nCheck that the person is happy for you to touch them before you give first aid\nCall 111 for an ambulance if the area of the burn is larger than half the person\u2019s arm;\nCool the burn by pouring cool liquid over it for at least 20 minutes.\nCover the burn by using a non-adhesive dressing or loose cling film.\n\nDO NOT\nPut small children or babies into a cold bath or shower for a full 20 minutes\n\nFirst: Cool the burn\nRemember to cool the burn not the child, so use cool (NOT cold) water.\nPour cool water over the burn for at least 20 minutes.\n\nThen: Cover the burn\nDon\u2019t use cling film on the face.\n\nChemical burns\nCall 111 for an ambulance urgently.\nSoak the area with lots of water\nVery carefully try to crack the bitumen with scissors taking care not to damage the skin underneath\n\nBurns in mouth or throat due to smoke or gas inhalation\nMove the person to a safe area, preferably outside into fresh air.\n\nClosing line\nIf you have a person in urgent need of medical attention, call 111 now.\n" }, { name: "Earthquake: Drop, Cover and Hold, then what to do after", template: `# Earthquake: Drop, Cover and Hold, then what to do after

About: Shows what to do while the ground is shaking, wherever you are, and then what to do when the shaking stops.
Source: Get Ready (NEMA), Earthquakes - https://getready.govt.nz/emergency/earthquakes/
Source: Get Ready (NEMA), Earthquakes, NZ Sign Language version - https://nzsl.getready.govt.nz/emergency/earthquakes
Version: Get Ready (NEMA) earthquakes page and its NZ Sign Language version (nzsl.getready.govt.nz/emergency/earthquakes), read 18 Nov 2026, no review date shown
Audience: Anyone in New Zealand during or just after an earthquake
Warning: Shaking now? Drop, Cover and Hold first. Read this when you are safe.
Reviewed by:

## Steps

### start: Shaking now: Drop, Cover and Hold
Do: Drop, Cover and Hold until the shaking is over.
Quote: "Drop, Cover and Hold until the shaking is over."
Warning: Do not run outside. You could be hit by falling bricks and glass.
Quote: "Do not run outside or you risk getting hit by falling bricks and glass."
Say: Use the version that works for your body.
Quote: "The best version of Drop, Cover, Hold is the one that works for your body and that you have practiced."
Ask: Where are you?
- Inside a building -> indoors
- In bed -> in-bed
- I have a mobility problem, or use a cane, walker or wheelchair -> mobility
- Outside -> outside
- Driving -> driving
- In a lift -> lift
- Somewhere else -> elsewhere

### mobility: Your version of Drop, Cover and Hold
Say: Use the version that works for your body.
Quote: "The best version of Drop, Cover, Hold is the one that works for your body and that you have practiced."
Ask: Which is closest to you?
- I have a mobility impairment or use a cane -> cane
- I can't get up from the floor without help -> cane
- I use a walker or wheelchair -> wheelchair

### indoors: Inside: Drop, Cover and Hold
Warning: If you can't get up from the floor without help, don't drop to the ground.
Quote: "If you can\u2019t get up from the floor without help, don\u2019t drop to the ground in an earthquake."
Do: Drop down on your hands and knees, or as low as you can.
Quote: "Drop down on your hands and knees or as low as you can."
Say: If you can't drop to the floor, brace yourself against a wall or sturdy furniture.
Quote: "Brace yourself against a wall or sturdy furniture if you cannot drop to the floor."
Do: Cover your head and neck under a sturdy table or desk, if one is a few steps away.
Quote: "COVER your head and neck (or your entire body if possible) under a sturdy table or desk (if it is within a few steps of you)."
Say: No shelter nearby? Cover your head and neck with your arms and hands.
Quote: "If there is no shelter nearby, cover your head and neck with your arms and hands."
Do: Hold on to your shelter, or your position, until the shaking stops.
Quote: "HOLD on to your shelter (or your position to protect your head and neck) until the shaking stops."
Say: Under a table, hold on to the table legs. If the shaking moves your shelter, move with it.
Quote: "Hold on to the table legs to keep it from moving away from you."
Quote: "If the shaking shifts your shelter around, move with it."
Say: Keep away from windows and tall furniture. Not in a doorway.
Quote: "Away from windows that can shatter and cause injury."
Quote: "And away from tall furniture that can fall on you."
Quote: "Not in a doorway."
Say: In most homes a doorway is no stronger than the rest of the house, and a swinging door can cause more injury.
Quote: "In most homes, doorways are not stronger than any other part of a house and a swinging door can cause more injury."
Note: The table, no-shelter, hold and move-with-it lines are only on the Sign Language page (Section B). The windows, tall furniture and doorway lines come from its "Get ready" list of safe spaces.
Next: shaking-stops

### in-bed: In bed: stay in bed
Do: Stay in bed. Pull the sheets and blankets over you.
Quote: "If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck."
Do: Use your pillow to protect your head and neck.
Quote: "If you are in bed, stay in bed and pull the sheets and blankets over you and use your pillow to protect your head and neck."
Note: Only on the Sign Language page (Section B).
Next: shaking-stops

### cane: Using a cane, or can't get up from the floor
Warning: If you can't get up from the floor without help, don't drop to the ground.
Quote: "If you can\u2019t get up from the floor without help, don\u2019t drop to the ground in an earthquake."
Do: Get as low as you can, or sit in a chair, on the side of the bed or on a couch.
Quote: "If you have a mobility impairment or use a cane, get as low as you can or sit on in a chair, on the side of the bed or on a couch."
Do: Cover your head and neck with both hands.
Quote: "Cover your head and neck with both hands."
Do: Curl your body as much as you can into your lap.
Quote: "Curl your body as much as you can into your lap."
Say: Keep your cane near you so you can use it when the shaking stops.
Quote: "Keep your cane near you so you can use it when the shaking stops."
Note: The cane lines are only on the Sign Language page (Section B). Its "sit on in a chair" is a typo on the page; the quote keeps it as written and the screen says "sit in a chair".
Next: shaking-stops

### wheelchair: Walker or wheelchair: Lock, Cover and Hold
Do: Lock your wheels and get as low as you can.
Quote: "Lock your wheels and get as low as you can."
Do: Cover your head and neck with both hands if you can.
Quote: "Cover your head and neck with both hands if you can."
Do: Curl your body as much as you can into your lap.
Quote: "Curl your body as much as you can into your lap."
Do: Hold on until the shaking stops.
Quote: "Hold on until the shaking stops."
Note: Only on the Sign Language page (Section B): "If you use a walker or wheelchair, Lock, Cover and Hold."
Next: shaking-stops

### outside: Outside
Do: If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold.
Quote: "If you are outside, move no more than a few steps away from buildings, trees, streetlights and power lines, then Drop, Cover and Hold."
Say: The guideline's wording here is unclear: it does not plainly say how far to move, or which way. Follow local advice.
Do: Drop down on your hands and knees, or as low as you can.
Quote: "Drop down on your hands and knees or as low as you can."
Do: Cover your head and neck if you can.
Quote: "Cover your head and neck if you can."
Do: Hold on to your position or shelter.
Quote: "Hold on to your position or shelter."
Say: The guideline does not give advice for crowds, or for being near cliffs or steep slopes. Follow local advice.
Note: Only on the Sign Language page (Section B). The screen shows the outside sentence word for word because it is ambiguous (it can be read as "stay within a few steps of buildings"); the app does not choose a reading. Gap: nothing on cliffs, slopes or crowds outdoors. The Drop, Cover and Hold how-to lines are from Section A.
Next: shaking-stops

### driving: Driving
Do: Pull over to a clear place and stop.
Quote: "If you are driving, pull over to a clear location."
Quote: "Stop."
Do: Wait there with your seatbelt on until the shaking stops.
Quote: "Wait there with your seatbelt fastened until the shaking stops."
Say: When the shaking stops, drive with caution. Avoid bridges and ramps: they may be damaged.
Quote: "Once the shaking stops, proceed with caution and avoid bridges or ramps as they may have been damaged."
Note: Only on the Sign Language page (Section B).
Next: shaking-stops

### lift: In a lift
Say: If you are in a lift, Drop, Cover and Hold.
Quote: "If you are in an elevator, Drop, Cover and Hold."
Do: Drop down on your hands and knees, or as low as you can.
Quote: "Drop down on your hands and knees or as low as you can."
Do: Cover your head and neck if you can.
Quote: "Cover your head and neck if you can."
Do: Hold on to your position or shelter.
Quote: "Hold on to your position or shelter."

Say: The guideline does not say what to do if the lift is stuck. Follow local advice.
Note: Only on the Sign Language page (Section B). Gap: nothing on a stuck lift.

### elsewhere: Somewhere else
Say: In an earthquake, Drop, Cover and Hold.
Quote: "In an earthquake Drop, Cover and Hold."
Do: Drop down on your hands and knees, or as low as you can.
Quote: "Drop down on your hands and knees or as low as you can."
Do: Cover your head and neck if you can.
Quote: "Cover your head and neck if you can."
Do: Hold on to your position or shelter.
Quote: "Hold on to your position or shelter."
Say: The guideline does not give separate advice for crowds, a moving bus or train, being near a cliff or slope, or holding a baby or child. Follow local advice.

Note: The "those in charge" line is in the page's "after an earthquake" list, so the screen starts it with "When the shaking stops"; it is the only line on public transport.
Next: shaking-stops

### shaking-stops: When the shaking stops: near the coast?
Say: If you are near the coast, remember: Long or Strong, Get Gone.
Quote: "If you are near the coast remember, Long or Strong, Get Gone."
Ask: Are you near the coast?

- No -> after

### long-strong: Long or Strong, Get Gone
Say: Long: the earthquake lasted longer than a minute. Strong: it was hard to stand.
Quote: "If the earthquake lasts longer than a minute or is strong enough to make it difficult to stand, move quickly to the nearest high ground or as far inland as you can out of tsunami evacuation zones."

For the purposes of online-only submission, Saturdays and Sundays count as calendar days.

The lateness penalty applied will be a total of 10 marks deducted from the total available marks for the assignment:

ii. Friday 8th March \u2013 5-mark late penalty.

[Table, not quoted word for word: columns "Due Date" and "Day 1 (overdue)" to "Day 7 (overdue)". On the due date, up to "Midday 12pm noon" is "No penalty" and "Midday-midnight" is "5 mark deduction". Each overdue day adds 5 marks, from "10 mark deduction" on Day 1 to "40 mark deduction" on Day 7.]

Take-home tests

==================== SECTION A: Resignation ====================

Resignation
Find out what happens when an employee wants to leave their job (resign) and how an employer should respond.
Learn what happens after an employee resigns, from giving notice to the final day of work.

What resignation is
Resignation is when an employee tells their employer they want to leave their job.
It\u2019s also called \u2018quitting\u2019, \u2018giving notice\u2019 or \u2018handing in your notice\u2019

When an employee can resign
An employee can resign at any time.
This includes if they\u2019re on leave or annual holidays.
It\u2019s a bit different for fixed-term employees and employees who work casual hours.
If an employee is resigning because of issues in the workplace, there are some things they may want to do before they resign.

Fixed-term employees
A fixed-term employee must resign when they:
have a fixed-term employment agreement for an agreed period of work, and
want to leave before their agreed employment end date.
These employees should check their employment agreement first to see if there are any rules around ending their employment early.
If they finish work on the agreed employment end date, this is not a resignation.

Casual employment
An employee who works casual hours can accept or decline offers of work.
They must resign when they:
accept an offer of work, and
want to leave before completing that work.
If they do not accept an offer of work, this is not a resignation.
These employees often have an employment agreement with an employer that covers multiple periods of work.
If they want to permanently end the employment relationship with that employer, they can resign at any time.

If there are issues in the workplace
If an employee is thinking about resigning because of an issue in the workplace, they may want to talk to their employer first.
The issue might be able to be resolved without needing to resign.
If an employee is feeling forced to resign, they may also want to talk to their employer or get legal advice before resigning.

How to resign
Before resigning, employees should check their employment agreement.
It will usually say:
who they need to tell about their resignation, for example, a manager, team leader or HR
how much notice to give, and
how to resign (most agreements say to do this in writing).
The employment agreement may also have rules around working for another employer once the current employment has ended.
For example, the employee cannot work for another, similar, employer for a certain period of time.

Step 1 - Work out how much notice to give
The notice period is the length of time between:
the day the employee tells their employer they are resigning, and
their last day of employment (the end of the notice period).
Most employment agreements usually say how long the notice period must be, for example, 4 weeks.
If the agreement does not say what the notice period is, the employee must give \u2018reasonable notice\u2019.
The employer and employee can agree to make the notice period shorter or longer.
Any agreed change to the notice period should be recorded in writing.

Resigning while on parental leave
If an employee resigns while they\u2019re on parental leave:
their last day of employment is the day their parental leave started, and
they must give at least 21 days\u2019 notice before their parental leave ends, unless their employment agreement has a longer notice period.

Resigning while on defence force volunteers leave
If an employee resigns while they\u2019re on certain types of defence force volunteers leave:
their last day of employment might be the day their leave started \u2014 it depends on the situation, and
they must give a set notice period \u2014 it depends on the type of leave they\u2019re on.

Step 2 \u2013 Provide the resignation in writing
It\u2019s best to put the resignation in writing, even if the employment agreement does not say to do this.
This means there\u2019s a record of it which can help to avoid any misunderstandings.
Sending an email or giving a short letter are the most common ways to resign.
The email or letter should include:
that the employee is resigning, and
the employee\u2019s last day of employment (based on the notice period).
The employee does not have to say why they\u2019re resigning unless they want to.
Employees can use this resignation letter template to help.

How an employer can respond to a resignation
An employer must accept an employee\u2019s resignation.
It\u2019s good practice for the employer to acknowledge the resignation in writing.
Employers should respond to confirm:
they\u2019ve received the resignation
what the last day of employment will be (based on the notice period), and
if there\u2019s anything that needs to be done before the employee leaves, for example, handing over work and returning company property.
The employer\u2019s response can also include:
whether the employee is expected to work during all or part of the notice period
that final pay will be calculated and paid
whether they will provide a statement of service or reference.
If the employer has any concerns about the circumstances of the resignation, they should talk to the employee as soon as possible.
In some situations, the employer or employee may want to get legal advice.

What happens after an employee resigns
After an employee resigns, they will work through their notice period, unless they have agreed to a different arrangement with their employer.
There will be tasks the employer and employee need to complete on the employee\u2019s last day.
The employer will also need to sort out the employee\u2019s final pay.
It\u2019s important to check whether there are any workplace policies about resigning.
These may explain what\u2019s expected when leaving the workplace.
The employer and employee must also continue to meet their employment rights and responsibilities.
Some of these will continue after the employment ends.
For example:
the employer must continue to keep the employee\u2019s personal details private
the employee must continue to respect the employer\u2019s confidentiality and not share private work information.

During the notice period
During the notice period:
the employer and employee should agree a plan for managing work and responsibilities
the employer must pay the employee correctly
the employee can take leave and holidays in the usual way, for example, sick leave or annual holidays.
The employer and employee could also agree to another arrangement instead of the employee working the notice period.
For example, or payment in lieu of notice.
[As captured, this sentence reads "For example, or payment in lieu of notice." A second read confirmed it; a word may be missing on the page itself. Section B names garden leave and payment in lieu of notice as the two arrangements.]

Starting a new job during the notice period
If the employee wants to start a new job before their notice period has finished, they should:
check their employment agreement first, and
talk to their current employer as soon as possible.
The employee cannot start a new job if the employment agreement has a clause about secondary employment.
This clause will say that the employee cannot have more than one job at the same time.
There must be a genuine reason for this clause.
If the employment agreement has a clause like this, the employee can still talk to their current employer.
The employer can still agree that the employee can start a new job.
If the employment agreement doesn\u2019t have a clause like this, the employee should talk to their current employer.
Both parties should consider all the circumstances and act in good faith.
If the employee has 2 or more jobs, it could also affect how much tax they pay.

Final pay
When an employee resigns, their last pay must include their:
final wages
holiday pay, and
any other payments they\u2019re owed.

Last day and reference
On the employee\u2019s last day, the employer and employee both have tasks they need to complete.
For example, organising to return company property or setting up \u2018out of office\u2019 messages.
The employee can also ask for a statement of service and a reference.
The employer should provide a statement of service.
They do not have to provide a reference unless they\u2019ve agreed to this.

Resignation in the heat of the moment
Resignation in the \u2018heat of the moment\u2019 is when an employee is upset or angry, for example after an argument, and:
resigns, or
says something that makes it sounds like they are resigning.
Afterwards, once they have calmed down, they might change their mind.

What to do if an employee resigns in the heat of the moment
If an employee resigns in the heat of the moment and then changes their mind, they should:
speak to their employer as soon as possible, and
clear up the confusion.
If an employee resigns in the heat of the moment, the employer should check with the employee that they meant to resign.
They might want to give the employee a cooling-off period before checking in with them.
In these situations, it might not be appropriate to rely only on text messages.
This is because they can be open to interpretation.

Example - Employee walks out of work
Sonja has an argument with a workmate and leaves work angrily saying, \u201CI\u2019m out of here\u201D.
Her manager Vivian calls her later that day and asks what happened.
Sonja, still angry, tells her about the argument and that she is thinking about leaving due to the bad atmosphere.
Vivian tells her to take a day to think about it and get back to her.
Vivian calls Sonja again the next day and asks if Sonja still wants to resign.
Sonja says that she doesn\u2019t and asks Vivian to help resolve the bad working relationship with her workmate.
Sonja returns to work the next day, and Vivian makes a plan to help Sonja and her workmate sort out their issues.

Withdrawing a resignation
If an employee has resigned but later changes their mind, they can ask to withdraw their resignation.
Their employer does not have to agree.
But whatever they decide, they should respond to the employee in writing so there are no misunderstandings.

If an employee feels forced to resign
If an employee feels they have no choice but to resign, it could be considered constructive dismissal.
Constructive dismissal is a type of unjustified dismissal.
If an employee believes they have been constructively dismissed, they can raise a personal grievance.

==================== SECTION B: Notice periods ====================

Notice periods

What giving notice means
Giving notice means telling an employer or employee that the job is ending and when the last day of employment will be.
For example, an employee resigns or an employer dismisses an employee.
The notice period is the time between:
the day the employee or employer gives notice, and
the employee\u2019s last day of employment.
During the notice period, work carries on as normal unless another type of arrangement is agreed.
For example, payment instead of notice or leave instead of notice (garden leave).
This gives the employee and employer time to get ready for the employment ending, such as handing over work or planning next steps.

Last day of employment and last day at work
The last day of employment and the last day at work are not always the same.
The last day of employment is the end of the notice period.
The employee\u2019s last day at work could be before this, for example, if:
they take leave towards the end of the notice period, or
they are rostered to finish before their last day of employment.

Example of last day at work being earlier due to leave
For example, Rama gives 4 weeks\u2019 notice on Monday 10 November.
His last day of employment will be Friday 5 December.
Rama takes leave in the last 2 weeks of his notice period, from Monday 24 November to Friday 5 December.
This means his last day at work will be Friday 21 November.
This is 2 weeks earlier than his last day of employment.

Example of last day at work being earlier due to roster
For example, Megan gives 4 weeks\u2019 notice on Monday 10 November.
Her last day of employment will be Friday 5 December.
Megan is only rostered on until Wednesday 3 December.
This means her last day at work will be Wednesday 3 December.
This is 2 days earlier than her last day of employment.

How much notice to give
The employment agreement usually says what the notice period is.
If it does, this is the amount of notice that must be given.
For example, the employment agreement says the notice period is 4 weeks.
For an employee who works Monday to Friday, this means:
if notice is given on Monday 25 May, then
the employee\u2019s last day of employment will be Friday 21 June.
If there\u2019s no notice period in the employment agreement, then reasonable notice must be given.
A shorter or longer notice period could also be agreed to.
If an employee is on parental leave or certain types of defence force leave, the notice period could be different.
If an employee does not want to work the notice period, for example, because they feel unsafe, they should talk to their employer.
They can also seek legal advice if they need to.

Reasonable notice
Reasonable notice is given when there\u2019s no notice period in the employment agreement.
There\u2019s no set timeframe for a reasonable notice period.
Employers and employees must act in good faith when deciding what\u2019s reasonable.
This means discussing together how long reasonable notice should be and why.
Generally 2 to 4 weeks is seen as reasonable.
However, this will depend on:
the type of job and how long it will take to find someone else, for example, if it\u2019s a specialised role
how much training someone will need to take over the role
how long the employee has been in the job
how easy it will be for the employee to find another job
what usually happens in that industry, sector or workplace.

[Part about employees being made redundant left out: not about resigning.]

Exceptions for parental leave and certain types of defence force leave
The notice period is different for employees who are on parental leave or certain types of defence force leave.

Want a shorter notice period
If an employer or employee want a shorter notice period, both must agree.
If they both agree, the shorter notice period should be recorded in writing.

work together to assign and handover any ongoing work to someone else

another arrangement is agreed, for example, garden leave or payment instead of notice.

## Notes
Source copy: web-fetch of AUT's "Special consideration for an assessment" page (the site blocks direct download); eleven key lines were confirmed exact in a second read, but small wording slips are possible. Saving the page as a PDF into sources/ would make checking exact. No date or review date on the page.
Audience: AUT's page is university-wide and covers assignments and tests/exams together under "assessment". The banner says it is AUT's guidance and others should follow their own university (not repeated on the start screen). Screens say "due date (or test or exam date)" where timing matters, since the failing-grade line covers "assignment or examination".
Links not captured: the SCA tool link, the Student Impairment Report download, and the Student Medical Centre and AUTSA links. The app points students to AUT's page instead of inventing addresses. Student Hub email and phone are on the page and quoted.
Two routes through the reasons: conditions can only test inputs, not the route, so a student who says their due date has passed goes through their own copies of the reason screens (ids ending "-after"). These lead straight to the after-due-date apply screen, so the student is never asked again whether it is before or after the due date, and never gets the before-due-date evidence clock (lessons trap 6). The "-after" not-eligible screen does not offer a short extension (no longer possible). Keep the two copies the same when editing.
Short extension length: the page says "up to 3 days" (intro), "a short extension (3 days)" and "3 calendar days". The app uses "3 calendar days", the most specific (lessons trap 5); "up to" is shown on the start screen as printed.
Short extension deadline: "by midnight the day BEFORE" and the example "BEFORE midnight on Sunday 19 May" for a Monday 4pm due date. The app gives the example without the dates (20 May / 19 May) so it reads for any year; the quote keeps them.
Short extension checklist: the three eligibility rules (not a test/exam/controlled conditions, one per course, by midnight the day before) are on one screen with one yes/no question, to keep decisions few. The page does not say how a student is told the short extension is granted or what the new due time is (said on screen).
"Standard extension": used once on the page ("apply for the standard extension and provide evidence"); everywhere else it says special consideration / SCA. The page does not say whether these are the same thing; the app sends the student to the special consideration route (the SCA tool) and does not claim they are identical.
Commitments: applications for sporting, cultural, religious and AUT-related commitments "must be made before the date of the commitment". The app states this as a rule and asks whether the commitment date has passed. If it has, the app says plainly that the page requires applying beforehand, that it doesn't say whether a late application can be considered, and points to the Student Hub and AUTSA. If not, the student carries on to apply (the past-due copy goes straight to the after-due-date apply screen).
Not eligible: misreading dates, computer/printer problems (unless an officially notified failure of university equipment), losing data. The app offers the short extension (not on the past-due route) and sends an equipment-failure case to the "What to send" screen, which carries the "depends on the situation, explained in the SCA form" line.
Evidence timing (lessons trap 6): before/on the due date -> 5 working days from submitting the application; after the due date -> 5 working days from the original due date. Shown where the student applies, and again on the "What happens next" screen. The page does not define working days (public holidays, university closedowns); the "I'm not sure" screen says so and points to the Student Hub.
Student Impairment Report timing (lessons traps 5, 6, 13): the page says the report must "accompany your Special Consideration Application form", and separately that supporting evidence is due within 5 working days. It does not say whether the report can be uploaded later within that window. Both apply screens show both readings and point to the Student Hub; the app does not pick one.
Failing grade and notifying the teaching department: the page puts the failing-grade line under "If you apply AFTER the due date"; the app shows it on the after-due-date apply screen only, as a Do: to tell the teaching department, because the page makes notifying the department a condition. "Within the required time" and how to notify are not defined (said on screen).
Past due: more than 5 working days -> the page gives no route; the app says so and points to the Student Hub and AUTSA. "I'm not sure" -> its own screen (working days not defined; contact the Student Hub now; option to carry on and apply).
Medical/mental health: a Student Impairment Report from a suitably qualified person must accompany the application. Medical: AUT Student Medical Centre registered nurses, or an external practitioner using the downloaded form. Emotional/mental: Student Hub advisor (booking path quoted), or an external practitioner. Each route asks one question ("Who will fill in your report?") and then shows a short screen for that choice. On the mental-health screen the counselling line is first, so urgent support isn't at the bottom; no crisis phone numbers are added because the page gives none. COVID-19 uses the 'Medical' reason. "A medical reason (illness, injury, COVID-19)" is plain-English for the page's "Medical ... conditions". The page does not say what evidence is needed for bereavement, crime or other reasons ("explained in the SCA form").
Gaps (shown on screen): who decides, how long a decision takes, possible outcomes, any formal appeal (the only route is AUTSA advocates if the outcome feels unfair), what happens after 5 working days, whether a late commitment application can be considered, how a short extension is confirmed, how and when to notify the teaching department, whether the Student Impairment Report can follow the application.
No timer or reminder: the deadlines are calendar/working-day dates the app can't know, so it states them instead.
Not on screen: "Medical or other evidence needs to be provided" is covered by the report screens; the "Permissions request" heading is folded into the apply steps.

==================== Special consideration for an assessment ====================

Special consideration for an assessment

At some point during your study at AUT, your ability to attempt or prepare for an assessment may be seriously affected by exceptional circumstances beyond your control.
If this happens, you can apply for special consideration for that assessment.
You could also apply for a short extension of up to 3 days

How to apply for special consideration

When to submit your Special Consideration Application (SCA)
You can submit an SCA up to 5 working days after your assessment due date.

Evidence requirements - important timeline differences:
If you apply BEFORE or ON the due date:
- You must upload your supporting evidence within 5 working days of submitting your application.
If you apply AFTER the due date:
- You must upload your supporting evidence within 5 working days of the original assessment due date.
- If you don't have a valid reason for missing the due date or have not notified your AUT teaching department within the required time, you will receive a failing grade for your assignment or examination.

To apply for special consideration:
[The page shows a link or button here to the SCA tool; its label and address could not be captured.]

Permissions request
When you're accessing the tool for the first time, you'll be asked by Microsoft to approve access to the new software.
Make sure you click on \u2018accept\u2019 and proceed.

Examples of exceptional circumstances
Exceptional circumstances can be due to:
- Medical or emotional/mental conditions
- Bereavement
- Being a victim of crime
- Essential sporting, cultural or religious commitments (applications must be made before the date of the commitment)
- AUT-related commitments (applications must be made before the date of the commitment)
- Other circumstances
The specific requirements for your application will depend on the situation and are explained in the Special Consideration Application (SCA) form.

COVID-19
COVID-19 continues to affect students\u2019 lives and health.
You can apply for a special consideration for assessment if you have COVID-19 and are unwell or you\u2019re needing to isolate.
You can also apply if you're suffering from ongoing health effects due to COVID-19 or your wh\u0101nau or household has been seriously affected by COVID-19.
Use the \u2018Medical\u2019 reason for application.
Medical or other evidence needs to be provided (though delays in accessing medical care through no fault of your own can be taken into account).

Exceptional circumstances do not include:
- Misreading assessment dates, times or instructions
- Computer problems, including printer problems, unless they relate to an officially notified failure of university equipment
- Losing data \u2013 ensure that you keep backup copies of everything

Short extensions
If you don't have exceptional circumstances but simply need a couple of extra days to submit your assessment, you can apply for a short extension (3 days).
You don't need to provide evidence for a short extension.
You can only have one short extension per course.
If you need further extensions for the same course, you'll then need to provide evidence of exceptional circumstances.

Important things to note about short extensions
- You must apply using the Special Consideration Application tool and select \u2018short extension\u2019 on the second screen
- The short extension is for 3 calendar days
- You can't apply for short extensions for tests and exams; any assessment conducted under controlled conditions is not eligible for a short extension
- You can only have one short extension per course
- You must apply by midnight the day BEFORE your assessment is due
- For example, if an assessment is due at 4pm on Monday 20 May, in order to be eligible for a short extension, you must apply BEFORE midnight on Sunday 19 May.
- If you need more time than 3 days because of valid exceptional circumstances, you need to apply for the standard extension and provide evidence

If you need support with extensions on assessments and are applying under medical impairments or emotional/mental wellbeing impairments, you need to provide a completed Student Impairment Report to accompany your Special Consideration Application form.
The Student Impairment Report must be completed by a suitably qualified person.
You can connect with our support services below to organise a report.
If you're seeing an external practitioner, you should download the Student Impairment Report so they can complete it for submission.

Medical impairments
For medical impairments, registered nurses at the AUT Student Medical Centre can complete the Student Impairment Report for your Special Consideration Application.
[Link: Student Medical Centre]

Emotional or mental impairments
For emotional/mental wellbeing impairments, a qualified advisor at the Student Hub can assess you for a Student Impairment Report.
To find a qualified advisor at your closest Student Hub:
- Visit My AUT and log in
- Click on 'Make a booking'
- Select 'Book a Student Hub appointment'
- Click on the 'Special Consideration Application' button
Student Counselling and Mental Health services are also available for appointments if you have urgent or ongoing needs for counselling and/or mental health support.

AUTSA support
AUT Students' Association (AUTSA) has advocates who are there to provide advice and support while you're studying at AUT.

Fire extinguishers
If you have a fire extinguisher in your home, you'll be better prepared to put out small fires before they become big ones.
For businesses, please view our commercial advice on fire extinguishers.

Using a fire extinguisher
Only use a fire extinguishers when:
It's safe to do so considering the size and location of the fire
your extinguisher will only last 10-15 seconds once started
You're confident you understand how to use the extinguisher correctly.
Everyone has been evacuated and accounted for at your safe meeting place.
Fire and Emergency New Zealand has been called.
You can safely access and retreat from the fire.
Remember, life is more important than property.
Don't put yourself or others at risk.

Operating a fire extinguisher
When operating a fire extinguisher, use the 'PTASS' technique:
Pull the safety pin or remove the clip.
Test squirt the extinguisher to make sure it is working.
Aim the nozzle at the base of the fire from a safe distance.
Most extinguishers are designed to be operated from about 2 - 3 metres away.
Squeeze the handles.
Sweep the extinguisher from side to side while aiming at the base of the fire.

There are many different types of fire extinguishers:

Foam
Wet chemical
Dry powder
Carbon dioxide

The type of fire extinguisher you need depends on the class of fire you're most likely to experience.

Class B (Flammable & combustible liquids)
Class C (Flammable gases)
Class D (Fires involving combustible metals)
Class E (Electrically energised equipment)

A Wet Chemical extinguisher is best for extinguishing cooking oil and fat fires.
However, don't use wet chemical extinguishers on fires with a live electrical source.

==================== SECTION A: Annual holidays ====================

Annual holidays
All employees become entitled to 4 weeks annual holidays (annual leave) after 12 months of continuous employment.

[The page is a short landing page. Its three sub-page summaries read:]
Managing annual holidays
An employer must give their employees at least 4 weeks paid annual holidays (annual leave) \u2013 and keep accurate records of what employees are entitled to and have taken.
Taking annual holidays
You are entitled to at least 4 weeks of paid annual holidays (annual leave) when you have worked for your employer for 12 months.
Annual closedowns and holidays
If a workplace has an annual closedown, employees may be required to use some of their annual holidays during this time.

==================== SECTION B: Taking annual holidays ====================

Taking annual holidays
You are entitled to at least 4 weeks of paid annual holidays (annual leave) when you have worked for your employer for 12 months.

Changes to leave coming in 2028
The Employment Leave Act is going to replace the Holidays Act in August 2028.
It will be a major change to how leave works.
You must follow the current rules in the Holidays Act until the new law starts in 2028.

What you're entitled to
After each 12 months of continuous employment with an employer, you are entitled to no less than 4 weeks of annual holidays as paid time off work.
Your employment agreement will say what your annual holidays entitlement is.
You may take annual holidays in advance of becoming entitled to them if both you and your employer agree.
Certain employees can agree to be paid at least 8% of gross earnings in addition to their usual pay instead of taking annual holidays, but only if they meet certain criteria.
Your annual holidays entitlement stays available until you have taken the holidays or it has been paid out ('cashed-up').
Your employer:
must allow you to take annual holidays when you want to unless they have a good reason not to
must pay you for annual holidays before you take them unless you have agreed to be paid in your normal pay cycle
can require you to take annual holidays in certain circumstances
can choose to let you take some of your annual holiday entitlement in advance.
[A link "Good reason" follows here; no text explaining it is on this page.]
In some cases, you can agree with your employer to have your annual holidays paid out with your regular pay instead of taking time off.
This is called 'pay-as-you-go' holiday pay.
This can only happen if you:
are on a fixed-term agreement of less than 12 months, or
work so irregularly or intermittently that it is impossible in practice for your employer to provide you with 4 weeks' annual holidays in the normal way.
You can also ask to \u2018cash-up\u2019 up to 1 week of your annual holidays each year.
If your employer agrees, you can exchange up to 1 week of your holidays for pay.

Calculating annual holiday entitlement
What constitutes a \u2018working week\u2019 and how you calculate your holiday entitlement depends on your working arrangement.
If you usually work the same number of days or hours each week, your \u2018working week\u2019 will be clear.
If your \u2018working week\u2019 is not clear, you and your employer can agree on how your entitlement to 4 weeks of annual holidays will be met.
This can be by:
defining a week in terms of days or hours, or
agreeing to a method your employer will use to define it.

If you work the same days and hours each week
If you work the same hours on the same days each week, your annual holiday entitlement is simple to work out.
For example, if you are working 3 x 8-hour days each week at the time you take annual holidays, a week will be 3 days, or 24 hours (3 days x 8 hours).

If you have a consistent pattern of work, but it's not the same every week
You may have a consistent pattern of work, but it\u2019s not the same each week.
This could be because:
you work the same total number of hours or days each week, but the number of hours each day or the days worked each week change
the total number of days you work each week is the same, but the total number of hours changes
the total number of hours you work each week is the same, but the total number of days you work changes
you have a work pattern that is consistent but not based on a 7-day cycle, for example, you work 4 days on, 4 days off.
If this is the case, you can agree with your employer to work out your annual holiday entitlement in either days or hours.
Your employer should discuss the consequences of the choice with you and help you choose the best option for your situation.

If you have an unpredictable work pattern
You may have an unpredictable work pattern and it's not possible to define in advance what a working week looks like \u2013 for example, you have no guaranteed hours or you work to a roster that changes unpredictably each week.
If this is the case, you and your employer should try to identify if there is a pattern of work that could be used to calculate a working week for annual holiday entitlement.
This must be a fair and reasonable reflection of your working week and agreed to by both parties.
It could be based on:
the agreed hours in your employment agreement
the days and hours you have been working in the weeks leading up to the annual holiday being taken
another method (for example, the average number of hours worked over a set period) agreed to by you and your employer.
Under New Zealand law, annual holidays are not accrued.
Employees get their 4-week annual holiday entitlement after they\u2019ve worked for their employer for 12 months and for each 12 months after.
If you take annual holidays before you are entitled to them, you are taking them in advance.
However, some payroll systems work by accruing holidays from when employment starts.
For example, your payslip or pay record might show \u2018accrued holidays\u2019 or \u2018accrued leave\u2019 based on the hours or days you\u2019ve worked.
If your annual holidays are being accrued, it\u2019s possible you will not get the correct entitlement, especially if your days or hours of work have changed or vary.
This is because your holiday entitlement should be based on what a week is for you at the time you take your holiday.
We recommend talking to your employer if you think you might not be getting your 4-week annual holiday entitlement.

Getting paid for annual holidays
You are entitled to be paid for annual holidays before they start unless you and your employer agree that you will be paid for annual holidays in your normal pay cycle.
If you agree to be paid in your normal pay cycle, this should be recorded in writing \u2013 usually in your employment agreement.

When you can take annual holidays
In general, you should be able to decide when to take your annual holidays.
Your employer must:
agree to your request for annual holidays before you take the time off \u2013 or have a good reason for declining it, for example, others having already arranged holidays at the same time
allow you to take at least 2 of your 4 weeks\u2019 annual holidays in one go
allow you to take annual holidays within 12 months of the date you become entitled to them.
Your employer can refuse a request to take annual holidays in advance.

When you might be required to take annual holidays
Your employer can require you to take annual holidays if:
you cannot agree with them about when your annual holidays will be taken, and they give you at least 14 days' notice, or
they regularly close down for a certain period every year and give you at least 14 days\u2019 notice.
Your employer cannot make you take annual holidays if:
your employer closes the workplace unexpectedly (for example, if there was a natural disaster), and
you are given less than 14 days' notice, and
you are willing and able to work.
Your employer cannot make you take annual holidays in advance.

Cancelling annual holidays
Sometimes you or your employer might want to cancel annual holidays that have already been arranged.
Neither you nor your employer have to accept the other\u2019s request to cancel annual holidays but you should negotiate a solution together in good faith.
For example, you could agree to:
take a holiday at another time, or
reduce the amount of annual holidays you take.
Any changes to arrangements should be in writing.
