<title>Guideline Apps design review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one phone screen. Look picker on top, the live app in the middle, feedback pinned at the bottom.
   The review chrome stays quiet and neutral so the looks themselves are what you judge. */
:root { --bg:#f3f4f6; --panel:#ffffff; --ink:#15181d; --mut:#606874; --line:#dadde2; --accent:#1f4fd1; --on:#ffffff; --soft:#e7ecfb;
  --ui:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121417; --panel:#1b1e23; --ink:#eceef1; --mut:#9aa3ae; --line:#2e333b; --accent:#7c9cff; --on:#0c1020; --soft:#232b45; color-scheme:dark; } }
:root[data-theme="dark"] { --bg:#121417; --panel:#1b1e23; --ink:#eceef1; --mut:#9aa3ae; --line:#2e333b; --accent:#7c9cff; --on:#0c1020; --soft:#232b45; color-scheme:dark; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 var(--ui); display:grid; grid-template-rows:auto 1fr auto; }
.wrap { padding-left:max(12px, env(safe-area-inset-left, 0px)); padding-right:max(12px, env(safe-area-inset-right, 0px)); }
header { background:var(--panel); border-bottom:1px solid var(--line); padding-block:10px 8px; }
.top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.top b { font-size:15px; } .top small { color:var(--mut); font-size:12px; }
.picker { display:grid; grid-template-columns:repeat(3, 1fr); gap:4px; margin-top:8px; background:var(--bg); padding:4px; border-radius:12px; }
.picker button { font:600 14px/1.2 var(--ui); color:var(--mut); background:transparent; border:0; border-radius:9px; padding:9px 4px; min-height:44px; position:relative; }
.picker button[aria-pressed="true"] { background:var(--panel); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12); }
.picker button .dot { position:absolute; top:5px; right:7px; width:7px; height:7px; border-radius:50%; background:var(--accent); }
.from { margin:8px 2px 0; color:var(--mut); font-size:13px; min-height:2.8em; }
main { min-height:0; display:flex; justify-content:center; background:var(--bg); }
iframe { border:0; width:100%; max-width:480px; height:100%; background:#fff; }
footer { background:var(--panel); border-top:1px solid var(--line); padding-block:10px calc(10px + env(safe-area-inset-bottom, 0px)); }
.ask { font-weight:600; margin:0 0 8px; }
.react { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
.react button { font:600 14px/1.2 var(--ui); min-height:48px; border-radius:12px; border:1.5px solid var(--line); background:var(--panel); color:var(--ink); }
.react button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--on); }
form { display:flex; gap:6px; margin-top:8px; }
input { flex:1; min-width:0; font:15px var(--ui); padding:11px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); }
form button { font:600 14px var(--ui); padding:0 16px; border-radius:12px; border:0; background:var(--ink); color:var(--panel); min-height:44px; }
.status { color:var(--mut); font-size:12px; margin:6px 2px 0; min-height:1.2em; }
button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
</style>

<header class="wrap">
  <div class="top"><b>{{TITLE}}: three looks</b><small id="round"></small></div>
  <div class="picker" id="picker" role="group" aria-label="Choose a look"></div>
  <p class="from" id="from"></p>
</header>
<main><iframe id="frame" title="App preview"></iframe></main>
<footer class="wrap">
  <p class="ask" id="ask">How does this look feel?</p>
  <div class="react" id="react" role="group" aria-label="Your reaction">
    <button data-r="love" aria-pressed="false">Love it</button>
    <button data-r="parts" aria-pressed="false">Parts of it</button>
    <button data-r="no" aria-pressed="false">Not for me</button>
  </div>
  <form id="form"><input id="comment" autocomplete="off" placeholder="What would you change? (optional)" aria-label="Comment"><button>Send</button></form>
  <p class="status" id="status" aria-live="polite"></p>
</footer>

<script type="application/json" id="data">/*DATA*/</script>
<script>
// Review page: switches the app preview between looks and saves one reaction per look plus any comments.
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const roundKey = D.round.replace(/[^a-z0-9]+/gi, '-');
const picked = {};          // look id -> reaction, as saved
let current = 0, db = null;

// Draws the look buttons and loads the chosen look into the preview.
function show(k) {
  current = k;
  const L = D.looks[k];
  $('picker').innerHTML = D.looks.map((l, i) => `<button data-k="${i}" aria-pressed="${i === k}">${'ABC'[i]} · ${l.name}${picked[l.id] ? '<span class="dot"></span>' : ''}</button>`).join('');
  $('from').textContent = 'Borrowed from ' + L.from.charAt(0).toLowerCase() + L.from.slice(1);
  $('frame').srcdoc = L.html;
  $('ask').textContent = `How does ${L.name} feel?`;
  for (const b of $('react').children) b.setAttribute('aria-pressed', String(picked[L.id] === b.dataset.r));
}
const say = (t) => { $('status').textContent = t; };

$('picker').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(+b.dataset.k); });

// One reaction per look; tapping another replaces it.
$('react').addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const L = D.looks[current];
  picked[L.id] = b.dataset.r; show(current);
  if (!db) return say('Saved on this screen only: feedback storage is not available here.');
  try { await db.doc(`reactions/${roundKey}-${L.id}`).set({ round: D.round, look: L.id, reaction: b.dataset.r, at: Date.now() }); say(`Saved: ${b.textContent} for ${L.name}.`); }
  catch (err) { say('Could not save that. Check your connection and tap again.'); }
});

// Comments are kept as separate notes, tagged with the look on screen.
$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $('comment').value.trim(); if (!text) return;
  const L = D.looks[current];
  if (!db) return say('Comments can only be saved when this page is opened in Claude.');
  try { await db.collection('comments').add({ round: D.round, look: L.id, text: text.slice(0, 2000), at: Date.now() }); $('comment').value = ''; say(`Comment saved for ${L.name}. The next build reads it.`); }
  catch (err) { say('Could not save the comment. Check your connection and try again.'); }
});

$('round').textContent = D.round.split(' ')[0];
show(0);

// Connect to feedback storage, then mark the looks already reacted to in this round.
(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db) return;
  try {
    const snap = await db.collection('reactions').where('round', '==', D.round).get();
    for (const d of snap.docs) { const v = d.data(); if (v?.look) picked[v.look] = v.reaction; }
    show(current);
  } catch { /* first visit or offline: nothing to mark */ }
})();
</script>
