<script type="application/json" id="spec">{"spec":{"title":"Power Cut: Keep or Throw Out Food","about":"Helps you look after the food in your fridge and freezer during a power cut, and decide what to keep, refreeze or throw out once you check it. It shows what each New Zealand source says, side by side where they disagree.","sources":[{"name":"MPI, Food safety in natural disasters and emergencies","link":"https://www.mpi.govt.nz/food-safety-home/food-safety-in-natural-disasters-and-emergencies"},{"name":"MPI / New Zealand Food Safety fact sheet, Food safety in the home after flooding (Feb 2023)","link":"https://www.mpi.govt.nz/dmsdocument/55615-Food-safety-in-the-home-after-flooding"},{"name":"NEMA Civil Defence consistent messages, Response: What to do in an emergency","link":"https://www.civildefence.govt.nz/guidance-training/consistent-messages/response"},{"name":"NEMA Get Ready, No power","link":"https://getready.govt.nz/prepared/household/impacts/no-power"},{"name":"Northland Regional Council, Food safety in a power cut","link":"https://www.nrc.govt.nz/civildefence/in-an-emergency/food-safety-in-power-cuts-and-floods/"},{"name":"Auckland Regional Public Health Service, Preventing foodborne illness when the power's out","link":"https://arphs.health.nz/news/preventing-foodborne-illness-when-the-powers-out"},{"name":"Queenstown Lakes District Council poster, How to keep food safe in a power cut (advice from Public Health Service - Southern)","link":"https://sportrec.qldc.govt.nz/media/0gycy45p/qldc_cdem_emergency-posters-a3_keep-food-safe-in-a-power-cut_sep23.pdf"},{"name":"FSANZ, Food safety in an emergency","link":"https://www.foodstandards.gov.au/consumer/prevention-of-foodborne-illness/food-safety-in-an-emergency"}],"warning":"If in doubt, throw it out. Don't taste food to see if it's OK. The sources give different times; this app shows each one.","audience":"Anyone at home in New Zealand whose power has gone off","reviewedBy":"","version":"MPI fact sheet 'Food safety in the home after flooding' (Feb 2023, document 55615); MPI web page 'Food safety in natural disasters and emergencies' (last reviewed 24.02.25); NEMA consistent messages 'Response' and Get Ready 'No power' (no dates shown); Northland Regional Council 'Food safety - power cuts' (no date); ARPHS news item (no date); QLDC poster (Sep 2023); FSANZ 'Food safety in an emergency' (last updated 2 October 2025); all read 19 Nov 2026 NZ time","brand":{"name":"","colour":""},"look":"","inputs":[{"id":"freezer","label":"Freezer","unit":"","type":"choice","optional":false,"whole":false,"line":22,"options":["Full","Half full","Not sure how full"]}],"tables":[{"id":"freezer-hold-time","title":"Freezer hold time","key":"Freezer","columns":["Freezer","MPI, NEMA and QLDC","Northland Regional Council","FSANZ (Australia and NZ)"],"rows":[{"key":"Full","cells":{"Freezer":"Full","MPI, NEMA and QLDC":"2–4 days","Northland Regional Council":"48 hours","FSANZ (Australia and NZ)":"around 24 hours (does not split full and half full)"},"line":31,"match":{"kind":"value","value":"Full"}},{"key":"Half full","cells":{"Freezer":"Half full","MPI, NEMA and QLDC":"1–2 days","Northland Regional Council":"up to 24 hours","FSANZ (Australia and NZ)":"around 24 hours (does not split full and half full)"},"line":32,"match":{"kind":"value","value":"Half full"}},{"key":"Not sure how full","cells":{"Freezer":"Not sure how full","MPI, NEMA and QLDC":"half full 1–2 days; full 2–4 days (the half full time is the shorter one)","Northland Regional Council":"half full up to 24 hours; full 48 hours (the half full time is the shorter one)","FSANZ (Australia and NZ)":"around 24 hours (does not split full and half full)"},"line":33,"match":{"kind":"value","value":"Not sure how full"}}],"source":"MPI fact sheet, NEMA and QLDC poster (\"full (2-4 days) ... half full (1-2 days)\"); Northland Regional Council (\"half full will be okay for up to 24 hours and a full freezer for 48 hours\"); FSANZ (\"shouldn't defrost for around 24 hours\", no full or half full split)","line":27,"keyInput":"freezer"}],"steps":[{"id":"start","title":"Power cut: what to do now","lines":[{"kind":"do","text":"Keep the fridge and freezer doors shut. Open them as little as you can.","line":38,"quotes":[{"text":"During the power failure, open your fridge or freezer as little as possible to help keep it cooler for longer.","where":"MPI fact sheet","check":"exact"},{"text":"The first advice is to not open the door of the refrigerator or freezer.","where":"Northland","check":"exact"}]},{"kind":"do","text":"Tell everyone in the house, including the children. A big notice on the door can help.","line":41,"quotes":[{"text":"Make sure you tell everyone in the house including the children. It might be a good idea to hang a big notice on the door to remind everyone.","where":"Northland","check":"exact"}]},{"kind":"do","text":"Eat from the fridge first, then the freezer, then the pantry or your emergency kit.","line":43,"quotes":[{"text":"EAT FROM THE FRIDGE FIRST, THE FREEZER SECOND, AND THE PANTRY LAST.","where":"QLDC","check":"exact"},{"text":"If the power goes out, eat the food from your fridge first, then your freezer. Then eat the food in the cupboard or your emergency kit.","where":"Get Ready","check":"exact"}]},{"kind":"do","text":"Eat foods that will expire soon first, such as bread, meat, salads and dairy products.","line":46,"quotes":[{"text":"Eat foods that will expire soon first – such as bread, meat, salads, and dairy products – because they spoil more quickly than non-perishable food.","where":"MPI fact sheet","check":"exact"}]},{"kind":"do","text":"Leave frozen food in the freezer if you can.","line":48,"quotes":[{"text":"So, leave already frozen food in the freezer if possible.","where":"MPI fact sheet","check":"exact"}]}],"ask":{"question":"Is the power still off?","options":[{"label":"Still off: it has just gone off","to":"just-off","line":51,"target":"just-off"},{"label":"Still off: it has been off for a while","to":"during","line":52,"target":"during"},{"label":"It is back on","to":"back-on","line":53,"target":"back-on"}],"line":50},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":37},{"id":"just-off","title":"Note when the power went off","lines":[{"kind":"say","text":"Tap the button to keep the time in the Log. The app will tell you when each source's fridge or freezer time has passed. Keep this app open (you can go on to the next screens). No source says how to tell how long the power was off if you missed the start.","line":56},{"kind":"record","text":"Power went off","line":57},{"kind":"note","text":"Reminder labels are kept short so four of them fit above the step on a phone; each source's full wording is on the During screen. Reminders start when this screen opens, so they only match the power cut if it really has just started. They run until \"The power is back on\". The MPI full/half-full day ranges are not reminded (ranges, not one time); they are in the table on the next screen.","line":68}],"ask":null,"next":{"to":"during","line":69,"target":"during"},"timer":null,"reminders":[{"ms":7200000,"every":"2 hours","once":true,"text":"Fridge: Northland's 2 hours","id":"fridge-northland-s-2-hours","line":58,"quotes":[{"text":"An unopened refrigerator will keep your food cool for at least 2 hours.","where":"Northland","check":"exact"}]},{"ms":14400000,"every":"4 hours","once":true,"text":"Fridge: MPI's 4 hours","id":"fridge-mpi-s-4-hours","line":60,"quotes":[{"text":"Unopened fridges should hold refrigeration temperature for 4 hours.","where":"MPI fact sheet","check":"exact"},{"text":"A fridge should keep food cold for around four hours - after that it can begin to spoil.","where":"FSANZ","check":"exact"}]},{"ms":86400000,"every":"24 hours","once":true,"text":"Freezer: FSANZ's 24 hours","id":"freezer-fsanz-s-24-hours","line":63,"quotes":[{"text":"A freezer shouldn't defrost for around 24 hours.","where":"FSANZ","check":"exact"},{"text":"A freezer that is half full will be okay for up to 24 hours","where":"Northland","check":"exact"}]},{"ms":172800000,"every":"48 hours","once":true,"text":"Freezer: Northland's 48 hours (full)","id":"freezer-northland-s-48-hours-full","line":66,"quotes":[{"text":"a full freezer for 48 hours.","where":"Northland","check":"exact"}]}],"stop":null,"end":false,"line":55,"nexts":[{"to":"during","line":69,"target":"during"}]},{"id":"during","title":"While the power is off","lines":[{"kind":"say","text":"How long an unopened fridge stays cold. The sources disagree:","line":72},{"kind":"say","text":"MPI, NEMA and the QLDC poster: 4 hours.","bullet":true,"line":73,"quotes":[{"text":"Unopened fridges should hold refrigeration temperature for 4 hours.","where":"MPI fact sheet","check":"exact"},{"text":"Unopened fridges should hold refrigeration temperature for 4 hours.","where":"QLDC","check":"exact"}]},{"kind":"say","text":"FSANZ: around four hours, and after that food can begin to spoil.","bullet":true,"line":76,"quotes":[{"text":"A fridge should keep food cold for around four hours - after that it can begin to spoil.","where":"FSANZ","check":"exact"}]},{"kind":"say","text":"Northland Regional Council: at least 2 hours.","bullet":true,"line":78,"quotes":[{"text":"An unopened refrigerator will keep your food cool for at least 2 hours.","where":"Northland","check":"exact"}]},{"kind":"say","text":"How long a freezer stays frozen depends on how full it is, and the sources disagree:","line":80,"quotes":[{"text":"Freezers will remain colder for longer if they are full (2−4 days) compared to if they are half full (1−2 days).","where":"MPI fact sheet","check":"exact"},{"text":"A freezer that is half full will be okay for up to 24 hours and a full freezer for 48 hours.","where":"Northland","check":"exact"},{"text":"A freezer shouldn't defrost for around 24 hours.","where":"FSANZ","check":"exact"}]},{"kind":"show","table":"Freezer hold time","column":null,"text":"Freezer hold time","line":84,"tableId":"freezer-hold-time"},{"kind":"say","text":"No source says what counts as \"full\" or \"half full\", or covers a nearly empty freezer.","cond":[{"input":"Freezer","op":"=","values":["Not sure how full"],"inputId":"freezer"}],"line":85},{"kind":"say","text":"Every time you open the door, food goes off more quickly.","line":86,"quotes":[{"text":"remember the more times you open the door, the quicker things will go off.","where":"NEMA","check":"exact"}]},{"kind":"do","text":"Throw out bad or rotting food quickly, before it spoils other food.","line":88,"quotes":[{"text":"throw out bad or rotting food before it spoils other food.","where":"MPI web page","check":"exact"},{"text":"Throw out rotten or contaminated food quickly so it doesn't spoil other food in the fridge.","where":"ARPHS","check":"exact"}]},{"kind":"do","text":"Keep food cold, clean and check the label.","line":91,"quotes":[{"text":"Keep food cold, clean and check the label.","where":"FSANZ","check":"exact"}]},{"kind":"say","text":"FSANZ (Australia and New Zealand) suggests getting eskies with ice bricks or gel packs ready before a power cut. No New Zealand source mentions chilly bins or ice.","line":93,"quotes":[{"text":"Prepare eskies with ice bricks or gel packs to keep food cold if the power goes out.","where":"FSANZ","check":"exact"}]}],"ask":{"question":"What now?","options":[{"label":"Check the food in the fridge","to":"fridge","line":96,"target":"fridge"},{"label":"Check the food in the freezer","to":"during-freezer","line":97,"target":"during-freezer"},{"label":"Tins, cooking and clean hands","to":"pantry","line":98,"target":"pantry"},{"label":"The power has come back on","to":"back-on","line":99,"target":"back-on"},{"label":"Nothing to check right now","to":"waiting","line":100,"target":"waiting"}],"line":95},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":71},{"id":"waiting","title":"Power still off: come back later","lines":[{"kind":"say","text":"Leave this app open. Any reminders keep running at the top. Come back here when you need to check food, or when the power comes back on.","line":103},{"kind":"do","text":"Keep the fridge and freezer doors shut.","line":104,"quotes":[{"text":"Open your fridge and freezer as little as possible to help keep it cooler for longer.","where":"NEMA","check":"exact"}]}],"ask":{"question":"What now?","options":[{"label":"The power has come back on","to":"back-on","line":107,"target":"back-on"},{"label":"Check the food in the fridge","to":"fridge","line":108,"target":"fridge"},{"label":"Check the food in the freezer","to":"during-freezer","line":109,"target":"during-freezer"},{"label":"Tins, cooking and clean hands","to":"pantry","line":110,"target":"pantry"},{"label":"Finish","to":"end","line":111,"target":"__end"}],"line":106},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":102},{"id":"during-freezer","title":"Freezer food while the power is off","lines":[{"kind":"say","text":"Eat from the fridge first, then the freezer.","line":114,"quotes":[{"text":"If the power goes out, eat the food from your fridge first, then your freezer.","where":"Get Ready","check":"exact"}]},{"kind":"do","text":"Keep the freezer shut and leave frozen food in it if you can.","line":116,"quotes":[{"text":"Leave already frozen food in the freezer if possible.","where":"NEMA","check":"exact"}]},{"kind":"show","table":"Freezer hold time","column":null,"text":"Freezer hold time","line":118,"tableId":"freezer-hold-time"},{"kind":"say","text":"Auckland Regional Public Health Service: throw out freezer food that has thawed and been at room temperature for longer than two hours.","line":119,"quotes":[{"text":"Dispose of any food from the freezer which has thawed out and been at room temperature for longer than two hours.","where":"ARPHS","check":"exact"}]},{"kind":"warning","text":"Don't refreeze food that has thawed.","line":121,"quotes":[{"text":"If frozen foods have thawed don't refreeze!","where":"FSANZ","check":"exact"}]},{"kind":"say","text":"The sources say to check the freezer food properly once the power is back on.","line":123,"quotes":[{"text":"Once the power is back on, check the food in your freezer.","where":"MPI fact sheet","check":"exact"}]}],"ask":{"question":"What now?","options":[{"label":"Check a food that has thawed","to":"thawed","line":126,"target":"thawed"},{"label":"Nothing has thawed: back","to":"waiting","line":127,"target":"waiting"}],"line":125},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":113},{"id":"back-on","title":"The power is back on","lines":[{"kind":"say","text":"Now check the food in your freezer, then your fridge.","line":131,"quotes":[{"text":"Once the power is back on, check the food in your freezer.","where":"MPI fact sheet","check":"exact"}]},{"kind":"warning","text":"If in doubt, throw it out.","line":133,"quotes":[{"text":"If in doubt, throw it out.","where":"MPI fact sheet","check":"exact"}]}],"ask":null,"next":{"to":"freezer","line":135,"target":"freezer"},"timer":null,"reminders":[],"stop":"all","end":false,"line":129,"nexts":[{"to":"freezer","line":135,"target":"freezer"}]},{"id":"fridge","title":"Food in the fridge","lines":[{"kind":"say","text":"The sources only give times for a fridge whose door was kept shut. None says how to tell how warm the food got, or what to do if the door was opened a lot. None mentions using a thermometer.","line":138,"quotes":[{"text":"Unopened fridges should hold refrigeration temperature for 4 hours.","where":"MPI fact sheet","check":"exact"}]}],"ask":{"question":"How long has the fridge been without power?","options":[{"label":"Less than 2 hours","to":"fridge-cold","line":141,"target":"fridge-cold"},{"label":"Between 2 and 4 hours","to":"fridge-between","line":142,"target":"fridge-between"},{"label":"More than 4 hours","to":"fridge-warm","line":143,"target":"fridge-warm"},{"label":"Not sure","to":"fridge-warm","line":144,"target":"fridge-warm"}],"line":140},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":137},{"id":"fridge-cold","title":"Fridge food should still be cold","lines":[{"kind":"say","text":"All the sources say an unopened fridge is still cold at this point.","line":147,"quotes":[{"text":"An unopened refrigerator will keep your food cool for at least 2 hours.","where":"Northland","check":"exact"},{"text":"Unopened fridges should hold refrigeration temperature for 4 hours.","where":"MPI fact sheet","check":"exact"}]},{"kind":"do","text":"Keep the door shut. Eat fridge food first, starting with foods that will expire soon, such as bread, meat, salads and dairy products.","line":150,"quotes":[{"text":"Eat foods that will expire soon first – such as bread, meat, salads, and dairy products.","where":"NEMA","check":"exact"},{"text":"Eat the food in your fridge first, then your freezer","where":"NEMA","check":"exact"}]}],"ask":null,"next":{"to":"pantry","line":153,"target":"pantry"},"timer":null,"reminders":[],"stop":null,"end":true,"line":146,"nexts":[{"to":"pantry","line":153,"target":"pantry"}]},{"id":"fridge-between","title":"Fridge food: 2 to 4 hours","lines":[{"kind":"say","text":"MPI, NEMA, the QLDC poster and FSANZ say an unopened fridge holds its cold for about 4 hours.","line":157,"quotes":[{"text":"Unopened fridges should hold refrigeration temperature for 4 hours.","where":"MPI fact sheet","check":"exact"},{"text":"A fridge should keep food cold for around four hours - after that it can begin to spoil.","where":"FSANZ","check":"exact"}]},{"kind":"say","text":"Northland Regional Council says \"at least 2 hours\". That is a minimum, not a limit, so it does not say the food is warm after 2 hours.","line":160,"quotes":[{"text":"An unopened refrigerator will keep your food cool for at least 2 hours.","where":"Northland","check":"exact"}]},{"kind":"say","text":"Northland: food at 5 degrees Celsius or above for more than 2 hours is much more likely to grow germs that cause illness.","line":162,"quotes":[{"text":"Once food reaches the temperature of 5 degrees Celsius or above for more than 2 hours it greatly increases the risk of growth by microorganisms that can cause illness.","where":"Northland","check":"exact"}]},{"kind":"do","text":"Check each food. Does it smell or look different? Has the colour changed, or is it slimy? If so, bin it.","line":164,"quotes":[{"text":"Does the food from your fridge, freezer or pantry smell or look different? Has the colour changed and does it have a slimy texture? If so, it's likely unsafe and should be binned.","where":"MPI fact sheet","check":"exact"}]},{"kind":"warning","text":"Don't taste food to see if it's OK. If in doubt, throw it out.","line":166,"quotes":[{"text":"Don't taste it to see if it's OK.","where":"FSANZ","check":"exact"},{"text":"If in doubt, throw it out.","where":"MPI fact sheet","check":"exact"}]}],"ask":null,"next":{"to":"pantry","line":169,"target":"pantry"},"timer":null,"reminders":[],"stop":null,"end":true,"line":156,"nexts":[{"to":"pantry","line":169,"target":"pantry"}]},{"id":"fridge-warm","title":"Fridge food may have warmed up","lines":[{"kind":"say","text":"If you're not sure how long it has been, treat the food as warmed up.","line":173,"quotes":[{"text":"If in doubt, throw it out.","where":"MPI fact sheet","check":"exact"}]},{"kind":"warning","text":"Northland: don't use fridge food that has warmed up. The only exceptions are butter or margarine, hard cheeses, raw eggs still in their shells, fruit and vegetables.","line":175,"quotes":[{"text":"Do not use frozen food that has thawed or refrigerated food that has warmed up. The only exceptions to this are butter/margarine, hard cheeses, raw eggs (still in eggshells), fruit and vegetables.","where":"Northland","check":"exact"}]},{"kind":"say","text":"Auckland Regional Public Health Service (in a news item during a long power cut): \"after today\", meat and fish from the fridge may not be safe. It gives no number of hours. Raw vegetables, cheese and bread can still be eaten (it says \"cheese\", not only hard cheese).","line":177,"quotes":[{"text":"After today, highly perishable foods in the fridge like meat and fish may not be safe to eat,","where":"ARPHS","check":"exact"},{"text":"You can still eat food like raw vegetables, cheese and bread.","where":"ARPHS","check":"exact"}]},{"kind":"do","text":"Check every food you keep. Does it smell or look different? Has the colour changed, or is it slimy? If so, bin it.","line":180,"quotes":[{"text":"Does the food from your fridge, freezer or pantry smell or look different? Has the colour changed and does it have a slimy texture? If so, it's likely unsafe and should be binned.","where":"MPI fact sheet","check":"exact"}]},{"kind":"warning","text":"Don't taste food to see if it's OK. If in doubt, throw it out.","line":182,"quotes":[{"text":"Don't taste it to see if it's OK.","where":"FSANZ","check":"exact"},{"text":"IF IN DOUBT, THROW IT OUT!","where":"QLDC","check":"exact"}]},{"kind":"say","text":"No source covers leftovers, cooked rice, sliced meats, sauces, baby formula, breast milk, or medicines kept in the fridge (such as insulin). For health advice, ARPHS says call Healthline free on 0800 611 116.","line":185,"quotes":[{"text":"For health advice call Healthline for free anytime on 0800 611 116","where":"ARPHS","check":"exact"}]}],"ask":null,"next":{"to":"pantry","line":187,"target":"pantry"},"timer":null,"reminders":[],"stop":null,"end":true,"line":172,"nexts":[{"to":"pantry","line":187,"target":"pantry"}]},{"id":"freezer","title":"Food in the freezer","lines":[{"kind":"say","text":"Check the frozen food now the power is back on. Look at one food at a time.","line":191,"quotes":[{"text":"Once the power is back on, check the food in your freezer.","where":"NEMA","check":"exact"}]}],"ask":{"question":"Is the food still visibly frozen, with ice crystals on it?","options":[{"label":"Yes, it still has ice crystals","to":"refreeze","line":194,"target":"refreeze"},{"label":"No, or I'm not sure","to":"thawed","line":195,"target":"thawed"},{"label":"I've checked all the frozen food","to":"fridge","line":196,"target":"fridge"}],"line":193},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":190},{"id":"refreeze","title":"Still frozen: you can refreeze it","lines":[{"kind":"say","text":"MPI: if the food still has ice crystals and the packaging isn't damaged or open, you can safely refreeze it.","line":199,"quotes":[{"text":"If the food is still visibly frozen (for example, if it still has ice crystals on it) and the packaging isn't damaged or open, you can safely refreeze it.","where":"MPI fact sheet","check":"exact"},{"text":"If the frozen food has ice crystals and the packaging is intact then it can be refrozen.","where":"ARPHS","check":"exact"}]},{"kind":"warning","text":"If the packaging is damaged or open, no source says it is safe to refreeze. If in doubt, throw it out.","line":202,"quotes":[{"text":"If in doubt, throw it out.","where":"MPI fact sheet","check":"exact"}]},{"kind":"say","text":"Northland's frozen-food table (food that still has ice crystals and was kept under 5°C):","line":204,"quotes":[{"text":"Still contains ice crystals. Kept under 5°C","where":"Northland","check":"exact"}]},{"kind":"say","text":"Meat, chicken, fish or shellfish: refreeze or use straight away.","bullet":true,"line":206,"quotes":[{"text":"| Meat | Refreeze or immediately use | Throw out |","where":"Northland","check":"exact"},{"text":"| Chicken | Refreeze or immediately use | Throw out |","where":"Northland","check":"exact"},{"text":"| Fish or shellfish | Refreeze or immediately use | Throw out |","where":"Northland","check":"exact"}]},{"kind":"say","text":"Casseroles, stews, soups, pizza, sausage rolls: refreeze or use straight away.","bullet":true,"line":210,"quotes":[{"text":"| Casseroles, stews, soups, pizza, sausage rolls | Refreeze or immediately use | Throw out |","where":"Northland","chec ":"ARPHS","check":"exact"},{"text":"If frozen foods have thawed don't refreeze!","where":"FSANZ","check":"exact"}]},{"kind":"say","text":"Keep it or throw it out? The sources disagree:","line":232},{"kind":"say","text":"MPI and NEMA: you can still keep or use thawed food if it has not started to look or smell bad. Keep it cold, like in the fridge, until you eat or cook it.","bullet":true,"line":233,"quotes":[{"text":"You can still keep or use thawed food if it has not started to look or smell bad. Keep it cold (like in the fridge) until you are ready to eat or cook it.","where":"MPI fact sheet","check":"exact"},{"text":"You can still keep or use thawed food if it has not started to look or smell bad. Keep it cold (like in the fridge) until you eat or cook it.","where":"NEMA","check":"exact"}]},{"kind":"say","text":"Auckland Regional Public Health Service: throw out freezer food that has thawed and been at room temperature for longer than two hours.","bullet":true,"line":236,"quotes":[{"text":"Dispose of any food from the freezer which has thawed out and been at room temperature for longer than two hours.","where":"ARPHS","check":"exact"}]},{"kind":"say","text":"Northland Regional Council: don't use frozen food that has thawed, except butter or margarine, hard cheeses, raw eggs in their shells, fruit and vegetables. Its table, by food, is on the next screen.","bullet":true,"line":238,"quotes":[{"text":"Do not use frozen food that has thawed or refrigerated food that has warmed up. The only exceptions to this are butter/margarine, hard cheeses, raw eggs (still in eggshells), fruit and vegetables.","where":"Northland","check":"exact"}]}],"ask":{"question":"What kind of food is it?","options":[{"label":"Meat, chicken, fish, or casseroles, stews, soups, pizza, sausage rolls","to":"thawed-meat","line":241,"target":"thawed-meat"},{"label":"Ice cream, frozen yoghurt or milk","to":"thawed-dairy","line":242,"target":"thawed-dairy"},{"label":"Bread, cakes, pies or pastries","t
