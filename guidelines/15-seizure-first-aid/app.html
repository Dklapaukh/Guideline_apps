<style>/* Phone-first, portrait, large tap targets. One stylesheet for every generated app; looks (engine/looks/) restyle it.

:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:var(--brand, #0b6e4f); --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }

,"line":131,"quotes":[{"text":"not consistent with the person's prescribed management plan","where":"ANZCOR","check":"exact"}]},{"kind":"say","text":"Rescue medicine: ANZCOR says follow your training and their plan. No source gives more detail.","line":133,"quotes":[{"text":"follow your training and the person's seizure management plan","where":"ANZCOR","check":"exact"}]}],"ask":{"question":"Now?","options":[{"label":"Call 111","to":"called","line":136,"target":"called"},{"label":"Still going","to":"during","line":137,"target":"during"},{"label":"It has stopped","to":"after","line":138,"target":"after"}],"line":135},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":123},{"id":"water","title":"Seizure in water","lines":[{"kind":"do","text":"Call 111 as soon as possible. Follow the call taker's instructions.","line":141,"quotes":[{"text":"(111) should always be called as soon as possible","where":"Epilepsy NZ web","check":"exact"},{"text":"Follow the instructions of the ambulance operator","where":"Epilepsy NZ web","check":"exact"}]},{"kind":"do","text":"Support their head: face above the water, head tilted back.","line":144,"quotes":[{"text":"face and head stays above the surface","where":"Epilepsy NZ web","check":"exact"},{"text":"Tilt the person's head back to ensure a clear airway","where":"Epilepsy NZ web","check":"exact"},{"text":"with the head tilted so the face is out of the water","where":"ANZCOR","check":"exact"}]},{"kind":"say","text":"When to take them out differs. Epilepsy NZ: once the movements stop. ANZCOR: as soon as it is safe. Others or a float can help.","line":148,"quotes":[{"text":"as soon as the active movements of the seizure have ceased","where":"Epilepsy NZ web","check":"exact"},{"text":"as soon it is safe to do so","where":"ANZCOR","check":"exact"},{"text":"Assistance from others or use of a floatation device may be useful","where":"Epilepsy NZ web","check":"exact"}]},{"kind":"say","text":"They need a medical check even i arted","to":"another","line":203,"target":"another"}],"line":200},"next":null,"timer":null,"reminders":[{"ms":300000,"every":"5 minutes","once":true,"text":"After 5 min not responding? Call 111 (Epilepsy NZ, ANZCOR)","id":"after-5-min-not-responding-call-111-epil","line":190,"quotes":[{"text":"non-responsive for more than 5 minutes after the seizure ends","where":"Epilepsy NZ poster","check":"exact"},{"text":"does not regain consciousness within 5 minutes","where":"ANZCOR","check":"exact"}]},{"ms":600000,"every":"10 minutes","once":true,"text":"After 10 min not waking? Call 111 (St John)","id":"after-10-min-not-waking-call-111-st-john","line":193,"quotes":[{"text":"does not wake up after 10 minutes","where":"St John","check":"exact"}]}],"stop":"Seizure","end":false,"line":188},{"id":"recovery","title":"Stay with them","lines":[{"kind":"do","text":"Stay and reassure them until they have recovered. Cover them lightly.","line":206,"quotes":[{"text":"Reassure and stay with the person until they have recovered","where":"Epilepsy NZ poster","check":"exact"},{"text":"Cover the person lightly","where":"St John","check":"exact"}]},{"kind":"do","text":"Keep checking their airway and breathing. Let them sleep, but check for a response every few minutes (no number given, so no reminder).","line":209,"quotes":[{"text":"frequently reassess the person, particularly their breathing","where":"ANZCOR","check":"exact"},{"text":"check for a response every few minutes","where":"St John","check":"exact"}]},{"kind":"say","text":"No source says if sleep counts as not responding. St John: unresponsive means they \"cannot be woken up\".","line":212,"quotes":[{"text":"cannot be woken up","where":"St John","check":"exact"}]},{"kind":"warning","text":"Nothing to eat or drink until fully awake and alert.","line":214,"quotes":[{"text":"Do not offer them anything to eat and drink until they are fully awake","where":"ANZCOR","check":"exact"}]}],"ask":{"question":"How are they?","options":[{"label":
