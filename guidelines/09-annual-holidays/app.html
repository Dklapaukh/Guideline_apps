 2026","brand":{"name":"","colour":""},"look":"","inputs":[],"tables":[],"steps":[{"id":"start","title":"What do you need?","lines":[{"kind":"say","text":"After 12 months with your employer, you are entitled to at least 4 weeks of paid annual holidays.","line":21,"quotes":[{"text":"You are entitled to at least 4 weeks of paid annual holidays (annual leave) when you have worked for your employer for 12 months.","where":"","check":"exact"}]}],"ask":{"question":"What do you need help with?","options":[{"label":"I want to ask for time off","to":"entitled","line":24,"target":"entitled"},{"label":"My employer wants me to take holidays, or there's a closedown","to":"required","line":25,"target":"required"},{"label":"I want to cash up some holidays (get paid instead)","to":"cashup","line":26,"target":"cashup"},{"label":"I'm an employer","to":"employer","line":27,"target":"employer"},{"label":"Something else (cancelling, holiday pay, leaving a job)","to":"other","line":28,"target":"other"}],"line":23},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":20},{"id":"other","title":"Something else","lines":[],"ask":{"question":"What do you want to know about?","options":[{"label":"Cancelling holidays that are already arranged","to":"cancel","line":32,"target":"cancel"},{"label":"How much is \"a week\" of holidays for me?","to":"week","line":33,"target":"week"},{"label":"How holiday pay is worked out","to":"holiday-pay","line":34,"target":"holiday-pay"},{"label":"Holidays when someone leaves a job","to":"leaving","line":35,"target":"leaving"}],"line":31},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":30},{"id":"entitled","title":"Are you entitled yet?","lines":[{"kind":"say","text":"You get at least 4 weeks after each 12 months of continuous work with your employer.","line":38,"quotes":[{"text":"After each 12 months of continuous employment with an employer, you are entitled to no less than 4 weeks of annual holidays as paid time off work.","where":"","check":"exact"}]},{"kind":"say","text":"Your employer cannot give you less than 4 weeks a year, even if your employment agreement says so.","line":40,"quotes":[{"text":"You cannot give an employee less than 4 weeks annual holidays each year, even if their employment agreement says so.","where":"","check":"exact"}]},{"kind":"say","text":"Holidays you are entitled to don't expire.","line":42,"quotes":[{"text":"Your annual holidays entitlement stays available until you have taken the holidays or it has been paid out ('cashed-up').","where":"","check":"exact"}]}],"ask":{"question":"Which is true for you?","options":[{"label":"I've worked 12 months or more and have holidays left","to":"ask-time","line":45,"target":"ask-time"},{"label":"I haven't worked 12 months yet, or I've used all my holidays","to":"advance","line":46,"target":"advance"},{"label":"I'm paid holiday pay with my wages (casual or short fixed-term)","to":"payg","line":47,"target":"payg"}],"line":44},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":37},{"id":"payg","title":"Holiday pay with your wages","lines":[{"kind":"say","text":"Some employees can agree to have holiday pay paid with their regular pay instead of taking time off. This is called \"pay-as-you-go\".","line":50,"quotes":[{"text":"In some cases, you can agree with your employer to have your annual holidays paid out with your regular pay instead of taking time off.","where":"","check":"exact"}]},{"kind":"say","text":"It can only happen if you are on a fixed-term agreement of less than 12 months, or your work is so irregular that 4 weeks' holidays in the normal way is impossible in practice.","line":52,"quotes":[{"text":"are on a fixed-term agreement of less than 12 months, or","where":"","check":"exact"},{"text":"work so irregularly or intermittently that it is impossible in practice for your employer to provide you with 4 weeks' annual holidays in the normal way.","where":"","check":"exact"}]},{"kind":"say","text":"The pay is at least 8% of gross earnings on top of your usual pay.","line":55,"quotes":[{"text":"Certain employees can agree to be paid at least 8% of gross earnings in addition to their usual pay instead of taking annual holidays, but only if they meet certain criteria.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":58,"target":"__end"}],"line":57},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":49},{"id":"ask-time","title":"Asking for time off","lines":[{"kind":"say","text":"Your employer must let you take holidays when you want to, unless they have a good reason not to.","line":61,"quotes":[{"text":"must allow you to take annual holidays when you want to unless they have a good reason not to","where":"","check":"exact"}]},{"kind":"do","text":"Ask your employer before you take the time off.","line":63,"quotes":[{"text":"agree to your request for annual holidays before you take the time off – or have a good reason for declining it, for example, others having already arranged holidays at the same time","where":"","check":"exact"}]},{"kind":"say","text":"Employment New Zealand does not say how far ahead to ask, or how. Check your employment agreement or workplace policy.","line":65},{"kind":"say","text":"You can take at least 2 of your 4 weeks in one go.","line":66,"quotes":[{"text":"allow you to take at least 2 of your 4 weeks’ annual holidays in one go","where":"","check":"exact"}]}],"ask":{"question":"What happened when you asked?","options":[{"label":"My employer agreed","to":"agreed","line":69,"target":"agreed"},{"label":"My employer said no","to":"declined","line":70,"target":"declined"},{"label":"I haven't had an answer","to":"no-answer","line":71,"target":"no-answer"},{"label":"I haven't asked yet","to":"not-asked","line":72,"target":"not-asked"}],"line":68},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":60},{"id":"not-asked","title":"Before you ask","lines":[{"kind":"say","text":"Your employer must let you take your holidays within 12 months of the date you become entitled to them.","line":75,"quotes":[{"text":"allow you to take annual holidays within 12 months of the date you become entitled to them.","where":"","check":"exact"}]},{"kind":"say","text":"Come back to this app once you have an answer.","line":77}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":79,"target":"__end"}],"line":78},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":74},{"id":"agreed","title":"Your request was agreed","lines":[{"kind":"say","text":"You are paid for your holidays before they start, unless you and your employer agreed you'd be paid in your normal pay cycle.","line":82,"quotes":[{"text":"You are entitled to be paid for annual holidays before they start unless you and your employer agree that you will be paid for annual holidays in your normal pay cycle.","where":"","check":"exact"}]},{"kind":"say","text":"That agreement should be in writing, usually in your employment agreement.","line":84,"quotes":[{"text":"If you agree to be paid in your normal pay cycle, this should be recorded in writing – usually in your employment agreement.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Someone wants to cancel the holidays","to":"cancel","line":87,"target":"cancel"},{"label":"Finish","to":"end","line":88,"target":"__end"}],"line":86},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":81},{"id":"declined","title":"Your employer said no","lines":[{"kind":"say","text":"Your employer needs a good reason to say no. One example: others have already arranged holidays at the same time.","line":91,"quotes":[{"text":"agree to your request for annual holidays before you take the time off – or have a good reason for declining it, for example, others having already arranged holidays at the same time","where":"","check":"exact"}]},{"kind":"say","text":"Your employer cannot unreasonably refuse holidays you are entitled to.","line":93,"quotes":[{"text":"You cannot unreasonably refuse an employee who wants to take annual holidays they're entitled to.","where":"","check":"exact"}]},{"kind":"warning","text":"Employment New Zealand does not explain what counts as a \"good reason\". Check your employment agreement or workplace policy.","line":95}],"ask":{"question":"What next?","options":[{"label":"My employer now says when I must take them","to":"required-disagree","line":97,"target":"required-disagree"},{"label":"Finish","to":"end","line":98,"target":"__end"}],"line":96},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":90},{"id":"no-answer","title":"No answer to your request","lines":[{"kind":"say","text":"Employment New Zealand does not say what to do if your request gets no answer, or how long your employer has to reply. Check your employment agreement or workplace policy, and ask your employer.","line":101},{"kind":"say","text":"Your employer must be reasonable in considering requests.","line":102,"quotes":[{"text":"be reasonable in considering requests to take annual holidays","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":105,"target":"__end"}],"line":104},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":100},{"id":"advance","title":"Holidays in advance","lines":[{"kind":"say","text":"Taking holidays before you are entitled to them is taking them \"in advance\". You can if you and your employer both agree.","line":108,"quotes":[{"text":"You may take annual holidays in advance of becoming entitled to them if both you and your employer agree.","where":"","check":"exact"}]},{"kind":"say","text":"Your employer can refuse.","line":110,"quotes":[{"text":"Your employer can refuse a request to take annual holidays in advance.","where":"","check":"exact"}]},{"kind":"say","text":"The employer page adds that a clause in your agreement may change this. Employment New Zealand's page could not be read in full here; check the page itself.","line":112,"quotes":[{"text":"but you do not have to agree to the request unless there is a relevant clause in their","where":"","check":"exact"}]},{"kind":"say","text":"If you leave before you become entitled, your employer can take back the overpayment from your final pay, if you agreed in writing.","line":114,"quotes":[{"text":"you should make sure they agree in writing that if they leave your employment before, they become entitled to annual holidays, you can recover the overpayment from their final pay.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":117,"target":"__end"}],"line":116},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":107},{"id":"required","title":"Being asked to take holidays","lines":[{"kind":"say","text":"An employer can make an employee take holidays only in certain cases. Pick the one closest to yours.","line":120,"quotes":[{"text":"can require you to take annual holidays in certain circumstances","where":"","check":"exact"}]}],"ask":{"question":"What is happening?","options":[{"label":"We can't agree on when to take holidays","to":"required-disagree","line":123,"target":"required-disagree"},{"label":"The workplace closes at the same time every year (for example over Christmas)","to":"closedown","line":124,"target":"closedown"},{"label":"A different or extra closedown (not the usual yearly one)","to":"other-closedown","line":125,"target":"other-closedown"},{"label":"The workplace closed suddenly (for example after a natural disaster)","to":"unexpected","line":126,"target":"unexpected"},{"label":"Holidays in advance","to":"required-advance","line":127,"target":"required-advance"}],"line":122},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":119},{"id":"required-disagree","title":"You can't agree on when","lines":[{"kind":"say","text":"If the employer and employee cannot agree on when, the employer can require holidays to be taken, with at least 14 days' notice.","line":130,"quotes":[{"text":"you cannot reach agreement about when annual holidays (that the employee is entitled to) will be taken, and you give the employee at least 14 days' notice, or","where":"","check":"exact"}]},{"kind":"say","text":"This is only for holidays the employee is already entitled to.","line":132,"quotes":[{"text":"you cannot reach agreement about when annual holidays (that the employee is entitled to) will be taken","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":135,"target":"__end"}],"line":134},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":129},{"id":"required-advance","title":"Being made to take holidays in advance","lines":[{"kind":"warning","text":"The pages disagree. The employee page says the employer cannot make you take holidays in advance. The employer page adds \"except when there is an annual closedown\".","line":138,"quotes":[{"text":"Your employer cannot make you take annual holidays in advance.","where":"","check":"exact"},{"text":"An employer cannot require an employee to take annual holidays in advance, except when there is an annual closedown.","where":"","check":"exact"}]},{"kind":"say","text":"The closedown page itself only talks about advance holidays the employer lets you take, or you both agree to.","line":141,"quotes":[{"text":"their employer can choose to also let them take annual holidays in advance","where":"","check":"exact"},{"text":"However, an employee could agree with their employer to take some annual holidays in advance in addition to the 8% payment.","where":"","check":"exact"}]}],"ask":{"question":"Is it for an annual closedown?","options":[{"label":"Yes","to":"closedown","line":145,"target":"closedown"},{"label":"No","to":"advance-no","line":146,"target":"advance-no"}],"line":144},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":137},{"id":"advance-no","title":"Not for a closedown","lines":[{"kind":"say","text":"Then the employer cannot make the employee take holidays in advance.","line":149,"quotes":[{"text":"Your employer cannot make you take annual holidays in advance.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":152,"target":"__end"}],"line":151},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":148},{"id":"unexpected","title":"The workplace closed suddenly","lines":[{"kind":"say","text":"The employee cannot be made to take holidays if:","line":155,"quotes":[{"text":"Your employer cannot make you take annual holidays if:","where":"","check":"exact"}]},{"kind":"say","text":"1. the workplace closed unexpectedly (for example, a natural disaster), and","line":157,"quotes":[{"text":"your employer closes the workplace unexpectedly (for example, if there was a natural disaster), and","where":"","check":"exact"}]},{"kind":"say","text":"2. they were given less than 14 days' notice, and","line":159,"quotes":[{"text":"you are given less than 14 days' notice, and","where":"","check":"exact"}]},{"kind":"say","text":"3. they are willing and able to work.","line":161,"quotes":[{"text":"you are willing and able to work.","where":"","check":"exact"}]},{"kind":"say","text":"The employer page adds that this is when the employee refuses to take holidays.","line":163,"quotes":[{"text":"and an employee refuses to take annual holidays with less than 14 days' notice and is willing and able to work – they cannot be made to take annual holidays.","where":"","check":"exact"}]},{"kind":"say","text":"Employment New Zealand does not say what applies if not all of these are true, or what happens to pay. Check the employment agreement.","line":165}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":167,"target":"__end"}],"line":166},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":154},{"id":"closedown","title":"Annual closedown","lines":[{"kind":"say","text":"An annual closedown is when a workplace (or part of it) shuts each year and staff must take time off.","line":170,"quotes":[{"text":"An annual closedown is when a workplace shuts each year, often for a holiday or seasonal break, and employees are required to take time off.","where":"","check":"exact"}]},{"kind":"say","text":"An employer can have only 1 annual closedown in any 12-month period, with 14 days' notice before it starts.","line":172,"quotes":[{"text":"An employer can only have 1 annual closedown in any 12-month period and must give their employees 14 days' notice before it starts.","where":"","check":"exact"}]}],"ask":{"question":"Does the employee have enough holidays to cover it?","options":[{"label":"Yes, enough","to":"closedown-enough","line":175,"target":"closedown-enough"},{"label":"Some, but not enough","to":"closedown-short","line":176,"target":"closedown-short"},{"label":"Not entitled yet, or not sure","to":"closedown-not-entitled","line":177,"target":"closedown-not-entitled"},{"label":"This is a second closedown in 12 months","to":"other-closedown","line":178,"target":"other-closedown"}],"line":174},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":169},{"id":"closedown-enough","title":"Enough holidays","lines":[{"kind":"say","text":"Holidays the employee can use must be used for the closedown, as long as they got 14 days' notice.","line":181,"quotes":[{"text":"they must do so (as long as they get 14 days' notice).","where":"","check":"exact"}]},{"kind":"say","text":"They are paid in the usual way.","line":183,"quotes":[{"text":"Payment for these annual holidays is calculated in the usual way.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"closedown-leave","line":185,"target":"closedown-leave"},"timer":null,"reminders":[],"stop":null,"end":false,"line":180,"nexts":[{"to":"closedown-leave","line":185,"target":"closedown-leave"}]},{"id":"closedown-short","title":"Not enough holidays","lines":[{"kind":"say","text":"The employee must use the holidays they have first, as long as they got 14 days' notice.","line":188,"quotes":[{"text":"they must do so (as long as they get 14 days' notice).","where":"","check":"exact"}]},{"kind":"say","text":"For the rest of the closedown:","line":190,"quotes":[{"text":"If they do not have enough annual holidays to cover the whole annual closedown period, then:","where":"","check":"exact"}]},{"kind":"say","text":"the employer can choose to let them take holidays in advance","bullet":true,"line":192,"quotes":[{"text":"their employer can choose to also let them take annual holidays in advance","where":"","check":"exact"}]},{"kind":"say","text":"they may agree to use other holidays or leave, such as alternative holidays or leave without pay.","bullet":true,"line":194,"quotes":[{"text":"they may agree with their employer to use other types of holidays or leave, such as alternative holidays, leave without pay, or another form of leave (with or without pay) not provided by law.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"closedown-leave","line":196,"target":"closedown-leave"},"timer":null,"reminders":[],"stop":null,"end":false,"line":187,"nexts":[{"to":"closedown-leave","line":196,"target":"closedown-leave"}]},{"id":"closedown-not-entitled","title":"Not entitled yet","lines":[{"kind":"say","text":"An employee may not be entitled yet because they have:","line":199,"quotes":[{"text":"This could be because they have:","where":"","check":"exact"}]},{"kind":"say","text":"not worked 12 months continuously","bullet":true,"line":201,"quotes":[{"text":"not worked for their employer for 12 months continuously","where":"","check":"exact"}]},{"kind":"say","text":"taken more than a week of unpaid leave that moved their anniversary date, or","bullet":true,"line":203,"quotes":[{"text":"taken unpaid leave of more than a week and this has moved their anniversary date for annual holidays entitlement, or","where":"","check":"exact"}]},{"kind":"say","text":"at some time been paid holiday pay as they go.","bullet":true,"line":205,"quotes":[{"text":"at some time, received pay for their annual holidays on a pay-as-you-go basis.","where":"","check":"exact"}]},{"kind":"say","text":"If so, the employer must pay them 8% and move their anniversary date.","line":207,"quotes":[{"text":"1. Pay the employee 8% of their gross earnings as at the annual closedown date.","where":"","check":"exact"},{"text":"2. Move the anniversary date for annual holidays entitlement.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"closedown-pay","line":210,"target":"closedown-pay"},"timer":null,"reminders":[],"stop":null,"end":false,"line":198,"nexts":[{"to":"closedown-pay","line":210,"target":"closedown-pay"}]},{"id":"closedown-pay","title":"The 8% payment","lines":[{"kind":"say","text":"The employer pays an extra 8% of gross earnings up to the closedown date, counted from:","line":213,"quotes":[{"text":"Employees must be paid an additional 8% of their gross earnings up to the annual closedown date, from:","where":"","check":"exact"}]},{"kind":"say","text":"the start of the job, if they haven't worked 12 months continuously, or","bullet":true,"line":215,"quotes":[{"text":"the start of their employment, if they've not worked for their employer continuously for 12 months, or","where":"","check":"exact"}]},{"kind":"say","text":"their last anniversary date, if they have worked at least 12 months.","bullet":true,"line":217,"quotes":[{"text":"their last anniversary date for annual holidays, if they've already worked for their employer continuously for at least 12 months.","where":"","check":"exact"}]},{"kind":"say","text":"Any 8% pay-as-you-go or advance holidays already paid is taken off.","line":219,"quotes":[{"text":"Any amount already paid as 8% pay-as-you-go, or already paid as annual holidays in advance, must be subtracted.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"closedown-date","line":221,"target":"closedown-date"},"timer":null,"reminders":[],"stop":null,"end":false,"line":212,"nexts":[{"to":"closedown-date","line":221,"target":"closedown-date"}]},{"id":"closedown-date","title":"The new anniversary date","lines":[{"kind":"say","text":"The anniversary date moves to the day the closedown starts (or a nearby date the employer chooses). The next holidays come 12 months from then.","line":224,"quotes":[{"text":"The anniversary date for their annual holidays entitlement will be moved to the date the annual closedown starts (or another nearby date that their employer chooses) – meaning they'll receive their next leave entitlement 12 months from this date.","where":"","check":"exact"}]},{"kind":"warning","text":"The employee then gets no holidays for the time worked up to the closedown, and no pay for the closedown period.","line":226,"quotes":[{"text":"In this situation, the employee is then not otherwise entitled to:","where":"","check":"exact"},{"text":"any annual holidays for the period of employment up to the start of the annual closedown","where":"","check":"exact"},{"text":"any pay for the period of the closedown.","where":"","check":"exact"}]},{"kind":"say","text":"They could agree with the employer to take some holidays in advance as well.","line":230,"quotes":[{"text":"However, an employee could agree with their employer to take some annual holidays in advance in addition to the 8% payment.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"closedown-leave","line":232,"target":"closedown-leave"},"timer":null,"reminders":[],"stop":null,"end":false,"line":223,"nexts":[{"to":"closedown-leave","line":232,"target":"closedown-leave"}]},{"id":"closedown-leave","title":"Sick leave and public holidays in a closedown","lines":[{"kind":"say","text":"Alternative holidays, sick leave, bereavement leave, family violence leave and public holidays can still fall in a closedown.","line":235,"quotes":[{"text":"An employee can also take any of the following types of leave during an annual closedown:","where":"","check":"exact"},{"text":"There may also be a public holiday that falls during the closedown period.","where":"","check":"exact"}]},{"kind":"say","text":"On a day the employee would normally work, they are paid for that leave as if there were no closedown, even if they are on unpaid leave for the rest.","line":238,"quotes":[{"text":"For any of these leave types, the employee must be paid for that leave day as if the closedown were not happening.","where":"","check":"exact"},{"text":"This applies even if they're on another type of leave for the rest of the closedown period — including unpaid leave.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":242,"target":"__end"}],"line":241},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":234},{"id":"other-closedown","title":"Other kinds of closedown","lines":[{"kind":"say","text":"This is a closedown that is not the annual one, or an extra one after an annual closedown in the last 12 months.","line":245,"quotes":[{"text":"in addition to an annual closedown that has already happened in the last 12 months.","where":"","check":"exact"}]},{"kind":"say","text":"The employer can make staff take holidays for it only if all of these are true:","line":247,"quotes":[{"text":"The employer can only require their employees to take annual holidays for these other types of closedowns if:","where":"","check":"exact"}]},{"kind":"say","text":"the employee has holidays they are entitled to (not in advance)","bullet":true,"line":249,"quotes":[{"text":"the employee has annual holidays they are entitled to take (not annual holidays in advance)","where":"","check":"exact"}]},{"kind":"say","text":"they could not agree on when to take them","bullet":true,"line":251,"quotes":[{"text":"the employer has been unable to reach agreement with the employee about when they will take these annual holidays","where":"","check":"exact"}]},{"kind":"say","text":"the employer gave 14 days' notice.","bullet":true,"line":253,"quotes":[{"text":"the employer has given their employee 14 days' notice.","where":"","check":"exact"}]},{"kind":"say","text":"Otherwise they need to agree how holidays and leave will work. The anniversary date does not change.","line":255,"quotes":[{"text":"they will also need to agree how these other types of closedowns will be treated and what annual holidays and/or leave arrangements will apply.","where":"","check":"exact"},{"text":"The date of the employee's entitlement to annual holidays is not affected by these other types of closedowns.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":259,"target":"__end"}],"line":258},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":244},{"id":"cashup","title":"Cashing up holidays","lines":[{"kind":"say","text":"Cashing up means getting holidays paid out instead of taking time off.","line":262,"quotes":[{"text":"Cashing-up means getting annual holidays paid out instead of taking time off from work.","where":"","check":"exact"}]},{"kind":"say","text":"You can ask to cash up up to 1 week of your 4-week entitlement each year.","line":264,"quotes":[{"text":"Employees can ask to cash-up up to 1 week of their 4-week annual holiday entitlement each year.","where":"","check":"exact"}]},{"kind":"say","text":"You can't cash up holidays until you are entitled to them.","line":266,"quotes":[{"text":"Annual holidays cannot be cashed-up until the employee gets their annual holiday entitlement.","where":"","check":"exact"}]}],"ask":{"question":"Are you entitled to annual holidays yet?","options":[{"label":"Yes","to":"cashup-ask","line":269,"target":"cashup-ask"},{"label":"Not yet","to":"end","line":270,"target":"__end"}],"line":268},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":261},{"id":"cashup-ask","title":"Asking to cash up","lines":[{"kind":"do","text":"Check your workplace policy or employment agreement. Some employers do not allow cashing up.","line":273,"quotes":[{"text":"Check the workplace policy or employment agreement to see if it says anything about cashing-up and what’s allowed.","where":"","check":"exact"}]},{"kind":"do","text":"Put your request in writing.","line":275,"quotes":[{"text":"Requests to cash-up must be in writing.","where":"","check":"exact"}]},{"kind":"say","text":"You can ask for the whole week at once, or in several requests.","line":277,"quotes":[{"text":"make 1 request to cash-up the whole week, or","where":"","check":"exact"},{"text":"make multiple requests until the whole week is cashed-up.","where":"","check":"exact"}]},{"kind":"warning","text":"You can't save up holidays to cash up later. Even with 8 weeks owing, the most is 1 week.","line":280,"quotes":[{"text":"For example, if an employee does not take any holidays for 2 years and has 8 weeks owing they can still only cash-up a maximum of 1 week.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"cashup-reply","line":282,"target":"cashup-reply"},"timer":null,"reminders":[],"stop":null,"end":false,"line":272,"nexts":[{"to":"cashup-reply","line":282,"target":"cashup-reply"}]},{"id":"cashup-reply","title":"What your employer must do","lines":[{"kind":"say","text":"Your employer must consider your request within a reasonable time (Employment New Zealand does not say how long).","line":285,"quotes":[{"text":"must consider a cash-up request within a reasonable time","where":"","check":"exact"}]},{"kind":"say","text":"They can say no, and do not have to give a reason. They must tell you their decision in writing.","line":287,"quotes":[{"text":"can say no","where":"","check":"exact"},{"text":"do not have to give a reason for their decision.","where":"","check":"exact"},{"text":"must tell the employee what their decision is and put it in writing","where":"","check":"exact"}]},{"kind":"warning","text":"A workplace policy can say the employer does not have to consider cash-up requests at all.","line":291,"quotes":[{"text":"The policy can say that the employer does not have to consider requests for cashing-up annual holidays.","where":"","check":"exact"}]}],"ask":{"question":"What happened?","options":[{"label":"My employer agreed","to":"cashup-paid","line":294,"target":"cashup-paid"},{"label":"My employer said no","to":"end","line":295,"target":"__end"},{"label":"I felt pressured, or was paid out without asking","to":"cashup-pressure","line":296,"target":"cashup-pressure"}],"line":293},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":284},{"id":"emp-cashup","title":"A request to cash up (employers)","lines":[{"kind":"warning","text":"You must not let an employee cash up more than 1 week of their minimum entitlement each year.","line":299,"quotes":[{"text":"Employers must not allow employees to cash-up more than 1 week of their minimum entitlement each year.","where":"","check":"exact"}]},{"kind":"say","text":"Holidays cannot be cashed up until the employee is entitled to them.","line":301,"quotes":[{"text":"Annual holidays cannot be cashed-up until the employee gets their annual holiday entitlement.","where":"","check":"exact"}]},{"kind":"say","text":"Requests must be in writing.","line":303,"quotes":[{"text":"Requests to cash-up must be in writing.","where":"","check":"exact"}]},{"kind":"say","text":"Weeks above the minimum may be cashed up if the employment agreement or workplace policy allows, and you agree.","line":305,"quotes":[{"text":"It depends on what it says in their employment agreement or workplace policy, and if their employer agrees to it.","where":"","check":"exact"}]}],"ask":null,"next":{"to":"emp-cashup-reply","line":307,"target":"emp-cashup-reply"},"timer":null,"reminders":[],"stop":null,"end":false,"line":298,"nexts":[{"to":"emp-cashup-reply","line":307,"target":"emp-cashup-reply"}]},{"id":"emp-cashup-reply","title":"Responding to a cash-up request","lines":[{"kind":"say","text":"You must consider it within a reasonable time (Employment New Zealand does not say how long). You can say no without giving a reason, but you must tell the employee your decision in writing.","line":310,"quotes":[{"text":"must consider a cash-up request within a reasonable time","where":"","check":"exact"},{"text":"can say no","where":"","check":"exact"},{"text":"do not have to give a reason for their decision.","where":"","check":"exact"},{"text":"must tell the employee what their decision is and put it in writing","where":"","check":"exact"}]},{"kind":"warning","text":"You must not pressure employees into cashing up.","line":315,"quotes":[{"text":"Employers must not pressure employees into cashing-up holidays.","where":"","check":"exact"}]}],"ask":{"question":"What will you do?","options":[{"label":"Agree","to":"cashup-paid","line":318,"target":"cashup-paid"},{"label":"Say no","to":"end","line":319,"target":"__end"},{"label":"Have or write a workplace policy on cashing up","to":"emp-cashup-policy","line":320,"target":"emp-cashup-policy"}],"line":317},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":309},{"id":"emp-cashup-policy","title":"A workplace policy on cashing up","lines":[{"kind":"say","text":"A policy can cover the whole workplace or part of it. It can say you don't have to consider requests; then the rules on responding don't apply.","line":323,"quotes":[{"text":"about cashing-up which can apply to the whole workplace or just parts of it.","where":"","check":"exact"},{"text":"If this is the case, then the above does not apply.","where":"","check":"exact"}]},{"kind":"say","text":"The policy must not allow more than 1 week of the 4-week minimum each year, or say how many requests an employee can make.","line":326,"quotes":[{"text":"allow an employee to cash-up more than 1 week of their 4-week minimum annual holiday entitlement each year","where":"","check":"exact"},{"text":"say how many requests to cash-up an employee can make.","where":"","check":"exact"}]},{"kind":"do","text":"Consult employees (and unions if applicable), and make sure staff know about the policy.","line":329,"quotes":[{"text":"consult with employees (and unions if applicable)","where":"","check":"exact"},{"text":"make sure new and existing employees know about the policy.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":333,"target":"__end"}],"line":332},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":322},{"id":"cashup-paid","title":"Paying out a cash-up","lines":[{"kind":"say","text":"The employer must pay as soon as they can, usually the next payday, and at least what the employee would have got for taking the holidays.","line":336,"quotes":[{"text":"If an employer agrees to cash-up annual holidays, they must make the payment as soon as they can.","where":"","check":"exact"},{"text":"This is usually the next payday.","where":"","check":"exact"},{"text":"The payment must be at least the amount the employee would have got if they had taken the holidays.","where":"","check":"exact"}]},{"kind":"do","text":"Employer: record how much holiday was cashed up, the amount, and the date paid.","line":340,"quotes":[{"text":"the portion of annual holidays cashed-up – for example, the whole week or part of the week","where":"","check":"exact"},{"text":"the amount of the payment","where":"","check":"exact"},{"text":"the date the payment was made.","where":"","check":"exact"}]},{"kind":"say","text":"If you can't agree on the amount, Employment New Zealand says it may be able to help and decide. Parental leave may change the amount.","line":344,"quotes":[{"text":"we may be able to help and decide for them.","where":"","check":"exact"},{"text":"may affect how much cashed-up annual holidays are paid out at.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":348,"target":"__end"}],"line":347},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":335},{"id":"cashup-pressure","title":"Cash-ups can't be required","lines":[{"kind":"warning","text":"Employers must not pressure employees to cash up, or make it part of pay talks or a condition of the job, spoken or written.","line":351,"quotes":[{"text":"Employers must not pressure employees into cashing-up holidays.","where":"","check":"exact"},{"text":"discuss a requirement to cash-up as part of wage or salary negotiations","where":"","check":"exact"},{"text":"make asking for, or receiving, a cash-up a term or condition of employment.","where":"","check":"exact"},{"text":"This applies to terms and conditions that have been agreed to verbally as well as in writing.","where":"","check":"exact"}]},{"kind":"say","text":"If the employee did not ask, they keep their holidays and may keep the money. Taking it back would count as a deduction.","line":356,"quotes":[{"text":"can keep their entitlement to the annual holidays that were cashed-up, and","where":"","check":"exact"},{"text":"may be able to keep the cash-up money. Recovering the payment would be treated as a deduction.","where":"","check":"exact"}]},{"kind":"say","text":"The employer may also face a penalty, up to $10,000 for an individual.","line":359,"quotes":[{"text":"The employer may also face a","where":"","check":"exact"},{"text":"Penalties can be up to $10,000 per","where":"","check":"exact"}]},{"kind":"say","text":"For a company or other entity, up to $20,000 per breach. Employment New Zealand's page could not be read in full here; check the page itself.","line":362,"quotes":[{"text":"$20,000 per breach if the employer is a company or other entity.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":365,"target":"__end"}],"line":364},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":350},{"id":"employer","title":"For employers","lines":[{"kind":"say","text":"You must be reasonable in considering requests. You cannot give less than 4 weeks a year, even if the employment agreement says so.","line":368,"quotes":[{"text":"be reasonable in considering requests to take annual holidays","where":"","check":"exact"},{"text":"You cannot give an employee less than 4 weeks annual holidays each year, even if their employment agreement says so.","where":"","check":"exact"}]}],"ask":{"question":"What do you need?","options":[{"label":"An employee asked for time off","to":"emp-request","line":372,"target":"emp-request"},{"label":"An employee asked for holidays in advance","to":"emp-advance","line":373,"target":"emp-advance"},{"label":"An employee asked to cash up holidays","to":"emp-cashup","line":374,"target":"emp-cashup"},{"label":"I want staff to take holidays, or to close down","to":"emp-require","line":375,"target":"emp-require"},{"label":"Cancelling, holiday pay or someone leaving","to":"other","line":376,"target":"other"}],"line":371},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":367},{"id":"emp-request","title":"A request for time off","lines":[{"kind":"say","text":"You cannot unreasonably refuse holidays an employee is entitled to. You need a good reason to say no, for example others already have holidays at the same time.","line":379,"quotes":[{"text":"You cannot unreasonably refuse an employee who wants to take annual holidays they're entitled to.","where":"","check":"exact"},{"text":"agree to your request for annual holidays before you take the time off – or have a good reason for declining it, for example, others having already arranged holidays at the same time","where":"","check":"exact"}]},{"kind":"say","text":"You must let them take holidays within 12 months of becoming entitled, and at least 2 of their 4 weeks at once if they wish.","line":382,"quotes":[{"text":"take annual holidays within 12 months of the date on which they become entitled to them.","where":"","check":"exact"},{"text":"take at least 2 of their 4 weeks of annual holidays at once, if they wish to.","where":"","check":"exact"}]},{"kind":"warning","text":"Employment New Zealand does not explain what counts as a \"good reason\", or how quickly to reply.","line":385}],"ask":{"question":"What will you do?","options":[{"label":"Agree","to":"emp-agree","line":387,"target":"emp-agree"},{"label":"We can't agree on when","to":"emp-require","line":388,"target":"emp-require"},{"label":"Finish","to":"end","line":389,"target":"__end"}],"line":386},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":378},{"id":"emp-agree","title":"You agreed","lines":[{"kind":"do","text":"Pay the holidays before they start, unless you agreed in writing to pay in the normal pay cycle.","line":392,"quotes":[{"text":"The employer must pay the employee for the holiday before they take it unless they have agreed in writing to be paid in their normal pay cycle.","where":"","check":"exact"}]},{"kind":"do","text":"Keep accurate records of holiday entitlements and payments.","line":394,"quotes":[{"text":"keep accurate records to track annual holiday entitlements and payments.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"How holiday pay is worked out","to":"holiday-pay","line":397,"target":"holiday-pay"},{"label":"Finish","to":"end","line":398,"target":"__end"}],"line":396},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":391},{"id":"emp-advance","title":"A request for holidays in advance","lines":[{"kind":"say","text":"Employees can ask if they haven't completed 12 months, or have used all their current holidays.","line":401,"quotes":[{"text":"have not completed 12 months of continuous service, or","where":"","check":"exact"},{"text":"have used all of their current entitlement.","where":"","check":"exact"}]},{"kind":"say","text":"You do not have to agree, unless a relevant clause says otherwise. Employment New Zealand's page could not be read in full here; check the page itself.","line":404,"quotes":[{"text":"but you do not have to agree to the request unless there is a relevant clause in their","where":"","check":"exact"}]},{"kind":"do","text":"If you agree, get the employee to agree in writing that you can recover the overpayment from their final pay if they leave before they become entitled.","line":406,"quotes":[{"text":"you should make sure they agree in writing that if they leave your employment before, they become entitled to annual holidays, you can recover the overpayment from their final pay.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":409,"target":"__end"}],"line":408},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":400},{"id":"emp-require","title":"Requiring staff to take holidays","lines":[{"kind":"say","text":"You can only require employees to take holidays if:","line":412,"quotes":[{"text":"You can only require employees to take annual holidays if:","where":"","check":"exact"}]},{"kind":"say","text":"you can't agree on when they take holidays they're entitled to, and give at least 14 days' notice, or","bullet":true,"line":414,"quotes":[{"text":"you cannot reach agreement about when annual holidays (that the employee is entitled to) will be taken, and you give the employee at least 14 days' notice, or","where":"","check":"exact"}]},{"kind":"say","text":"you close down every year for a set period (for example over Christmas), with at least 14 days' notice.","bullet":true,"line":416,"quotes":[{"text":"you regularly close down for a certain period every year (for example, over Christmas) and give the employee at least 14 days’ notice.","where":"","check":"exact"}]}],"ask":{"question":"What is the situation?","options":[{"label":"We can't agree on when","to":"end","line":419,"target":"__end"},{"label":"Our yearly closedown","to":"closedown","line":420,"target":"closedown"},{"label":"A different or extra closedown","to":"other-closedown","line":421,"target":"other-closedown"},{"label":"A sudden closure (for example a natural disaster)","to":"unexpected","line":422,"target":"unexpected"},{"label":"Holidays in advance","to":"required-advance","line":423,"target":"required-advance"}],"line":418},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":411},{"id":"cancel","title":"Cancelling arranged holidays","lines":[{"kind":"say","text":"Neither the employee nor the employer has to accept the other's request to cancel arranged holidays. They should work out a solution in good faith, for example another time, or fewer days.","line":426,"quotes":[{"text":"Neither you nor your employer have to accept the other’s request to cancel annual holidays but you should negotiate a solution together in good faith.","where":"","check":"exact"},{"text":"take a holiday at another time, or","where":"","check":"exact"},{"text":"reduce the amount of annual holidays you take.","where":"","check":"exact"}]},{"kind":"warning","text":"The employer page also says an employer can cancel approved holidays \"if you have a good reason\". That doesn't fit with the above, and \"good reason\" is not explained.","line":430,"quotes":[{"text":"cancel annual holidays that have already been approved, if you have a good reason, or the employee asks you to.","where":"","check":"exact"}]},{"kind":"do","text":"Put any changes in writing.","line":432,"quotes":[{"text":"Any changes to arrangements should be in writing.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":435,"target":"__end"}],"line":434},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":425},{"id":"week","title":"How much is a week for you?","lines":[{"kind":"say","text":"Your holidays are 4 of your own working weeks, based on what a week is for you when you take them.","line":438,"quotes":[{"text":"This is because your holiday entitlement should be based on what a week is for you at the time you take your holiday.","where":"","check":"exact"}]}],"ask":{"question":"Which is closest to how you work?","options":[{"label":"The same days and hours each week","to":"week-same","line":441,"target":"week-same"},{"label":"A steady pattern, but not the same every week","to":"week-pattern","line":442,"target":"week-pattern"},{"label":"Unpredictable hours or roster","to":"week-unpredictable","line":443,"target":"week-unpredictable"},{"label":"My payslip shows \"accrued\" leave","to":"week-accrued","line":444,"target":"week-accrued"}],"line":440},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":437},{"id":"week-same","title":"Same days and hours each week","lines":[{"kind":"say","text":"For example, working 3 days a week gives 12 days of holidays (3 days x 4 weeks).","line":447,"quotes":[{"text":"For example, if an employee works 3 days each week, they can take 12 days of annual holidays. (3 days x 4 weeks = 12 days.)","where":"","check":"exact"}]},{"kind":"say","text":"Working 5 days a week gives 20 days.","line":449,"quotes":[{"text":"If they work 5 days each week, they can take 20 days of annual holidays.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":452,"target":"__end"}],"line":451},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":446},{"id":"week-pattern","title":"A steady pattern that changes","lines":[{"kind":"say","text":"You and your employer can agree to count your holidays in days or in hours. Your employer should explain the choice and help you pick.","line":455,"quotes":[{"text":"If this is the case, you can agree with your employer to work out your annual holiday entitlement in either days or hours.","where":"","check":"exact"},{"text":"Your employer should discuss the consequences of the choice with you and help you choose the best option for your situation.","where":"","check":"exact"}]},{"kind":"say","text":"Once agreed, the same method should be used. If your work pattern changes, your entitlement must be reviewed and worked out again.","line":458,"quotes":[{"text":"The option agreed should be used consistently for that employee unless their situation changes.","where":"","check":"exact"},{"text":"If the employee’s work pattern does change, their situation must be reviewed, and their annual holiday entitlement recalculated based on the new work pattern.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish","to":"end","line":462,"target":"__end"}],"line":461},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":454},{"id":"week-unpredictable","title":"Unpredictable hours","lines":[{"kind":"say","text":"You and your employer should try to find a pattern to use. It must be fair and reasonable, and you both must agree. It could be based on:","line":465,"quotes":[{"text":"This must be a fair and reasonable reflection of your working week and agreed to by both parties.","where":"","check":"exact"}]},{"kind":"say","text":"the agreed hours in your employment agreement","bullet":true,"line":467,"quotes":[{"text":"the agreed hours in your employment agreement","where":"","check":"exact"}]},{"kind":"say","text":"the days and hours you worked in the weeks before the holiday","bullet":true,"line":469,"quotes":[{"text":"the days and hours you have been working in the weeks leading up to the annual holiday being taken","where":"","check":"exact"}]},{"kind":"say","text":"another method you both agree, such as an average.","bullet":true,"line":471,"quotes":[{"text":"another method (for example, the average number of hours worked over a set period) agreed to by you and your employer.","where":"","check":"exact"}]}],"ask":{"question":"What next?","options":[{"label":"Finish
