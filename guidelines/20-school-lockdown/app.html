<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14213d">
<title>School lockdown</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Archivo:wght@500;700;800;900&family=IBM+Plex+Sans:wght@400;500;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700;800&display=swap">
<style>/* Phone-first, portrait, large tap targets. One stylesheet for every generated app; looks (engine/looks/) restyle it.
   --brand is set by the runtime when the template gives "Brand colour:"; each look decides where it shows. */
:root { --ink:#1b1f24; --mut:#5d6670; --bg:#f4f5f7; --card:#fff; --line:#dde1e6; --go:var(--brand, #0b6e4f); --warn:#9a3412; --warnbg:#fff4e5; --due:#b91c1c; --author:#6b21a8; --authorbg:#f5ecff; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding-bottom: 72px; }
.bar { position: sticky; top: 0; z-index: 3; display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 14px; background:#14213d; color:#fff; }
.bar .t { font-weight:600; font-size:16px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar .brand { font-weight:800; margin-right:6px; }
.bar .clock:empty { display:none; }
.bar .clock { font-variant-numeric: tabular-nums; font-size:18px; }
.proto { font-size:12px; color:var(--author); background:var(--authorbg); padding:4px 14px; }
.card { background:var(--card); margin:10px; padding:14px 16px; border-radius:12px; border:1px solid var(--line); }
h1 { font-size:22px; margin:4px 0 8px; } h2 { font-size:21px; margin:2px 0 10px; } h3 { font-size:15px; margin:16px 0 6px; color:var(--mut); text-transform:uppercase; letter-spacing:.04em; }
p { margin: 8px 0; } p.bul::before { content:"• "; color:var(--mut); }
.big { display:block; width:100%; min-height:52px; margin:10px 0 0; padding:12px 14px; font:inherit; font-weight:600; border-radius:10px; border:1px solid var(--line); background:#eef1f4; color:var(--ink); text-align:left; }
.big.go { background:var(--go); color:#fff; border-color:var(--go); text-align:center; }
.big.opt { background:#e8f0fe; border-color:#b7c9f5; }
.big.opt.broken { border-style:dashed; border-color:var(--author); }
.big.skip { background:transparent; text-align:center; font-weight:500; color:var(--mut); }
.link { background:none; border:0; color:#1d4ed8; font:inherit; padding:0; }
.crumb { display:flex; justify-content:space-between; font-size:14px; color:var(--mut); }
.q { font-weight:600; font-size:19px; margin-top:16px; }
.warn { background:var(--warnbg); color:var(--warn); border-left:4px solid var(--warn); padding:8px 10px; border-radius:6px; font-weight:600; }
.author { background:var(--authorbg); color:var(--author); border-left:4px solid var(--author); padding:8px 10px; border-radius:6px; font-size:15px; }
.do { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--line); }
.do input { width:26px; height:26px; margin:0; flex:none; } .do span { flex:1; }
.do .dep { flex-basis:100%; margin-left:36px; }
.dep { display:block; color:var(--author); font-size:13px; }
/* folds: "More detail" (extra lines of the step) and "Sources for this screen" (the guideline quotes) */
details.more, details.sources { margin:14px 0 0; }
details.more > summary, details.sources > summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; min-height:48px; }
details.more > summary::-webkit-details-marker, details.sources > summary::-webkit-details-marker { display:none; }
details.more > summary::before, details.sources > summary::before { content:"+"; display:inline-grid; place-items:center; flex:none; width:26px; height:26px; border-radius:6px; font-weight:800; line-height:1; }
details.more[open] > summary::before, details.sources[open] > summary::before { content:"−"; }
details.more { border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
details.more > summary { font-weight:700; color:var(--ink); } details.more > summary::before { background:#e8eef6; color:#1d4ed8; }
details.more[open] { padding-bottom:6px; } .more-line { margin:6px 0 10px; }
details.sources { font-size:14px; color:var(--mut); border-top:1px dashed var(--line); margin-top:18px; }
details.sources > summary { color:var(--mut); font-weight:600; } details.sources > summary::before { border:1px solid var(--line); color:var(--mut); }
.src-list { margin:4px 0 6px; padding-left:24px; } .src-list li { margin:0 0 10px; }
.src-list q { font-style:italic; color:var(--ink); } .src-list .where { color:var(--mut); } .src-list .for { display:block; font-size:13px; color:var(--mut); }
/* "Tip:" the app's own suggestion, never guideline advice: a dashed box and a badge that says so */
.tip { margin:12px 0; padding:10px 12px; border:2px dashed #4f6fb5; border-radius:10px; background:#f1f5fd; }
.tip-badge { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:#fff; background:#3b5998; border-radius:999px; padding:2px 10px; }
.tip-text { margin:6px 0 0; font-size:.94em; font-weight:400; color:var(--mut); }   /* secondary to the guideline's own lines; the badge says what it is */
.timer { margin:14px 0; padding:12px; border-radius:10px; background:#eef6f2; text-align:center; }
.timer .lbl { color:var(--mut); font-size:14px; }
.big-clock { font-size:44px; font-weight:700; font-variant-numeric:tabular-nums; }
.timer.due { background:#fde8e8; } .timer.due .big-clock { color:var(--due); }
.reminders { position:sticky; top:44px; z-index:2; background:var(--bg); padding:6px 10px 0; }
.rem { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:6px; }
.rem .rt { flex:1; font-weight:600; font-size:15px; } .rem .rc { font-variant-numeric:tabular-nums; font-size:15px; }
.rem button { font:inherit; font-size:14px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.rem.due { border-color:var(--due); background:#fde8e8; } .rem.due .rc { color:var(--due); font-weight:700; }
.rec { padding:6px 0; } .rec small { color:var(--mut); }
.rec-btn { background:#fff7e6; border-color:#f2c46d; }
.note-box { margin:12px 0; padding:10px 0; } .note-lbl { display:block; font-weight:700; margin-bottom:6px; }
.note-text { display:block; width:100%; min-height:132px; font:inherit; line-height:1.4; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); resize:vertical; }
.note-text:focus { outline:3px solid var(--go); outline-offset:1px; }
.note-save { text-align:center; } .note-status { display:block; margin-top:6px; color:var(--mut); font-size:14px; }
/* "Location:" a position box with a big "Use GPS position" button */
.gps-btn { text-align:center; min-height:60px; font-size:18px; background:var(--go); color:#fff; border-color:var(--go); }
.gps-btn::before { content:"⌖"; margin-right:8px; font-size:1.2em; }
.gps-msg, .gps-ddm { display:block; margin:8px 0 0; } .gps-msg:empty, .gps-ddm:empty { display:none; }
.gps-msg { font-weight:600; font-size:15px; } .gps-ddm { font-weight:700; font-variant-numeric:tabular-nums; }
.loc-text { min-height:76px; margin-top:10px; }
.log small { white-space:pre-wrap; }
.lookup { border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:8px 0; }
.lookup .lk { font-weight:600; } .lookup .lv { display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px dashed var(--line); }
table { border-collapse:collapse; width:100%; font-size:14px; } th, td { border:1px solid var(--line); padding:4px 6px; text-align:left; }
.inputs { margin:10px 0; } .inp { display:block; margin:10px 0; font-weight:600; }
.inp input { display:block; width:100%; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); margin-top:4px; }
.inp small { font-weight:400; color:var(--mut); } .inp .bad { color:var(--due); font-weight:400; font-size:14px; }
.choices { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.choices button { font:inherit; padding:10px 12px; border-radius:8px; border:1px solid var(--line); background:#eef1f4; }
.choices button.on { background:#14213d; color:#fff; }
.log { padding-left:0; list-style:none; } .log li { padding:6px 0; border-bottom:1px solid var(--line); } .log time { display:inline-block; min-width:56px; font-variant-numeric:tabular-nums; color:var(--mut); } .log .tod { font-variant-numeric:tabular-nums; font-size:.85em; color:var(--mut); margin-right:4px; }
.findings { padding-left:18px; } .findings li { margin:8px 0; font-size:15px; }
.lvl-fix { color:var(--due); } .lvl-check { color:var(--warn); } .lvl-info { color:var(--mut); }
.tabs { position:fixed; bottom:0; left:0; right:0; display:flex; background:#fff; border-top:1px solid var(--line); max-width:560px; margin:0 auto; }
.tabs button { flex:1; font:inherit; font-size:15px; padding:14px 4px; background:none; border:0; color:var(--mut); }
.look-link { text-align:center; font-size:14px; margin-top:14px; }
.look-pick { display:flex; flex-wrap:wrap; gap:6px; }
.look-pick button { font:inherit; padding:10px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
.look-pick button.on { background:var(--go); border-color:var(--go); color:#fff; }
.tabs button.on { color:#14213d; font-weight:700; box-shadow: inset 0 3px 0 #14213d; }

/* look: Clinic */
html[data-look="clinic"]{ --ink:#16232b; --mut:#5b6b75; --bg:#eef3f4; --card:#fff; --line:#dfe7ea; --go:var(--brand, #0f766e); --gosoft:#d9f0ec; --gosoft:color-mix(in srgb, var(--go) 15%, #fff);
  --warn:#9a3412; --warnbg:#fff1e6; --due:#c2410c; --author:#6b21a8; --authorbg:#f4edfb; }html[data-look="clinic"], html[data-look="clinic"] body{ font-family:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); }html[data-look="clinic"] .bar{ background:var(--bg); color:var(--ink); padding:14px 18px 6px; }html[data-look="clinic"] .bar .t{ font-size:15px; color:var(--mut); font-weight:600; }html[data-look="clinic"] .bar .clock{ background:var(--card); border-radius:999px; padding:4px 12px; font-size:15px; font-weight:600; color:var(--go); }html[data-look="clinic"] .proto{ background:transparent; color:var(--mut); padding:0 18px 4px; font-size:12px; }html[data-look="clinic"] .card{ border:0; border-radius:22px; padding:20px; margin:10px 12px; box-shadow:0 1px 2px rgba(22,35,43,.05), 0 8px 24px rgba(22,35,43,.06); }html[data-look="clinic"] h1, html[data-look="clinic"] h2{ font-family:"Inter", system-ui, sans-serif; font-weight:700; letter-spacing:-.02em; text-wrap:balance; }html[data-look="clinic"] h2{ font-size:24px; }html[data-look="clinic"] h3{ color:var(--go); }html[data-look="clinic"] .crumb{ font-size:13px; }html[data-look="clinic"] .crumb span{ background:var(--gosoft); color:var(--go); border-radius:999px; padding:2px 10px; font-weight:600; }html[data-look="clinic"] .big{ border-radius:16px; border:0; background:#f1f5f6; min-height:56px; }html[data-look="clinic"] .big.go{ background:var(--go); border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.25); }html[data-look="clinic"] .big.opt{ background:#f4f8f8; border:1.5px solid var(--line); position:relative; padding-right:40px; }html[data-look="clinic"] .big.opt::after{ content:"›"; position:absolute; right:16px; top:50%; transform:translateY(-52%); font-size:26px; color:var(--go); }html[data-look="clinic"] .q{ font-size:20px; }html[data-look="clinic"] .warn{ border:0; border-radius:14px; padding:12px 14px; }html[data-look="clinic"] .do{ border-bottom:0; background:#f6f9f9; border-radius:14px; padding:12px; margin:8px 0; }html[data-look="clinic"] .do input{ accent-color:var(--go); border-radius:50%; }html[data-look="clinic"] .timer{ background:var(--gosoft); border-radius:20px; padding:18px; position:relative; overflow:hidden; }html[data-look="clinic"] .timer::after{ content:""; position:absolute; left:0; bottom:0; height:6px; width:calc(var(--p, 0) * 100%); background:var(--go); transition:width .25s linear; }html[data-look="clinic"] .big-clock{ color:var(--go); font-size:52px; letter-spacing:-.02em; }html[data-look="clinic"] .rem{ border:0; border-radius:16px; box-shadow:0 4px 14px rgba(22,35,43,.08); }html[data-look="clinic"] .tabs{ left:12px; right:12px; bottom:10px; border:0; border-radius:20px; box-shadow:0 8px 30px rgba(22,35,43,.15); overflow:hidden; }html[data-look="clinic"] .tabs button.on{ color:var(--go); box-shadow:none; background:var(--gosoft); }html[data-look="clinic"] .choices button{ border-radius:999px; }html[data-look="clinic"] .choices button.on{ background:var(--go); border-color:var(--go); }html[data-look="clinic"] .note-box{ background:#f6f9f9; border-radius:16px; padding:14px; }html[data-look="clinic"] .note-text{ border:1.5px solid var(--line); border-radius:14px; background:#fff; }html[data-look="clinic"] .note-save{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] .tip{ background:#eef4ff; border:1.5px dashed #7b9be0; border-radius:16px; padding:12px 14px; }html[data-look="clinic"] .tip-badge{ background:#dbe6fb; color:#2f4f9a; font-weight:700; text-transform:none; letter-spacing:0; font-size:13px; }html[data-look="clinic"] details.more{ border:0; background:#f6f9f9; border-radius:16px; padding:0 14px; }html[data-look="clinic"] details.more[open]{ padding-bottom:8px; }html[data-look="clinic"] details.more > summary{ color:var(--ink); }html[data-look="clinic"] details.more > summary::before{ background:var(--gosoft); color:var(--go); border-radius:999px; }html[data-look="clinic"] details.sources{ border-top:1px solid var(--line); }html[data-look="clinic"] details.sources > summary::before{ border-radius:999px; }html[data-look="clinic"] .gps-btn{ background:var(--go); color:#fff; border-radius:999px; box-shadow:0 6px 16px rgba(15,118,110,.2); }html[data-look="clinic"] .gps-ddm{ color:var(--go); }

/* look: Wayfinding */
html[data-look="wayfinding"]{ --ink:#0a0a0a; --mut:#555; --bg:#ffffff; --card:#fff; --line:#0a0a0a; --go:#0a0a0a; --route:var(--brand, #e4002b); --sign:#ffd400;
  --warn:#0a0a0a; --warnbg:#ffd400; --due:#e4002b; --author:#5b21b6; --authorbg:#efe9fb; }html[data-look="wayfinding"], html[data-look="wayfinding"] body{ font-family:"Archivo", "Helvetica Neue", Arial, sans-serif; background:var(--bg); }html[data-look="wayfinding"] .bar{ background:var(--ink); padding:12px 16px; }html[data-look="wayfinding"] .bar .t{ font-weight:800; letter-spacing:.01em; }html[data-look="wayfinding"] .bar .clock{ background:var(--sign); color:var(--ink); padding:2px 10px; font-weight:800; }html[data-look="wayfinding"] .proto{ background:#f2f2f2; color:var(--mut); }html[data-look="wayfinding"] .card{ border:0; border-radius:0; margin:0; padding:18px 18px 20px; }html[data-look="wayfinding"] h1, html[data-look="wayfinding"] h2{ font-weight:900; letter-spacing:-.02em; line-height:1.05; text-wrap:balance; }html[data-look="wayfinding"] h1{ font-size:32px; }html[data-look="wayfinding"] h2{ font-size:30px; margin-top:6px; }html[data-look="wayfinding"] .crumb{ flex-direction:row-reverse; justify-content:flex-end; gap:14px; align-items:center; }html[data-look="wayfinding"] .crumb span{ display:inline-grid; place-items:center; min-width:40px; height:40px; padding:0 8px; background:var(--route); color:#fff; font-weight:900; font-size:15px; border-radius:999px; }html[data-look="wayfinding"] .big{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:800; min-height:58px; }html[data-look="wayfinding"] .big.go{ background:var(--ink); color:#fff; border-color:var(--ink); text-align:left; position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.go::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:22px; }html[data-look="wayfinding"] .big.opt{ background:#fff; border-color:var(--ink); position:relative; padding-right:44px; }html[data-look="wayfinding"] .big.opt::after{ content:"→"; position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--route); font-size:22px; }html[data-look="wayfinding"] .big.skip{ border:0; text-decoration:underline; }html[data-look="wayfinding"] .link{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] .q{ font-size:22px; font-weight:900; }html[data-look="wayfinding"] .warn{ background:var(--sign); color:var(--ink); border:0; border-radius:0; padding:12px 14px; font-weight:800; }html[data-look="wayfinding"] .warn::before{ content:"!"; display:inline-grid; place-items:center; width:22px; height:22px; margin-right:8px; background:var(--ink); color:var(--sign); font-weight:900; border-radius:3px; vertical-align:-3px; }html[data-look="wayfinding"] .do{ position:relative; border-bottom:0; padding:12px 0 12px 44px; font-weight:700; }html[data-look="wayfinding"] .do::before{ content:""; position:absolute; left:15px; top:0; bottom:0; width:6px; background:var(--route); }html[data-look="wayfinding"] .do input{ position:absolute; left:6px; top:12px; width:24px; height:24px; accent-color:var(--route); }html[data-look="wayfinding"] .do .dep{ margin-left:0; }html[data-look="wayfinding"] .timer{ background:var(--ink); color:#fff; border-radius:0; text-align:left; padding:14px 16px; }html[data-look="wayfinding"] .timer .lbl{ color:#bbb; text-transform:uppercase; letter-spacing:.08em; font-size:12px; font-weight:700; }html[data-look="wayfinding"] .timer::after{ content:""; display:block; height:8px; margin-top:10px; background:linear-gradient(90deg, var(--sign) calc(var(--p, 0) * 100%), #333 0); }html[data-look="wayfinding"] .big-clock{ font-size:60px; font-weight:900; color:var(--sign); }html[data-look="wayfinding"] .timer.due{ background:var(--due); }html[data-look="wayfinding"] .timer.due .big-clock{ color:#fff; }html[data-look="wayfinding"] .rem{ border:2px solid var(--ink); border-radius:0; }html[data-look="wayfinding"] .rem button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .rem.due{ background:var(--sign); }html[data-look="wayfinding"] .choices button{ border-radius:0; border:2px solid var(--ink); background:#fff; font-weight:700; }html[data-look="wayfinding"] .choices button.on{ background:var(--ink); color:#fff; }html[data-look="wayfinding"] .look-pick button{ border-radius:0; border:2px solid var(--ink); font-weight:700; }html[data-look="wayfinding"] .tabs{ border-top:2px solid var(--ink); }html[data-look="wayfinding"] .tabs button{ font-weight:800; color:var(--mut); }html[data-look="wayfinding"] .tabs button.on{ color:var(--ink); box-shadow:inset 0 4px 0 var(--route); }html[data-look="wayfinding"] .note-lbl{ font-weight:900; font-size:19px; }html[data-look="wayfinding"] .note-text{ border:2px solid var(--ink); border-radius:0; font-weight:600; }html[data-look="wayfinding"] .note-text:focus{ outline:4px solid var(--sign); outline-offset:0; }html[data-look="wayfinding"] .tip{ background:#f2f6fb; color:var(--mut); border:0; border-left:6px solid #0057b8; border-radius:0; padding:10px 14px; }html[data-look="wayfinding"] .tip-badge{ background:#0057b8; color:#fff; border-radius:0; font-weight:900; }html[data-look="wayfinding"] .tip-text{ font-weight:400; color:var(--mut); }html[data-look="wayfinding"] details.more{ border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); }html[data-look="wayfinding"] details.more > summary{ font-weight:900; font-size:18px; }html[data-look="wayfinding"] details.more > summary::before{ background:var(--ink); color:#fff; border-radius:0; }html[data-look="wayfinding"] details.sources{ border-top:2px solid #ddd; }html[data-look="wayfinding"] details.sources > summary{ color:var(--ink); text-decoration:underline; font-weight:700; }html[data-look="wayfinding"] details.sources > summary::before{ border:2px solid var(--ink); color:var(--ink); border-radius:0; }html[data-look="wayfinding"] .gps-btn{ background:var(--ink); color:#fff; border-color:var(--ink); border-radius:0; font-weight:900; }html[data-look="wayfinding"] .gps-btn::before{ color:var(--sign); }html[data-look="wayfinding"] .gps-ddm{ font-size:19px; font-weight:900; }

":"exact"},{"text":"Call 111 for emergency incidents.","where":"Ministry schools page","check":"exact"},{"text":"Call 105 for non-emergency incidents.","where":"Ministry early learning page","check":"exact"}]},{"kind":"record","text":"Police called about the threat","line":34},{"kind":"more","text":"Police will assess it, decide if it is credible, and tell you what to do. This may include a lockdown, evacuation or another safety measure.","line":35,"quotes":[{"text":"Police will assess the information you give them, determine whether it is credible, and tell you what actions you need to take.","where":"Ministry schools page","check":"exact"},{"text":"This may include a lockdown, evacuation or another safety measure.","where":"Ministry schools page","check":"exact"}]},{"kind":"more","text":"Not an emergency? The early learning page says you can also complete an online report.","line":38,"quotes":[{"text":"You can also complete an online report for non-emergency events.","where":"Ministry early learning page","check":"exact"}]}],"ask":{"question":"What did Police say?","options":[{"label":"Lock down","to":"lockdown","line":41,"target":"lockdown"},{"label":"Shelter in place","to":"shelter","line":42,"target":"shelter"},{"label":"Not told yet, or limited information","to":"called","line":43,"target":"called"},{"label":"Something else (evacuate or another measure)","to":"other","line":44,"target":"other"}],"line":40},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":29},{"id":"other","title":"Not a lockdown","lines":[{"kind":"say","text":"Respond as your emergency management plan sets out, and follow Police.","line":47,"quotes":[{"text":"Respond to event as outlined in the emergency management plan","where":"Ministry guide 2026","check":"exact"},{"text":"tell you what actions you need to take.","where":"Ministry schools page","check":"exact"}]},{"kind":"tip","text":"This app covers lockdown and shelter in place only.","line":50},{"kind":"say","text":"Follow your emergency management plan.","line":51}],"ask":null,"next":null,"timer":null,"reminders":[],"stop":null,"end":true,"line":46},{"id":"told","title":"Told to lock down or shelter in place","lines":[{"kind":"say","text":"Note who told you, then start it.","line":54,"quotes":[{"text":"Instruction to lockdown/shelter in place received from: [Police/emergency services/we initiated it ourselves]","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Instruction received","line":56},{"kind":"write","text":"Instruction received from","line":57},{"kind":"more","text":"An instruction can come from Police, the principal or delegate, the early childhood service manager or person responsible, other emergency services, or the Ministry of Education (at the direction of Police or another emergency service).","line":58,"quotes":[{"text":"Instructions to shelter in place or lockdown may be initiated by:","where":"Ministry guide 2026","check":"exact"},{"text":"the Ministry of Education (at the direction of the Police or other emergency service).","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"If Police started it, they advise when it is lifted, through the principal or manager or through the Ministry.","line":61,"quotes":[{"text":"If the Police initiated the shelter in place or lockdown, they would provide advice on lifting the shelter in place or lockdown directive through the principal or early childhood service manager directly or through the Ministry of Education.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"2025 edition: Police will usually say \"lockdown\" rather than \"shelter in place\".","line":63,"quotes":[{"text":"Police will usually direct you to lockdown rather than use the term ‘shelter in place’.","where":"2025 edition, replaced","check":"exact"}]}],"ask":{"question":"Which were you told?","options":[{"label":"Lockdown","to":"lockdown","line":66,"target":"lockdown"},{"label":"Shelter in place","to":"shelter","line":67,"target":"shelter"}],"line":65},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":53},{"id":"called","title":"Lockdown or shelter in place?","lines":[{"kind":"say","text":"Limited information? Lock down until Police or emergency services tell you more.","line":70,"quotes":[{"text":"If you have limited information at the time you are advised of an incident/event, implementing a lockdown is advised until you get further information from the Police or other emergency services.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"Lockdown: the threat is directly related to your school or centre, for example an attacker on your grounds.","line":72,"quotes":[{"text":"Lockdown – issued when the threat is directly related to your school/centre.","where":"Ministry guide 2026","check":"exact"},{"text":"For example, an attacker on your property/grounds.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"Shelter in place: the threat is external and not directed at you, for example wasps, toxic smoke, a chemical spill or an offender nearby.","line":75,"quotes":[{"text":"Shelter in place – issued when the threat is external and not directed at your school/centre.","where":"Ministry guide 2026","check":"exact"},{"text":"For example, if there is a swarm of wasps, toxic smoke, chemical spill, or a threat from an offender nearby","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"If you made the decision, you lift it yourself.","line":78,"quotes":[{"text":"If you made the decision to shelter in place or lockdown, you would lift the directive yourself.","where":"Ministry guide 2026","check":"exact"}]}],"ask":{"question":"Which one?","options":[{"label":"Lockdown: threat aimed at us (e.g. attacker on grounds)","to":"lockdown","line":81,"target":"lockdown"},{"label":"Shelter in place: threat outside, not aimed at us (e.g. wasps, smoke)","to":"shelter","line":82,"target":"shelter"},{"label":"Not sure: lockdown until Police say more","to":"lockdown","line":83,"target":"lockdown"}],"line":80},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":69},{"id":"lockdown","title":"Starting a lockdown","lines":[{"kind":"say","text":"Everyone must quickly move inside and stay there.","line":86,"quotes":[{"text":"When activated, children, students, staff, volunteers and visitors must quickly move inside the facility and remain there for safety.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Lockdown started","line":88},{"kind":"tip","text":"Tap the buttons as you go: the app keeps the times and names for later.","line":89}],"ask":null,"next":{"to":"alert","line":90,"target":"alert"},"timer":null,"reminders":[],"stop":null,"end":false,"line":85,"nexts":[{"to":"alert","line":90,"target":"alert"}]},{"id":"shelter","title":"Starting a shelter in place","lines":[{"kind":"say","text":"Everyone moves quickly inside and stays there. Usual inside activities can carry on where possible.","line":93,"quotes":[{"text":"When activated, children, students, staff, volunteers and visitors must quickly move inside the facility and remain there for safety.","where":"Ministry guide 2026","check":"exact"},{"text":"which could allow for the controlled movement of staff, students and children to their usual classrooms and continue with usual inside activities where possible.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Shelter in place started","line":96},{"kind":"tip","text":"Tap the buttons as you go: the app keeps the times and names for later.","line":97},{"kind":"more","text":"2025 edition: entries and exits restricted; no one in or out until the authorities give an all-clear; ventilation could be shut down and doors and windows closed if necessary.","line":98,"quotes":[{"text":"The entries and exits to the buildings should be restricted, however normal instructional activities continue as much as possible.","where":"2025 edition, replaced","check":"exact"},{"text":"No one should be allowed in or out of the grounds and buildings until the authorities give an all-clear signal.","where":"2025 edition, replaced","check":"exact"},{"text":"Heating, ventilation, and air conditioning systems could be shut down if necessary (to prevent spread of harmful air) and doors and windows could be closed.","where":"2025 edition, replaced","check":"exact"}]}],"ask":null,"next":{"to":"alert","line":102,"target":"alert"},"timer":null,"reminders":[],"stop":null,"end":false,"line":92,"nexts":[{"to":"alert","line":102,"target":"alert"}]},{"id":"alert","title":"Alert everyone on site","lines":[{"kind":"say","text":"Start it with the signal in your emergency management plan. Alert everyone, including visitors and contractors.","line":105,"quotes":[{"text":"Initiate lockdown/shelter in place using [insert method in the emergency management plan e.g. sounding airhorn 3 times]","where":"Ministry guide 2026","check":"exact"},{"text":"Once initiated, staff should activate their emergency management plan, alerting everyone on site of the situation, including visitors and contractors.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"warning","text":"Intruder or attacker? Sounding any alarm may not be right. Tell staff the way your plan sets out.","line":108,"quotes":[{"text":"In the case of an intruder/attacker it may not be appropriate to sound any type of alarm – how will you communicate with staff?","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Alert given","line":110},{"kind":"more","text":"The guide sets no national signal. \"Sounding airhorn 3 times\" is only its fill-in example; each school or service writes its own in its plan.","line":111,"quotes":[{"text":"[insert method in the emergency management plan e.g. sounding airhorn 3 times]","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"Parents and caregivers on site must follow staff instructions.","line":113,"quotes":[{"text":"If parents and caregivers are also onsite, they will be required to follow staff instructions.","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"police","line":115,"target":"police"},"timer":null,"reminders":[],"stop":null,"end":false,"line":104,"nexts":[{"to":"police","line":115,"target":"police"}]},{"id":"police","title":"Police or emergency services","lines":[{"kind":"say","text":"Notify Police or other emergency services if relevant, and keep communication open both ways.","line":118,"quotes":[{"text":"Notify Police or other emergency services (if relevant) and keep communication open for updates both ways.","where":"Ministry guide 2026","check":"exact"}]}],"ask":{"question":"Do Police or emergency services already know?","options":[{"label":"No: call 111 now (when it is safe)","to":"call111","line":121,"target":"call111"},{"label":"Yes (they told us, or we are in contact), or not needed for this event","to":"roll","line":122,"target":"roll"}],"line":120},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":117},{"id":"call111","title":"Call 111 when it is safe","lines":[{"kind":"do","text":"Call 111 when it is safe. Stay on the line if asked.","line":125,"quotes":[{"text":"Call Emergency Services if needed - 111","where":"Ministry guide 2026","check":"exact"},{"text":"Tell - police by calling 111 when it is safe.","where":"Ministry guide 2026","check":"exact"},{"text":"You may be asked to stay on the line and provide further information that the operator requests or if the situation changes.","where":"Police","check":"exact"}]},{"kind":"record","text":"111 called","line":129},{"kind":"more","text":"Police: if it is safe, find out the exact location, what the offenders look like and which way they are going, weapons, how many people are there and who is hurt, and what the offenders intend (if known).","line":130,"quotes":[{"text":"exact location of the incident.","where":"Police","check":"exact"},{"text":"description of the offender/s and whether they are moving in any particular direction.","where":"Police","check":"exact"},{"text":"details of any weapons being used.","where":"Police","check":"exact"},{"text":"number of people in the area and any that have been injured.","where":"Police","check":"exact"},{"text":"the intent of the offender/s (if known or apparent).","where":"Police","check":"exact"}]},{"kind":"more","text":"Police help that is not urgent: 105.","line":136,"quotes":[{"text":"Or call 105 if you need Police assistance but it is not urgent","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"roll","line":138,"target":"roll"},"timer":null,"reminders":[],"stop":null,"end":false,"line":124,"nexts":[{"to":"roll","line":138,"target":"roll"}]},{"id":"roll","title":"Is everyone inside?","lines":[{"kind":"do","text":"Check that everyone is inside. Note the names of anyone unaccounted for.","line":141,"quotes":[{"text":"Check that everyone is inside. Note any names of anyone who is unaccounted for.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"write","text":"Names of anyone unaccounted for","line":143},{"kind":"record","text":"Roll checked","line":144},{"kind":"more","text":"2025 edition: staff take attendance if possible and list missing and extra children in the room. The 2026 edition does not mention extra children.","line":145,"quotes":[{"text":"The staff will take attendance, if possible, and prepare a list of missing and extra children/students in the room.","where":"2025 edition, replaced","check":"exact"}]},{"kind":"more","text":"The guide does not say what to do about children still outside or in the toilets, beyond everyone moving to the required location.","line":147,"quotes":[{"text":"You must ensure everyone moves to and remains at the required location until the further notice.","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"secure","line":149,"target":"secure"},"timer":null,"reminders":[],"stop":null,"end":false,"line":140,"nexts":[{"to":"secure","line":149,"target":"secure"}]},{"id":"secure","title":"Secure your locations","lines":[{"kind":"do","text":"Secure your locations as required. This may include locking doors and entrances.","line":152,"quotes":[{"text":"Secure your lockdown/shelter in place location(s) as required.","where":"Ministry guide 2026","check":"exact"},{"text":"This may include locking/securing doors/entrances","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Locations secured","line":155},{"kind":"more","text":"Attacker near? Police's Escape. Hide. Tell. advice: lock doors and windows, barricade entries where possible, stay away from doors, be quiet and still.","line":156,"quotes":[{"text":"Secure your environment by locking doors and windows and barricading entries where possible.","where":"Ministry guide 2026","check":"exact"},{"text":"Stay away from doors and be as quiet and still as possible so you do not give away your hiding place.","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"staff","line":159,"target":"staff"},"timer":null,"reminders":[],"stop":null,"end":false,"line":151,"nexts":[{"to":"staff","line":159,"target":"staff"}]},{"id":"staff","title":"Keep staff updated","lines":[{"kind":"do","text":"Use the emergency staff channel to give updates and get information.","line":162,"quotes":[{"text":"Use the emergency staff communication channel to give updates and provide information to the emergency management team.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"say","text":"Staff need to know if it is lockdown or shelter in place.","line":164,"quotes":[{"text":"They will need to know whether it is a shelter in place or lockdown event and respond accordingly.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Staff updated","line":166},{"kind":"more","text":"Student phones may alert an intruder to where people are hiding, overwhelm networks, and expose children to distressing news.","line":167,"quotes":[{"text":"alert an intruder to the location of students/children and staff in hiding","where":"Ministry guide 2026","check":"exact"},{"text":"overwhelm local communication networks","where":"Ministry guide 2026","check":"exact"},{"text":"expose children and students to distressing information relating to the event.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"Consider turning off alarm bells to avoid confusion.","line":171,"quotes":[{"text":"Consider turning off alarm bells to avoid confusion.","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"tell","line":173,"target":"tell"},"timer":null,"reminders":[],"stop":null,"end":false,"line":161,"nexts":[{"to":"tell","line":173,"target":"tell"}]},{"id":"tell","title":"Tell parents, off-site groups, Ministry","lines":[{"kind":"do","text":"Tell parents and off-site groups to stay away until advised otherwise.","line":176,"quotes":[{"text":"Inform parents/caregivers/community of the situation and to stay away until advised otherwise.","where":"Ministry guide 2026","check":"exact"},{"text":"Inform groups/individuals currently off-site that we are in lockdown/shelter in place (and to stay away until advised otherwise)","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Parents messaged","line":179},{"kind":"record","text":"Off-site groups told","line":180},{"kind":"more","text":"The guide's message (fill in the brackets): \"URGENT: The centre/school is currently in lockdown due to [reason]. All [children/students] and staff are safe. Do not come to the centre until advised. We will send updates when possible.\"","line":181,"quotes":[{"text":"URGENT: The centre/school is currently in lockdown due to [reason].","where":"Ministry guide 2026","check":"exact"},{"text":"All [children/students] and staff are safe.","where":"Ministry guide 2026","check":"exact"},{"text":"Do not come to the centre until advised.","where":"Ministry guide 2026","check":"exact"},{"text":"We will send updates when possible.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"Prepare to update off-site groups regularly. The guide gives no time between updates.","line":186,"quotes":[{"text":"prepare to update them regularly.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"do","text":"Advise the Ministry of Education local office.","line":188,"quotes":[{"text":"Advise the Ministry of Education local office about the situation.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Ministry local office told","line":190}],"ask":null,"next":{"to":"hold","line":191,"target":"hold"},"timer":null,"reminders":[],"stop":null,"end":false,"line":175,"nexts":[{"to":"hold","line":191,"target":"hold"}]},{"id":"hold","title":"Stay inside until further notice","lines":[{"kind":"say","text":"Everyone stays where they are until further notice.","line":194,"quotes":[{"text":"You must ensure everyone moves to and remains at the required location until the further notice.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"do","text":"Keep direct contact with Police (or the Ministry) for updates.","line":196,"quotes":[{"text":"Maintain direct communication with emergency services/Police (or Ministry of Education where Police have asked them to direct schools and services to lockdown) to get updates about the event.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"The guide gives no time limits.","line":198},{"kind":"more","text":"2025 edition: remain in the room until Police instruct or a formal announcement ends the lockdown.","line":199,"quotes":[{"text":"Everyone will remain in the room until further instruction is received from NZ Police or until a formal announcement is made signifying the end of the lockdown.","where":"2025 edition, replaced","check":"exact"}]}],"ask":{"question":"What now?","options":[{"label":"Toilets, first aid, food or water needed","to":"needs","line":202,"target":"needs"},{"label":"Attacker near: Escape. Hide. Tell.","to":"attack","line":203,"target":"attack"},{"label":"Lockdown: advised we can move to shelter in place","to":"stepdown","line":204,"target":"stepdown"},{"label":"Lockdown or shelter in place lifted","to":"lifted","line":205,"target":"lifted"}],"line":201},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":193},{"id":"needs","title":"Toilets, first aid, food, water","lines":[{"kind":"do","text":"If needed, organise safe access to toilets, first aid, food and water.","line":208,"quotes":[{"text":"If needed, organise safe access to the necessary toileting facilities, first aid, food and water supplies etc.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"say","text":"Bathroom only if it is deemed safe and an adult goes with the child.","line":210,"quotes":[{"text":"not using the bathroom unless it is deemed safe, and the child is accompanied by an adult.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Child left room (bathroom or first aid)","line":212},{"kind":"write","text":"Who left and who went with them","line":213},{"kind":"more","text":"2025 edition: a designated staff member goes with the child, with permission from the person managing the lockdown; camp toilets if bathrooms can't be reached safely.","line":214,"quotes":[{"text":"This may include the requirement that they can only do so if the child/student is accompanied by a designated staff member.","where":"2025 edition, replaced","check":"exact"},{"text":"Schools may need to have alternative arrangements in place if bathrooms can’t be safely accessed such as camp toilets or similar.","where":"2025 edition, replaced","check":"exact"}]},{"kind":"more","text":"Medicines (for example an inhaler or EpiPen) are in the guide's planning list.","line":217,"quotes":[{"text":"Access to medications (for example, inhaler or EpiPen).","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"hold","line":219,"target":"hold"},"timer":null,"reminders":[],"stop":null,"end":false,"line":207,"nexts":[{"to":"hold","line":219,"target":"hold"}]},{"id":"stepdown","title":"Move to shelter in place","lines":[{"kind":"say","text":"Police, emergency services or others advise you can safely move from lockdown to shelter in place.","line":222,"quotes":[{"text":"Advised by Police/emergency services/other that we can safely move from lockdown to shelter in place.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Moved to shelter in place","line":224},{"kind":"write","text":"Advised by","line":225},{"kind":"say","text":"Staff need to know it is now shelter in place.","line":226,"quotes":[{"text":"They will need to know whether it is a shelter in place or lockdown event and respond accordingly.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"This can allow controlled movement to usual classrooms and usual inside activities where possible.","line":228,"quotes":[{"text":"which could allow for the controlled movement of staff, students and children to their usual classrooms and continue with usual inside activities where possible.","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"hold","line":230,"target":"hold"},"timer":null,"reminders":[],"stop":null,"end":false,"line":221,"nexts":[{"to":"hold","line":230,"target":"hold"}]},{"id":"lifted","title":"Lifted: the all-clear","lines":[{"kind":"say","text":"Whoever started it lifts it. Then follow the steps in your emergency management plan.","line":233,"quotes":[{"text":"Who lifts the shelter in place or lockdown depends on who initiated the shelter in place or lockdown.","where":"Ministry guide 2026","check":"exact"},{"text":"Advised by Police/emergency services/other to come out of lockdown or shelter in place.","where":"Ministry guide 2026","check":"exact"},{"text":"Once the directive has been lifted, follow the steps set out in your emergency management plan.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"All-clear (lifted)","line":237},{"kind":"write","text":"Lifted on whose advice","line":238},{"kind":"warning","text":"An automatic alarm stopping does not mean it is over. Signal the end the way your plan sets out.","line":239,"quotes":[{"text":"You will need to ensure staff, children, students, or visitors do not assume the situation has been resolved when the automatic alarm stops ringing.","where":"Ministry guide 2026","check":"exact"},{"text":"How will you signal the end to a lockdown or shelter in place instruction?","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"If Police started it, they advise you directly or through the Ministry. The guide sets no national all-clear signal or wording; each plan decides it.","line":242,"quotes":[{"text":"If the Police initiated the shelter in place or lockdown, they would provide advice on lifting the shelter in place or lockdown directive through the principal or early childhood service manager directly or through the Ministry of Education.","where":"Ministry guide 2026","check":"exact"}]}],"ask":{"question":"Then?","options":[{"label":"Reunite children with families","to":"reunite","line":245,"target":"reunite"},{"label":"Resume usual activities until end of day","to":"resume","line":246,"target":"resume"}],"line":244},"next":null,"timer":null,"reminders":[],"stop":null,"end":false,"line":232},{"id":"reunite","title":"Reunite children with families","lines":[{"kind":"do","text":"Tell parents where and when they can collect their child. In the message, remind them of the pick-up process.","line":249,"quotes":[{"text":"Initiate reunification process and notify parents and caregivers about where and when they can collect their child.","where":"Ministry guide 2026","check":"exact"},{"text":"When you are sending parents and caregivers messages for them to come and collect their child(ren), reinforce the reunification process.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"record","text":"Parents told where and when to collect","line":252},{"kind":"do","text":"Consider moving children in class groups to an assigned area before pick-up.","line":253,"quotes":[{"text":"Consider organising children and young people into class groups and moving them to an assigned area before they are picked up.","where":"Ministry guide 2026","check":"exact"}]},{"kind":"more","text":"The guide's message (fill in the brackets): \"The emergency has ended. All [children/students] and staff are safe. We will [remain open/close for the rest of the day]. Please collect your child [time or instructions].\"","line":255,"quotes":[{"text":"The emergency has ended.","where":"Ministry guide 2026","check":"exact"},{"text":"All [children/students] and staff are safe.","where":"Ministry guide 2026","check":"exact"},{"text":"We will [remain open/close for the rest of the day].","where":"Ministry guide 2026","check":"exact"},{"text":"Please collect your child [time or instructions].","where":"Ministry guide 2026","check":"exact"}]}],"ask":null,"next":{"to":"release","line":260,"target":"release"},"timer":null,"reminders":[],"stop":null,"end":false,"line":248,"nexts":[{"to":"release","line":260,"target":"release"}]},{"id":"release","title":"Hand each child over","lines":[{"kind":"do","text":"Release each child only to the parent or usual caregiver, or someone they approved. Early learning: day-to-day carer or authorised in writing.","line":263,"quotes":[{"text":"Each child or young person can only be released to the parent or usual caregiver, or someone identified/approved by the parent or usual caregiver.","where":"Ministry guide 2026","check":"exact"},{"text":"For early childhood services, the person collecting the child must be either the person providing day-to-day care or
